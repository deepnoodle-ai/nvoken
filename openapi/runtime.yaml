  /v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create or seed a Session without admitting an Invocation
      description: |
        Creates a Session with zero Invocations and optional host-asserted
        starting history. Every body field is optional. An omitted `agent_key` leaves the
        Session unbound: `agent_id` is null until the first admitted
        Invocation binds it, and the binding is immutable once set either way;
        `seed_messages` therefore requires `agent_key`. A `session_key`
        requires an `agent_key`, because key uniqueness
        and lookup are scoped per (tenant partition, Agent); a keyed create
        is an upsert that accepts equal supplied Session options and returns
        `session_options_conflict` when a supplied value differs.
        Without a `session_key`, every call creates a fresh Session.
        Precedence for the tenant partition is credential constraint,
        explicit `tenant_key`, then the default partition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The created (or key-resolved existing) Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Supplied options differ from the existing keyed Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List authoritative Sessions
      description: |
        Returns newest-first Session identity and current nonterminal
        Invocation state. Exact filters combine with AND. Tenant filtering and
        cursor binding follow the Invocation-list rules. `agent_id` and
        `agent_key` are mutually exclusive and normalize to the same cursor
        filter.
      parameters:
        - $ref: "#/components/parameters/TenantKeyFilter"
        - $ref: "#/components/parameters/DefaultTenantFilter"
        - $ref: "#/components/parameters/UserKeyFilter"
        - name: agent_id
          in: query
          description: Mutually exclusive with agent_key.
          schema:
            $ref: "#/components/schemas/AgentID"
        - $ref: "#/components/parameters/AgentKeyFilter"
        - name: session_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Read authoritative Session identity and current state
      description: |
        An installation-wide credential may resolve a Session in any tenant
        partition. A tenant-constrained credential resolves only Sessions
        in its partition. Missing, incompatible, and undisclosable resources use
        `not_found`; a credential denied the read operation itself receives
        `forbidden`.
      responses:
        "200":
          description: Authoritative Session identity and state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                keyedTenantSession:
                  value:
                    id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    agent_id: agnt_019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                    tenant_key: tenant-acme
                    session_key: ticket-483
                    user_key: null
                    forked_from: null
                    active_invocation_id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    active_invocation_status: running
                    blocking_budget: null
                    compaction: null
                    retention: null
                    budget: null
                    expires_at: null
                    metadata: null
                    context:
                      estimated_tokens: 129400
                      context_window_tokens: 1000000
                      model:
                        provider: anthropic
                        id: claude-sonnet-5
                    usage: null
                    created_at: "2026-07-20T14:01:02Z"
                    updated_at: "2026-07-20T14:01:05Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Merge host metadata into a Session
      description: |
        Merges a metadata patch: a present key replaces its value, an explicit
        `null` deletes that key, and a key the patch does not mention survives.

        Merge rather than replace, because independent writers share this map —
        a conversation UI writing a title, correlation tooling writing a trace
        id — and a full replacement would make each silently discard the
        other's keys. The merge happens under the Session lock, so two
        concurrent patches compose instead of one overwriting the other's read.

        `"metadata": null` is refused rather than guessed at: it could mean
        "clear everything" or "leave it alone", and either reading is
        destructive or silent. Delete keys one at a time.

        Bounds apply to the merged result, not to the patch, so a patch that
        deletes as many keys as it adds is not refused for a count it never
        produces. Requires the `update_session` operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
            examples:
              setTitleAndDropTrace:
                value:
                  metadata:
                    title: Refund policy
                    trace_id: null
      responses:
        "200":
          description: The Session after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Erase a Session and everything under it
      description: |
        Removes the Session, its Invocations, transcript messages, checkpoints,
        tool calls, provider artifacts, compactions, provider-key and MCP
        bindings, and undelivered webhooks. The erasure is immediate and
        irreversible; a subsequent read is `not_found`.

        An Invocation still running is stopped. No cancellation is recorded,
        because there is nothing left to record it against — the Invocation is
        removed rather than settled, and no `invocation.settled` webhook
        is emitted for it. A host that needs a settled record should cancel and
        observe the terminal state before deleting.

        Erasure is scoped like every other Session operation: an unknown or
        out-of-scope `session_id` returns `not_found`, so a retry after a lost
        response can treat `404` as already-done. The `delete_session`
        operation belongs to the Runtime and Operator profiles; a Viewer
        credential cannot erase a transcript.

        **This is not account deletion by itself.** nvoken keeps no account
        tombstone, so a host honouring a deletion request must first stop
        admitting work for that tenant, then page `GET /v1/sessions` and delete
        until the list is empty. Otherwise a concurrent request creates a new
        Session behind the sweep.

        Two consequences worth planning for. Usage reporting shrinks
        retroactively: `GET /v1/usage/daily` is computed at read time from
        Invocation evidence that erasure removes, which is why the endpoint is
        documented as operational visibility rather than a billing ledger — a
        billing host records usage at settlement, keyed by Invocation id.
        And the erased Invocations' idempotency keys become free for reuse,
        consistent with the documented guarantee that deduplication holds while
        the original Invocation is retained.
      responses:
        "204":
          description: The Session and its subtree no longer exist.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/fork:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [Sessions]
      operationId: forkSession
      summary: Copy a Session prefix into a new Session
      description: |
        Creates a new Session in the source Session's tenant and Agent scope,
        copying every canonical message through `from_message` inclusively.
        The source is untouched. The child stores durable Session and message
        lineage, but copied messages no longer belong to the source
        Invocations. Their `origin`, per-turn `user_key`, and resolved message
        phase are preserved.

        Usage and compaction summaries are not copied. Child usage starts at
        zero and the child starts uncompacted. Retention and metadata come only
        from `session_options` on this request; no Session option is inherited.
        A `session_key` has the same tenant/Agent-scoped upsert behavior as
        Session creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkSessionRequest"
            examples:
              byMessageID:
                value:
                  from_message: smsg_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                  session_key: ticket-483-alt
              bySequence:
                value:
                  from_message: 1
      responses:
        "201":
          description: The new or key-resolved Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: listSessionMessages
      summary: Page through the canonical Session transcript
      description: |
        Returns persisted SessionMessage rows in ascending sequence order.
        The opaque forward cursor is bound to the authenticated caller and
        Session. This history endpoint contains no lifecycle or live-preview
        copies.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of canonical messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/compactions:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: listSessionCompactions
      summary: Page through immutable Session compaction records
      description: |
        Returns newest-first diagnostic records for every attempted compaction
        pass. `applied` records include the private summary projection and its
        model usage. `fell_through` records identify the failure class and may
        include usage when the provider returned trustworthy evidence. Only
        applied records change future model context; neither kind changes the
        canonical Session transcript.

        The summary is derived from the caller's own transcript and therefore
        uses the same authorization and Session scoping as transcript reads.
        The opaque cursor is bound to the authenticated app and Session.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of immutable compaction records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCompactionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: getSessionTranscript
      summary: Drain a fixed-cut incremental transcript snapshot
      description: |
        Projects canonical messages and append-only Invocation lifecycle
        changes. Supply a prior `resume_cursor` as `cursor` to drain newer
        durable state. Continue a multi-page fixed cut with `page_token` until
        `has_more` is false. Each page contains one phase: all message pages are
        delivered before lifecycle-change pages, so terminal state cannot
        precede the transcript rows committed with it. Omitting both positions
        starts at the beginning of the retained Session.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: page_token
          in: query
          description: Opaque fixed-cut continuation from `next_page_token`.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One phase of a fixed-cut transcript snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSnapshot"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/transcript/stream:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: streamSessionTranscript
      summary: Replay and tail one Session transcript over SSE
      description: |
        Opens a resumable Server-Sent Events projection over the same fixed-cut
        transcript read model as the JSON endpoint. With deltas enabled, the
        server subscribes to live fan-out before its first Postgres drain. In
        either mode it re-drains Postgres on a bounded poll and closes after
        authoritative terminal reconciliation or deliberate rotation.
        Disconnecting never cancels the Invocation.

        Every nonempty `transcript.update` frame carries
        `id: <resume_cursor>`; that opaque ID is the only replay position
        clients persist. `output_text.delta`, `thinking.delta`,
        `stream.resync`, and `stream.end` never carry an `id`. Deltas are
        ephemeral and may be lost; after `stream.resync`, discard provisional
        output and wait for canonical messages. `stream.end` reason `terminal`
        means the final Postgres drain observed no nonterminal Invocation.
        Reason `rotate` means reconnect with the last durable ID. An abnormal
        close has no terminal meaning. `deltas=false` skips preview fan-out
        without changing replay, polling, cursor, or terminal semantics.

        The explicit `cursor` query parameter takes precedence over
        `Last-Event-ID`. Bearer authentication requires an SSE-capable HTTP
        client that can set the `Authorization` header; the browser EventSource
        constructor alone cannot do so. The server emits `retry: 1000` as its
        default reconnect delay.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: deltas
          in: query
          description: Include id-less output and thinking preview frames. Defaults to true.
          schema:
            type: boolean
            default: true
        - name: Last-Event-ID
          in: header
          description: Opaque `resume_cursor` from the last durable update frame; ignored when `cursor` is supplied.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: |
            SSE frames named `transcript.update`, `output_text.delta`,
            `thinking.delta`, `stream.resync`, and `stream.end`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TranscriptStreamEvent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
webhooks:
  toolCallback:
    post:
      operationId: receiveToolCallback
      security: []
      summary: Receive a signed callback ToolCall delivery
      description: |
        nvoken sends this request to the HTTPS endpoint declared by a callback
        tool. Delivery is at least once. A receiver must deduplicate by the
        ToolCall ID in Idempotency-Key.

        The signature is HMAC-SHA256 over
        `v1.<delivery_id>.<timestamp>.<raw_body>`. The signing key is selected
        by its ID and positive version headers. The signature value is lowercase
        hex with a `sha256=` prefix. Verify the raw body in constant time before
        parsing it. Enforce a receiver-side timestamp skew window.

        Delivery uses a lease, exponential backoff, and at most five attempts.
        Retryable transport failures and HTTP 408, 425, 429, 500, 502, 503, and
        504 are retried. The same request may arrive more than once. An invalid
        successful reply is not retried. When delivery fails or attempts are
        exhausted, nvoken settles the ToolCall with `is_error: true` and content
        `{"code":"callback_delivery_failed"}`. The Invocation then continues.
      parameters:
        - name: X-Nvoken-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
          description: HMAC-SHA256 signature of the canonical delivery string.
        - name: X-Nvoken-Signature-Version
          in: header
          required: true
          schema:
            type: string
            enum: [v1]
        - name: X-Nvoken-Timestamp
          in: header
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp used in the signature.
        - name: X-Nvoken-Delivery-Id
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/CallbackDeliveryID"
        - name: X-Nvoken-Signing-Key-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Nvoken-Signing-Key-Version
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/ToolCallID"
          description: The stable ToolCall ID. It is unchanged across retries.
      requestBody:
        required: true
        content:
          "application/vnd.nvoken.tool-callback+json; version=1":
            schema:
              $ref: "#/components/schemas/ToolCallbackRequest"
            example:
              nvoken:
                schema_version: 1
                delivery_id: cbdy_019b0a12-8d51-7f34-aed2-0e07c1bdb326
                tool_call_id: tcal_019b0a12-8d51-7f34-aed2-0e07c1bdb325
                invocation_id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                session_id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                agent_key: support
                tenant_key: acme
              input:
                title: Customer needs a refund
      responses:
        "2XX":
          description: |
            The ToolCall result. The body must be an object with exactly
            `content` and optional `is_error`. Content may be any JSON value.
            Its encoded size is at most 256 KiB and its nesting depth is at
            most 32. Unknown or duplicate members, trailing data, and any other
            shape are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallbackResponse"
              example:
                content:
                  ticket_id: T-1042
                is_error: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or Ed25519 JWT
      description: |
        Machine API keys are always accepted. When
        `CONSOLE_ISSUER_PUBLIC_KEYS` is configured, nvoken also accepts
        short-lived Ed25519 console issuer tokens with issuer
        `nvoken-console`, audience `nvoken`, an app or installation scope,
        an operator or viewer profile, and an opaque subject.
  headers:
    ETag:
      description: Strong validator for this exact JSON representation.
      schema:
        type: string
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a prior response for this exact representation.
      schema:
        type: string
        minLength: 1
    InvocationID:
      name: invocation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InvocationID"
    PendingInputID:
      name: pending_input_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PendingInputID"
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AgentID"
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SessionID"
    ProviderKeyID:
      name: provider_key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderKeyID"
    BudgetID:
      name: budget_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BudgetID"
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the same operation and filter set.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Maximum items in this page. Defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    UserKeyFilter:
      name: user_key
      in: query
      description: |
        Exact host-owned end-user reference. Filters to rows whose Session
        carries this label.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantKeyFilter:
      name: tenant_key
      in: query
      description: Exact non-default tenant partition reference.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    DefaultTenantFilter:
      name: default_tenant
      in: query
      description: Select only the default tenant partition. Mutually exclusive with tenant_key.
      schema:
        type: boolean
        default: false
    AgentKeyFilter:
      name: agent_key
      in: query
      description: |
        Exact host-owned Agent key. On Session and Invocation lists this is
        mutually exclusive with agent_id.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    AgentID:
      type: string
      pattern: "^agnt_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `agnt_` prefix.
    Agent:
      type: object
      additionalProperties: false
      required: [id, agent_key, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AgentID"
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable host-owned key, unique within the installation.
        created_at:
          type: string
          format: date-time
      description: |
        Installation-wide identity anchor only. Agent behavior is not registered;
        instructions, model, tools, and provider keys travel per Invocation.
    App:
      type: object
      additionalProperties: false
      required: [id, name, external_ref, display_name, created_at]
      properties:
        id:
          type: string
          description: The generated nvoken app identifier.
        name:
          type: string
          description: The unique host-chosen name for this app.
        external_ref:
          type: [string, "null"]
          maxLength: 255
          description: |
            Opaque owner reference used to ground console issuer tokens. One
            reference may own many apps.
        display_name:
          type: [string, "null"]
          maxLength: 255
          description: Human-facing label; `name` stays the unique handle.
        created_at:
          type: string
          format: date-time
    AppList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/App"
    RegisterAppRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: |
            The unique name identifying this app. Registering a name that
            already exists is rejected.
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional opaque owner reference.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional human-facing label.
    UpdateAppRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: New human-facing label for the app.
    AgentList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionID:
      type: string
      pattern: "^sesn_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `sesn_` prefix.
    SessionCompactionID:
      type: string
      pattern: "^cmp_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7-shaped diagnostic identifier with the public `cmp_` prefix.
    SessionMessageID:
      type: string
      pattern: "^smsg_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `smsg_` prefix.
    InvocationID:
      type: string
      pattern: "^invk_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `invk_` prefix.
    PendingInputID:
      type: string
      pattern: "^npin_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `npin_` prefix.
    ProviderKeyID:
      type: string
      pattern: "^pkey_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `pkey_` prefix.
    BudgetID:
      type: string
      pattern: "^bdgt_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `bdgt_` prefix.
    APICredentialID:
      type: string
      pattern: "^cred_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `cred_` prefix.
    ProviderKeyVersionID:
      type: string
      pattern: "^pkeyv_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `pkeyv_` prefix.
    ModelProvider:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: |
        Extensible canonical provider identifier. Consumers must preserve
        unknown values so adding a provider does not break decoding. Request
        positions still reject providers not registered by the installation.
    ModelPricing:
      type: object
      additionalProperties: false
      required: [status, pricing_version]
      description: |
        Standard local price evidence used by nvoken's estimated-cost
        guardrail. A `priced` object also carries currency, unit, input, output,
        and update date. `unpriced` and `unknown` carry only status and the
        opaque pricing version. Clients compare versions for equality only.
      properties:
        status:
          type: string
          enum: [priced, unpriced, unknown]
        currency:
          type: string
          enum: [USD]
        unit:
          type: string
          enum: [per_million_tokens]
        input:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        output:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        cache_read:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        cache_write:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        updated_at:
          type: string
          format: date
        pricing_version:
          type: string
          minLength: 1
          description: |
            Opaque nvoken-owned identifier for the local pricing snapshot.
            Values never encode an upstream dependency name or version.
    ModelDescriptor:
      type: object
      additionalProperties: false
      required: [provider, id, cataloged, pricing]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        id:
          type: string
          minLength: 1
          maxLength: 255
        cataloged:
          type: boolean
          description: Whether nvoken advertises and maintains metadata for this selection.
        display_name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        context_window_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_modalities:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Input modalities admission accepts for this model selection. Media
            modalities also publish their exact media types under
            controls.input.media.
        recommended:
          type: boolean
          description: nvoken's suggested general-purpose starting point for this provider.
        deprecated:
          type: boolean
        deprecated_at:
          type: string
          format: date
          description: Date nvoken marked this model deprecated.
        retires_at:
          type: string
          format: date
          description: Date nvoken starts refusing new admission for this model.
        replacement:
          $ref: "#/components/schemas/Model"
        controls:
          $ref: "#/components/schemas/ModelControlCapabilities"
        pricing:
          $ref: "#/components/schemas/ModelPricing"
      description: |
        Cataloged descriptors include all maintained metadata fields.
        Uncataloged descriptors include only provider, id, cataloged, and
        pricing; absent metadata is unknown rather than false or zero.
        A cataloged descriptor's controls are the same qualified capabilities
        used by admission; omitted controls on an uncataloged descriptor mean
        unknown, not unsupported. Deprecated models remain admissible until
        `retires_at`; after that date, new admission returns `model_retired`
        with this entry's replacement.
    ModelControlCapabilities:
      type: object
      additionalProperties: false
      required: [sampling, reasoning, tools, input]
      properties:
        sampling:
          $ref: "#/components/schemas/ModelSamplingCapabilities"
        reasoning:
          $ref: "#/components/schemas/ModelReasoningCapabilities"
        tools:
          $ref: "#/components/schemas/ModelToolCapabilities"
        input:
          $ref: "#/components/schemas/ModelInputCapabilities"
    ModelSamplingCapabilities:
      type: object
      additionalProperties: false
      required: [temperature]
      properties:
        temperature:
          type: boolean
          description: Whether nvoken can guarantee an explicit temperature reaches this exact model path.
    ModelReasoningCapabilities:
      type: object
      additionalProperties: false
      required: [effort, budget_tokens, effort_budget_compatible]
      properties:
        effort:
          $ref: "#/components/schemas/ModelReasoningEffortCapabilities"
        budget_tokens:
          $ref: "#/components/schemas/ModelReasoningBudgetCapabilities"
        effort_budget_compatible:
          type: boolean
    ModelReasoningEffortCapabilities:
      type: object
      additionalProperties: false
      required: [supported, values, with_temperature]
      properties:
        supported:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningEffort"
        with_temperature:
          type: boolean
    ModelReasoningBudgetCapabilities:
      type: object
      additionalProperties: false
      required: [supported, with_temperature]
      properties:
        supported:
          type: boolean
        with_temperature:
          type: boolean
        minimum:
          type: integer
          minimum: 1024
        maximum:
          type: integer
          minimum: 1024
    ModelToolCapabilities:
      type: object
      additionalProperties: false
      required: [choice, web_search]
      properties:
        choice:
          $ref: "#/components/schemas/ModelToolChoiceCapabilities"
        web_search:
          type: boolean
          description: |
            Whether this exact model supports the provider's server-side web
            search. Admission fails closed on it, so `provider_tools` is
            refused on a model that reports false — including any uncataloged
            model, which reports nothing.
    ModelToolChoiceMode:
      type: string
      enum: [auto, none, required, named]
      x-enum-varnames: [ChoiceAuto, ChoiceNone, ChoiceRequired, ChoiceNamed]
    ModelToolChoiceCapabilities:
      type: object
      additionalProperties: false
      required: [modes, with_reasoning]
      properties:
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ModelToolChoiceMode"
        with_reasoning:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ModelToolChoiceMode"
          description: Modes that remain exact when explicit reasoning is active.
    ModelInputCapabilities:
      type: object
      additionalProperties: false
      required: [media]
      properties:
        media:
          $ref: "#/components/schemas/ModelMediaCapabilities"
    ModelMediaCapabilities:
      type: object
      additionalProperties: false
      required: [image, document]
      properties:
        image:
          $ref: "#/components/schemas/ModelMediaKindCapabilities"
        document:
          $ref: "#/components/schemas/ModelMediaKindCapabilities"
    ModelMediaKindCapabilities:
      type: object
      additionalProperties: false
      required: [supported, media_types]
      properties:
        supported:
          type: boolean
        media_types:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            Exact media types admission accepts for this model. An empty list
            means the modality is unsupported.
    ModelList:
      type: object
      additionalProperties: false
      required: [items, catalog_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelDescriptor"
        catalog_version:
          type: string
          minLength: 1
          description: Opaque version of the complete unfiltered catalog and pricing snapshot.
    ProviderKeyScope:
      type: string
      enum: [app, tenant]
      description: |
        `app` is one provider key shared by every tenant of one app;
        `tenant` is one provider key for a single named
        tenant_key inside the app.
    CreateInvocationRequest:
      type: object
      additionalProperties: false
      required: [agent_key, idempotency_key, input]
      description: |
        The request carries one definition form. It either carries
        definition_id or an inline definition with model. The two forms are
        mutually exclusive.
      allOf:
        - not:
            required: [session_id, session_key]
      properties:
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Stable caller-controlled Agent key, unique within the
            installation. The resulting Agent anchor stores identity
            only and is shared across tenant partitions.
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional tenant partition. For Session-key resolution or a new
            Session, precedence is credential constraint, this explicit value,
            then the default partition. For Session-ID resolution, an
            installation-wide caller may omit it and use the stored partition.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional host-owned end-user label recorded on this Invocation and
            its input message. The Session retains the label from the request
            that opened it, while later turns may identify different end users.
            Filtering only; not an isolation boundary.
        session_id:
          $ref: "#/components/schemas/SessionID"
          description: Existing Session to continue. Mutually exclusive with session_key.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Caller key resolved within (effective tenant partition,
            Agent, session_key). Mutually exclusive with session_id.
        session_options:
          $ref: "#/components/schemas/SessionOptions"
          description: |
            Durable options for the resolved Session. On an existing Session,
            every supplied value is compared with the stored value: equal is
            accepted and different returns `session_options_conflict`.
            Compaction is the one late-installable option: when no policy is
            stored yet, this admission installs its model-validated policy.
            Session options are not part of the reusable execution snapshot or
            its idempotency comparison.
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: |
            Opaque host correlation data recorded on this Invocation. It is
            part of the admitted input, so it is immutable and material to
            idempotency: a replay carrying different metadata conflicts rather
            than updating it. A genuine retry describes the same originating
            request and so carries the same values by construction.

            Session metadata is separate and mutable — see
            `session_options.metadata` and `PATCH /v1/sessions/{session_id}`.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Stable admission identity scoped to (effective tenant
            partition, agent_key). Reuse an unchanged request after any 5xx,
            timeout, disconnect, or missing acknowledgement. Deduplication is
            guaranteed while the original Invocation is retained.
        if_active:
          type: string
          enum: [reject, supersede, interrupt]
          default: reject
          description: |
            Policy when the resolved Session already has a nonterminal
            Invocation. `reject` returns `session_invocation_active`.
            `supersede` atomically applies the ordinary durable cancellation
            transition to that Invocation before admitting this replacement,
            dropping its work from later turns. `interrupt` stops it
            gracefully and admits only after it has settled `completed`, so
            the replacement builds on what the stopped turn produced: it is
            "stop and redo" where supersede is "discard and redo". Omission
            and explicit `reject` compare equal on replay.
        on_budget_exhausted:
          type: string
          enum: [settle, pause]
          default: settle
          description: |
            `settle` ends a coherent consumption-budget stop as `incomplete`.
            `pause` parks it as resumable `paused`. Applies to iteration,
            output-token, per-turn estimated-cost, and Session estimated-cost
            ceilings; deadlines always settle.
        input:
          $ref: "#/components/schemas/InvocationInput"
        webhook:
          $ref: "#/components/schemas/WebhookTarget"
        definition_id:
          $ref: "#/components/schemas/AgentDefinitionID"
          description: |
            Immutable content-addressed definition previously admitted inline
            by this app. Unknown and foreign IDs return
            `definition_not_found`. Mutually exclusive with every inline
            definition field. A reference and the byte-identical inline
            definition are equal on idempotent replay.
        instructions:
          type: string
          minLength: 1
          description: Optional model instructions. Omission adds no hidden default.
        model:
          $ref: "#/components/schemas/ModelInput"
        sampling:
          $ref: "#/components/schemas/Sampling"
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        limits:
          $ref: "#/components/schemas/Limits"
        structured_output:
          $ref: "#/components/schemas/StructuredOutput"
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ToolDeclaration"
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServer"
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProviderTool"
        provider_keys:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ProviderKeySelection"
          description: |
            Explicit nonsecret source selection for the model provider.
            Omission resolves the default chain at admission: the app's
            stored key for the provider when one exists, else a
            self-hosted installation's environment key (config_byok), else
            platform funding when the installation enables it. The chosen
            source is bound durably at admission; execution never falls
            through to a different payer afterward. The selection is stored
            outside the reusable execution snapshot; only caller_ephemeral accepts secret
            material, and a caller may equivalently supply it with the
            X-Anthropic-Api-Key, X-Openai-Api-Key, X-Gemini-Api-Key, or
            X-Xai-Api-Key request header naming the model provider. Equal
            idempotent replay never replaces the original encrypted key. The
            field is deliberately plural even though this
            contract currently permits one entry: future routed invocations
            may select keys for more than one model provider.
    SeedMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          $ref: "#/components/schemas/SeedMessageContent"
    SeedMessageContent:
      description: |
        Text-only canonical history. A string is shorthand for one text block;
        both forms normalize to the same stored content-block array.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/TextInputBlock"
    ForkSessionRequest:
      type: object
      additionalProperties: false
      required: [from_message]
      properties:
        from_message:
          oneOf:
            - $ref: "#/components/schemas/SessionMessageID"
            - type: integer
              format: int64
              minimum: 1
          description: Inclusive fork point, by stable message ID or sequence.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional tenant/Agent-scoped keyed identity for the child.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional opened-by label for the child Session.
        session_options:
          $ref: "#/components/schemas/ForkSessionOptions"
    ForkSessionOptions:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        retention:
          $ref: "#/components/schemas/RetentionPolicy"
        metadata:
          $ref: "#/components/schemas/Metadata"
      description: |
        Creation-only options for a forked child. The child never inherits the
        source Session's compaction policy, retention, or metadata.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        session_key: [agent_key]
        seed_messages: [agent_key]
      properties:
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional stable caller-controlled Agent key, resolved or created
            exactly as invocation admission does. Omitting it creates an
            unbound Session whose agent is set by its first admitted
            Invocation.
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional tenant partition. Precedence is credential constraint,
            this explicit value, then the default partition.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional host-owned end-user label recorded on the Session.
            Filtering only; not an isolation boundary.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional caller key resolved within (effective tenant partition,
            Agent, session_key). Requires agent_key. Makes creation an
            upsert: an existing keyed Session is returned unchanged.
        session_options:
          $ref: "#/components/schemas/SessionOptions"
        seed_messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SeedMessage"
          description: |
            Host-asserted starting history, accepted only while a new Session
            is created. Requires `agent_key`. A keyed request that resolves an
            existing Session returns it unchanged and never appends these
            messages. The UTF-8 text across the array may total at most 524288
            bytes.
    WebhookTarget:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        Optional endpoint nvoken posts a signed webhook to when this
        Invocation parks awaiting host tool results or reaches a terminal
        status. It is delivery configuration rather than model input, so it is
        excluded from the reusable execution snapshot. Two otherwise identical
        turns that differ only in endpoint therefore share one snapshot.

        Delivery is at least once and ordered within one Invocation, and the
        webhook ID is repeated in `Idempotency-Key` on every attempt. nvoken
        webhooks are thin: identifiers and status only, the API stays the read
        authority. A webhook never changes, delays, or fails the Invocation it
        describes.

        The endpoint is part of the request, so replaying an idempotency key
        with a changed endpoint or event set is a conflict rather than a
        silent adoption of either value. An installation without a configured
        webhook signing key rejects this field instead of accepting it and
        never delivering it.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Absolute HTTPS endpoint with no userinfo and no fragment. Private,
            loopback, and link-local destinations are refused by the same
            guarded public egress the callback transport uses.
        events:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
          description: |
            Events to deliver. Omission selects every event, because the
            harmful default is the one that quietly drops
            `invocation.waiting` and leaves a parked tool loop with nobody
            listening. Order does not affect replay comparison.
    WebhookEvent:
      type: string
      enum: [invocation.waiting, invocation.paused, invocation.settled]
      x-enum-varnames: [WebhookEventWaiting, WebhookEventPaused, WebhookEventSettled]
      description: |
        `invocation.waiting` fires when the Invocation parks with at least one
        unresolved host ToolCall the caller must satisfy; a wait made entirely
        of callback tools emits nothing, because nvoken delivers those itself.
        `invocation.paused` fires when an opt-in consumption budget parks the
        turn and carries the exhausted `stop_reason`.
        `invocation.settled` fires once when the Invocation reaches
        `completed`, `incomplete`, `failed`, or `cancelled`; completed and
        incomplete payloads carry `stop_reason` next to `failure_code`.
    ProviderKeySelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [provider, source, key]
          properties:
            provider:
              $ref: "#/components/schemas/ModelProvider"
            source:
              type: string
              enum: [caller_ephemeral]
              x-enum-varnames: [SourceCallerEphemeral]
            key:
              $ref: "#/components/schemas/ProviderStaticKey"
        - type: object
          additionalProperties: false
          required: [provider, source]
          properties:
            provider:
              $ref: "#/components/schemas/ModelProvider"
            source:
              type: string
              enum: [app_byok, tenant_byok, platform]
      description: |
        Exactly one selection matching the canonical model provider. Omitting
        `provider_keys` entirely resolves the default chain instead:
        the app's stored key when one exists, else the self-hosted
        installation's environment key (config_byok), else platform funding
        when the installation enables it.
    BudgetScope:
      type: string
      enum: [app, customer, user, agent, provider_key, api_credential]
    CreateBudgetRequest:
      type: object
      additionalProperties: false
      required: [scope, window_start, window_end, max_estimated_cost_usd, idempotency_key]
      properties:
        scope:
          $ref: "#/components/schemas/BudgetScope"
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        default_tenant:
          type: boolean
          default: false
        user_key:
          type: string
          minLength: 1
          maxLength: 255
        agent_id:
          $ref: "#/components/schemas/AgentID"
        provider_key_id:
          $ref: "#/components/schemas/ProviderKeyID"
        credential_id:
          $ref: "#/components/schemas/APICredentialID"
        window_start:
          type: string
          format: date-time
          description: Inclusive UTC start.
        window_end:
          type: string
          format: date-time
          description: Exclusive UTC end.
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      description: |
        The selected scope requires only its identity fields. `app` requires
        none. `customer` requires exactly one of `tenant_key` or
        `default_tenant: true`. `user` also requires `user_key`. `agent`,
        `provider_key`, and `api_credential` require `agent_id`,
        `provider_key_id`, and `credential_id` respectively. A credential ID
        resolves to its stable rotation family.
    UpdateBudgetRequest:
      type: object
      additionalProperties: false
      required: [max_estimated_cost_usd]
      properties:
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
    Budget:
      type: object
      additionalProperties: false
      required: [id, scope, tenant_key, user_key, agent_id, provider_key_id,
                 credential_family_id, window_start, window_end,
                 max_estimated_cost_usd, settled_estimated_cost_usd,
                 reserved_estimated_cost_usd, available_estimated_cost_usd,
                 paused_invocations, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/BudgetID"
        scope:
          $ref: "#/components/schemas/BudgetScope"
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
        user_key:
          oneOf:
            - type: string
            - type: "null"
        agent_id:
          oneOf:
            - $ref: "#/components/schemas/AgentID"
            - type: "null"
        provider_key_id:
          oneOf:
            - $ref: "#/components/schemas/ProviderKeyID"
            - type: "null"
        credential_family_id:
          oneOf:
            - $ref: "#/components/schemas/APICredentialID"
            - type: "null"
          description: Root API credential ID shared by its rotation chain.
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        max_estimated_cost_usd:
          type: number
          multipleOf: 0.000001
        settled_estimated_cost_usd:
          type: number
          minimum: 0
          multipleOf: 0.000001
        reserved_estimated_cost_usd:
          type: number
          minimum: 0
          multipleOf: 0.000001
        available_estimated_cost_usd:
          type: number
          minimum: 0
          multipleOf: 0.000001
        paused_invocations:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: |
        Durable enforcement state for one fixed window. Settled and reserved
        are stored quota facts. They do not shrink when transcript evidence is
        erased and are not an invoice.
    BudgetBlock:
      type: object
      additionalProperties: false
      required: [id, scope]
      properties:
        id:
          $ref: "#/components/schemas/BudgetID"
        scope:
          type: string
          enum: [app, customer, user, agent, provider_key, api_credential, session]
      description: Exact durable budget that refused or paused work.
    ProviderStaticKey:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: Encrypted before persistence and never returned.
    CreateProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [provider, scope, key, idempotency_key]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required for tenant scope and forbidden for app scope.
        key:
          $ref: "#/components/schemas/ProviderStaticKey"
        expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    RotateProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [key, idempotency_key]
      properties:
        key:
          $ref: "#/components/schemas/ProviderStaticKey"
        expires_at:
          type: string
          format: date-time
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 0
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    ProviderKey:
      type: object
      additionalProperties: false
      required: [id, provider, scope, tenant_key, status, version, version_id, previous_version_id, version_status, expires_at, overlap_expires_at, created_by, created_at, updated_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum: [active, revoked]
          description: Active roots remain rotatable and revocable even when their current version has expired.
        version:
          type: integer
          minimum: 1
        version_id:
          $ref: "#/components/schemas/ProviderKeyVersionID"
        previous_version_id:
          oneOf:
            - $ref: "#/components/schemas/ProviderKeyVersionID"
            - type: "null"
        version_status:
          type: string
          enum: [active, overlap, expired, revoked]
          description: An expired current version is unusable; rotate the active provider key before any admission or model call can use it.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        overlap_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      description: Safe metadata only; secret material is never represented.
    ProviderKeyList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderKey"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    ProviderKeyUsage:
      type: object
      additionalProperties: false
      required: [id, provider, scope, invocations, last_used_at, usage]
      properties:
        id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        invocations:
          type: integer
          minimum: 0
          description: Invocations that bound this provider key at admission.
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Latest durable model checkpoint under any bound Invocation, null before the first model call.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: Summed checkpoint usage, null before the first model call.
    DailyUsage:
      type: object
      additionalProperties: false
      required: [start_date, end_date, items]
      properties:
        start_date:
          type: string
          format: date
          description: Inclusive first UTC day of the served window.
        end_date:
          type: string
          format: date
          description: Inclusive last UTC day of the served window.
        items:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsageBucket"
          description: Buckets ordered by day, app, provider, and model. Days with no usage produce no bucket.
    DailyUsageBucket:
      type: object
      additionalProperties: false
      required:
        [
          day,
          app_id,
          provider,
          model,
          invocations,
          model_calls,
          input_tokens,
          output_tokens,
          cache_creation_input_tokens,
          cache_read_input_tokens,
          reasoning_tokens,
          estimated_cost,
        ]
      properties:
        day:
          type: string
          format: date
          description: UTC calendar day of the bucket.
        app_id:
          type: string
          description: The app whose tenants produced the usage.
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Host customer group when `group_by=tenant_key`; omitted otherwise.
        provider:
          type: string
          description: Provider from checkpoint provenance; empty when provenance omitted it.
        model:
          type: string
          description: Served model from provenance, falling back to the requested model.
        invocations:
          type: integer
          minimum: 0
          description: Distinct Invocations with at least one model call in the bucket. Compaction calls carry no Invocation.
        model_calls:
          type: integer
          minimum: 0
          description: Individual provider calls in the bucket.
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
        estimated_cost:
          type: number
          description: Summed list-price estimate in USD; zero when every call in the bucket was unpriced.
    InvocationInput:
      description: |
        A plain string is shorthand for one text block; an array is ordered
        multi-block input mixing text, images, and documents. Both normalize
        to the same stored message and are therefore equal for idempotency.
        At most 8 blocks may carry media, and their decoded payloads must
        total at most 16777216 bytes.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/InputBlock"
    InputBlock:
      oneOf:
        - $ref: "#/components/schemas/TextInputBlock"
        - $ref: "#/components/schemas/ImageInputBlock"
        - $ref: "#/components/schemas/DocumentInputBlock"
      description: |
        One caller-input block. A block carries text, an image, or a document;
        the members of one type are never valid on another.
    TextInputBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          x-enum-varnames: [InputTypeText]
        text:
          type: string
          minLength: 1
    ImageInputBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          enum: [image]
          x-enum-varnames: [InputTypeImage]
        source:
          $ref: "#/components/schemas/ImageInputSource"
      description: |
        An inline or URL image. A URL is fetched once during admission. nvoken
        stores the fetched bytes and never fetches it again. Admission sniffs
        the bytes, bounds them to 5242880 bytes and 8000 by 8000 pixels, and
        requires the selected model to declare the image modality and exact
        media type.
    ImageInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum: [image/gif, image/jpeg, image/png, image/webp]
          x-enum-varnames: [ImageGIF, ImageJPEG, ImagePNG, ImageWEBP]
        data:
          type: string
          minLength: 1
          maxLength: 6990508
          description: |
            Standard padded base64 with no whitespace. Mutually exclusive with
            url.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            Public HTTPS URL fetched once during admission. The response is
            size-bounded while reading and its bytes are sniffed. media_type is
            optional for this form. When present it must match the sniffed type.
    DocumentInputBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          enum: [document]
          x-enum-varnames: [InputTypeDocument]
        source:
          $ref: "#/components/schemas/DocumentInputSource"
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional filename supplied to providers that require one. Omission
            uses the adapter default and does not change acceptance.
      description: |
        An inline or URL document. A URL is fetched once during admission.
        nvoken stores the fetched bytes and never fetches it again. Admission
        applies the same sniff rules as an image with a 16777216-byte bound.
        Page limits are the provider's, so an oversized page count settles as
        input_media_rejected.
    DocumentInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum: [application/pdf]
          x-enum-varnames: [DocumentPDF]
        data:
          type: string
          minLength: 1
          maxLength: 22369624
          description: Standard padded base64 with no whitespace.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            Public HTTPS URL fetched once during admission. The response is
            size-bounded while reading and its bytes are sniffed. media_type is
            optional for this form. When present it must be application/pdf.
    AgentDefinitionID:
      type: string
      pattern: "^def_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: UUIDv7 with the public `def_` prefix.
    AgentDefinition:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        instructions:
          type: string
          minLength: 1
          description: Optional model instructions. Omission adds no hidden default.
        model:
          $ref: "#/components/schemas/Model"
        sampling:
          $ref: "#/components/schemas/Sampling"
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        limits:
          $ref: "#/components/schemas/Limits"
        structured_output:
          $ref: "#/components/schemas/StructuredOutput"
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ToolDeclaration"
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServer"
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProviderTool"
      description: |
        Immutable launch snapshot returned on detailed Invocation reads. The
        host owns the agent definition; nvoken only records the definition
        each turn ran with. The
        create request exposes these execution fields at its top level; nvoken
        selects them, stores them as one immutable snapshot row, and re-reads
        the snapshot unchanged on every model iteration and recovery. Two
        Invocations with byte-identical execution fields share one snapshot.
        Identity, session selection, input, idempotency, `if_active`, `webhook`,
        metadata, and provider key selection are durable elsewhere and
        never appear here. Callback declarations require installation callback
        signing configuration. Remote MCP authentication headers are encrypted
        outside this snapshot and never returned. Tools or structured output
        require at least two model iterations; omission resolves to three or
        the lower installation maximum.
    Sampling:
      type: object
      additionalProperties: false
      required: [temperature]
      properties:
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Portable sampling temperature. Omit sampling to preserve the
            provider default. An explicit zero remains explicit. Admission
            fails closed unless the selected model descriptor positively
            declares support.
    ReasoningEffort:
      type: string
      enum: [low, medium, high, xhigh, max]
      x-enum-varnames: [EffortLow, EffortMedium, EffortHigh, EffortXHigh, EffortMax]
    Reasoning:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        effort:
          $ref: "#/components/schemas/ReasoningEffort"
        budget_tokens:
          type: integer
          minimum: 1024
          description: |
            Provider reasoning target, not a separate Invocation hard budget.
            Requires an explicit, larger limits.max_output_tokens and exact
            support in the selected model descriptor.
    ToolChoice:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/ModelToolChoiceMode"
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
      description: |
        Portable Invocation tool selection. auto preserves normal selection;
        none disables tools for the Invocation; required and named apply only
        to the first durable model iteration, then return to auto. name is
        required only for named mode. The final bounded iteration always
        disables tools.
    SessionOptions:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        compaction:
          $ref: "#/components/schemas/CompactionPolicy"
        retention:
          $ref: "#/components/schemas/RetentionPolicy"
        budget:
          $ref: "#/components/schemas/SessionBudget"
        metadata:
          $ref: "#/components/schemas/Metadata"
      description: |
        Durable Session options. Every member is optional and at least one must
        be present. A new Session stores the supplied values. When a keyed
        upsert or admission resolves an existing Session, supplied values are
        comparison-only: equal values are accepted and different values return
        `session_options_conflict` with `details.conflicting_paths`.

        `compaction` requires an Invocation because the policy is validated
        against that turn's model. It may be installed on any Session that has
        no compaction policy yet, including a Session created ahead of its first
        Invocation or a long-running Session opting in later. An `auto` trigger
        is materialized from the installing Invocation's context window. Once
        set, the resolved policy is immutable. `POST /v1/sessions` therefore
        still rejects `compaction`, while admissions may supply it with either
        `session_id`, `session_key`, or a new Session.
    SessionBudget:
      type: object
      additionalProperties: false
      required: [max_estimated_cost_usd]
      properties:
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
      description: |
        Mutable Session-wide USD list-price guardrail. The estimate is derived
        from durable model-call evidence and is operational control, not a
        billing ledger. Models without catalog pricing fail closed.
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        metadata:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 512
              - type: "null"
          maxProperties: 16
          propertyNames:
            pattern: "^[A-Za-z0-9_.:-]+$"
            maxLength: 64
          description: |
            Metadata merge patch. A string value sets the key, `null` deletes
            it, and an absent key is left alone. Bounds are enforced on the
            merged result.
        budget:
          oneOf:
            - $ref: "#/components/schemas/SessionBudget"
            - type: "null"
          description: |
            Replaces the Session budget; null removes it. A finite ceiling may
            not be lower than estimated cost already consumed. Raising or
            removing the ceiling atomically requeues a turn paused on it.
    Metadata:
      type: object
      additionalProperties:
        type: string
        maxLength: 512
      maxProperties: 16
      propertyNames:
        pattern: "^[A-Za-z0-9_.:-]+$"
        maxLength: 64
      description: |
        Opaque host correlation data. nvoken stores it, returns it verbatim,
        and never interprets it — it exists so a support engineer holding an
        Invocation id can get back to the board, ticket, or surface the turn
        came from, which nvoken deliberately knows nothing about.

        At most 16 entries. Keys are 1–64 bytes of letters, digits, `_`, `.`,
        `:`, and `-`; values are at most 512 bytes of UTF-8.

        There is no `title` field on a Session by design. A title is one of
        these entries (`{"title": "Refund policy"}`), which keeps nvoken from
        forming opinions about a string only the host renders.
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: |
            Idle window, from one hour to thirty days.
      description: |
        Bounds how long an idle Session is retained. Past the window nvoken
        erases the Session and its whole subtree, exactly as
        `DELETE /v1/sessions/{session_id}` would.

        The window measures idle time, not lifetime: it restarts on every
        Invocation admission and every settlement, so a turn that runs longer
        than the window cannot expire underneath itself.

        **Automatic expiry never cancels running work.** A Session holding a
        queued, running, or waiting Invocation is skipped and reconsidered on
        the next sweep. An explicit `DELETE` may still stop a running turn,
        because a person asked for it; a clock may not.

        Omitting retention retains the Session until it is deleted explicitly,
        which stays the default.
    CompactionPolicy:
      type: object
      additionalProperties: false
      required: [trigger_tokens]
      properties:
        trigger_tokens:
          oneOf:
            - type: integer
              minimum: 4096
              maximum: 1000000
            - type: string
              enum: [auto]
              x-enum-varnames: [Auto]
          description: |
            Estimated retained-context size that triggers compaction. The
            Session stores "auto" as an exact value materialized when the
            policy is installed to 60% of that Invocation's primary model
            context window, clamped to the
            supported integer range.
        model:
          $ref: "#/components/schemas/Model"
      description: |
        Durable Session context-compaction policy. Omission of model uses the
        installing Invocation's primary model. An explicit model must be
        cataloged and use the same provider. Later Invocations automatically
        use this resolved policy and the latest Session summary.
    ProviderTool:
      type: object
      additionalProperties: false
      required: [type, web_search]
      properties:
        type:
          type: string
          enum: [web_search]
          x-enum-varnames: [ProviderToolWebSearch]
        web_search:
          $ref: "#/components/schemas/WebSearchTool"
      description: |
        Selects one server-side tool the provider runs inside the generation
        call. Unlike a host tool the turn does not park for it, and unlike a
        builtin nvoken does not execute it — the provider does, and bills it on
        the same provider key the model runs on. That is deliberate: a
        runtime-operated search would make nvoken hold a search vendor
        relationship and answer "who pays per query" for every installation,
        while this uses the billing relationship the host already has.

        **Anthropic only, for now.** The providers' search controls differ
        materially, and a "common" option set would either be the empty
        intersection or would silently drop fields on some providers — which is
        exactly what nvoken's fail-closed posture forbids. Another provider is
        rejected at admission rather than served a degraded search. Widening is
        per-provider capability work.

        A model that does not declare `controls.tools.web_search` is refused
        too, including any uncataloged model: a tool configuration the provider
        quietly ignored would bill a turn that did no searching and return an
        answer the host believes was researched.

        **Cost accounting.** Search charges ride the provider's bill outside
        nvoken's estimate. `limits.max_estimated_cost_usd` and the usage
        reporting cover model tokens; the provider does not report a
        per-search fee through the interface nvoken reads, so a host that needs
        a hard ceiling on search spend should set `max_uses`.

        **What appears in the transcript.** The model's `server_tool_use` block
        is public, so a host can show what was searched for. The matching
        `web_search_tool_result` is not: it carries the provider's encrypted
        continuation bytes, which the next turn must echo back verbatim and
        which mean nothing to a host. The sources behind a claim arrive as
        citations on the visible text blocks.
    WebSearchTool:
      type: object
      additionalProperties: false
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            Searches this turn may run. Omitted means the provider default.
            This is the only bound nvoken can place on search spend, because
            the provider does not report a per-search fee it can meter.
        allowed_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Restrict results to these hosts. Bare hostnames only — a scheme,
            path, or port is rejected rather than reinterpreted. Mutually
            exclusive with `blocked_domains`, which is the provider's rule.
        blocked_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Exclude these hosts. Same format as `allowed_domains`, and mutually
            exclusive with it.
        user_location:
          $ref: "#/components/schemas/WebSearchLocation"
      description: |
        Anthropic web search options, passed through as the provider defines
        them.
    WebSearchLocation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        city:
          type: string
          maxLength: 128
        region:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 128
        timezone:
          type: string
          maxLength: 128
      description: |
        Approximate location used to bias results. Every member is optional;
        the host decides how precise to be about its end user.
    MCPServer:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Unique server name used as the projected tool-name prefix. Names
            beginning with nvoken in any letter case are reserved.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: Public HTTPS streamable-HTTP MCP endpoint without userinfo or a fragment.
        transport:
          type: string
          enum: [streamable_http]
          x-enum-varnames: [TransportStreamableHTTP]
        allowed_tools:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Optional ordered allowlist. Every named tool must be discovered and projectable.
        headers:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: |
            Secret request headers, limited to 8 KiB encoded. Routing,
            framing, proxy, cookie, hop-by-hop, and MCP session headers are
            rejected. Headers are encrypted per Invocation and never returned.
        timeouts:
          $ref: "#/components/schemas/MCPTimeouts"
    MCPTimeouts:
      type: object
      additionalProperties: false
      properties:
        discovery_seconds:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
        call_seconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
    MCPListToolsRequest:
      type: object
      additionalProperties: false
      required: [server]
      properties:
        server:
          $ref: "#/components/schemas/MCPServer"
    MCPToolAnnotations:
      type: object
      additionalProperties: false
      required: [read_only_hint, idempotent_hint, destructive_hint]
      properties:
        read_only_hint:
          type: [boolean, "null"]
        idempotent_hint:
          type: [boolean, "null"]
        destructive_hint:
          type: [boolean, "null"]
    MCPProjectedTool:
      type: object
      additionalProperties: false
      required: [server_name, projected_name, remote_name, description, input_schema, annotations]
      properties:
        server_name:
          type: string
        projected_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        remote_name:
          type: string
        description:
          type: string
          maxLength: 4096
        input_schema:
          type: object
          additionalProperties: true
        annotations:
          $ref: "#/components/schemas/MCPToolAnnotations"
    MCPToolExclusion:
      type: object
      additionalProperties: false
      required: [server_name, remote_name, reason]
      properties:
        server_name:
          type: string
        remote_name:
          type: string
        reason:
          type: string
          enum: [not_allowlisted, invalid_name, name_collision, invalid_schema, schema_too_large, schema_too_deep]
    MCPListToolsResponse:
      type: object
      additionalProperties: false
      required: [tools, exclusions]
      properties:
        tools:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/MCPProjectedTool"
        exclusions:
          type: array
          items:
            $ref: "#/components/schemas/MCPToolExclusion"
    ToolDeclaration:
      oneOf:
        - $ref: "#/components/schemas/BuiltinToolDeclaration"
        - $ref: "#/components/schemas/HostToolDeclaration"
        - $ref: "#/components/schemas/CallbackToolDeclaration"
      discriminator:
        propertyName: mode
        mapping:
          builtin: "#/components/schemas/BuiltinToolDeclaration"
          host: "#/components/schemas/HostToolDeclaration"
          callback: "#/components/schemas/CallbackToolDeclaration"
    BuiltinToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name:
          type: string
          enum: [nvoken_fetch]
          x-enum-varnames: [NameNvokenFetch]
          description: Fixed runtime-owned public-web fetch capability.
        mode:
          type: string
          enum: [builtin]
          x-enum-varnames: [ModeBuiltin]
    HostToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, description, mode, input_schema]
      description: |
        A host tool is function calling: declared with JSON Schema and executed
        by the host application.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Unique within the definition; the `nvoken_` prefix is reserved.

            The charset is deliberately the strictest tool-name constraint any
            supported provider imposes, so every admitted name reaches every
            provider unchanged. Widening it — to dotted names, for instance —
            would require a mangling layer whose collisions nvoken would then
            own, and would sit ambiguously beside the `__` separator MCP tool
            projection already uses. A host whose own permission grammar uses
            dots should map it injectively (`naming.domain.check` becomes
            `naming_domain_check`) and state the mapping to the model once.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [host]
          x-enum-varnames: [ModeHost]
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
    CallbackToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, description, mode, input_schema, callback]
      description: |
        A callback tool is a host tool nvoken delivers to the host's endpoint
        instead of waiting for the host to poll.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Unique within the definition; the `nvoken_` prefix is reserved.

            The charset is deliberately the strictest tool-name constraint any
            supported provider imposes, so every admitted name reaches every
            provider unchanged. Widening it — to dotted names, for instance —
            would require a mangling layer whose collisions nvoken would then
            own, and would sit ambiguously beside the `__` separator MCP tool
            projection already uses. A host whose own permission grammar uses
            dots should map it injectively (`naming.domain.check` becomes
            `naming_domain_check`) and state the mapping to the model once.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [callback]
          x-enum-varnames: [ModeCallback]
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
        callback:
          $ref: "#/components/schemas/CallbackTarget"
    CallbackTarget:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            Public HTTPS endpoint. Userinfo and fragments are rejected. Every
            dial revalidates resolved addresses and refuses redirects.
    StructuredOutput:
      type: object
      additionalProperties: false
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: true
          description: |
            Self-contained JSON Schema for an object result. Compact canonical
            JSON is limited to 32 KiB and 16 schema positions. Supported
            keywords are type, title, description, properties, required,
            additionalProperties, items, enum, pattern, minLength, maxLength,
            minItems, maxItems, uniqueItems, minimum, and maximum. Every schema
            position has one string type; pattern values are limited to 1,024
            UTF-8 bytes; references and other keywords are rejected. Numeric
            bounds are read as values, not spellings: 10, 10.0, and 1e1 are the
            same bound.
      description: |
        Optional per-Invocation structured-output contract. nvoken exposes a
        reserved durable submit tool and publishes only a server-validated
        terminal object. This does not enable host-defined tools.
    Limits:
      type: object
      additionalProperties: false
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          type: integer
          minimum: 1
          description: |
            Optional cumulative external-waiting SLA. When omitted, host and
            callback ToolCalls may remain pending indefinitely; waiting does
            not consume the Invocation's total or active execution budgets.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            nvoken's standard list-price guardrail, not preauthorization or a billing
            ledger. Requires known USD pricing for the selected model and
            otherwise fails closed with `budget_exceeded` and
            `details.kind = estimated_cost_unavailable`. When pricing absence
            is knowable before execution, nvoken rejects before a provider call.
            Reaching the ceiling itself is not a failure when it is noticed at
            an execution seam: the turn settles `incomplete` with
            `stop_reason: max_estimated_cost` and keeps its work.
        max_iterations:
          type: integer
          minimum: 1
      description: |
        Optional requested limits. Total time bounds the entire turn, active
        time bounds model and tool execution, and waiting time bounds the
        cumulative time parked for host or callback tool results. Installation
        defaults supply all three time limits and the iteration limit.
        Output-token and estimated-cost limits are unlimited when omitted.
        Installation maxima may be lower than the schema's numeric range.
    ResumeInvocationRequest:
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits:
          $ref: "#/components/schemas/Limits"
      description: |
        Replacement for the one turn-level consumption ceiling named by the
        paused Invocation's stop_reason. Exactly that field must be present
        and must be raised above both the previous ceiling and usage so far.
    Model:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        id:
          type: string
          minLength: 1
          maxLength: 255
    ModelInput:
      oneOf:
        - $ref: "#/components/schemas/Model"
        - type: string
          pattern: "^[^/]+/.+$"
          maxLength: 511
      description: |
        Model selection accepted at Invocation admission. The object is
        canonical. The `provider/id` string is caller convenience: nvoken
        splits on the first slash and always echoes the object form.
    InvocationStatus:
      type: string
      enum: [queued, running, waiting, paused, completed, incomplete, failed, cancelled]
      description: |
        `completed`, `incomplete`, `failed`, and `cancelled` are terminal and
        immutable.

        `completed` means exactly one thing: the turn ended the way it was
        asked to — the model finished, or the caller interrupted it.
        `incomplete` means the runtime enforced a budget at a coherent
        execution seam. Any budget exhaustion observed at such a seam settles
        `incomplete` with `stop_reason` naming the budget; the transcript is
        valid and stays in the next turn's context, exactly as a completed
        turn's does. Exhaustion that cannot reach a seam — a deadline landing
        mid-request, reaper settlement — still settles `failed` with `error`
        as the authority. A schema-bearing turn that never published a
        validated object also fails, `structured_output_unsatisfied`,
        whichever budget stopped it.

        `waiting`—known elsewhere as `requires_action`—means the Invocation has
        durable pending host ToolCalls and owns no execution lease. Final
        result acceptance moves it back to
        `queued`. Checkpoint recovery may also move `running` back to
        `queued`; the `attempt` counter distinguishes a retry from tool-result
        acceptance, and lifecycle revision orders every transition.

        `paused` is nonterminal dormant work stopped at a coherent consumption
        ceiling. It owns no lease and its deadlines are suspended until the
        exhausted turn limit is raised or the Session budget is raised or
        removed. It still accepts interrupt, cancel, and staged nudges.
    InvocationStopReason:
      type: string
      enum: [end_turn, interrupted, max_iterations, deadline,
             max_output_tokens, max_estimated_cost, session_budget, shared_budget]
      description: |
        Why a turn stopped. It spans both non-failure terminals and is
        partitioned between them.

        A `completed` turn carries `end_turn` (the model finishing) or
        `interrupted` (a caller's graceful stop, taken at the next execution
        seam). An `incomplete` turn carries the budget it exhausted at a seam:
        `max_iterations`, `deadline`, `max_output_tokens`, or
        `max_estimated_cost`, `session_budget`, or `shared_budget`. A paused turn carries one of
        the consumption reasons but never `deadline`. An interrupt is deliberately not `incomplete` —
        the caller asked the turn to end there, so ending there is the
        requested result. The vocabulary is extensible.
    Invocation:
      type: object
      additionalProperties: false
      required: [id, agent_id, session_id, user_key, definition_id, definition, status, stop_reason, blocking_budget,
                 attempt, error, usage,
                 provenance, structured_output, structured_output_provenance,
                 metadata, limits, active_execution_ms, deadline_at,
                 created_at, updated_at, ended_at]
      properties:
        id:
          $ref: "#/components/schemas/InvocationID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Host-owned end-user label admitted on this turn. Filtering only;
            not an isolation boundary.
        definition_id:
          $ref: "#/components/schemas/AgentDefinitionID"
        definition:
          oneOf:
            - $ref: "#/components/schemas/AgentDefinition"
            - type: "null"
          description: |
            The admitted definition, returned exactly as snapshotted. Remote MCP
            request headers were never stored and never appear here. Present
            on `GET /v1/invocations/{id}` and on the result; null in list
            items, where `definition_id` identifies it. `definition.limits` is what the
            host requested; `limits` is what the installation resolved.
        deduplicated:
          type: boolean
          description: |
            Present only in the `POST /v1/invocations` response. False for a
            new durable admission and true when the idempotency key returned
            an existing Invocation.
        status:
          $ref: "#/components/schemas/InvocationStatus"
        stop_reason:
          oneOf:
            - $ref: "#/components/schemas/InvocationStopReason"
            - type: "null"
          description: |
            Why the turn stopped or paused. Present on `completed`,
            `incomplete`, and `paused`; null on every other status — a failure
            keeps `error` as the authority. Treat an unrecognized value as an
            ordinary end.
        blocking_budget:
          oneOf:
            - $ref: "#/components/schemas/BudgetBlock"
            - type: "null"
          description: Exact Session or shared Budget for a budget stop, otherwise null.
        attempt:
          type: integer
          minimum: 0
          description: |
            Execution attempts this Invocation has been claimed for. It
            increases on every claim, so an attempt increase across a
            `running → queued → running` transition is the retry signal that
            status alone cannot give, and it is the durable anchor for
            discarding provisional output from an earlier attempt. Zero
            before the first claim.
        error:
          oneOf:
            - $ref: "#/components/schemas/InvocationFailure"
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: One normalized terminal aggregate, not a billing ledger.
        provenance:
          oneOf:
            - $ref: "#/components/schemas/ModelProvenance"
            - type: "null"
        structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
          description: |
            Server-validated terminal object for a schema-bearing Invocation.
            Null until successful terminal settlement and always null when no
            output contract was admitted.
        structured_output_provenance:
          oneOf:
            - $ref: "#/components/schemas/StructuredOutputProvenance"
            - type: "null"
        metadata:
          oneOf:
            - $ref: "#/components/schemas/Metadata"
            - type: "null"
          description: |
            Host correlation data recorded at admission, returned verbatim.
        limits:
          $ref: "#/components/schemas/ResolvedLimits"
        active_execution_ms:
          type: integer
          minimum: 0
        deadline_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            The deadline currently enforced by the runtime. Null while the
            Invocation is waiting without an explicit waiting timeout; the
            explicit waiting deadline while bounded; otherwise the total-time
            deadline for queued, running, and terminal Invocations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
          description: Present for a waiting Invocation with unresolved host calls.
    InvocationList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invocation"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    InvocationResult:
      type: object
      additionalProperties: false
      required: [invocation, messages, output_text]
      properties:
        invocation:
          $ref: "#/components/schemas/Invocation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
          description: |
            Every canonical SessionMessage owned by this Invocation, all
            roles, ascending sequence, composed at read time from the
            canonical transcript. Nothing is stored twice.
        output_text:
          oneOf:
            - type: string
            - type: "null"
          description: |
            The text content blocks of this Invocation's assistant-role
            messages concatenated in transcript order without separators.
            Non-null only when the Invocation is completed and at least one
            assistant text block exists. Failed and cancelled Invocations
            keep their messages readable as evidence while output_text stays
            null.
    ModelUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
          description: Model requests represented by this aggregate. Older retained evidence may omit it.
        estimated_cost:
          $ref: "#/components/schemas/ModelCost"
    ModelCost:
      type: object
      additionalProperties: false
      required: [input, output, cache_read, cache_write, total]
      properties:
        input:
          type: number
          minimum: 0
        output:
          type: number
          minimum: 0
        cache_read:
          type: number
          minimum: 0
        cache_write:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
        currency:
          type: string
        model:
          type: string
    ModelProvenance:
      type: object
      additionalProperties: false
      required: [provider, requested_model, served_model, provider_key_source]
      properties:
        provider:
          type: string
        requested_model:
          type: string
        served_model:
          type: string
        provider_key_source:
          type: string
          enum: [caller_ephemeral, app_byok, tenant_byok, platform, config_byok]
        provider_key_id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider_key_version_id:
          $ref: "#/components/schemas/ProviderKeyVersionID"
      description: |
        Reusable BYOK sources include safe provider key and version IDs. Caller,
        platform, and config sources omit them. No secret material is
        included.
    StructuredOutputProvenance:
      type: object
      additionalProperties: false
      required: [source, schema_sha256]
      properties:
        source:
          type: string
          enum: [tool_call]
          x-enum-varnames: [SourceToolCall]
        tool_call_id:
          type: string
          pattern: "^tcal_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        schema_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
      description: |
        Immutable proof that output equals the accepted reserved durable
        ToolCall request under the admitted schema digest.
    ToolCallID:
      type: string
      pattern: "^tcal_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    CallbackDeliveryID:
      type: string
      pattern: "^cbdy_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    ToolCallMode:
      type: string
      enum: [builtin, host, callback, mcp]
    ToolCallStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]
    CallbackDeliveryOutcome:
      type: string
      enum: [pending, succeeded, failed, abandoned]
      description: |
        `pending` covers a blocked, available, or currently leased delivery.
        The other values are terminal transport outcomes.
    ToolCallDelivery:
      type: object
      additionalProperties: false
      required: [outcome, attempts, last_http_status]
      properties:
        outcome:
          $ref: "#/components/schemas/CallbackDeliveryOutcome"
        attempts:
          type: integer
          format: int64
          minimum: 0
          description: Number of leased HTTP delivery attempts.
        last_http_status:
          oneOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: "null"
          description: Last HTTP status returned by the endpoint, or null before any response.
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, mode, name, status, iteration, created_at, settled_at, attempts]
      properties:
        id:
          $ref: "#/components/schemas/ToolCallID"
        mode:
          $ref: "#/components/schemas/ToolCallMode"
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: "#/components/schemas/ToolCallStatus"
        iteration:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        settled_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        attempts:
          type: integer
          minimum: 0
          description: Number of runtime execution attempts for this ToolCall.
        delivery:
          $ref: "#/components/schemas/ToolCallDelivery"
          description: Present only when mode is callback.
    ToolCallList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    ToolCallbackContext:
      type: object
      additionalProperties: false
      required: [schema_version, delivery_id, tool_call_id, invocation_id,
                 session_id, agent_key]
      properties:
        schema_version:
          type: integer
          enum: [1]
        delivery_id:
          $ref: "#/components/schemas/CallbackDeliveryID"
        tool_call_id:
          $ref: "#/components/schemas/ToolCallID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Absent for the app's default tenant.
    ToolCallbackRequest:
      type: object
      additionalProperties: false
      required: [nvoken, input]
      properties:
        nvoken:
          $ref: "#/components/schemas/ToolCallbackContext"
        input: {}
    ToolCallbackResponse:
      type: object
      additionalProperties: false
      required: [content]
      description: |
        Strict callback reply. The encoded content is limited to 256 KiB and
        32 nesting levels. `is_error` defaults to false when omitted.
      properties:
        content: {}
        is_error:
          type: boolean
          default: false
    PendingHostToolCall:
      type: object
      additionalProperties: false
      required: [id, name, input, deadline_at]
      properties:
        id:
          $ref: "#/components/schemas/ToolCallID"
        name:
          type: string
        input: {}
        deadline_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            The Invocation's explicit waiting deadline, or null when external
            waiting is unbounded.
    SubmitHostToolResultsRequest:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [tool_call_id, content]
            properties:
              tool_call_id:
                $ref: "#/components/schemas/ToolCallID"
              content: {}
              is_error:
                type: boolean
    HostToolResultAcceptance:
      type: object
      additionalProperties: false
      required: [tool_call_id, status, deduplicated]
      properties:
        tool_call_id:
          $ref: "#/components/schemas/ToolCallID"
        status:
          type: string
          enum: [completed, failed]
        deduplicated:
          type: boolean
    SubmitHostToolResultsResponse:
      type: object
      additionalProperties: false
      required: [invocation_id, session_id, status, results, pending_tool_calls]
      properties:
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        status:
          $ref: "#/components/schemas/InvocationStatus"
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/HostToolResultAcceptance"
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
    InvocationFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - deadline_exceeded
            - budget_exceeded
            - provider_key_unavailable
            - context_window_exceeded
            - input_media_rejected
            - provider_error
            - mcp_discovery_failed
            - structured_output_unsatisfied
            - internal
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      description: |
        Failed Invocations may carry paired usage and provenance when a model
        response produced safe normalized evidence before deadline or limit
        settlement. Cancellation carries any checkpointed usage and
        provenance accumulated before it was requested; a pre-response
        failure carries neither.

        `details` is a bounded, code-specific object. Each code names its own
        keys and nothing else reads them:

        - `deadline_exceeded` carries `details.scope`, the deadline that was
          breached, drawn from `total | active_execution | execution_segment
          | waiting`. One condition has one code: a deadline reports this
          wherever the runtime noticed it.
        - `budget_exceeded` carries `details.kind`, the consumption ceiling
          the turn overran, drawn from `output_tokens | estimated_cost |
          estimated_cost_unavailable`. A ceiling only lands here when no
          coherent seam absorbed it; at a seam the same ceiling settles
          `incomplete` with the matching `stop_reason` instead.
          `estimated_cost_unavailable` is always a failure — nothing was
          exhausted, nvoken simply cannot price the model.
        - `structured_output_unsatisfied` carries `details.reason`, drawn from
          `missing | invalid | oversized`.
        - `context_window_exceeded` carries the integer keys
          `input_tokens`, `context_window_tokens`, and
          `requested_output_tokens`, each present only when known.
        - `input_media_rejected` carries `modality`, `media_type`, and
          `reason` as the provider reported them, each present only when
          known.

        A `provider_error` failure carries
        `details.provider_failure_class`, nvoken's own classification of the
        provider failure, drawn from `configuration | canceled | throttled |
        upstream_rejected | upstream_unavailable | timeout_or_transport |
        invalid_response | unknown`. `upstream_rejected` means the provider
        refused this request — do not retry it as-is. `upstream_unavailable`
        and `throttled` mean the provider could not serve it — retry with
        backoff. No raw provider error material ever crosses into this
        payload.
    ResolvedLimits:
      type: object
      additionalProperties: false
      required: [total_timeout_seconds, active_timeout_seconds, waiting_timeout_seconds, max_iterations]
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: |
            The explicit cumulative external-waiting SLA, or null when waits
            are durable and unbounded.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            Resolved USD list-price guardrail. It is present only when the host
            requested a cost limit; unknown price metadata fails closed.
        max_iterations:
          type: integer
          minimum: 1
    SessionContext:
      type: object
      additionalProperties: false
      required: [estimated_tokens, context_window_tokens, model]
      properties:
        estimated_tokens:
          type: integer
          format: int64
          minimum: 0
          description: |
            Estimated tokens in the retained generation context: the latest
            applied summary plus the generation-eligible messages after its
            watermark. This is the same estimate the compaction trigger uses.
        context_window_tokens:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: |
            Cataloged context window for `model`, or null when the selected
            model is not in this nvoken installation's catalog.
        model:
          $ref: "#/components/schemas/Model"
          description: |
            Model whose context window applies: the Session compaction model
            when configured, otherwise the most recent Invocation's primary
            model.
    Session:
      type: object
      additionalProperties: false
      required: [id, agent_id, tenant_key, session_key, user_key, forked_from, compaction, retention, budget, expires_at, metadata, active_invocation_id, active_invocation_status, blocking_budget, context, usage, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionID"
        agent_id:
          oneOf:
            - $ref: "#/components/schemas/AgentID"
            - type: "null"
          description: |
            Null only for a Session created ahead of its first Invocation.
            The first admitted Invocation binds it; once set the binding is
            immutable.
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Immutable effective tenant partition reference.
        session_key:
          oneOf:
            - type: string
            - type: "null"
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Host-owned end-user label recorded when this Session was opened.
            Filtering only; not an isolation boundary.
        forked_from:
          oneOf:
            - $ref: "#/components/schemas/SessionForkLineage"
            - type: "null"
          description: Durable source prefix lineage, or null for an original Session.
        compaction:
          oneOf:
            - $ref: "#/components/schemas/CompactionPolicy"
            - type: "null"
          description: |
            The automatic compaction policy this Session actually applies, or
            null when it compacts nothing. It is echoed resolved: a request
            that asked for `trigger_tokens: auto` reads back the integer that
            resolved to, and a request that named no model reads back the
            model the policy bound. Nothing here is ever the unresolved
            request.
        retention:
          oneOf:
            - $ref: "#/components/schemas/RetentionPolicy"
            - type: "null"
          description: |
            The idle retention window this Session was created with, or null
            when it is retained until deleted explicitly. A window outside the
            supported range is refused at creation rather than clamped, so
            what is read back is always exactly what applies.
        budget:
          oneOf:
            - $ref: "#/components/schemas/SessionBudget"
            - type: "null"
          description: The current mutable Session-wide estimated-cost guardrail.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            When this Session becomes eligible for automatic erasure, or null
            when it has no retention window. It moves forward on every
            Invocation admission and settlement, so a Session in use stays
            ahead of it.
        metadata:
          oneOf:
            - $ref: "#/components/schemas/Metadata"
            - type: "null"
          description: |
            Host correlation data, returned verbatim. Set at creation through
            `session_options.metadata` and changed with
            `PATCH /v1/sessions/{session_id}`.
        active_invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
          description: The queued, running, waiting, or paused Invocation, if one exists.
        active_invocation_status:
          oneOf:
            - type: string
              enum: [queued, running, waiting, paused]
            - type: "null"
          description: Status of active_invocation_id; null exactly when that ID is null.
        blocking_budget:
          oneOf:
            - $ref: "#/components/schemas/BudgetBlock"
            - type: "null"
          description: Budget blocking the active paused Invocation, otherwise null.
        context:
          oneOf:
            - $ref: "#/components/schemas/SessionContext"
            - type: "null"
          description: |
            Read-time retained-context estimate and the model window it is
            measured against. Null until the Session has either a compaction
            model or an Invocation primary model. The object remains present
            for an uncataloged model, with `context_window_tokens: null`.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: |
            Read-time sum of this Session's non-null Invocation usage and
            committed private compaction usage. Null until either exists. This
            normalized estimate is not a billing ledger.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
          description: Pending host calls for the active waiting Invocation.
    SessionForkLineage:
      type: object
      additionalProperties: false
      required: [session, message]
      properties:
        session:
          $ref: "#/components/schemas/SessionID"
        message:
          $ref: "#/components/schemas/SessionMessageID"
      description: |
        The source Session and inclusive source message of a fork. These IDs
        remain as lineage after the source Session is erased.
    SessionList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionMessageRole:
      type: string
      enum: [user, assistant, tool]
    SessionContentBlock:
      oneOf:
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/ImageReferenceBlock"
        - $ref: "#/components/schemas/DocumentReferenceBlock"
        - $ref: "#/components/schemas/ToolUseBlock"
        - $ref: "#/components/schemas/ServerToolUseBlock"
        - $ref: "#/components/schemas/ToolResultBlock"
        - $ref: "#/components/schemas/RedactedBlock"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextBlock"
          image: "#/components/schemas/ImageReferenceBlock"
          document: "#/components/schemas/DocumentReferenceBlock"
          tool_use: "#/components/schemas/ToolUseBlock"
          server_tool_use: "#/components/schemas/ServerToolUseBlock"
          tool_result: "#/components/schemas/ToolResultBlock"
          redacted: "#/components/schemas/RedactedBlock"
      description: |
        One public, provider-neutral transcript block. Stored media bytes are
        projected on reads as `type`, `media_type`, optional `title`, byte
        count in `bytes`, and a `sha256:` digest.

        New block types will appear as features ship. Render the types you know
        and skip the rest.
    TextBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          x-enum-varnames: [TypeText]
        text:
          type: string
          minLength: 1
        citations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Citation"
          description: Source locations attached to generated text.
    Citation:
      oneOf:
        - $ref: "#/components/schemas/CharLocationCitation"
        - $ref: "#/components/schemas/WebSearchResultLocationCitation"
        - $ref: "#/components/schemas/URLCitation"
      discriminator:
        propertyName: type
        mapping:
          char_location: "#/components/schemas/CharLocationCitation"
          web_search_result_location: "#/components/schemas/WebSearchResultLocationCitation"
          url_citation: "#/components/schemas/URLCitation"
    CharLocationCitation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [char_location]
          x-enum-varnames: [TypeCharLocation]
        cited_text:
          type: string
        document_index:
          type: integer
          minimum: 0
        document_title:
          type: string
        start_char_index:
          type: integer
          minimum: 0
        end_char_index:
          type: integer
          minimum: 0
      description: A location inside one indexed input document.
    WebSearchResultLocationCitation:
      type: object
      additionalProperties: false
      required: [type, url, title]
      properties:
        type:
          type: string
          enum: [web_search_result_location]
          x-enum-varnames: [TypeWebSearchResultLocation]
        url:
          type: string
          format: uri
        title:
          type: string
        encrypted_index:
          type: string
        cited_text:
          type: string
      description: A provider search result cited by the generated text.
    URLCitation:
      type: object
      additionalProperties: false
      required: [type, url, title, start_index, end_index]
      properties:
        type:
          type: string
          enum: [url_citation]
          x-enum-varnames: [TypeURLCitation]
        url:
          type: string
          format: uri
        title:
          type: string
        start_index:
          type: integer
          minimum: 0
        end_index:
          type: integer
          minimum: 0
      description: A URL citation positioned within the generated text.
    ImageReferenceBlock:
      type: object
      additionalProperties: false
      required: [type, media_type, bytes, digest]
      properties:
        type:
          type: string
          enum: [image]
          x-enum-varnames: [TypeImage]
        media_type:
          type: string
          enum: [image/gif, image/jpeg, image/png, image/webp]
        bytes:
          type: integer
          minimum: 0
          maximum: 5242880
          description: Decoded media byte count; never the media payload.
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the decoded media bytes.
        url:
          type: string
          format: uri
          description: Original URL when the image arrived by URL.
      description: A bounded read projection of a stored input image.
    DocumentReferenceBlock:
      type: object
      additionalProperties: false
      required: [type, media_type, bytes, digest]
      properties:
        type:
          type: string
          enum: [document]
          x-enum-varnames: [TypeDocument]
        media_type:
          type: string
          enum: [application/pdf]
        title:
          type: string
          description: Present only when the caller supplied a title.
        bytes:
          type: integer
          minimum: 0
          maximum: 16777216
          description: Decoded document byte count; never the document payload.
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the decoded document bytes.
        url:
          type: string
          format: uri
          description: Original URL when the document arrived by URL.
      description: A bounded read projection of a stored input document.
    ToolUseBlock:
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      properties:
        type:
          type: string
          enum: [tool_use]
          x-enum-varnames: [TypeToolUse]
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        input: {}
      description: A host, builtin, MCP, or callback tool call.
    ServerToolUseBlock:
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      properties:
        type:
          type: string
          enum: [server_tool_use]
          x-enum-varnames: [TypeServerToolUse]
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        input: {}
      description: A provider-run tool call retained in the public transcript.
    ToolResultBlock:
      type: object
      additionalProperties: false
      required: [type, tool_use_id, content]
      properties:
        type:
          type: string
          enum: [tool_result]
          x-enum-varnames: [TypeToolResult]
        tool_use_id:
          type: string
          minLength: 1
        content:
          description: |
            The host's own JSON, retained verbatim. Its canonical encoding is
            limited to 262144 bytes and 32 nesting levels; the complete result
            submission body is limited to 1048576 bytes.
          x-nvoken-max-json-bytes: 262144
          x-nvoken-max-json-depth: 32
        is_error:
          type: boolean
      description: The durable result of one tool call.
    RedactedBlock:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [redacted]
          x-enum-varnames: [TypeRedacted]
      description: Placeholder for an assistant message whose content is private.
    SessionMessage:
      type: object
      additionalProperties: false
      required: [id, session_id, agent_id, invocation_id, user_key, sequence, role, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionMessageID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
          description: |
            The Invocation that wrote this row, or null for seeded and copied
            history. `origin` and `copied_from_message_id` explain that null.
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Per-turn host end-user attribution. Copied rows preserve it;
            seeded history may omit it.
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          $ref: "#/components/schemas/SessionMessageRole"
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SessionContentBlock"
        origin:
          type: string
          enum: [seeded]
          description: |
            Present only when the message content was asserted by the host at
            Session creation. Messages nvoken wrote carry no origin marker;
            fork copies preserve the source marker.
        copied_from_message_id:
          $ref: "#/components/schemas/SessionMessageID"
          description: Present only on a fork copy; names its source message.
        phase:
          allOf:
            - $ref: "#/components/schemas/MessagePhase"
          description: |
            What this assistant message was in its turn. Absent on user and
            tool messages, which have no phase.

            Derived at read time from the settling facts on an
            Invocation-owned message and frozen onto a fork copy. It never
            takes host input. One consequence: a live source message read
            before its turn settles reads `commentary`, because nothing had
            settled yet. The same source message read after settlement reads
            its final phase, and the stream's `invocation_changes` are what
            announce the settlement in between.
        created_at:
          type: string
          format: date-time
    MessagePhase:
      type: string
      enum: [commentary, final_answer]
      description: |
        `final_answer` is the assistant message that settled its turn
        `completed` with `stop_reason: end_turn` — the reply. `commentary` is
        everything else: narration between tool calls, and every message of an
        interrupted or `incomplete` turn, none of which was ever an answer. A
        turn with no `final_answer` is visibly unfinished, which is what makes
        `incomplete` directly renderable.
    NudgeInvocationRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          allOf:
            - $ref: "#/components/schemas/InvocationInput"
          description: |
            Text guidance for the running turn: a string, or an array of text
            blocks. Media blocks are refused here.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Per-Invocation retry key. The same key with the same content
            returns the original acknowledgement with `deduped: true`; the
            same key with different content is refused, so a key is never
            reused with different words.
    NudgeAcknowledgement:
      type: object
      additionalProperties: false
      required: [pending_input_id, state, deduped, after_sequence]
      properties:
        pending_input_id:
          $ref: "#/components/schemas/PendingInputID"
        state:
          $ref: "#/components/schemas/PendingInputStatus"
        deduped:
          type: boolean
        after_sequence:
          type: integer
          format: int64
          description: |
            Transcript position to watch from for the promoted message. It is
            the Session cursor as of this call for input that has not been
            drained, and the position immediately before the promoted message
            for input that already has, so reading after it finds the message
            either way.
    PendingInputStatus:
      type: string
      enum: [pending, drained, expired, cancelled]
      description: |
        `pending` is the only state the turn consumes. `drained` means the
        executor promoted the content into the transcript, `expired` that the
        Invocation settled without taking it, and `cancelled` that the caller
        withdrew it first.
    PendingInput:
      type: object
      additionalProperties: false
      required: [id, invocation_id, status, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/PendingInputID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        status:
          $ref: "#/components/schemas/PendingInputStatus"
        content:
          $ref: "#/components/schemas/InvocationInput"
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        drained_at:
          type: string
          format: date-time
        drained_message_sequence:
          type: integer
          format: int64
          description: |
            Transcript sequence the content was promoted into. Present only on
            a drained input, and the receipt that the model saw it.
        settled_at:
          type: string
          format: date-time
    PendingInputList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingInput"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionMessageList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionCompactionStatus:
      type: string
      enum: [applied, fell_through]
      description: |
        `applied` means the summary became the Session's private context
        projection. `fell_through` means the turn continued with the prior
        projection after a failed or invalid summary pass.
    SessionCompaction:
      type: object
      additionalProperties: false
      required: [id, invocation_id, covers_through, status, failure_class,
                 usage, summary, created_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionCompactionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        covers_through:
          type: integer
          format: int64
          minimum: 1
          description: Last canonical Session message sequence included in this pass.
        status:
          $ref: "#/components/schemas/SessionCompactionStatus"
        failure_class:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
          description: |
            nvoken's stable failure classification for a fell-through pass;
            null when status is applied.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: |
            Summary-model usage when trustworthy evidence exists. This counts
            toward Session usage but never toward the creating Invocation's
            usage.
        summary:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
          description: |
            Diagnostic private context projection for an applied pass; null
            for a fell-through pass. It is derived from the host transcript
            and is not a canonical Session message.
        created_at:
          type: string
          format: date-time
    SessionCompactionList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionCompaction"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    InvocationChange:
      type: object
      additionalProperties: false
      required: [invocation_id, revision, status, through_message_sequence, error, usage, provenance, structured_output, structured_output_provenance, occurred_at]
      properties:
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/InvocationStatus"
        through_message_sequence:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/InvocationFailure"
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
        provenance:
          oneOf:
            - $ref: "#/components/schemas/ModelProvenance"
            - type: "null"
        structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        structured_output_provenance:
          oneOf:
            - $ref: "#/components/schemas/StructuredOutputProvenance"
            - type: "null"
        occurred_at:
          type: string
          format: date-time
    TranscriptSnapshot:
      type: object
      additionalProperties: false
      required: [messages, invocation_changes, has_more, resume_cursor, next_page_token]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        invocation_changes:
          type: array
          items:
            $ref: "#/components/schemas/InvocationChange"
        has_more:
          type: boolean
        resume_cursor:
          type: string
          minLength: 1
          description: Delivered composite message-sequence and lifecycle-revision watermark.
        next_page_token:
          oneOf:
            - type: string
            - type: "null"
    TranscriptUpdate:
      type: object
      additionalProperties: false
      required: [type, session_id, messages, invocation_changes, resume_cursor]
      properties:
        type:
          type: string
          enum: [transcript.update]
          x-enum-varnames: [EventTranscriptUpdate]
        session_id:
          $ref: "#/components/schemas/SessionID"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        invocation_changes:
          type: array
          items:
            $ref: "#/components/schemas/InvocationChange"
        resume_cursor:
          type: string
          minLength: 1
          description: Delivered composite message-sequence and lifecycle-revision watermark.
    OutputTextDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, attempt, iteration, content_index, text, emitted_at]
      properties:
        type:
          type: string
          enum: [output_text.delta]
          x-enum-varnames: [EventOutputTextDelta]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: |
            Execution attempt that emitted this preview. Discard provisional
            output from earlier attempts when this value increases.
        iteration:
          type: integer
          minimum: 1
          description: Model iteration that owns the assistant message.
        content_index:
          type: integer
          minimum: 0
        text:
          type: string
          minLength: 1
        emitted_at:
          type: string
          format: date-time
    ThinkingDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, attempt, iteration, content_index, thinking, emitted_at]
      properties:
        type:
          type: string
          enum: [thinking.delta]
          x-enum-varnames: [EventThinkingDelta]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: |
            Execution attempt that emitted this preview. Discard provisional
            output from earlier attempts when this value increases.
        iteration:
          type: integer
          minimum: 1
          description: Model iteration that owns the assistant message.
        content_index:
          type: integer
          minimum: 0
        thinking:
          type: string
          minLength: 1
        emitted_at:
          type: string
          format: date-time
    StreamResyncEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, reason]
      properties:
        type:
          type: string
          enum: [stream.resync]
          x-enum-varnames: [EventStreamResync]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        reason:
          type: string
          enum: [live_delivery_gap]
          x-enum-varnames: [ReasonLiveDeliveryGap]
    StreamEndEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, reason, resume_cursor]
      properties:
        type:
          type: string
          enum: [stream.end]
          x-enum-varnames: [EventStreamEnd]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        reason:
          type: string
          enum: [terminal, rotate]
          description: |
            `rotate` means reconnect with `resume_cursor`. `terminal` means
            the scoped Invocation settled, or the Session became idle for a
            Session-scoped stream.
        resume_cursor:
          type: string
          minLength: 1
    TranscriptStreamEvent:
      description: |
        The JSON value carried by one Session-stream SSE `data:` field.
        Durable `transcript.update` frames carry the resume cursor as both
        payload data and SSE `id`; preview and control frames never carry IDs.
      oneOf:
        - $ref: "#/components/schemas/TranscriptUpdate"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    InvocationAcceptedEvent:
      type: object
      additionalProperties: false
      required: [type, agent_id, session_id, invocation_id, status, deduplicated, deadline_at, limits]
      properties:
        type:
          type: string
          enum: [invocation.accepted]
          x-enum-varnames: [EventInvocationAccepted]
        agent_id:
          $ref: "#/components/schemas/AgentID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        status:
          $ref: "#/components/schemas/InvocationStatus"
        deduplicated:
          type: boolean
        deadline_at:
          type: string
          format: date-time
        limits:
          allOf:
            - $ref: "#/components/schemas/ResolvedLimits"
          description: |
            The effective budgets this Invocation was admitted with, after
            installation defaults and feature floors were applied. Echoed here
            so a host sees what it actually got without a second read — an
            omitted `max_iterations` in particular resolves to a value the
            request never named.
    InvocationUpdateEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, invocation, new_messages]
      properties:
        type:
          type: string
          enum: [invocation.update]
          x-enum-varnames: [EventInvocationUpdate]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        invocation:
          $ref: "#/components/schemas/Invocation"
        new_messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
    InvocationResultEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, result]
      properties:
        type:
          type: string
          enum: [invocation.result]
          x-enum-varnames: [EventInvocationResult]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        result:
          $ref: "#/components/schemas/InvocationResult"
    InvocationStreamEvent:
      description: |
        Typed event from one Invocation stream. A minimal consumer prints
        `output_text.delta` and finishes on `invocation.result`.
      oneOf:
        - $ref: "#/components/schemas/InvocationAcceptedEvent"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/InvocationUpdateEvent"
        - $ref: "#/components/schemas/InvocationResultEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - definition_not_found
        - media_fetch_failed
        - model_retired
        - unauthenticated
        - forbidden
        - not_found
        - idempotency_conflict
        - session_options_conflict
        - provider_key_conflict
        - session_invocation_active
        - invocation_not_waiting
        - invocation_not_paused
        - budget_exceeded
        - budget_conflict
        - tool_result_conflict
        - tool_result_expired
        - mcp_discovery_failed
        - rate_limited
        - internal
        - unavailable
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    InvalidRequest:
      description: The request is invalid or contains a deferred field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: tools[0].mode must be host.
            request_id: req_01K0NV9K7Z9WR3Y3Q3RMV2G7H0
            details:
              path: /tools/0/mode
    Unauthenticated:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unauthenticated
            message: A valid API credential is required.
            request_id: req_01K0NVA1K5T8Y1MBVX7TZBM21H
    Forbidden:
      description: The authenticated credential is not permitted to make this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: forbidden
            message: The requested tenant_key conflicts with the credential constraint.
            request_id: req_01K0NVAE24H917QNE9P1QMX95Y
    NotFound:
      description: The resource is missing or cannot be disclosed in this scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: not_found
            message: The requested resource was not found.
            request_id: req_01K0NVASB4CF29K41VZA271H23
    Conflict:
      description: The resource state conflicts with the requested lifecycle transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invocation_not_paused
            message: The Invocation is not paused on a turn-level budget.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    RateLimited:
      description: The deployment ingress rate limited the request; nvoken has no per-app quota yet.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before the caller should retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: rate_limited
            message: Too many requests.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    Internal:
      description: An unexpected server error occurred before acknowledgement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal
            message: The request could not be completed.
            request_id: req_01K0NVB8MJPBPQY0WXFJGCXEH3
    Unavailable:
      description: The service cannot currently complete admission or the read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unavailable
            message: The service is temporarily unavailable.
            request_id: req_01K0NVBGWQ1V6JJBVH0Q4WZRS1
    MCPDiscoveryFailed:
      description: The remote MCP server could not be safely discovered or projected.
      content:
