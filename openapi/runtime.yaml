openapi: 3.1.0
info:
  title: nvoken Runtime API
  version: 0.1.0
  summary: Durable Invocation admission, execution, recovery, and live-output contract
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    This focused contract defines nvoken's implemented background Runtime surface:
    durable Invocation admission, authoritative Invocation and Session reads,
    cursor-based transcript recovery, and resumable Session output streaming.

    The Runtime API has no deletion or retention-control operation. Session
    context compaction creates a private provider projection without mutating
    canonical Session messages. Authoritative records exposed by this contract,
    plus private compaction state, are retained by default; the complete
    inventory and any future ordered-deletion contract are governed by the
    design packet's Data and retention section.

    Inline and callback host tools, structured output, reusable definitions,
    URL media input, and reusable model provider key lifecycle are included.
    General administrative APIs remain outside this version.

    ## Protected vocabulary

    Several names deliberately converge with established agent APIs and must
    not be casually renamed: `metadata` uses OpenAI's bounds of 16 keys,
    64-character names, and 512-byte values; `output_text` is the composed text
    convenience; `reasoning.effort` uses `low`, `medium`, `high`, `xhigh`, and
    `max`; `stop_reason: end_turn`, status `running`, and message phases
    `commentary` and `final_answer` are likewise intentional.

    ## Echo resolved config

    Every setting the runtime resolves on the caller's behalf is readable back,
    resolved, on the resource that used it. A host never has to reconstruct
    what applied from the request it sent plus its own model of nvoken's
    defaults — the resource says.

    Concretely: an Invocation echoes `limits` after installation defaults and
    feature floors, alongside the `definition` it was admitted with exactly as
    snapshotted, and `provenance` records what actually ran. A Session echoes
    its compaction policy with `auto` already materialized to the integer it
    resolved to and the model it bound, and its retention window as accepted.
    New settings are expected to follow: a default the caller cannot read back
    is a setting only the server knows about.

servers:
  - url: /
    description: Current nvoken installation
security:
  - bearerAuth: []
tags:
  - name: Agents
    description: Installation-wide identity anchors; behavior remains per Invocation.
  - name: Invocations
    description: Durable agent-turn admission and state. One Invocation is one agent turn—what OpenAI calls a Response and Cursor calls a Run.
  - name: Models
    description: Curated model discovery and exact model-selection inspection.
  - name: MCP
    description: Stateless remote MCP server discovery.
  - name: Sessions
    description: Durable conversation identity and state. A Session is what OpenAI and Mistral call a Conversation.
  - name: Provider keys
    description: |
      Encrypted app and tenant model-provider BYOK lifecycle. Claude vaults
      authenticate an agent's tools; nvoken provider keys decide who pays for
      the model.
  - name: Apps
    description: Host applications using nvoken as their agentic backend.
  - name: Usage
    description: Read-side token and cost analytics derived from durable evidence.
paths:
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: List registered apps
      description: |
        Returns the apps this credential can see. A credential associated with
        an app sees only that app; a credential with no app association sees
        every registered app. An exact `external_ref` filter narrows either
        view to apps owned by that reference.
      parameters:
        - name: external_ref
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Return only apps whose `external_ref` equals this value.
      responses:
        "200":
          description: The apps visible to the authenticated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [Apps]
      operationId: registerApp
      summary: Register an app
      description: |
        Registers one host application and creates its default tenant,
        returning the generated `app_id`.

        Registration is installation management rather than work inside an app,
        so it requires a credential that is *not* associated with an app; a
        credential bound to one app cannot mint siblings for itself. Names
        identify apps and are unique, so re-registering an existing name is
        rejected rather than returning the existing app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAppRequest"
      responses:
        "201":
          description: The registered app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/apps/{app_id}:
    get:
      tags: [Apps]
      operationId: getApp
      summary: Get one app
      description: |
        Returns one registered app. A credential associated with a different
        app receives `404`, so an app identifier cannot be probed across the
        isolation boundary.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [Apps]
      operationId: updateApp
      summary: Update an app
      description: |
        Updates an app's mutable presentation fields. The unique `name` and the
        ownership-grounding `external_ref` cannot be changed. A credential
        associated with a different app receives `404`.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppRequest"
      responses:
        "200":
          description: The updated app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List Agent identity anchors
      description: |
        Returns newest-first identity anchors scoped to the caller's app. An
        Agent stores only its nvoken ID, the host-owned `agent_key`, and
        creation time; instructions, models, tools, and provider keys still
        travel on each Invocation. An exact `agent_key` filter returns zero or
        one item.

        Unconstrained credentials see the anchors referenced by a Session in
        one of their app's tenants. Tenant-constrained credentials see only
        anchors referenced by a Session in their effective partition.
        Session-constrained credentials see only that Session's anchor. The
        opaque cursor is bound to the authenticated caller, credential
        constraint, and exact key filter.
      parameters:
        - $ref: "#/components/parameters/AgentKeyFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of Agent identity anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Read one Agent identity anchor
      description: |
        Reads identity without admitting work. Out-of-scope and undisclosable
        constrained resources use `not_found`.
      responses:
        "200":
          description: One Agent identity anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/mcp/list-tools:
    post:
      tags: [MCP]
      operationId: listMCPTools
      summary: Discover and project one remote MCP server's tools
      description: |
        Opens one short-lived streamable-HTTP MCP session through guarded
        public-only egress, drains tools/list pagination, applies the same
        allowlist and projection rules used by Invocation execution, and then
        closes the session. Supplied headers are used only for this request,
        are never logged or returned, and are not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPListToolsRequest"
      responses:
        "200":
          description: Stable projected tools and bounded exclusions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPListToolsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/MCPDiscoveryFailed"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations:
    get:
      tags: [Invocations]
      operationId: listInvocations
      summary: List authoritative Invocations
      description: |
        Returns newest-first durable Invocation state. Exact filters combine
        with AND. An installation-wide caller may list all tenant partitions, one
        named partition with `tenant_key`, or the default partition with
        `default_tenant=true`. A tenant-constrained credential is always scoped
        to its partition. The opaque cursor is bound to the normalized filter
        set and credential tenant scope. `agent_id` and `agent_key` are
        mutually exclusive; both normalize to the resolved Agent ID for cursor
        binding, so an equivalent cursor may resume under either spelling.
      parameters:
        - $ref: "#/components/parameters/TenantKeyFilter"
        - $ref: "#/components/parameters/DefaultTenantFilter"
        - $ref: "#/components/parameters/UserKeyFilter"
        - name: session_id
          in: query
          schema:
            $ref: "#/components/schemas/SessionID"
        - name: agent_id
          in: query
          description: Mutually exclusive with agent_key.
          schema:
            $ref: "#/components/schemas/AgentID"
        - $ref: "#/components/parameters/AgentKeyFilter"
        - name: status
          in: query
          description: |
            Repeat to select a union of statuses. Order and duplicates are
            normalized before cursor binding.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/InvocationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of Invocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Invocations]
      operationId: createInvocation
      summary: Durably admit one background agent turn
      description: |
        Resolves or creates the installation-wide Agent identity anchor,
        resolves or creates a Session, resolves the inline or referenced
        definition, appends exactly one caller-input message, and creates one
        queued Invocation in a single transaction. The response is sent only
        after that transaction commits. The request handler never executes the
        model.

        `session_id` and `session_key` are mutually exclusive. A Session ID must
        belong to the named Agent, or be a Session created without one — the
        first admitted Invocation binds the Agent permanently. An installation-wide
        credential may omit `tenant_key` and use the Session's stored partition.
        A tenant-constrained credential cannot cross its partition; an explicit
        mismatch is rejected with `403 forbidden` before resource lookup.

        `idempotency_key` is scoped to the effective
        tenant partition, and `agent_key`. A same-key replay is checked before
        the Session's one-nonterminal-Invocation rule. It returns the original
        records without appending input, even when the Invocation is terminal.
        Material equality covers the Session selector kind and value, the
        resolved definition, and input. A `definition_id` and its byte-identical
        inline definition compare equal. Requested limits are compared before
        default resolution, so an explicit default differs from omission. JSON
        object member order is ignored, array order is significant, and strings
        are not rewritten. A changed material field returns
        `idempotency_conflict`.

        `if_active` defaults to `reject`, preserving
        `session_invocation_active`. Explicit `supersede` requires both create
        and cancel authority. While holding the Session lock, it durably
        cancels any nonterminal Invocation and admits this replacement in the
        same transaction. With no active work it admits normally. Equal replay
        returns the original work before supersession and never cancels newer
        active work.

        `interrupt` requires the same authority and keeps the same lock
        ordering, but stops the active Invocation gracefully instead of
        cancelling it: work already at a seam settles and the replacement is
        admitted in the same transaction, while work under a live lease has
        the interrupt recorded and this request waits for it to settle. If it
        has not settled within the wait, the response is
        `session_invocation_active` with `details.interrupt_requested = true`
        and the request may be reissued.

        A cataloged model continues to admit while deprecated. On and after
        its `retires_at` date, a new admission is refused with `422
        model_retired`; `details` carries the refused `model`, `retires_at`,
        the exact `replacement` provider/id pair, and the request `path`.
        Equal idempotent replay still returns work admitted before retirement.

        A text-only request body is limited to 1 MiB. A body carrying image or
        document blocks is limited to 24 MiB, within which decoded media is
        bounded separately: at most 8 media blocks, 16 MiB decoded in total,
        5 MiB per image, and 16 MiB per document. Requests over any of these
        limits are rejected before admission. URL media is fetched after an
        idempotent replay check and before any row is admitted. The guarded
        fetch accepts public HTTPS only, enforces the item limit while reading,
        and sniffs the returned bytes. nvoken stores those bytes and does not
        fetch the URL again.

        The supported streaming pattern is admit-then-stream: admit with a
        plain JSON POST, then follow the Invocation over
        `GET /v1/invocations/{invocation_id}/stream`. It survives a dropped
        connection without re-admitting and does not depend on front-end
        streaming behavior. `Accept: text/event-stream` on this request is a
        deployment-dependent convenience, not a first-class mode: the
        committed admission is the first `invocation.accepted` frame and the
        connection tails that Invocation through `invocation.result`, but
        delivery requires the deployment front end to stream a non-`200`
        POST response unbuffered. Some managed front ends (including Cloud
        Run's) buffer it until the Invocation settles, which makes a
        host-tool turn's `waiting` state invisible on this connection.
      parameters:
        - name: X-Anthropic-Api-Key
          in: header
          required: false
          description: |
            Caller-supplied Anthropic API key, equivalent to a
            caller_ephemeral `provider_keys` selection. The header
            must name the model provider and cannot be combined with
            the body field. Siblings: X-Openai-Api-Key, X-Gemini-Api-Key,
            X-Xai-Api-Key.
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Openai-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Gemini-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Xai-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvocationRequest"
            examples:
              newSession:
                summary: First use creates the Agent anchor and a new Session
                value:
                  agent_key: support-triage
                  tenant_key: tenant-acme
                  idempotency_key: ticket-483:first-reply
                  input: Why was I charged twice?
                  model:
                    provider: anthropic
                    id: claude-sonnet-5
              keyedSession:
                summary: Resolve or create a tenant-partitioned host Session key
                value:
                  agent_key: support-triage
                  tenant_key: tenant-acme
                  session_key: ticket-483
                  idempotency_key: ticket-483:follow-up-2
                  input:
                    - type: text
                      text: Can you show me the two charge dates?
                  instructions: You are a concise billing support agent.
                  model:
                    provider: anthropic
                    id: claude-sonnet-5
              existingSession:
                summary: Continue an existing Session by durable ID
                value:
                  agent_key: support-triage
                  session_id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                  idempotency_key: ticket-483:follow-up-3
                  input:
                    - type: text
                      text: Please summarize what happened.
                  instructions: You are a concise billing support agent.
                  model:
                    provider: openai
                    id: gpt-5.4
              reusedDefinition:
                summary: Reuse an immutable definition already admitted by this app
                value:
                  agent_key: support-triage
                  session_key: ticket-483
                  idempotency_key: ticket-483:follow-up-4
                  definition_id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
                  input: Please draft the reply.
              structuredOutput:
                summary: Require one validated machine-readable object
                value:
                  agent_key: support-triage
                  session_key: ticket-483
                  idempotency_key: ticket-483:classification
                  input:
                    - type: text
                      text: Classify the billing problem.
                  instructions: Classify the request, then submit the result.
                  model:
                    provider: anthropic
                    id: claude-sonnet-5
                  structured_output:
                    schema:
                      type: object
                      properties:
                        category:
                          type: string
                          enum: [duplicate_charge, refund, other]
                      required: [category]
                      additionalProperties: false
      responses:
        "202":
          description: |
            The Invocation is durably admitted, or an existing Invocation was
            returned for an equal idempotent replay. A replay remains `202` even
            when the returned status is terminal. `Accept: text/event-stream`
            selects an Invocation-scoped stream with `invocation.accepted` as
            its first frame and `invocation.result` as its terminal durable
            frame — a deployment-dependent convenience; the supported pattern
            is a plain JSON admission followed by
            `GET /v1/invocations/{invocation_id}/stream`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invocation"
              examples:
                admitted:
                  summary: New durable admission
                  value:
                    agent_id: agnt_019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                    session_id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    user_key: null
                    id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    definition_id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
                    definition: null
                    status: queued
                    stop_reason: null
                    blocking_budget: null
                    attempt: 0
                    error: null
                    usage: null
                    provenance: null
                    structured_output: null
                    structured_output_provenance: null
                    metadata: null
                    limits:
                      total_timeout_seconds: 900
                      active_timeout_seconds: 300
                      waiting_timeout_seconds: null
                      max_iterations: 3
                    active_execution_ms: 0
                    deduplicated: false
                    deadline_at: "2026-07-20T14:31:02Z"
                    created_at: "2026-07-20T14:16:02Z"
                    updated_at: "2026-07-20T14:16:02Z"
                    ended_at: null
                replayed:
                  summary: Lost acknowledgement followed by equal replay
                  value:
                    agent_id: agnt_019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                    session_id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    user_key: null
                    id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    definition_id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
                    definition: null
                    status: running
                    stop_reason: null
                    blocking_budget: null
                    attempt: 1
                    error: null
                    usage: null
                    provenance: null
                    structured_output: null
                    structured_output_provenance: null
                    metadata: null
                    limits:
                      total_timeout_seconds: 900
                      active_timeout_seconds: 300
                      waiting_timeout_seconds: null
                      max_iterations: 3
                    active_execution_ms: 1200
                    deduplicated: true
                    deadline_at: "2026-07-20T14:31:02Z"
                    created_at: "2026-07-20T14:16:02Z"
                    updated_at: "2026-07-20T14:16:04Z"
                    ended_at: null
                terminalReplay:
                  summary: Equal replay after settlement still returns 202
                  value:
                    agent_id: agnt_019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                    session_id: sesn_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    user_key: null
                    id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    definition_id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
                    definition: null
                    status: completed
                    stop_reason: end_turn
                    blocking_budget: null
                    attempt: 1
                    error: null
                    usage:
                      input_tokens: 12
                      output_tokens: 8
                    provenance: null
                    structured_output: null
                    structured_output_provenance: null
                    metadata: null
                    limits:
                      total_timeout_seconds: 900
                      active_timeout_seconds: 300
                      waiting_timeout_seconds: null
                      max_iterations: 3
                    active_execution_ms: 2300
                    deduplicated: true
                    deadline_at: "2026-07-20T14:31:02Z"
                    created_at: "2026-07-20T14:16:02Z"
                    updated_at: "2026-07-20T14:16:07Z"
                    ended_at: "2026-07-20T14:16:07Z"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/InvocationStreamEvent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The referenced Session, Invocation, or definition is not visible to this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                definitionNotFound:
                  value:
                    code: definition_not_found
                    message: The definition does not exist in this app.
                    request_id: req_01K0NV9K7Z9WR3Y3Q3RMV2G7H2
                    details:
                      definition_id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
        "409":
          description: The idempotency key, supplied Session options, or active Session state conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  summary: Same scope and key, changed material request
                  value:
                    code: idempotency_conflict
                    message: The idempotency key was already used with a different request.
                    request_id: req_01K0NV89D93D0W2V5CGF8BC2R7
                    details:
                      conflicting_paths: [/input]
                activeInvocation:
                  summary: Distinct request races existing nonterminal work
                  value:
                    code: session_invocation_active
                    message: This Session already has a nonterminal Invocation.
                    request_id: req_01K0NV8AJQ9FB89N5MZ5HDZDR3
                    details:
                      invocation_id: invk_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                      status: running
                sessionOptionsConflict:
                  summary: Supplied options differ from the stored Session
                  value:
                    code: session_options_conflict
                    message: The supplied Session options conflict with the stored Session.
