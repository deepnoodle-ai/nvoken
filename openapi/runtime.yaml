  /v1/usage/daily:
    get:
      tags: [Usage]
      operationId: getDailyUsage
      summary: Read daily usage rollups
      description: |
        Aggregates durable model-call evidence — invocation checkpoints plus
        session compaction calls — into per-day buckets keyed by app,
        provider, and model, summing token counts and estimated cost. Derived
        at read time from the transcript record, never from a separately
        maintained counter.

        An app-bound credential reads its own app. An app-less presentation
        spans every registered app; for a console issuer token that requires
        the admin claim.
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive first UTC day. Defaults to 29 days before `end_date`.
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive last UTC day. Defaults to the current UTC day.
        - name: tenant_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Return only usage attributed to this host customer.
        - name: user_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Return only usage attributed to this host end user.
        - name: group_by
          in: query
          schema:
            type: string
            enum: [tenant_key]
          description: Split otherwise identical buckets by host customer.
      responses:
        "200":
          description: Daily usage buckets ordered by day, app, provider, and model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyUsage"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/models:
