          type: string
          minLength: 1
          maxLength: 255
    TenantTurnMemory:
      type: object
      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          type: string
          const: tenant
        namespace:
          type: string
          minLength: 1
          maxLength: 255
    TurnConversation:
      oneOf:
        - $ref: '#/components/schemas/NewTurnConversation'
        - $ref: '#/components/schemas/ContinueTurnConversation'
        - $ref: '#/components/schemas/ContinueOrCreateTurnConversation'
      discriminator:
        propertyName: mode
        mapping:
          new: '#/components/schemas/NewTurnConversation'
          continue: '#/components/schemas/ContinueTurnConversation'
          continue_or_create: '#/components/schemas/ContinueOrCreateTurnConversation'
    ConversationActivePolicy:
      type: string
      enum:
        - reject
        - supersede
        - interrupt
      default: reject
      description: |
        Selects what admission does when the Conversation already has a
        nonterminal Turn. `reject` returns `conversation_active` without
        changing either Turn. `supersede` atomically cancels the predecessor,
        excludes its messages from later generation, and admits the successor.
        `interrupt` preserves the predecessor's completed work: it settles the
        predecessor at a safe seam and admits the successor atomically, or
        durably requests interruption from its live executor, waits boundedly
        for settlement, and then retries the same materialized admission. A
        predecessor that does not settle before that bound returns
        `conversation_active`; no successor Turn or MemorySpace is created.

        App credentials may use all three policies. Browser grants scoped to a
        user's Conversations may use `reject` or `interrupt`. Exact-Conversation
        browser grants and anonymous grants use `reject`; browser admission
        never permits `supersede`.
    NewTurnConversation:
      type: object
      additionalProperties: false
      required:
        - mode
        - owner
      properties:
        mode:
          type: string
          const: new
        owner:
          $ref: '#/components/schemas/ConversationOwner'
        conversation_key:
          $ref: '#/components/schemas/ConversationKey'
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
        compaction:
          $ref: '#/components/schemas/CompactionPolicy'
        metadata:
          $ref: '#/components/schemas/ConversationMetadata'
    ContinueTurnConversation:
      type: object
      additionalProperties: false
      required:
        - mode
        - conversation_id
      properties:
        mode:
          type: string
          const: continue
        conversation_id:
          $ref: '#/components/schemas/ConversationID'
        if_active:
          $ref: '#/components/schemas/ConversationActivePolicy'
    ContinueOrCreateTurnConversation:
      type: object
      additionalProperties: false
      required:
        - mode
        - conversation_key
        - owner
      properties:
        mode:
          type: string
          const: continue_or_create
        conversation_key:
          $ref: '#/components/schemas/ConversationKey'
        owner:
          $ref: '#/components/schemas/ConversationOwner'
        if_active:
          $ref: '#/components/schemas/ConversationActivePolicy'
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
        compaction:
          $ref: '#/components/schemas/CompactionPolicy'
        metadata:
          $ref: '#/components/schemas/ConversationMetadata'
    TurnContextItem:
      type: object
      additionalProperties: false
      required:
        - name
        - tier
        - content
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9-]*$
          description: Stable caller-owned name without the reserved `app-` prefix.
        tier:
          type: string
          enum:
            - contextual
            - operator
          description: |
            `contextual` is ordinary conversation context. `operator` is
            higher-authority application state; Dive maps the typed tier to
            each provider's native role.
        content:
          type: string
          minLength: 1
          x-nvoken-max-utf8-bytes: 8192
          description: Non-empty UTF-8 snapshot text, at most 8 KiB.
    WebhookTarget:
      type: object
      additionalProperties: false
      required:
        - url
      description: |
        Optional endpoint nvoken posts a signed webhook to when this
        Turn parks awaiting host tool results or reaches a terminal
        status. It is delivery configuration rather than model input, so it is
        excluded from the reusable AgentRevision. Two otherwise identical
        turns that differ only in endpoint therefore share one AgentRevision.

        Delivery is at least once and ordered within one Turn, and the
        webhook ID is repeated in `Idempotency-Key` on every attempt. nvoken
        webhooks are thin: identifiers and status only, the API stays the read
        authority. A webhook never changes, delays, or fails the Turn it
        describes.

        The endpoint is part of the request, so replaying an idempotency key
        with a changed endpoint or event set is a conflict rather than a
        silent adoption of either value. An App without a webhook-purpose
        signing key rejects this field instead of accepting it and never
        delivering it.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Absolute HTTPS endpoint with no userinfo and no fragment. Private,
            loopback, and link-local destinations are refused by the same
            guarded public egress the callback transport uses.
        events:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEvent'
          description: |
            Events to deliver. Omission selects every event, because the
            harmful default is the one that quietly drops
            `turn.waiting` and leaves a parked tool loop with nobody
            listening. Order does not affect replay comparison.
    ProviderKeySelection:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - provider
            - source
            - key
          properties:
            provider:
              $ref: '#/components/schemas/ModelProvider'
            source:
              type: string
              enum:
                - caller_ephemeral
              x-enum-varnames:
                - SourceCallerEphemeral
