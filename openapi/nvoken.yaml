          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
        - Agents
      operationId: publishAgentRevision
      summary: Publish an immutable Agent revision
      description: |
        Appends one immutable revision and advances the Agent's current pointer
        atomically. Already admitted Turns keep their exact effective behavior.
        Publishing once changes future unpinned Turns without tenant or user
        fan-out. `Idempotency-Key` names the publication request: retrying the
        same key with the same behavior returns the original revision, while
        reusing it with different behavior returns `idempotency_conflict`.
        A different key always appends a revision, even when its behavior is
        identical to an earlier revision.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorInput'
      responses:
        '201':
          description: >-
            The immutable revision created by this request, or the original
            revision on an exact retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRevision'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agents/{agent_id}/revisions/{revision}:
