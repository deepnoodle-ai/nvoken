          additionalProperties: true
    TraceID:
      type: string
      pattern: ^[0-9a-f]{32}$
      description: Lowercase W3C trace ID. Holding this value does not grant access.
    NudgeID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required:
        - idempotency_key
        - input
      description: |
        Starts exactly one durable Turn. Machine callers supply `tenant_key`
        and `behavior`; browser callers omit both because their verified grant
        supplies the tenant and one exact AgentRevision. Browser callers also
        cannot replace the grant's actor or memory authority. Behavior, memory,
        Conversation, and actor are independent coordinates and all participate
        in idempotency comparison.
      properties:
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Tenant in which this Turn executes. Required for machine callers;
            browser callers omit it because the verified grant supplies it.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional machine-selected actor. Browser callers omit it because
            their verified grant supplies the actor. It does not select Agent
            or Conversation ownership.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Trusted-host keys are scoped only to the resolved tenant. An equal
            retry returns the original Turn; a changed request conflicts.
        behavior:
          $ref: '#/components/schemas/TurnBehaviorSelection'
        memory:
          $ref: '#/components/schemas/TurnMemorySelection'
          description: |
            Omission applies the selected behavior's default. `none` disables
            memory. User memory requires `user_key`; inline user or tenant
            memory requires a namespace at admission.
        conversation:
          $ref: '#/components/schemas/TurnConversation'
          description: Omit for a standalone Turn with no public Conversation.
        limits:
          $ref: '#/components/schemas/Limits'
          description: >-
            Monotonic narrowing only; values may never widen stored behavior
            limits.
        input:
          $ref: '#/components/schemas/TurnInput'
        metadata:
          $ref: '#/components/schemas/Metadata'
        context:
          type: array
          maxItems: 8
          x-nvoken-max-total-utf8-bytes: 16384
          items:
            $ref: '#/components/schemas/TurnContextItem'
        triggered_by:
          $ref: '#/components/schemas/TurnTrigger'
        webhook:
          $ref: '#/components/schemas/WebhookTarget'
        on_budget_exhausted:
          type: string
          enum:
            - stop
            - hold
          default: stop
        mcp_server_headers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MCPServerHeaders'
        provider_keys:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/ProviderKeySelection'
    TurnBehaviorSelection:
      oneOf:
        - $ref: '#/components/schemas/AgentTurnBehavior'
        - $ref: '#/components/schemas/InlineTurnBehavior'
