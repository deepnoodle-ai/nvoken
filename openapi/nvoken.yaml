            - 'null'
    AdmissionAttemptID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    AdmissionOutcome:
      type: string
      enum:
        - admitted
        - refused
      description: |
        `admitted` created a Turn; `refused` did not. A refusal is the
        only record that the request happened at all.
    AdmissionAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - attempted_at
        - outcome
        - error_code
        - http_status
        - tenant_key
        - user_key
        - behavior_source_kind
        - agent_owner_kind
        - agent_key
        - agent_id
        - agent_revision_id
        - effective_behavior_digest
        - memory_space_id
        - conversation_id
        - provider
        - model
        - credential_family_id
        - authentication_method
        - request_id
        - turn_id
        - deduplicated
      properties:
        id:
          $ref: '#/components/schemas/AdmissionAttemptID'
        attempted_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/AdmissionOutcome'
        error_code:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
          description: The refusal code, or null when the turn was admitted.
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: The status the caller received.
        tenant_key:
          type:
            - string
            - 'null'
          description: |
            The tenant key as sent, or null when nvoken refused the request
            before reading one. It is raw text, not a resolved reference: a
            refused attempt commonly names a tenant that was never interned.
        user_key:
          type:
            - string
            - 'null'
          description: Optional Turn actor as sent or resolved from a browser grant.
        behavior_source_kind:
          type:
            - string
            - 'null'
          enum:
            - agent_revision
            - inline
            - null
          description: |
            Resolved source kind, or null when admission was refused before
            behavior selection completed.
        agent_owner_kind:
          type:
            - string
            - 'null'
          enum:
            - app
            - tenant
            - user
            - null
          description: Raw owner namespace for a key selector, otherwise null.
        agent_key:
          type:
            - string
            - 'null'
          description: >-
            Raw owner-qualified lookup key, or null for ID, inline, or browser
            selection.
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/AgentID'
            - type: 'null'
        agent_revision_id:
          oneOf:
            - $ref: '#/components/schemas/AgentRevisionID'
            - type: 'null'
        effective_behavior_digest:
          type:
            - string
            - 'null'
          pattern: ^sha256:[0-9a-f]{64}$
        memory_space_id:
          oneOf:
            - $ref: '#/components/schemas/MemorySpaceID'
            - type: 'null'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        provider:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        credential_family_id:
          type:
            - string
            - 'null'
        authentication_method:
          type:
            - string
            - 'null'
          enum:
            - api_key
            - issuer_token
            - client_token
            - anonymous_token
            - null
        request_id:
          type:
            - string
            - 'null'
        turn_id:
          oneOf:
            - $ref: '#/components/schemas/TurnID'
            - type: 'null'
          description: |
            The admitted Turn, or null for a refusal. It carries no
            foreign key: the record outlives Conversation erasure, so a deleted
            transcript never erases the evidence that the request happened.
        deduplicated:
          type: boolean
          description: Whether the request replayed an existing Turn.
        details:
          type: object
          additionalProperties: true
          description: |
            The refusal's own detail object, the same one the caller received.
            For `insufficient_credits` it carries the tenant key with exact
            available and required amounts.
    AdmissionAttemptList:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdmissionAttempt'
        next_cursor:
          type:
            - string
            - 'null'
    AdmissionSummary:
      type: object
      additionalProperties: false
      required:
        - start_at
        - end_at
        - admitted
        - refused
        - reasons
        - tenants
      properties:
        start_at:
          type: string
          format: date-time
          description: Inclusive lower bound the counts cover.
        end_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Exclusive upper bound, or null when the window runs to now.
        admitted:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        reasons:
          type: array
          description: Every refusal in the window, grouped by code. Never truncated.
          items:
            $ref: '#/components/schemas/AdmissionReasonCount'
        tenants:
          type: array
          description: |
            The ten keys refused most, worst first. Raw keys, not tenants: a
            key here may have no tenant behind it, which is the case worth
            acting on.
          items:
            $ref: '#/components/schemas/AdmissionTenantCount'
    AdmissionReasonCount:
      type: object
      additionalProperties: false
      required:
        - error_code
        - count
      properties:
        error_code:
          type: string
        count:
          type: integer
          format: int64
    AdmissionTenantCount:
      type: object
      additionalProperties: false
      required:
        - tenant_key
        - refusals
        - last_refused_at
      properties:
        tenant_key:
          type: string
        refusals:
          type: integer
          format: int64
        last_refused_at:
          type: string
          format: date-time
    CredentialType:
      type: string
      enum:
        - installation_admin
        - app
        - app_read_only
      x-enum-varnames:
        - InstallationAdmin
        - App
        - AppReadOnly
      description: |
        Durable trust boundary. App and App-read-only keys require `app_id`;
        installation-admin keys forbid an App or Org binding.
    CredentialStatus:
      type: string
      enum:
        - active
        - revoked
    Credential:
