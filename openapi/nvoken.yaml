                id: def_019b0a12-8d51-7f34-aed2-0e07c1bdb323
                revision: 1
                instructions: You are a concise billing support agent.
                model:
                  provider: anthropic
                  id: claude-sonnet-5
                created_at: 2026-08-11T12:00:00Z
                updated_at: 2026-08-11T12:00:00Z
                archived_at: null
