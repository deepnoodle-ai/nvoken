          description: Provider key metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The idempotency key changed nonsecret request metadata, an active
            provider key already exists, or the App is archived
            (`app_archived`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/provider-keys/{provider_key_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderKeyID'
    get:
      tags:
