          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/console/device-authorizations/{user_code}/deny:
    parameters:
      - $ref: '#/components/parameters/ConsoleDeviceUserCode'
    post:
      tags:
        - Console integration
      operationId: denyConsoleDeviceAuthorization
      summary: Deny a pending console CLI authorization
      responses:
        '204':
          description: The pending authorization was denied.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/console/device-authorizations/{device_code}/exchange:
    parameters:
      - $ref: '#/components/parameters/ConsoleDeviceCode'
    post:
      tags:
        - Console integration
      operationId: exchangeConsoleDeviceAuthorization
      summary: Poll or claim a console CLI authorization
      responses:
        '200':
          description: The approved grant, claimed and deleted exactly once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDeviceAuthorizationClaim'
        '202':
          description: Authorization is still pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDeviceAuthorizationExchangeState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The authorization was denied or the caller is forbidden.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/ConsoleDeviceAuthorizationExchangeState
                  - $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The code is invalid, expired, or already claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDeviceAuthorizationExchangeState'
        '429':
          description: The pending code was polled before its interval elapsed.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDeviceAuthorizationExchangeState'
  /health:
    get:
      operationId: getHealth
      security: []
      tags:
        - Operations
      summary: Liveness
      description: |
        Answers 200 as long as the process is running. It touches nothing —
        no database, no provider — so it stays honest as a restart signal:
        a dependency being down is not a reason to kill the process.
      responses:
        '200':
          description: The process is running.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /ready:
    get:
      operationId: getReadiness
      security: []
      tags:
        - Operations
      summary: Readiness
      description: |
        Answers 200 when the process can serve requests, which here means
        Postgres answered a ping. Route traffic on this rather than on
        `/health`: nvoken's execution authority is the database, so a process
        that cannot reach it has nothing to serve.
      responses:
        '200':
          description: Ready to serve.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ready
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: |
            Not ready. Stop sending traffic; do not restart the process on
            this alone, because the dependency is what is unavailable.
          content:
            text/plain:
              schema:
                type: string
webhooks:
  toolCallback:
    post:
      operationId: receiveToolCallback
      security: []
      summary: Receive a signed callback ToolCall delivery
      description: |
        nvoken sends this request to the HTTPS endpoint you declared on a
        callback tool. Your endpoint runs the tool and replies with the result.

        **Expect duplicates.** Delivery is at-least-once, so the same request
        can arrive more than once. Deduplicate on the ToolCall ID in the
        `Idempotency-Key` header.

        **Verify the signature before you parse the body.** It is an
        HMAC-SHA256 over `v1.<delivery_id>.<timestamp>.<raw_body>`, sent as
        lowercase hex with a `sha256=` prefix. Headers tell you which signing
        key and version to use. Compare in constant time, against the raw bytes
        rather than re-serialized JSON, and reject timestamps too far from your
        own clock.

        For work that may outlive the App's callback reply deadline, return
        HTTP 202 with an empty body. That acknowledges the delivery without
        settling the ToolCall; later submit its result through
        `POST /v1/turns/{turn_id}/tool-results`. An acknowledged
        call waits under the host's responsibility and is bounded only when
        the Turn opted into `waiting_timeout_seconds`.

        **If you never reply successfully, the turn still moves on.** nvoken
        retries with exponential backoff, up to five attempts, on connection
        failures and on HTTP 408, 425, 429, 500, 502, 503, and 504. A reply
        that arrives but is malformed is not retried. Once attempts run out,
        nvoken records the tool call as failed with `is_error: true` and
        content `{"code":"callback_delivery_failed"}`, and the turn continues
        from there. This fail-loud guarantee applies to unacknowledged
        delivery exhaustion; an acknowledged call remains parked as described
        above.
      parameters:
        - name: X-Nvoken-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
          description: HMAC-SHA256 signature of the canonical delivery string.
        - name: X-Nvoken-Signature-Version
          in: header
          required: true
          schema:
            type: string
            enum:
              - v1
        - name: X-Nvoken-Timestamp
          in: header
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp used in the signature.
        - name: X-Nvoken-Delivery-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/DeliveryID'
        - name: X-Nvoken-Signing-Key-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Nvoken-Signing-Key-Version
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/ToolCallID'
          description: The stable ToolCall ID. It is unchanged across retries.
      requestBody:
        required: true
        content:
          application/vnd.nvoken.tool-callback+json; version=2:
            schema:
              $ref: '#/components/schemas/ToolCallbackRequest'
            example:
              nvoken:
                schema_version: 2
                delivery_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb326
                tool_call_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb325
                tool_name: open_ticket
                turn_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb322
                conversation_id: 019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                content_expires_at: null
                behavior_source:
                  kind: agent_revision
                  agent_id: 019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                  agent_revision_id: 019b0a12-5b21-7c04-8ed2-0e07c1bdb301
                  revision: 3
                memory_space_id: 019b0a12-5b21-7c04-8ed2-0e07c1bdb302
                user_key: user-7c1f
                tenant_key: acme
              input:
                title: Customer needs a refund
      responses:
        2XX:
          description: |
            HTTP 202 with an empty body acknowledges delivery without settling
            the ToolCall. Any 2xx response carrying a body is the ToolCall
            result: the body must be an object with exactly `content` and
            optional `is_error`. Content may be any JSON value. Its encoded
            size is at most 256 KiB and its nesting depth is at most 32.
            Unknown or duplicate members, trailing data, and any other shape
            are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallbackResponse'
              example:
                content:
                  ticket_id: T-1042
                is_error: false
  turnWebhook:
    post:
      operationId: receiveTurnWebhook
      security: []
      summary: Receive a signed Turn lifecycle delivery
      description: |
        nvoken sends this request to the endpoint you named in `webhook` on an
        Turn, or to the App's `browser_access.turn_webhook` for a
        turn a browser started. It reports that a turn changed state; it is not
        the turn's result.

        **It is the same signing scheme as `toolCallback`**, down to the header
        names and the canonical string, so a host verifies one way and routes
        on the content type. The signing key is a different one: this delivery
        is signed with the App's `webhook` purpose key rather than its
        `callback` key, and the headers tell you which.

        **Expect duplicates and reordering.** Delivery is at-least-once, so
        deduplicate on the delivery ID in the `Idempotency-Key` header. Two
        transitions for one turn can also arrive out of order, so fold by
        `nvoken.sequence` — keep the highest you have seen for that Turn
        and discard anything lower.

        **Reply 2xx to accept, and mean it.** Any 2xx settles the delivery.
        nvoken retries connection failures and HTTP 408, 425, 429, 500, 502,
        503, and 504 with exponential backoff, up to five attempts; any other
        status is permanent and is not retried. The body is ignored and read
        only up to 8 KiB.

        **A delivery that never lands is not an error you will hear about.**
        Once attempts run out nvoken records the delivery failed and moves on —
        the turn is unaffected, and nothing retries later. That is what
        `GET /v1/turns?ended=true` is for: it walks every turn that
        ended, oldest first, from a cursor you keep, so a webhook outage
        becomes a gap you close rather than turns you never learn about.
        Reconcile against it; do not treat webhook delivery as the ledger.
      parameters:
        - name: X-Nvoken-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
          description: HMAC-SHA256 signature of the canonical delivery string.
        - name: X-Nvoken-Signature-Version
          in: header
          required: true
          schema:
            type: string
            enum:
              - v1
        - name: X-Nvoken-Timestamp
          in: header
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp used in the signature.
        - name: X-Nvoken-Delivery-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/DeliveryID'
        - name: X-Nvoken-Signing-Key-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Nvoken-Signing-Key-Version
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/DeliveryID'
          description: |
            The delivery ID, unchanged across retries of this delivery. Unlike
            the callback scheme, which keys on the ToolCall, one Turn
            produces several deliveries — one per transition — so this is the
            delivery rather than the turn.
      requestBody:
        required: true
        content:
          application/vnd.nvoken.turn-webhook+json; version=2:
            schema:
              $ref: '#/components/schemas/TurnWebhookRequest'
            example:
              nvoken:
                schema_version: 2
                delivery_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb327
                event: turn.ended
                sequence: 2
                turn_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb322
                conversation_id: 019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                content_expires_at: null
                behavior_source:
                  kind: agent_revision
                  agent_id: 019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                  agent_revision_id: 019b0a12-5b21-7c04-8ed2-0e07c1bdb301
                  revision: 3
                memory_space_id: 019b0a12-5b21-7c04-8ed2-0e07c1bdb302
                user_key: user-7c1f
                tenant_key: acme
              turn:
                status: completed
                stop_reason: end_turn
      responses:
        2XX:
          description: |
            Delivery accepted. The body is ignored, so there is nothing to
            return; reply 200 or 204 once you have durably recorded it.
        4XX:
          description: |
            Permanent. nvoken does not retry, and the delivery is recorded
            failed. Reply 429 instead if you want the retry.
        5XX:
          description: |
            Retried with backoff for 500, 502, 503, and 504. Any other 5xx is
            permanent.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or Ed25519 JWT
      description: >
        Present either a machine API key or, when

        `CONSOLE_ISSUER_PUBLIC_KEYS` is configured, a JWT with `alg: EdDSA`,

        a known `kid`, `iss: nvoken-console`, `aud: nvoken`, and required

        `iat`, `exp`, `scope`, and `sub` claims. `scope` is `app`

        (with `app_id` and `org_id`), `org` (with `org_id`), or

        `installation`; `exp - iat` may

        not exceed five minutes. The subject identifies the human for

        attribution only. App authorization compares the asserted `org_id`

        with the App's durable owner; `admin: true` retains its bypass. A

        `profile` claim is rejected.


        Browser-direct calls use a separate App-signed Ed25519 JWT trust class.

        The grant names one tenant, subject, Agent, and exact AgentRevision;

        Turn admission cannot replace that behavior. Conversation and memory

        authority are closed claims: omission grants none. The token type,

        issuer, audience, signing key, issued-at time, and expiry are verified,

        and lifetime is at most 15 minutes. Client tokens are accepted only in

        this header, never in a query parameter.


        An App with anonymous access enabled has a fourth class: a token

        nvoken itself mints and signs (HS256, `typ:
        nvoken-anonymous-access+jwt`)

        from `POST /v1/apps/{app_id}/anonymous-tokens`, for a visitor with no

        account. It is

        presented in this same header and is authorized exactly like a client

        token, narrowed to one exact AgentRevision. It is short-lived and

        paired with a renewable visitor token; a host never signs it, which is

        the difference from the class above.
  parameters:
    ArchiveStatus:
      name: status
      in: query
      required: false
      description: |
        Which container rows to return. Archive hides a container from pickers,
        never from money: usage reporting always counts archived Apps.
      schema:
        type: string
        enum:
          - active
          - archived
          - all
        default: active
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the same operation and filter set.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Maximum items in this page. Defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    UserKeyFilter:
      name: user_key
      in: query
      description: |
        Exact host-owned end-user reference. On Turn lists this is the actor;
        on owner-qualified resources it is part of the explicit owner tuple.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantKeyFilter:
      name: tenant_key
      in: query
      description: Exact tenant partition reference.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TurnID:
      name: turn_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TurnID'
    TraceID:
      name: trace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TraceID'
    NudgeID:
      name: nudge_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NudgeID'
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a prior response for this exact representation.
      schema:
        type: string
        minLength: 1
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentID'
    AgentRevisionNumber:
      name: revision
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentRevisionNumber'
    AgentOwnerKind:
      name: owner_kind
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/AgentOwnerKind'
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConversationID'
    ProviderKeyID:
      name: provider_key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProviderKeyID'
    UsageStartAt:
      name: start_at
      in: query
      required: true
      description: Inclusive RFC 3339 start of the half-open reporting window.
      schema:
        type: string
        format: date-time
    UsageEndAt:
      name: end_at
      in: query
      required: true
      description: >-
        Exclusive RFC 3339 end of the half-open reporting window; at most 400
        days after start_at.
      schema:
        type: string
        format: date-time
    UsageAppIDFilter:
      name: app_id
      in: query
      description: Exact App within the caller's App, Org, or installation reporting scope.
      schema:
        $ref: '#/components/schemas/AppID'
    UsageAgentIDFilter:
      name: agent_id
      in: query
      schema:
        $ref: '#/components/schemas/AgentID'
    UsageProviderFilter:
      name: provider
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UsageModelFilter:
      name: model
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UsageProviderKeySourceFilter:
      name: provider_key_source
      in: query
      schema:
        $ref: '#/components/schemas/ProviderKeySource'
    UsageProviderKeyIDFilter:
      name: provider_key_id
      in: query
      schema:
        $ref: '#/components/schemas/ProviderKeyID'
    UsageCredentialFamilyIDFilter:
      name: credential_family_id
      in: query
      schema:
        $ref: '#/components/schemas/CredentialID'
    UsageAuthenticationMethodFilter:
      name: authentication_method
      in: query
      schema:
        $ref: '#/components/schemas/AuthenticationMethod'
    UsageCallKindFilter:
      name: call_kind
      in: query
      schema:
        $ref: '#/components/schemas/ModelCallKind'
    UsageToolNameFilter:
      name: tool_name
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UsageToolModeFilter:
      name: tool_mode
      in: query
      schema:
        $ref: '#/components/schemas/ToolCallMode'
    CredentialID:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CredentialID'
    CredentialLimit:
      name: limit
      in: query
      description: |
        Maximum credentials in this page. Defaults to 100. Credential listing
        caps at 100 rather than the 200 the other list operations allow.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    ConsoleDeviceUserCode:
      name: user_code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
      description: Short ambiguity-free code shown to the human.
    ConsoleDeviceCode:
      name: device_code
      in: path
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: ^[A-Za-z0-9_-]{43}$
      description: Opaque high-entropy capability retained only by the CLI.
  schemas:
    OrgID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    AgentID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    MemorySpaceID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    AppID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ConversationID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ConversationMessageID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    TurnID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ContentExpiresAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'
      description: |
        Scheduled private-content expiry for a terminal standalone Turn.
        Null while it is nonterminal and for conversation-bound work.
    ProviderKeyID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    CredentialID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ProviderKeyVersionID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ModelProvider:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: |
        Extensible canonical provider identifier. Consumers must preserve
        unknown values so adding a provider does not break decoding. Request
        positions still reject providers not registered by the installation.
    ModelToolChoiceMode:
      type: string
      enum:
        - auto
        - none
        - required
        - named
      x-enum-varnames:
        - ChoiceAuto
        - ChoiceNone
        - ChoiceRequired
        - ChoiceNamed
    WebhookEvent:
      type: string
      enum:
        - turn.waiting
        - turn.budget_hold
        - turn.ended
      x-enum-varnames:
        - WebhookEventWaiting
        - WebhookEventBudgetHold
        - WebhookEventEnded
      description: |
        `turn.waiting` fires when a turn stops and needs you to run at
        least one tool. A turn waiting only on callback tools sends nothing,
        because nvoken delivers those to your endpoint itself and there is
        nothing for you to do.

        `turn.budget_hold` fires when a consumption limit you opted into
        stopped the turn, and carries the `stop_reason` naming the limit.

        `turn.ended` fires exactly once, when the turn reaches
        `completed`, `incomplete`, `failed`, or `cancelled`. Completed and
        incomplete payloads carry `stop_reason` alongside `failure_code`.
    CreditBlock:
      type: object
      additionalProperties: false
      required:
        - tenant_key
      properties:
        tenant_key:
          type: string
          description: Account that could not fund the next provider attempt.
    ProviderStaticKey:
      type: object
      additionalProperties: false
      required:
        - api_key
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: Encrypted before persistence and never returned.
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{6}$
          description: Exact decimal amount with six fractional digits.
        currency:
          type: string
          const: USD
    TextInputBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
          x-enum-varnames:
            - InputTypeText
        text:
          type: string
          minLength: 1
    AgentRevisionID:
      type: string
      description: RFC 9562 UUIDv7 in canonical lowercase text. Treat the body as opaque.
    ClientInterface:
      type: object
      additionalProperties: false
      properties:
        context_names:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
          description: |
            Exact recorded-context names a browser client principal may
            append or supersede. Every item is contextual tier; clients never
            author operator-tier context.
        tool_names:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
          description: |
            Exact subset of this AgentRevision's declared host-mode tools whose
            parked calls a browser client principal may see and settle.
      description: >
        One immutable AgentRevision-specific authorization object. Omission
        means

        the AgentRevision is not client-token-capable; an explicit empty object

        opts in with no client-authored context or tools. Each set is sorted

        before a revision snapshot is retained, so order alone cannot advance

        a resource revision.


        This object grants authorship and settlement only, never selective read

        visibility. All public transcript content in a browser-reachable

        Conversation, including operator-tier recorded context, must be treated
        as

        client-visible. No lifetime, host_only, wildcard, generic tool-policy,

        tier-switch, or disclosure field exists here.
    Sampling:
      type: object
      additionalProperties: false
      required:
        - temperature
      properties:
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Sampling temperature, expressed the same way across providers. Omit

            `sampling` entirely to keep the provider's own default; an explicit
            `0`

            means 0 and is not treated as absent.


            If the model is not known to support temperature, the turn is
            refused

            rather than run with the setting quietly dropped.
    ReasoningEffort:
      type: string
      enum:
        - low
        - medium
        - high
        - xhigh
        - max
      x-enum-varnames:
        - EffortLow
        - EffortMedium
        - EffortHigh
        - EffortXHigh
        - EffortMax
    Reasoning:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        effort:
          $ref: '#/components/schemas/ReasoningEffort'
        budget_tokens:
          type: integer
          minimum: 1024
          description: |
            Provider reasoning target, not a separate Turn hard budget.
            Requires an explicit, larger limits.max_output_tokens and exact
            support in the selected model descriptor.
    ToolChoice:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/ModelToolChoiceMode'
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
      description: |
        Portable Turn tool selection. auto preserves normal selection;
        none disables tools for the Turn; required and named apply only
        to the first durable model iteration, then return to auto. name is
        required only for named mode. The final bounded iteration always
        disables tools.
    Metadata:
      type: object
      additionalProperties:
        type: string
        maxLength: 512
      maxProperties: 16
      propertyNames:
        pattern: ^[A-Za-z0-9_.:-]+$
        maxLength: 64
      description: |
        Opaque host correlation data. nvoken stores it, returns it verbatim,
        and never interprets it — it exists so a support engineer holding an
        Turn id can get back to the board, ticket, or surface the turn
        came from, which nvoken deliberately knows nothing about.

        At most 16 entries. Keys are 1–64 bytes of letters, digits, `_`, `.`,
        `:`, and `-`; values are at most 512 bytes of UTF-8.

        A Conversation similarly has no dedicated `title` field. A host may
        store one in that Conversation's own metadata object, which keeps
        nvoken from forming opinions about a string only the host renders.

        Metadata is correlation data, not an authorization anchor. Delivery
        receivers authorize from their own trusted product state and the
        signed nvoken coordinates, never from model-authored input or metadata.
    RetentionPolicy:
      type: object
      additionalProperties: false
      required:
        - ttl_seconds
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: |
            Idle window, from one hour to thirty days.
        max_expires_at:
          type: string
          format: date-time
          description: Optional absolute ceiling; requires `ttl_seconds`.
      description: >
        How long a Conversation can sit unused before nvoken deletes it. When
        the

        window passes, the Conversation and everything under it are erased,
        exactly

        as `DELETE /v1/conversations/{conversation_id}` would.


        The clock measures idle time, not age: it resets every time a turn

        starts and every time one finishes. A long-running turn can never

        expire out from under you.


        Expiry and explicit erasure never cancel active work. A Conversation

        holding a nonterminal Turn is skipped by expiry and refused by

        explicit erasure until that Turn becomes terminal.


        Omitting retention retains the Conversation until it is deleted
        explicitly,

        which stays the default.
    CompactionPolicy:
      type: object
      additionalProperties: false
      required:
        - trigger_tokens
      properties:
        trigger_tokens:
          oneOf:
            - type: integer
              minimum: 4096
              maximum: 1000000
            - type: string
              enum:
                - auto
              x-enum-varnames:
                - Auto
          description: |
            Estimated retained-context size that triggers compaction. The
            Conversation stores "auto" as an exact value materialized when the
            policy is installed to 60% of that Turn's primary model
            context window, clamped to the
            supported integer range.
        model:
          $ref: '#/components/schemas/Model'
      description: >
        Durable Conversation context-compaction policy. Omission of model uses
        the

        installing Turn's primary model. An explicit model must be

        cataloged and use the same provider. Later Turns automatically

        use this resolved policy and the latest Conversation summary.
    ProviderTool:
      type: object
      additionalProperties: false
      required:
        - type
        - web_search
      properties:
        type:
          type: string
          enum:
            - web_search
          x-enum-varnames:
            - ProviderToolWebSearch
        web_search:
          $ref: '#/components/schemas/WebSearchTool'
      description: |
        Turns on a tool the model provider runs itself, inside the model call —
        web search, for example.

        This behaves differently from your own tools in two ways: the turn
        never stops to wait for it, and nvoken never executes it. The provider
        does, and charges it to the same provider key the model is running on.

        That is deliberate. A search tool operated by nvoken would mean nvoken
        holding a vendor relationship with a search provider and answering "who
        pays per query" for every installation. Letting the provider run it
        keeps one key and one bill.
    WebSearchTool:
      type: object
      additionalProperties: false
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            Searches this turn may run. Omitted means the provider default.
            This is the only bound nvoken can place on search spend, because
            the provider does not report a per-search fee it can meter.
        allowed_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Restrict results to these hosts. Bare hostnames only — a scheme,
            path, or port is rejected rather than reinterpreted. Mutually
            exclusive with `blocked_domains`, which is the provider's rule.
        blocked_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Exclude these hosts. Same format as `allowed_domains`, and mutually
            exclusive with it.
        user_location:
          $ref: '#/components/schemas/WebSearchLocation'
      description: |
        Anthropic web search options, passed through as the provider defines
        them.
    WebSearchLocation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        city:
          type: string
          maxLength: 128
        region:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 128
        timezone:
          type: string
          maxLength: 128
      description: |
        Approximate location used to bias results. Every member is optional;
        the host decides how precise to be about its end user.
    MCPServer:
      type: object
      additionalProperties: false
      required:
        - name
        - url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: ^[A-Za-z0-9_-]+$
          description: |
            A name for this MCP server, unique within the turn. Its tools are
            exposed to the model as `<name>__<tool>`, so this is the prefix your
            model will see. Names starting with `nvoken`, in any casing, are
            reserved.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: >-
            Public HTTPS streamable-HTTP MCP endpoint without userinfo or a
            fragment.
        transport:
          type: string
          enum:
            - streamable_http
          x-enum-varnames:
            - TransportStreamableHTTP
        allowed_tools:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Optional ordered allowlist. Every named tool must be discovered and
            projectable.
        timeouts:
          $ref: '#/components/schemas/MCPTimeouts'
    MCPTimeouts:
      type: object
      additionalProperties: false
      properties:
        discovery_seconds:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
        call_seconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
    ToolDeclaration:
      oneOf:
        - $ref: '#/components/schemas/BuiltinToolDeclaration'
        - $ref: '#/components/schemas/HostToolDeclaration'
        - $ref: '#/components/schemas/CallbackToolDeclaration'
      discriminator:
        propertyName: mode
        mapping:
          builtin: '#/components/schemas/BuiltinToolDeclaration'
          host: '#/components/schemas/HostToolDeclaration'
          callback: '#/components/schemas/CallbackToolDeclaration'
    BuiltinToolDeclaration:
      type: object
      additionalProperties: false
      required:
        - name
        - mode
      properties:
        name:
          type: string
          enum:
            - nvoken_fetch
          x-enum-varnames:
            - NameNvokenFetch
          description: Fixed runtime-owned public-web fetch capability.
        mode:
          type: string
          enum: [builtin]
          x-enum-varnames:
            - ModeBuiltin
    HostToolDeclaration:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - mode
        - input_schema
      description: |
        A host tool is function calling: declared with JSON Schema and executed
        by the host application.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: >
            The tool's name, unique within this AgentRevision. Names starting

            with `nvoken_` are reserved.


            Letters, digits, `_`, and `-` only. That is the strictest rule any

            supported provider imposes, so a name accepted here reaches every

            provider unchanged and your agent behaves the same wherever it runs.

            nvoken deliberately does not rewrite names to fit — a rewriting
            layer

            would own the collisions it creates, and would clash with the `__`

            separator used for MCP tool names.


            If your own permissions use dotted names, map them one-to-one

            (`naming.domain.check` becomes `naming_domain_check`) and tell the

            model about the mapping once in your instructions.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [host]
          x-enum-varnames:
            - ModeHost
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
    CallbackToolDeclaration:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - mode
        - input_schema
        - callback
      description: |
        A callback tool is a host tool nvoken delivers to the host's endpoint
        instead of waiting for the host to poll.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: >
            The tool's name, unique within this AgentRevision. Names starting

            with `nvoken_` are reserved.


            Letters, digits, `_`, and `-` only. That is the strictest rule any

            supported provider imposes, so a name accepted here reaches every

            provider unchanged and your agent behaves the same wherever it runs.

            nvoken deliberately does not rewrite names to fit — a rewriting
            layer

            would own the collisions it creates, and would clash with the `__`

            separator used for MCP tool names.


            If your own permissions use dotted names, map them one-to-one

            (`naming.domain.check` becomes `naming_domain_check`) and tell the

            model about the mapping once in your instructions.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [callback]
          x-enum-varnames:
            - ModeCallback
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
        callback:
          $ref: '#/components/schemas/CallbackTarget'
    CallbackTarget:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |
            Public HTTPS endpoint. Userinfo and fragments are rejected. Every
            dial revalidates resolved addresses and refuses redirects.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: >
            This tool's own reply deadline, replacing the App's

            `callback_timeout_seconds` for its deliveries. Omit it and the App

            value applies unchanged.


            The two ceilings differ deliberately. The App value is capped at 60

            because it governs every callback the App makes: raising it to

            cover your slowest tool would make a hung delivery of your fastest

            one invisible for just as long. Naming a long deadline here says

            which tool is slow, and leaves loss detection tight everywhere else.


            The delivery snapshots this value when the tool call is created, so

            an AgentRevision publication landing mid-flight does not move the
            deadline

            an in-flight delivery is already held to.


            It is a ceiling on the delivery, not a promise of one: the

            effective limit is the smallest of this value, the Turn's

            deadline, and `limits.waiting_timeout_seconds` when set. A

            300-second tool inside a shorter turn never gets 300 seconds.
    OutputSchema:
      type: object
      additionalProperties: true
      description: |
        Self-contained JSON Schema for an object result. Compact canonical JSON
        is limited to 32 KiB and 16 schema positions. Supported keywords are
        type, title, description, properties, required, additionalProperties,
        items, enum, pattern, minLength, maxLength, minItems, maxItems,
        uniqueItems, minimum, and maximum. Every schema position has one string
        type; pattern values are limited to 1,024 UTF-8 bytes; references and
        other keywords are rejected. Numeric bounds are read as values, not
        spellings: 10, 10.0, and 1e1 are the same bound. When present, nvoken
        exposes a reserved durable submit tool and publishes only a
        server-validated terminal object. This does not enable host-defined
        tools.
    Limits:
      type: object
      additionalProperties: false
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          type: integer
          minimum: 1
          description: |
            Optional cumulative external-waiting SLA. When omitted, host and
            callback ToolCalls may remain pending indefinitely; waiting does
            not consume the Turn's total or active execution budgets.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            A cost ceiling for this turn, in USD, estimated from list prices.
            It does not reserve funds and is not a bill.

            The model must have a known price. If it does not, the turn fails
            with `cost_estimate_unavailable` — and where nvoken can
            tell in advance, it refuses before calling the provider at all, so
            you are not charged for a turn it cannot police.

            Hitting the ceiling is not itself a failure. If the turn can stop
            cleanly it ends `incomplete` with
            `stop_reason: max_estimated_cost` and keeps everything it
            produced.
        max_iterations:
          type: integer
          minimum: 1
          description: |
            The number of model calls this turn may make. Omitted means the
            turn carries no cap of its own: nvoken never invents one, and the
            loop runs until the agent stops or the installation ceiling
            (`TURN_MAX_ITERATIONS`) halts a runaway. A behavior may set a cap,
            and a request may only narrow it.
      description: |
        Optional requested limits. Total time bounds the entire turn, active
        time bounds model and tool execution, and waiting time bounds the
        cumulative time parked for host or callback tool results. Installation
        defaults supply the three time limits. Iteration, output-token, and
        estimated-cost limits are unlimited when omitted. Installation maxima
        may be lower than the schema's numeric range.
    Model:
      type: object
      additionalProperties: false
      required:
        - provider
        - id
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        id:
          type: string
          minLength: 1
          maxLength: 255
    ModelInput:
      oneOf:
        - $ref: '#/components/schemas/Model'
        - type: string
          pattern: ^[^/]+/.+$
          maxLength: 511
      description: |
        Which model to use. The object form — separate `provider` and `id` — is
        the real shape. You may also send a single `provider/id` string for
        convenience; nvoken splits it at the first slash and always returns the
        object form.
    TurnStatus:
      type: string
      enum:
        - queued
        - running
        - waiting
        - budget_hold
        - completed
        - incomplete
        - failed
        - cancelled
      description: |
        `completed`, `incomplete`, `failed`, and `cancelled` are final. Once a
        turn reaches one of them it never changes again. Do not encode that
        set: a TurnChange carries `terminal`, a Turn carries
        `ended_at`, and both say the same thing without a list of yours to
        keep in step as this enum grows.

        `completed` means the turn ended the way it was asked to: the model
        finished on its own, or you interrupted it.

        `incomplete` means a limit you set stopped the turn cleanly, between
        steps rather than mid-request. `stop_reason` names the limit that ran
        out. The reply so far is valid and carries into the next turn just
        like a completed turn's does, so this is a stopping point rather than
        an error.

        `failed` means the turn could not stop cleanly — a deadline landing in
        the middle of a model request, for example — or that a turn you asked
        for structured output from never produced a valid object. Read `error`
        for the reason; the reply, if any, is not carried forward.

        `waiting` — `requires_action` in some other APIs — means the turn has
        stopped for tool calls you need to run. Nothing is executing. Send the
        results and the turn returns to `queued` and picks up where it left
        off. A turn can also return to `queued` on its own if nvoken had to
        restart it after an interruption; `attempt` tells the two apart, and
        the `revision` on each stream update tells you their order.

        `budget_hold` means a consumption limit stopped the turn but left it
        resumable. Nothing is executing, and its deadlines are on hold, so a
        turn cannot expire while you decide. Raise the turn's limit or add
        credits to the blocked tenant account and it continues. It still
        accepts interrupt, cancel, and nudge. `stop_reason` distinguishes the
        iteration, output-token, estimated-cost, and credit ceilings.
    TurnStopReason:
      type: string
      enum:
        - end_turn
        - interrupted
        - max_iterations
        - deadline
        - max_output_tokens
        - max_estimated_cost
        - insufficient_credits
      description: |
        Why a turn stopped. Set on turns that did not fail, and which values
        can appear depends on the status.

        A `completed` turn carries `end_turn` (the model finished on its own)
        or `interrupted` (you asked it to stop, and it stopped at the next
        clean point). An `incomplete` turn carries whichever limit ran out:
        `max_iterations`, `deadline`, `max_output_tokens`, or
        `max_estimated_cost`. A `budget_hold` turn carries `max_iterations`,
        `max_output_tokens`, `max_estimated_cost`, or `insufficient_credits`,
        never `deadline`, because a held turn's deadlines are on hold.

        An interrupt is deliberately `completed` rather than `incomplete`: you
        asked the turn to end there, so ending there is the result you wanted,
        not a shortfall.

        Expect new values here over time.
    ModelUsage:
      type: object
      additionalProperties: false
      required:
        - input_tokens
        - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
          description: |
            Uncached input tokens. The three input buckets are disjoint across
            every provider, so total prompt size is input_tokens +
            cache_creation_input_tokens + cache_read_input_tokens. Cached tokens
            are never also counted here.
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
          description: |
            Input tokens written to the provider's prompt cache. Absent on
            providers that report cache hits but not cache writes.
        cache_read_input_tokens:
          type: integer
          minimum: 0
          description: Input tokens served from the provider's prompt cache.
        reasoning_tokens:
          type: integer
          minimum: 0
          description: |
            Output tokens spent on reasoning. A subset of output_tokens, not an
            additive bucket.
        model_calls:
          type: integer
          minimum: 0
          description: >
            How many model requests these totals cover. Older records may not
            have

            it.
        estimated_cost:
          $ref: '#/components/schemas/ModelCost'
    ModelCost:
      type: object
      additionalProperties: false
      required:
        - input
        - output
        - cache_read
        - cache_write
        - total
      properties:
        input:
          type: number
          minimum: 0
        output:
          type: number
          minimum: 0
        cache_read:
          type: number
          minimum: 0
        cache_write:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
        currency:
          type: string
        model:
          type: string
    ModelProvenance:
      type: object
      additionalProperties: false
      required:
        - provider
        - requested_model
        - served_model
        - provider_key_source
      properties:
        provider:
          type: string
        requested_model:
          type: string
        served_model:
          type: string
        provider_key_source:
          type: string
          enum:
            - caller_ephemeral
            - app_byok
            - tenant_byok
            - platform
            - config_byok
        provider_key_id:
          $ref: '#/components/schemas/ProviderKeyID'
        provider_key_version_id:
          $ref: '#/components/schemas/ProviderKeyVersionID'
      description: |
        Reusable BYOK sources include safe provider key and version IDs. Caller,
        platform, and config sources omit them. No secret material is
        included.
    StructuredOutputProvenance:
      type: object
      additionalProperties: false
      required:
        - source
        - schema_sha256
      properties:
        source:
          type: string
          enum:
            - tool_call
          x-enum-varnames:
            - SourceToolCall
        tool_call_id:
          $ref: '#/components/schemas/ToolCallID'
        schema_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: |
            SHA-256 of the JSON Schema this object was checked against. Compare
            it with your own schema's hash to confirm the model answered the
            version you sent.
      description: |
        Shows where `structured_output` came from and what it was checked
        against, so you can verify the object rather than trust it. It records
        the tool call the model produced the object in and the exact schema
        that object was validated against. It never changes after the turn
        ends.
    ToolCallID:
      type: string
      description: |
        Identifies one durable ToolCall. Treat it as opaque: read it from a
        transcript `tool_use` block or from a turn's `tool_calls`, and pass it
        back verbatim as `tool_call_id` when submitting results. The same value
        is the `Idempotency-Key` on a callback delivery.
    ToolCallMode:
      type: string
      enum:
        - builtin
        - host
        - callback
        - mcp
    ToolCallStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
      description: |
        Where one tool call stands. `pending` means the model asked for it and
        nothing has started it yet; `running` means it is executing or, for a
        host tool, waiting on you. The last three are final.
    ToolCallSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - mode
        - status
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ToolCallID'
        name:
          type: string
          description: The tool this call names.
        mode:
          allOf:
            - $ref: '#/components/schemas/ToolCallMode'
          description: |
            How this call executes, present on every entry whatever its mode.

            It is what separates "answerable" from "mine to run". A pending
            callback-mode call is answerable to a machine credential, because
            you may settle it after acknowledging delivery — but nvoken is the
            one delivering it. A call you must run yourself is one that carries
            `arguments` **and** has `mode: host`.
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        arguments:
          type: object
          additionalProperties: true
          description: |
            The arguments the model produced, as a JSON object whose shape is
            the `input_schema` you declared for this tool. nvoken does not
            narrow it further, because only your tool declaration knows what
            belongs there.

            Present exactly while this call is yours to run: a host- or
            callback-mode call that has not settled. Omitted otherwise,
            including for builtin and MCP calls nvoken runs itself, and for
            any call that has already settled. The durable record of what
            every call was given is the `tool_use` block in the transcript.
        deadline_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: |
            The Turn's explicit waiting deadline, or null when external
            waiting is unbounded. Present under the same rule as `arguments`.
        updated_at:
          type: string
          format: date-time
          description: When this call last changed state.
      description: |
        One tool call as a stream sees it: which call, what tool, how it
        executes, what state it is in, and when it reached that state. The `id`
        is the `id` of the `tool_use` block that opened it, so a client can
        show a call as failed or still running without waiting for the message
        that carries its result.

        This is the only tool-call collection. A call you may settle carries
        `arguments` and `deadline_at`; a call you must run yourself is one of
        those with `mode: host`. Filter on those rather than reading a second
        list or keeping a list of your own tool names. Attempts and delivery
        detail live on the ToolCall resource at
        `GET /v1/turns/{turn_id}/tool-calls`.
    TurnFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - deadline_exceeded
            - budget_exceeded
            - cost_estimate_unavailable
            - provider_key_unavailable
            - context_window_exceeded
            - input_media_rejected
            - provider_error
            - mcp_discovery_failed
            - structured_output_unsatisfied
            - internal
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      description: |
        A failed turn still reports `usage` and `provenance` if the model
        answered at least once before it stopped, so you can see what you were
        charged for. A cancelled turn reports whatever it had used up to the
        moment you cancelled. A turn that failed before any model reply
        reports neither.

        `details` is a small object whose keys depend on `code`. Each code
        below lists the only keys it sets:

        - `deadline_exceeded` sets `details.scope` to the deadline that ran
          out: `total`, `active_execution`, `execution_segment`, or `waiting`.
        - `budget_exceeded` sets `details.kind` to the limit the turn went
          over: `output_tokens` or `estimated_cost`. A limit only shows up as a failure
          when the turn could not stop cleanly; when it could, the turn ends
          `incomplete` with a matching `stop_reason` instead.
        - `cost_estimate_unavailable` does not
          mean you overspent — it means nvoken has no price for the model and
          so cannot enforce mandatory credits or the cost limit you set.
        - `structured_output_unsatisfied` sets `details.reason` to `missing`,
          `invalid`, or `oversized`.
        - `context_window_exceeded` sets the integer keys `input_tokens`,
          `context_window_tokens`, and `requested_output_tokens`, each only
          when nvoken knows it.
        - `input_media_rejected` sets `modality`, `media_type`, and `reason`
          as the provider reported them, each only when known.

        A `provider_error` sets `details.provider_failure_class`, which is
        nvoken's summary of what went wrong at the provider and is the field
        to branch your retry logic on:

        - `upstream_rejected` — the provider refused this request. Do not
          retry it unchanged; fix the request first.
        - `upstream_unavailable` or `throttled` — the provider could not serve
          it right now. Retry with backoff.
        - `configuration`, `canceled`, `timeout_or_transport`,
          `invalid_response`, or `unknown` — everything else.

        Provider error text is never passed through here, so nothing in this
        object leaks another vendor's wording or your key material.
    ConversationMessageRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    ConversationContentBlock:
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ImageReferenceBlock'
        - $ref: '#/components/schemas/DocumentReferenceBlock'
        - $ref: '#/components/schemas/ToolUseBlock'
        - $ref: '#/components/schemas/ServerToolUseBlock'
        - $ref: '#/components/schemas/ToolResultBlock'
        - $ref: '#/components/schemas/ReminderBlock'
        - $ref: '#/components/schemas/RedactedBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          image: '#/components/schemas/ImageReferenceBlock'
          document: '#/components/schemas/DocumentReferenceBlock'
          tool_use: '#/components/schemas/ToolUseBlock'
          server_tool_use: '#/components/schemas/ServerToolUseBlock'
          tool_result: '#/components/schemas/ToolResultBlock'
          reminder: '#/components/schemas/ReminderBlock'
          redacted: '#/components/schemas/RedactedBlock'
      description: |
        One block of a stored message, in nvoken's own shape rather than any
        provider's. Images and documents come back described rather than
        inlined — type, media type, optional title, size in `bytes`, and a
        `sha256:` checksum — so reading a transcript never ships the original
        bytes back to you.

        New block types will appear as features ship. Render the ones you know
        and skip the rest.
    TextBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
          x-enum-varnames:
            - TypeText
        text:
          type: string
          minLength: 1
        citations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Citation'
          description: Source locations attached to generated text.
    ReminderBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - tier
        - content
      properties:
        type:
          type: string
          enum:
            - reminder
          x-enum-varnames:
            - TypeReminder
        name:
          type: string
          minLength: 5
          maxLength: 68
          pattern: ^app-[a-z][a-z0-9-]*$
          description: Caller name in nvoken's reserved application namespace.
        tier:
          type: string
          enum:
            - contextual
            - operator
        content:
          type: string
          minLength: 1
          x-nvoken-max-utf8-bytes: 8192
      description: |
        One application-owned state snapshot recorded at Turn admission.
        Contextual reminders use the user role; operator reminders use the
        system role. The typed tier remains authoritative for provider mapping.
    Citation:
      oneOf:
        - $ref: '#/components/schemas/CharLocationCitation'
        - $ref: '#/components/schemas/WebSearchResultLocationCitation'
        - $ref: '#/components/schemas/URLCitation'
      discriminator:
        propertyName: type
        mapping:
          char_location: '#/components/schemas/CharLocationCitation'
          web_search_result_location: '#/components/schemas/WebSearchResultLocationCitation'
          url_citation: '#/components/schemas/URLCitation'
    CharLocationCitation:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - char_location
          x-enum-varnames:
            - TypeCharLocation
        cited_text:
          type: string
        document_index:
          type: integer
          minimum: 0
        document_title:
          type: string
        start_char_index:
          type: integer
          minimum: 0
        end_char_index:
          type: integer
          minimum: 0
      description: A location inside one indexed input document.
    WebSearchResultLocationCitation:
      type: object
      additionalProperties: false
      required:
        - type
        - url
        - title
      properties:
        type:
          type: string
          enum:
            - web_search_result_location
          x-enum-varnames:
            - TypeWebSearchResultLocation
        url:
          type: string
          format: uri
        title:
          type: string
        encrypted_index:
          type: string
        cited_text:
          type: string
      description: A provider search result cited by the generated text.
    URLCitation:
      type: object
      additionalProperties: false
      required:
        - type
        - url
        - title
        - start_index
        - end_index
      properties:
        type:
          type: string
          enum:
            - url_citation
          x-enum-varnames:
            - TypeURLCitation
        url:
          type: string
          format: uri
        title:
          type: string
        start_index:
          type: integer
          minimum: 0
        end_index:
          type: integer
          minimum: 0
      description: A URL citation positioned within the generated text.
    ImageReferenceBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - media_type
        - bytes
        - digest
      properties:
        type:
          type: string
          enum:
            - image
          x-enum-varnames:
            - TypeImage
        media_type:
          type: string
          enum:
            - image/gif
            - image/jpeg
            - image/png
            - image/webp
        bytes:
          type: integer
          minimum: 0
          maximum: 5242880
          description: Decoded media byte count; never the media payload.
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Digest of the decoded media bytes.
        url:
          type: string
          format: uri
          description: Original URL when the image arrived by URL.
      description: |
        A stored input image, described rather than sent back. You get its
        media type, size, and checksum, but not the bytes.
    DocumentReferenceBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - media_type
        - bytes
        - digest
      properties:
        type:
          type: string
          enum:
            - document
          x-enum-varnames:
            - TypeDocument
        media_type:
          type: string
          enum:
            - application/pdf
        title:
          type: string
          description: Present only when the caller supplied a title.
        bytes:
          type: integer
          minimum: 0
          maximum: 16777216
          description: Decoded document byte count; never the document payload.
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Digest of the decoded document bytes.
        url:
          type: string
          format: uri
          description: Original URL when the document arrived by URL.
      description: |
        A stored input document, described rather than sent back. You get its
        media type, size, and checksum, but not the bytes.
    ToolUseBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
        - input
      properties:
        type:
          type: string
          enum:
            - tool_use
          x-enum-varnames:
            - TypeToolUse
        id:
          $ref: '#/components/schemas/ToolCallID'
        name:
          type: string
          minLength: 1
        input: {}
      description: A host, builtin, MCP, or callback tool call.
    ServerToolUseBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
        - input
      properties:
        type:
          type: string
          enum:
            - server_tool_use
          x-enum-varnames:
            - TypeServerToolUse
        id:
          type: string
          minLength: 1
          description: |
            The provider's own ID for a tool it ran itself, such as web
            search. This is not a ToolCall ID: you never send a result for
            it, and it never appears in your pending tool calls. It is here
            so you can show the user what the model looked up.
        name:
          type: string
          minLength: 1
        input: {}
      description: A provider-run tool call retained in the public transcript.
    ToolResultBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_use_id
        - content
      properties:
        type:
          type: string
          enum:
            - tool_result
          x-enum-varnames:
            - TypeToolResult
        tool_use_id:
          $ref: '#/components/schemas/ToolCallID'
          description: >
            The `id` of the `tool_use` block this result answers. The name comes

            from the provider message format nvoken stores and replays; the
            value

            is a ToolCall ID.
        content:
          description: |
            The host's own JSON, retained verbatim. Its canonical encoding is
            limited to 262144 bytes and 32 nesting levels; the complete result
            submission body is limited to 1048576 bytes.
          x-nvoken-max-json-bytes: 262144
          x-nvoken-max-json-depth: 32
        is_error:
          type: boolean
      description: The durable result of one tool call.
    RedactedBlock:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - redacted
          x-enum-varnames:
            - TypeRedacted
      description: Placeholder for an assistant message whose content is private.
    ConversationMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - content_expires_at
        - turn_id
        - sequence
        - role
        - content
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/ConversationMessageID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        agent_id:
          $ref: '#/components/schemas/AgentID'
        turn_id:
          oneOf:
            - $ref: '#/components/schemas/TurnID'
            - type: 'null'
          description: |
            The Turn that wrote this row, or null for a copied fork-history
            row. `copied_from_message_id` explains that null.
        user_key:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Per-Turn actor attribution. Copied rows preserve it.
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          $ref: '#/components/schemas/ConversationMessageRole'
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConversationContentBlock'
        copied_from_message_id:
          $ref: '#/components/schemas/ConversationMessageID'
          description: Present only on a fork copy; names its source message.
        phase:
          allOf:
            - $ref: '#/components/schemas/MessagePhase'
          description: >
            Whether this assistant message is the turn's actual answer or
            something

            along the way. Absent on user and tool messages, which have no
            phase.


            It is worked out when you read, from how the turn ended, and it is

            frozen onto forked copies so a fork keeps the phases it had. Your
            own

            input never carries a phase.


            Because it is worked out on read, it is authoritative on ordinary

            reads and not on the stream: a message delivered there before its

            turn settled carries `commentary` forever, and no later frame

            corrects it. On the stream, derive the answer instead. A turn has

            a final answer only once it settled `completed` with stop reason

            `end_turn`, and that answer is the turn's last assistant message.

            That is the same rule nvoken applies.
        created_at:
          type: string
          format: date-time
    MessagePhase:
      type: string
      enum:
        - commentary
        - final_answer
      description: |
        Tells you which assistant message is the actual answer, so you can
        render a turn without guessing.

        `final_answer` is the message the model ended the turn with — the
        reply you would show a user. `commentary` is everything else: the
        model thinking out loud between tool calls, and every message of a
        turn that was interrupted or stopped early, none of which was ever an
        answer. A turn with no `final_answer` was left unfinished, and you can
        show it as such.
    TurnChange:
      type: object
      required:
        - turn_id
        - conversation_id
        - content_expires_at
        - revision
        - status
        - terminal
        - through_message_sequence
        - error
        - structured_output
        - occurred_at
      description: |
        One lifecycle step of one turn, as the stream and the JSON transcript
        deliver it. Order changes by `revision` and fold to the highest one to
        get current state.

        **A turn is over when a change for it carries `terminal: true`.**
        That is the terminal signal, and there is no other. Because it is
        saved it replays on reconnect at any cursor, so a turn that settled
        while you were away is still settled when you return.

        A change carries what a turn's own projection carries about where it
        stands: `terminal` for whether this change is the end, `stop_reason`
        for a turn that ended, `credit_block` for one held on credits, and
        `tool_calls` for what its tools are doing, with `arguments` on the ones
        waiting for you to run them. You never need a second request to find
        out why a turn is not moving.
      properties:
        turn_id:
          $ref: '#/components/schemas/TurnID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/TurnStatus'
        terminal:
          type: boolean
          description: |
            Whether this change is the turn's end. It is exactly
            `status IN (completed, incomplete, failed, cancelled)`, computed
            here so you never restate that set — read this rather than
            testing the status against a list of your own, and a status added
            later cannot silently change what your code believes.

            It describes *this change*, not the turn's current state. A
            replayed `running` change reports `false` even after the turn has
            ended, which is what keeps the ordering rule intact: fold messages
            before changes and a turn is never settled before its final
            message exists.
        stop_reason:
          oneOf:
            - $ref: '#/components/schemas/TurnStopReason'
            - type: 'null'
          description: |
            Why the turn stopped. Present once it has stopped, so an
            `incomplete` change names the limit that ran out.
        credit_block:
          oneOf:
            - $ref: '#/components/schemas/CreditBlock'
            - type: 'null'
          description: Present while the turn is on budget hold for spending capacity.
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallSummary'
          description: |
            Every tool call this turn has made, with its current status.
            Omitted when the turn has made none. A tool call changing state is
            itself a change, so a failed or long-running call is visible
            before its result message arrives, and a client that was
            disconnected sees it on replay.
        through_message_sequence:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/TurnFailure'
            - type: 'null'
        usage:
          oneOf:
            - $ref: '#/components/schemas/ModelUsage'
            - type: 'null'
        provenance:
          oneOf:
            - $ref: '#/components/schemas/ModelProvenance'
            - type: 'null'
        structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        structured_output_provenance:
          oneOf:
            - $ref: '#/components/schemas/StructuredOutputProvenance'
            - type: 'null'
        occurred_at:
          type: string
          format: date-time
    TranscriptUpdateEvent:
      type: object
      required:
        - type
        - conversation_id
        - content_expires_at
        - messages
        - turn_changes
        - cursor
      description: |
        The saved frame, and the only one. Messages append by `sequence` and
        are never sent twice. Changes are an append log keyed by
        `(turn_id, revision)`; fold to the highest revision for current
        state. Within one frame apply messages before changes, so a turn is
        never marked settled before its final message exists.
      properties:
        type:
          type: string
          enum:
            - transcript.update
          x-enum-varnames:
            - EventTranscriptUpdate
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        turn_changes:
          type: array
          items:
            $ref: '#/components/schemas/TurnChange'
        cursor:
          type: string
          minLength: 1
          description: >-
            Your resume position. Store it and send it back as `cursor` to
            continue where you left off.
    MessageDeltaEvent:
      type: object
      required:
        - type
        - conversation_id
        - content_expires_at
        - turn_id
        - attempt
        - message_id
        - content_index
        - kind
        - delta
        - emitted_at
      properties:
        type:
          type: string
          enum:
            - message.delta
          x-enum-varnames:
            - EventMessageDelta
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        turn_id:
          $ref: '#/components/schemas/TurnID'
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: |
            Execution attempt that emitted this preview. Discard provisional
            output from earlier attempts when this value increases.
        message_id:
          $ref: '#/components/schemas/PreviewMessageID'
        content_index:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/MessageDeltaKind'
        delta:
          type: string
          minLength: 1
          description: |
            The fragment, for every kind. One accumulator handles all of them.
        tool_call_id:
          type: string
          minLength: 1
          description: |
            The tool call these arguments belong to. Present on every
            `tool_arguments` frame, denormalized so a lost frame cannot orphan
            a fragment. Absent on other kinds.
        name:
          type: string
          minLength: 1
          description: |
            The tool being called, alongside `tool_call_id` and on the same
            terms.
        emitted_at:
          type: string
          format: date-time
      description: |
        A live preview of a message the model is writing. Not saved, never
        replayed, and never a message. Accumulate it by `(message_id,
        content_index)` and discard it under the rules in Streaming above.

        Reasoning previews travel here like any other kind, on machine and
        browser streams alike. What an end user sees is your application's
        decision, made in your application. Reasoning is watchable and not
        stored: no content block carries it, and no read returns it. Watch the
        stream if you want to see the model think. A turn that runs under
        explicit `reasoning` controls emits no reasoning previews at all, to
        either audience.
    MessageDeltaKind:
      type: string
      enum:
        - text
        - thinking
        - tool_arguments
      x-enum-varnames:
        - DeltaKindText
        - DeltaKindThinking
        - DeltaKindToolArguments
      description: |
        What this fragment is part of. `text` is assistant prose,
        `thinking` is reasoning, and `tool_arguments` is the JSON the model is
        writing for a tool call, which is only valid JSON once complete.

        Expect new values here over time. Treat a value you do not recognize
        as content you do not render, and keep reading.
    StreamResyncEvent:
      type: object
      required:
        - type
        - conversation_id
        - content_expires_at
        - reason
      properties:
        type:
          type: string
          enum:
            - stream.resync
          x-enum-varnames:
            - EventStreamResync
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        turn_id:
          allOf:
            - $ref: '#/components/schemas/TurnID'
          description: |
            The Turn whose previews are void. Absent means every
            Turn in the Conversation: an absent field is scope, where a null
            identifier would be scope wearing an identifier's name.
        reason:
          $ref: '#/components/schemas/StreamResyncReason'
    ConnectionClosingEvent:
      type: object
      required:
        - type
        - conversation_id
        - content_expires_at
        - reason
      properties:
        type:
          type: string
          enum:
            - connection.closing
          x-enum-varnames:
            - EventConnectionClosing
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        reason:
          $ref: '#/components/schemas/ConnectionClosingReason'
      description: |
        This connection is closing. The stream continues and the turn is
        unaffected, so reconnect with your last `cursor`.

        There is no cursor here. You already track your last durable one,
        because you need it to survive a connection that drops without saying
        anything, and a field that repeats what you must hold anyway is a
        second spelling of it.
    StreamResyncReason:
      type: string
      enum:
        - live_delivery_gap
      x-enum-varnames:
        - ReasonLiveDeliveryGap
      description: |
        Why previews were invalidated. `live_delivery_gap` means the live
        delivery path could not prove continuity, so previews were lost;
        discard what you accumulated and wait for saved frames.

        Expect new values here over time. Treat a value you do not recognize
        the same way you treat `live_delivery_gap`.
    ConnectionClosingReason:
      type: string
      enum:
        - rotate
        - idle
        - slow_consumer
      x-enum-varnames:
        - ReasonRotate
        - ReasonIdle
        - ReasonSlowConsumer
      description: >
        Why this connection is closing. `rotate` means the server is cycling the
        connection, so reconnect now

        with your last `cursor`. `idle` means no turn is running and the

        server is reclaiming the connection, so reconnect when you next need

        to read; nothing is lost while you are away. `slow_consumer` means

        this connection could not keep up with what was being written to it

        and was dropped; reconnect, and read faster or buffer more.


        Expect new values here over time. Treat a value you do not recognize

        as `rotate` and reconnect with your last `cursor`. Reconnecting is

        always safe.
    PreviewMessageID:
      type: string
      description: |
        The identifier the saved assistant message will carry when this
        iteration lands, with the same `msg_` prefix every message ID has. Key
        your preview by it and the handoff becomes an update to a row that
        already has its permanent identity, rather than one row disappearing
        and another taking its place.

        It is allocated when the model starts writing, so every preview of one
        message carries it. It is stable within one attempt; a retried attempt
        allocates a new one, which is harmless, because a higher `attempt`
        already voids every earlier preview.
    ConversationStreamEvent:
      description: |
        The JSON value carried by one SSE `data:` field. Switch on `type`.
        Saved `transcript.update` frames carry the resume cursor as both
        payload data and SSE `id`; preview and control frames never carry IDs.

        New frame types may appear here over time, and existing ones may gain
        fields. Handle the types you know and ignore the rest.
      oneOf:
        - $ref: '#/components/schemas/TranscriptUpdateEvent'
        - $ref: '#/components/schemas/MessageDeltaEvent'
        - $ref: '#/components/schemas/StreamResyncEvent'
