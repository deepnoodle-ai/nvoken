  /v1/tenants:
    get:
      tags:
        - Tenants
      operationId: listTenants
      summary: List the App's interned tenants
      description: |
        One row per tenant key nvoken has interned for this App, with its
        credit position and the last time it ran a turn.

        A tenant row is an interning of a key, not tenant state: nvoken stores
        no configuration, profile, or entitlement for it. What this list
        reports is therefore what is attached to the key, not what is
        configured on it.

        A key that has only ever been refused does not appear here, because it
        was never interned. Those keys are in `GET /v1/admissions`, and the
        difference between the two lists is the set of tenants a host is
        addressing but has never successfully run.
      parameters:
        - $ref: '#/components/parameters/TenantKeyFilter'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: One page of tenants, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tenants/{tenant_id}:
    delete:
      tags:
        - Tenants
      operationId: deleteTenant
      summary: Delete a tenant that never ran anything
      description: |
        Removes a tenant along with the credit account and allocations that
        belong to it alone. It exists to undo a mistake -- a key funded with a
        typo in it, a tenant created by a misconfigured client -- and is
        deliberately narrow.

        A tenant with any Conversation, Turn, retained model-call fact,
        durable memory, provider key, or dispatch is refused with
        `409 tenant_in_use` and the
        counts that made it load-bearing. This is not a policy choice: every
        runtime table references `tenants` with ON DELETE RESTRICT, and the
        retained usage facts must outlive the transcripts they describe, so
        deleting a tenant that has run work would mean destroying accounting
        evidence. To remove transcripts, delete the Conversations; the facts and
        their spend stay.

        Deleting a funded tenant destroys its allocation history, and
        allocations cannot be recreated with their original identity, so the
        released amount is written to the operator log at deletion.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TenantID'
      responses:
        '204':
          description: The tenant and its credit state were removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The tenant has runtime history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
