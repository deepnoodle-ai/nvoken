            starting with `invocation.accepted` and ending with `invocation.result`.
            That depends on your deployment not buffering the response — the
            pattern to rely on is a plain JSON POST followed by
            `GET /v1/invocations/{invocation_id}/stream`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
              examples:
