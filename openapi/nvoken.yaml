  /v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create or seed a Session without creating an Invocation
      description: |
        Creates an empty Session, optionally seeded with history you already
        have. Use this when you want a conversation to exist before the first
        turn runs — to show it in a UI, or to import messages from elsewhere.

        Every field is optional. Leave out `agent_key` and the Session starts
        unbound: `agent_id` stays null until the first turn binds it
        permanently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The created (or key-resolved existing) Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Supplied options differ from the existing keyed Session, or the App
            is archived (`app_archived`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List authoritative Sessions
      description: |
        Lists Sessions, newest first, each with the state of its currently
        running turn if it has one. Filters combine with AND. Tenant filtering
        and cursors work the same as on the Invocation list. `agent_id` and
        `agent_key` are mutually exclusive.
      parameters:
        - $ref: "#/components/parameters/TenantKeyFilter"
        - $ref: "#/components/parameters/DefaultTenantFilter"
        - $ref: "#/components/parameters/UserKeyFilter"
        - name: agent_id
          in: query
          description: Mutually exclusive with agent_key.
          schema:
            $ref: "#/components/schemas/AgentID"
        - $ref: "#/components/parameters/AgentKeyFilter"
        - name: session_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Read authoritative Session identity and current state
      description: |
        An App credential without a tenant constraint may resolve a Session in
        any tenant partition in that App. A tenant-constrained credential
        resolves only Sessions in its partition. Missing, incompatible, and
        undisclosable resources use
        `not_found`; a credential denied the read operation itself receives
        `forbidden`.
      responses:
        "200":
          description: The Session's current identity and state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              examples:
                keyedTenantSession:
                  value:
                    id: sess_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    agent_id: agent_019b0a12-6a31-7d14-9ed2-0e07c1bdb300
                    tenant_key: tenant-acme
                    session_key: ticket-483
                    user_key: null
                    forked_from: null
                    active_invocation_id: inv_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    active_invocation_status: running
                    credit_block: null
                    compaction: null
                    retention: null
                    expires_at: null
                    metadata: null
                    context:
                      estimated_tokens: 129400
                      context_window_tokens: 1000000
                      model:
                        provider: anthropic
                        id: claude-sonnet-5
                    usage: null
                    created_at: "2026-07-20T14:01:02Z"
                    updated_at: "2026-07-20T14:01:05Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Update a Session
      description: |
        Replaces or removes the Session lifetime estimated-cost cap, and merges
        host metadata when present. Raising or removing an exhausted cap
        requeues a turn paused on its per-Invocation estimated-cost limit. A
        credit-paused turn resumes automatically after its account receives
        enough credits.

        For metadata, a present key replaces its value, an explicit
        `null` deletes that key, and a key the patch does not mention survives.

        Merge rather than replace, because independent writers share this map —
        a conversation UI writing a title, correlation tooling writing a trace
        id — and a full replacement would make each silently discard the
        other's keys. The merge happens under the Session lock, so two
        concurrent patches compose instead of one overwriting the other's read.

        `"metadata": null` is refused rather than guessed at: it could mean
        "clear everything" or "leave it alone", and either reading is
        destructive or silent. Delete keys one at a time.

        Bounds apply to the merged result, not to the patch, so a patch that
        deletes as many keys as it adds is not refused for a count it never
        produces. Requires the `update_session` operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
            examples:
              setTitleAndDropTrace:
                value:
                  metadata:
                    title: Refund policy
                    trace_id: null
      responses:
        "200":
          description: The Session after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Erase a Session and everything under it
      description: |
        Removes the Session, its Invocations, transcript messages, checkpoints,
        tool calls, provider artifacts, compactions, provider-key and MCP
        bindings, and undelivered webhooks. The erasure is immediate and
        irreversible; a subsequent read is `not_found`.

        A turn still running is stopped, but no cancellation is recorded —
        there is nothing left to record it against, and no
        `invocation.ended` webhook fires for it. If you need a record that
        the turn ended, cancel it and wait for its final state before
        deleting.

        An unknown `session_id`, or one outside your scope, returns
        `not_found`. So if you lose the response and retry, you can safely
        treat `404` as "already deleted". Deleting requires the Runtime or
        Operator profile; a Viewer credential cannot erase a transcript.

        **Deleting Sessions is not the same as deleting a user's account.**
        nvoken has no record that an account was deleted, so to honour a
        deletion request you must first stop starting new turns for that
        tenant, then page through `GET /v1/sessions` and delete until the list
        comes back empty. Otherwise a request arriving mid-sweep creates a new
        Session behind you.

        Two consequences to plan for. Content-free Invocation, model-call,
        and tool-call facts remain for usage reporting, with the Invocation
        marked erased; prompts, responses, and tool payloads do not. The
        deleted turns' idempotency keys become reusable, since deduplication
        only holds while the original turn still exists.
      responses:
        "204":
          description: The Session and its subtree no longer exist.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/fork:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [Sessions]
      operationId: forkSession
      summary: Copy a Session prefix into a new Session
      description: |
        Creates a new Session in the source Session's tenant and Agent scope,
        copying every canonical message through `from_message` inclusively.
        The source is untouched. The child stores durable Session and message
        lineage, but copied messages no longer belong to the source
        Invocations. Their `origin`, per-turn `user_key`, and resolved message
        phase are preserved.

        Usage and compaction summaries are not copied. Child usage starts at
        zero and the child starts uncompacted. Retention and metadata come only
        from `session_options` on this request; no Session option is inherited.
        A `session_key` has the same tenant/Agent-scoped upsert behavior as
        Session creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkSessionRequest"
            examples:
              byMessageID:
                value:
                  from_message: msg_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                  session_key: ticket-483-alt
              bySequence:
                value:
                  from_message: 1
      responses:
        "201":
          description: The new or key-resolved Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AppArchived"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: listSessionMessages
      summary: Page through the canonical Session transcript
      description: |
        Returns persisted SessionMessage rows in ascending sequence order.
        The opaque forward cursor is bound to the authenticated caller and
        Session. This history endpoint contains no lifecycle or live-preview
        copies.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of canonical messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessageListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/compactions:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: listSessionCompactions
      summary: Page through immutable Session compaction records
      description: |
        Lists every attempt nvoken made to summarize this Session's history,
        newest first. Use it to understand why the model's context looks the
        way it does.

        An `applied` record includes the summary that took effect and what the
        summarizing call cost. A `fell_through` record tells you why the
        attempt was not usable, and includes usage when a model call happened
        before it failed.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of immutable compaction records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCompactionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: getSessionTranscript
      summary: Drain a fixed-cut incremental transcript snapshot
      description: |
        Returns the Session's stored messages plus a running log of turn state
        changes.

        To catch up rather than re-read everything, pass a `resume_cursor` you
        received earlier as `cursor` and you get only what is new since then.
        Within one read, keep passing `page_token` until `has_more` is false —
        all pages come from the same consistent snapshot, so the transcript
        cannot shift under you mid-read.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: page_token
          in: query
          description: Opaque fixed-cut continuation from `next_page_token`.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One phase of a fixed-cut transcript snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSnapshotResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sessions/{session_id}/transcript/stream:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Sessions]
      operationId: streamSessionTranscript
      summary: Follow a Session transcript over Server-Sent Events
      description: |
        Streams a Session's transcript as it grows, and can be resumed after a
        dropped connection. It covers the same messages as the JSON transcript
        endpoint.

        Every non-empty `transcript.update` frame carries
        `id: <resume_cursor>`. That opaque ID is your resume position and the
        only value you need to store — reconnect with it and you continue
        exactly where you left off. `output_text.delta`, `thinking.delta`,
        `stream.resync`, and `stream.end` never carry an `id`, because they
        are live previews and control frames rather than saved messages.

        Previews can be lost. If you receive `stream.resync`, discard the
        preview text you have accumulated and wait for the saved messages to
        arrive. Set `deltas=false` to skip previews entirely; nothing about
        replay, resumption, or how the stream ends changes.

        `stream.end` with reason `terminal` means no turn is still running.
        Reason `rotate` means the server is cycling the connection —
        reconnect with your last `id`. A connection that just drops carries no
        meaning: reconnect and resume. Disconnecting never cancels a running
        turn.

        The `cursor` query parameter wins over the `Last-Event-ID` header.
        Because this endpoint uses bearer authentication, you need an SSE
        client that can set the `Authorization` header — the browser's
        built-in `EventSource` cannot. The server suggests a 1000 ms
        reconnect delay.

        Client-token streams omit `thinking.delta` previews even when
        `deltas=true`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: deltas
          in: query
          description: Include id-less output and thinking preview frames. Client tokens receive output previews only. Defaults to true.
          schema:
            type: boolean
            default: true
        - name: Last-Event-ID
          in: header
          description: Opaque `resume_cursor` from the last durable update frame; ignored when `cursor` is supplied.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: |
            SSE frames named `transcript.update`, `output_text.delta`,
            `thinking.delta`, `stream.resync`, and `stream.end`. Client-token
            streams never emit `thinking.delta`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TranscriptStreamResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/identity:
    get:
      tags: [Identity]
      operationId: getCurrentIdentity
      summary: Explain the authenticated caller
      responses:
        "200":
          description: The resolved caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/identity/credentials:
    get:
      tags: [Identity]
      operationId: listCredentials
      summary: List safe credential metadata
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CredentialStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CredentialLimit"
      responses:
        "200":
          description: Bounded credential metadata only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Identity]
      operationId: createCredential
      summary: Create a machine credential
      description: |
        Creates a credential within the caller's durable boundary. A non-admin
        installation issuer token may create App credentials, but cannot mint
        Org or installation credentials.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialRequest"
      responses:
        "201":
          description: One-time credential secret
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssuance"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The idempotency key was reused with a different request, or the
            App or Org the credential would be bound to is archived
            (`app_archived`, `org_archived`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/identity/credentials/{credential_id}:
    parameters:
      - $ref: "#/components/parameters/CredentialID"
    get:
      tags: [Identity]
      operationId: getCredential
      summary: Read safe credential metadata
      responses:
        "200":
          description: Credential metadata without secret material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/identity/credentials/{credential_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/CredentialID"
    post:
      tags: [Identity]
      operationId: rotateCredential
      summary: Rotate a machine credential with bounded overlap
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overlap_seconds]
              properties:
                overlap_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
      responses:
        "201":
          description: One-time replacement secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialIssuance"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/identity/credentials/{credential_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/CredentialID"
    post:
      tags: [Identity]
      operationId: revokeCredential
      summary: Revoke a credential
      responses:
        "200":
          description: Revoked credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
webhooks:
  toolCallback:
    post:
      operationId: receiveToolCallback
      security: []
      summary: Receive a signed callback ToolCall delivery
      description: |
        nvoken sends this request to the HTTPS endpoint you declared on a
        callback tool. Your endpoint runs the tool and replies with the result.

        **Expect duplicates.** Delivery is at-least-once, so the same request
        can arrive more than once. Deduplicate on the ToolCall ID in the
        `Idempotency-Key` header.

        **Verify the signature before you parse the body.** It is an
        HMAC-SHA256 over `v1.<delivery_id>.<timestamp>.<raw_body>`, sent as
        lowercase hex with a `sha256=` prefix. Headers tell you which signing
        key and version to use. Compare in constant time, against the raw bytes
        rather than re-serialized JSON, and reject timestamps too far from your
        own clock.

        For work that may outlive the App's callback reply deadline, return
        HTTP 202 with an empty body. That acknowledges the delivery without
        settling the ToolCall; later submit its result through
        `POST /v1/invocations/{invocation_id}/tool-results`. An acknowledged
        call waits under the host's responsibility and is bounded only when
        the Invocation opted into `waiting_timeout_seconds`.

        **If you never reply successfully, the turn still moves on.** nvoken
        retries with exponential backoff, up to five attempts, on connection
        failures and on HTTP 408, 425, 429, 500, 502, 503, and 504. A reply
        that arrives but is malformed is not retried. Once attempts run out,
        nvoken records the tool call as failed with `is_error: true` and
        content `{"code":"callback_delivery_failed"}`, and the turn continues
        from there. This fail-loud guarantee applies to unacknowledged
        delivery exhaustion; an acknowledged call remains parked as described
        above.
      parameters:
        - name: X-Nvoken-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
          description: HMAC-SHA256 signature of the canonical delivery string.
        - name: X-Nvoken-Signature-Version
          in: header
          required: true
          schema:
            type: string
            enum: [v1]
        - name: X-Nvoken-Timestamp
          in: header
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp used in the signature.
        - name: X-Nvoken-Delivery-Id
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/DeliveryID"
        - name: X-Nvoken-Signing-Key-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Nvoken-Signing-Key-Version
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/ToolCallID"
          description: The stable ToolCall ID. It is unchanged across retries.
      requestBody:
        required: true
        content:
          "application/vnd.nvoken.tool-callback+json; version=1":
            schema:
              $ref: "#/components/schemas/ToolCallbackRequest"
            example:
              nvoken:
                schema_version: 1
                delivery_id: dlvr_019b0a12-8d51-7f34-aed2-0e07c1bdb326
                tool_call_id: call_019b0a12-8d51-7f34-aed2-0e07c1bdb325
                invocation_id: inv_019b0a12-8d51-7f34-aed2-0e07c1bdb322
                session_id: sess_019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                agent_key: support
                tenant_key: acme
              input:
                title: Customer needs a refund
      responses:
        "2XX":
          description: |
            HTTP 202 with an empty body acknowledges delivery without settling
            the ToolCall. Any 2xx response carrying a body is the ToolCall
            result: the body must be an object with exactly `content` and
            optional `is_error`. Content may be any JSON value. Its encoded
            size is at most 256 KiB and its nesting depth is at most 32.
            Unknown or duplicate members, trailing data, and any other shape
            are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallbackResponse"
              example:
                content:
                  ticket_id: T-1042
                is_error: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or Ed25519 JWT
      description: |
        Present either a machine API key or, when
        `CONSOLE_ISSUER_PUBLIC_KEYS` is configured, a JWT with `alg: EdDSA`,
        a known `kid`, `iss: nvoken-console`, `aud: nvoken`, and required
        `iat`, `exp`, `scope`, `profile`, and `sub` claims. `scope` is `app`
        (with `app_id` and `org_id`), `org` (with `org_id`), or
        `installation`; `profile` is `operator` or `viewer`; `exp - iat` may
        not exceed five minutes. The subject identifies the human for
        attribution only. App authorization compares the asserted `org_id`
        with the App's durable owner; `admin: true` retains its bypass.

        Browser-direct calls use a separate App-signed Ed25519 JWT trust class:
        `iss` is the App ID, `kid` names one active registered client key,
        `aud` is `nvoken`, and `sub`, `tenant_key`, `agent_key`,
        `agent_definition_id`, `agent_definition_revision`, `iat`, and `exp` are required. `session_id` and
        `ops` are optional. Lifetime is at most 15 minutes. Client tokens are
        accepted only in this header, never in a query parameter, and expose
        only the documented Client-prefixed response schemas and public routes.
  headers:
    ETag:
      description: Strong validator for this exact JSON representation.
      schema:
        type: string
  parameters:
    ArchiveStatus:
      name: status
      in: query
      required: false
      description: |
        Which container rows to return. Archive hides a container from pickers,
        never from money: usage reporting always counts archived Apps.
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a prior response for this exact representation.
      schema:
        type: string
        minLength: 1
    InvocationID:
      name: invocation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InvocationID"
    TraceID:
      name: trace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TraceID"
    NudgeID:
      name: nudge_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/NudgeID"
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AgentID"
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SessionID"
    ProviderKeyID:
      name: provider_key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderKeyID"
    CredentialID:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CredentialID"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the same operation and filter set.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Maximum items in this page. Defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    CredentialLimit:
      name: limit
      in: query
      description: |
        Maximum credentials in this page. Defaults to 100. Credential listing
        caps at 100 rather than the 200 the other list operations allow.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    UserKeyFilter:
      name: user_key
      in: query
      description: |
        Exact host-owned end-user reference. Filters to rows whose Session
        carries this label.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TenantKeyFilter:
      name: tenant_key
      in: query
      description: Exact non-default tenant partition reference.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    DefaultTenantFilter:
      name: default_tenant
      in: query
      description: Select only the default tenant partition. Mutually exclusive with tenant_key.
      schema:
        type: boolean
        default: false
    AgentKeyFilter:
      name: agent_key
      in: query
      description: |
        Exact host-owned Agent key. On Session and Invocation lists this is
        mutually exclusive with agent_id.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UsageStartAt:
      name: start_at
      in: query
      required: true
      description: Inclusive RFC 3339 start of the half-open reporting window.
      schema: { type: string, format: date-time }
    UsageEndAt:
      name: end_at
      in: query
      required: true
      description: Exclusive RFC 3339 end of the half-open reporting window; at most 400 days after start_at.
      schema: { type: string, format: date-time }
    UsageAppIDFilter:
      name: app_id
      in: query
      description: Exact App within the caller's App, Org, or installation reporting scope.
      schema: { $ref: "#/components/schemas/AppID" }
    UsageAgentIDFilter:
      name: agent_id
      in: query
      schema: { $ref: "#/components/schemas/AgentID" }
    UsageProviderFilter:
      name: provider
      in: query
      schema: { type: string, minLength: 1, maxLength: 255 }
    UsageModelFilter:
      name: model
      in: query
      schema: { type: string, minLength: 1, maxLength: 255 }
    UsageProviderKeySourceFilter:
      name: provider_key_source
      in: query
      schema: { $ref: "#/components/schemas/ProviderKeySource" }
    UsageProviderKeyIDFilter:
      name: provider_key_id
      in: query
      schema: { $ref: "#/components/schemas/ProviderKeyID" }
    UsageCredentialFamilyIDFilter:
      name: credential_family_id
      in: query
      schema: { $ref: "#/components/schemas/CredentialID" }
    UsageAuthenticationMethodFilter:
      name: authentication_method
      in: query
      schema: { $ref: "#/components/schemas/AuthenticationMethod" }
    UsageCallKindFilter:
      name: call_kind
      in: query
      schema: { $ref: "#/components/schemas/ModelCallKind" }
    UsageToolNameFilter:
      name: tool_name
      in: query
      schema: { type: string, minLength: 1, maxLength: 255 }
    UsageToolModeFilter:
      name: tool_mode
      in: query
      schema: { $ref: "#/components/schemas/ToolCallMode" }
  schemas:
    OrgID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `org_` prefix. Treat the body as opaque.
    Org:
      type: object
      additionalProperties: false
      required: [id, display_name, external_ref, created_at, archived_at]
      properties:
        id:
          $ref: "#/components/schemas/OrgID"
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-facing label for the customer Org.
        external_ref:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          description: Optional unique identity-provider Org identifier.
        created_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the Org was archived, or null while it is live. An archived
            Org admits no new App and no new Org-bound credential; its reads
            and org-scoped reporting are unchanged.
      description: |
        Thin customer ownership boundary. Membership, roles, invitations,
        policy, and runtime state deliberately live elsewhere.
    OrgList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
    RegisterOrgRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional unique identity-provider Org identifier. Reusing it
            returns the existing Org unchanged.
    UpdateOrgRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
    AgentID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `agent_` prefix. Treat the body as opaque.
    Agent:
      type: object
      additionalProperties: false
      required: [id, agent_key, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AgentID"
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable host-owned key, unique within the App.
        created_at:
          type: string
          format: date-time
      description: |
        App-scoped identity anchor only. Agent behavior is not registered;
        instructions, model, tools, and provider keys travel per Invocation.
    App:
      type: object
      additionalProperties: false
      required: [id, org_id, name, external_ref, display_name, callback_timeout_seconds, default_rate_limits, browser_access, credit_policy, created_at, archived_at]
      properties:
        id:
          $ref: "#/components/schemas/AppID"
          description: The generated nvoken app identifier.
        org_id:
          oneOf:
            - $ref: "#/components/schemas/OrgID"
            - type: "null"
          description: |
            Durable owning Org. Nullable only during the staged console
            migration and tightened after every existing App is claimed.
        name:
          type: string
          description: The unique host-chosen name for this app.
        external_ref:
          type: [string, "null"]
          maxLength: 255
          description: |
            Transitional console-owner reference retained only to stamp
            existing Apps into Orgs during rollout. It is not an authorization
            boundary and is removed by the gated cleanup migration.
        display_name:
          type: [string, "null"]
          maxLength: 255
          description: Human-facing label; `name` stays the unique handle.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          description: |
            Resolved deadline for each callback HTTP request. Defaults to 10.
            Webhook delivery is unaffected.
        default_rate_limits:
          oneOf:
            - $ref: "#/components/schemas/AppDefaultRateLimits"
            - type: "null"
          description: |
            Dormant App-wide admission ceilings shared by machine and future
            client-token callers. Null means unlimited machine admission.
            These values are recorded but not enforced until PRD 065.
        browser_access:
          oneOf:
            - $ref: "#/components/schemas/BrowserAccess"
            - type: "null"
          description: |
            Complete dormant browser-direct configuration. Null means browser
            access is disabled. Client JWTs and CORS remain unavailable until
            PRD 065.
        credit_policy:
          $ref: "#/components/schemas/CreditPolicy"
        created_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the App was archived, or null while it is live. An archived
            App refuses admission and grant-minting with `409 app_archived`
            while every read, settlement, erasure, configuration, and
            revocation path stays open. Its credentials keep authenticating.
    AppList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/App"
    AppSigningKeyPurpose:
      type: string
      enum: [callback, webhook]
      description: The only delivery class this HMAC key may sign.
    AppSigningKeySecret:
      type: object
      additionalProperties: false
      required: [purpose, key_id, version, secret]
      properties:
        purpose:
          $ref: "#/components/schemas/AppSigningKeyPurpose"
        key_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Value sent in `X-Nvoken-Signing-Key-Id`.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Value sent in `X-Nvoken-Signing-Key-Version`.
        secret:
          type: string
          minLength: 32
          description: |
            Receiver HMAC secret. This plaintext is returned only during App
            registration and is omitted from every later App response.
    AppRegistration:
      type: object
      additionalProperties: false
      required: [app, signing_keys]
      properties:
        app:
          $ref: "#/components/schemas/App"
        signing_keys:
          type: array
          minItems: 2
          maxItems: 2
          description: One callback key and one webhook key.
          items:
            $ref: "#/components/schemas/AppSigningKeySecret"
    RegisterAppRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: |
            The unique name identifying this app. Registering a name that
            already exists is rejected.
        org_id:
          $ref: "#/components/schemas/OrgID"
          description: |
            Owning Org. Org-scoped callers may omit this to use their own Org
            and cannot name another. Installation callers may name any
            registered Org or omit it during the staged migration.
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional opaque owner reference.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional human-facing label.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          default: 10
          description: Callback HTTP reply deadline for this App.
        default_rate_limits:
          oneOf:
            - $ref: "#/components/schemas/AppDefaultRateLimits"
            - type: "null"
          description: |
            Optional shared App admission ceilings. Browser access requires a
            non-null value. Recorded but not enforced until PRD 065.
        browser_access:
          oneOf:
            - $ref: "#/components/schemas/BrowserAccess"
            - type: "null"
          description: |
            Optional complete browser configuration. Null and omission both
            create the App with browser access disabled.
        credit_policy:
          $ref: "#/components/schemas/CreditPolicy"
          description: Defaults to `off`. See the schema for what each value enforces.
    UpdateAppRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: New human-facing label for the app.
        org_id:
          $ref: "#/components/schemas/OrgID"
          description: |
            New owning Org. Supplying this field transfers ownership and is
            restricted to installation administrators.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          description: New callback HTTP reply deadline for this App.
        default_rate_limits:
          oneOf:
            - $ref: "#/components/schemas/AppDefaultRateLimits"
            - type: "null"
          description: |
            Replace the whole member, or send null to restore unlimited
            machine admission. Clearing is rejected while browser access
            remains enabled. Omission preserves the stored value.
        browser_access:
          oneOf:
            - $ref: "#/components/schemas/BrowserAccess"
            - type: "null"
          description: |
            Replace the complete member, or send null to disable browser
            access without deleting client keys. Omission preserves the
            stored value.
        credit_policy:
          $ref: "#/components/schemas/CreditPolicy"
          description: |
            Change credit enforcement for turns admitted from now on.
            Invocations already running keep the policy they were admitted
            under. Omission preserves the stored value.
    CreditPolicy:
      type: string
      enum: [off, required]
      default: off
      description: |
        Whether nvoken refuses a turn whose tenant has no available credits.

        `off`, the default, admits turns without consulting the tenant's
        credit account. It is the right setting when the provider account
        paying for the call is yours -- an App provider key, or the
        deployment's own -- because nvoken is not the party at risk and your
        own billing system already meters the end user.

        `required` refuses admission, and each later provider call, unless the
        tenant has enough available credits. Choose it when you want nvoken to
        hold the line per tenant.

        Neither value governs platform-funded work. When a call is paid for by
        nvoken's own provider key, credits are always required.
    AppDefaultRateLimits:
      type: object
      additionalProperties: false
      required: [max_concurrent_invocations, max_admissions_per_minute]
      properties:
        max_concurrent_invocations:
          type: integer
          format: int64
          minimum: 1
        max_admissions_per_minute:
          type: integer
          format: int64
          minimum: 1
      description: |
        The one App-wide admission contract shared by machine and future
        client-token callers. Both positive values are required. They are
        authoritative configuration but unenforced until PRD 065.
    BrowserAccess:
      type: object
      additionalProperties: false
      required: [allowed_origins, invocation_webhook, limits]
      properties:
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
          description: |
            Canonical exact origins, returned sorted. Wildcards, userinfo,
            paths, queries, and fragments are invalid. HTTPS is required,
            except that exact localhost and loopback origins may use HTTP for
            development. CORS is not emitted until PRD 065.
        invocation_webhook:
          $ref: "#/components/schemas/BrowserInvocationWebhook"
        limits:
          $ref: "#/components/schemas/BrowserRateLimits"
      description: |
        Complete dormant browser-direct configuration. Enabling it requires
        App default_rate_limits and an active webhook-purpose signing key.
    BrowserInvocationWebhook:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Guarded absolute HTTPS Invocation webhook endpoint.
        events:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
          description: |
            Must include invocation.waiting and invocation.ended. Omission
            selects every current Invocation webhook event.
    BrowserRateLimits:
      type: object
      additionalProperties: false
      required: [max_concurrent_invocations_per_tenant, max_concurrent_invocations_per_user, max_admissions_per_user_per_minute]
      properties:
        max_concurrent_invocations_per_tenant:
          type: integer
          format: int64
          minimum: 1
        max_concurrent_invocations_per_user:
          type: integer
          format: int64
          minimum: 1
        max_admissions_per_user_per_minute:
          type: integer
          format: int64
          minimum: 1
      description: Dormant browser-specific ceilings enforced by PRD 065.
    ClientKeyID:
      type: string
      minLength: 1
      description: Opaque App client verification-key identifier with the public `ckey_` prefix.
    CreateClientKeyRequest:
      type: object
      additionalProperties: false
      required: [name, public_key]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Bounded operator-facing display name.
        public_key:
          type: string
          format: byte
          minLength: 44
          maxLength: 44
          description: Standard padded base64 for exactly 32 Ed25519 public-key bytes.
    ClientKey:
      type: object
      additionalProperties: false
      required: [id, name, fingerprint, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ClientKeyID"
        name:
          type: string
          minLength: 1
          maxLength: 255
        fingerprint:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Base64url-without-padding SHA-256 of the raw 32 public-key bytes.
        created_at:
          type: string
          format: date-time
      description: Public-key metadata only; no key bytes are returned.
    ClientKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ClientKey"
    AgentList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    AppID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `app_` prefix. Treat the body as opaque.
    TenantID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `tnt_` prefix. Treat the body as opaque.
    SessionID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `sess_` prefix. Treat the body as opaque.
    SessionCompactionID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `comp_` prefix. Treat the body as opaque.
    SessionMessageID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `msg_` prefix. Treat the body as opaque.
    InvocationID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `inv_` prefix. Treat the body as opaque.
    TraceID:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: Lowercase W3C trace ID. Possession does not grant access.
    NudgeID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `nudge_` prefix. Treat the body as opaque.
    ProviderKeyID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `pkey_` prefix. Treat the body as opaque.
    CreditAllocationID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `alloc_` prefix. Treat the body as opaque.
    CredentialID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `cred_` prefix. Treat the body as opaque.
    ProviderKeyVersionID:
      type: string
      minLength: 1
      description: Opaque identifier with the public `ver_` prefix. Treat the body as opaque.
    ModelProvider:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: |
        Extensible canonical provider identifier. Consumers must preserve
        unknown values so adding a provider does not break decoding. Request
        positions still reject providers not registered by the installation.
    ModelPricing:
      type: object
      additionalProperties: false
      required: [status, pricing_version]
      description: |
        The list prices nvoken uses to estimate what a turn will cost. These
        are nvoken's own recorded prices, not a live quote from the provider.

        A `priced` entry carries the currency, unit, input and output rates,
        and when it was last updated. `unpriced` and `unknown` carry only the
        status and a version string. Treat that version as opaque — compare
        two versions for equality to detect a change, but do not try to order
        or parse them.
      properties:
        status:
          type: string
          enum: [priced, unpriced, unknown]
        currency:
          type: string
          enum: [USD]
        unit:
          type: string
          enum: [per_million_tokens]
        input:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        output:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        cache_read:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        cache_write:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        updated_at:
          type: string
          format: date
        pricing_version:
          type: string
          minLength: 1
          description: |
            Opaque nvoken-owned identifier for the local pricing snapshot.
            Values never encode an upstream dependency name or version.
    ModelDescriptor:
      type: object
      additionalProperties: false
      required: [provider, id, cataloged, pricing]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        id:
          type: string
          minLength: 1
          maxLength: 255
        cataloged:
          type: boolean
          description: Whether nvoken advertises and maintains metadata for this selection.
        display_name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        context_window_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_modalities:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
          description: |
            The kinds of input this model accepts. For images and documents, the
            exact media types are listed under `controls.input.media`.
        recommended:
          type: boolean
          description: nvoken's suggested general-purpose starting point for this provider.
        deprecated:
          type: boolean
        deprecated_at:
          type: string
          format: date
          description: Date nvoken marked this model deprecated.
        retires_at:
          type: string
          format: date
          description: The date nvoken stops accepting new turns on this model.
        replacement:
          $ref: "#/components/schemas/Model"
        controls:
          $ref: "#/components/schemas/ModelControlCapabilities"
        pricing:
          $ref: "#/components/schemas/ModelPricing"
      description: |
        What nvoken knows about one model.

        For a model in nvoken's catalog you get the full picture, including the
        capability details under `controls` — the same ones nvoken checks when
        deciding whether to accept a turn. For a model not in the catalog you
        get only `provider`, `id`, `cataloged`, and `pricing`. Missing
        information there means unknown, not "unsupported" or "zero" — so treat
        an absent capability as "nvoken cannot tell", not as false.

        A deprecated model keeps working until its `retires_at` date.
    ModelControlCapabilities:
      type: object
      additionalProperties: false
      required: [sampling, reasoning, tools, input]
      properties:
        sampling:
          $ref: "#/components/schemas/ModelSamplingCapabilities"
        reasoning:
          $ref: "#/components/schemas/ModelReasoningCapabilities"
        tools:
          $ref: "#/components/schemas/ModelToolCapabilities"
        input:
          $ref: "#/components/schemas/ModelInputCapabilities"
    ModelSamplingCapabilities:
      type: object
      additionalProperties: false
      required: [temperature]
      properties:
        temperature:
          type: boolean
          description: Whether nvoken can guarantee an explicit temperature reaches this exact model path.
    ModelReasoningCapabilities:
      type: object
      additionalProperties: false
      required: [effort, budget_tokens, effort_budget_compatible]
      properties:
        effort:
          $ref: "#/components/schemas/ModelReasoningEffortCapabilities"
        budget_tokens:
          $ref: "#/components/schemas/ModelReasoningBudgetCapabilities"
        effort_budget_compatible:
          type: boolean
    ModelReasoningEffortCapabilities:
      type: object
      additionalProperties: false
      required: [supported, values, with_temperature]
      properties:
        supported:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/ReasoningEffort"
        with_temperature:
          type: boolean
    ModelReasoningBudgetCapabilities:
      type: object
      additionalProperties: false
      required: [supported, with_temperature]
      properties:
        supported:
          type: boolean
        with_temperature:
          type: boolean
        minimum:
          type: integer
          minimum: 1024
        maximum:
          type: integer
          minimum: 1024
    ModelToolCapabilities:
      type: object
      additionalProperties: false
      required: [choice, web_search]
      properties:
        choice:
          $ref: "#/components/schemas/ModelToolChoiceCapabilities"
        web_search:
          type: boolean
          description: |
            Whether this model can run the provider's own web search. If it reports
            false, asking for `provider_tools` is refused rather than silently
            ignored — and a model missing from nvoken's catalog reports nothing, so
            it is refused too.
    ModelToolChoiceMode:
      type: string
      enum: [auto, none, required, named]
      x-enum-varnames: [ChoiceAuto, ChoiceNone, ChoiceRequired, ChoiceNamed]
    ModelToolChoiceCapabilities:
      type: object
      additionalProperties: false
      required: [modes, with_reasoning]
      properties:
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ModelToolChoiceMode"
        with_reasoning:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ModelToolChoiceMode"
          description: Modes that remain exact when explicit reasoning is active.
    ModelInputCapabilities:
      type: object
      additionalProperties: false
      required: [media]
      properties:
        media:
          $ref: "#/components/schemas/ModelMediaCapabilities"
    ModelMediaCapabilities:
      type: object
      additionalProperties: false
      required: [image, document]
      properties:
        image:
          $ref: "#/components/schemas/ModelMediaKindCapabilities"
        document:
          $ref: "#/components/schemas/ModelMediaKindCapabilities"
    ModelMediaKindCapabilities:
      type: object
      additionalProperties: false
      required: [supported, media_types]
      properties:
        supported:
          type: boolean
        media_types:
          type: array
          uniqueItems: true
          items:
            type: string
          description: |
            The exact media types this model accepts. An empty list means it does
            not accept this kind of input at all.
    ModelList:
      type: object
      additionalProperties: false
      required: [items, catalog_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelDescriptor"
        catalog_version:
          type: string
          minLength: 1
          description: Opaque version of the complete unfiltered catalog and pricing snapshot.
    ProviderKeyScope:
      type: string
      enum: [app, tenant]
      description: |
        `app` is one provider key shared by every tenant of one app;
        `tenant` is one provider key for a single named
        tenant_key inside the app.
    CreateInvocationRequest:
      type: object
      additionalProperties: false
      required: [agent_key, idempotency_key, input]
      description: |
        Carries exactly one Agent Definition form. Use `agent_definition` for
        an inline definition owned by this Invocation, or
        `agent_definition_id` to reuse an App-owned resource. Admission always
        pins immutable definition bytes; later resource updates affect only
        future Invocations.
      oneOf:
        - required: [agent_definition]
          not:
            required: [agent_definition_id]
        - required: [agent_definition_id]
          not:
            required: [agent_definition]
      allOf:
        - not:
            required: [session_id, session_key]
      properties:
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Stable caller-controlled Agent key, unique within the
            authenticated App. The resulting Agent anchor stores identity
            only and is shared across that App's tenant partitions.
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional tenant partition. For Session-key resolution or a new
            Session, precedence is credential constraint, this explicit value,
            then the default partition. For Session-ID resolution, an App
            credential without a tenant constraint may omit it and use the
            stored partition.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional host-owned end-user label recorded on this Invocation and
            its input message. The Session retains the label from the request
            that opened it, while later turns may identify different end users.
            Filtering only; not an isolation boundary.
        session_id:
          $ref: "#/components/schemas/SessionID"
          description: Existing Session to continue. Mutually exclusive with session_key.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Caller key resolved within (effective tenant partition,
            Agent, session_key). Mutually exclusive with session_id.
        session_options:
          $ref: "#/components/schemas/SessionOptions"
          description: |
            Settings stored on the Session itself, rather than on this turn.

            On a new Session these are saved. On a Session that already exists they
            are checked rather than applied: matching values are fine, and a
            different value returns `session_options_conflict` telling you which
            paths disagreed. This keeps two callers from silently reconfiguring
            each other's conversation.

            Compaction is the exception — if no compaction policy is stored yet,
            this turn can install one, because the policy needs a model to validate
            against and only a turn supplies that.
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: |
            Your own data to attach to this turn — a ticket number, a trace
            ID, whatever helps you tie it back to your system. nvoken stores
            it and hands it back untouched.

            It is fixed once the turn is created and counts as part of the
            request for idempotency. Retrying with the same `idempotency_key`
            but different metadata is treated as a different request and
            returns a conflict rather than updating it. A genuine retry of the
            same original request carries the same values anyway.

            Session metadata is a separate thing and can be changed — see
            `session_options.metadata` and `PATCH /v1/sessions/{session_id}`.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Your key for making retries safe. Send the same unchanged request
            again after a 5xx, a timeout, a dropped connection, or any case
            where you never saw the response, and you get the original turn
            back instead of starting a second one.

            Keys are scoped to the tenant and `agent_key`, so the same key
            under a different tenant is a different request. Deduplication
            lasts as long as the original turn still exists.
        if_active:
          type: string
          enum: [reject, supersede, interrupt]
          default: reject
          description: |
            What to do when the Session already has a turn running. A Session
            runs one turn at a time.

            - `reject` (the default) refuses this request with
              `session_invocation_active` and leaves the running turn alone.
            - `supersede` cancels the running turn and starts this one in its
              place. The cancelled turn's work is discarded and does not carry
              forward — "discard and redo".
            - `interrupt` asks the running turn to stop cleanly and starts
              this one only once it has, so this turn builds on what the
              stopped one produced — "stop and redo".

            Omitting the field and sending `reject` are the same request for
            idempotency purposes.
        on_budget_exhausted:
          type: string
          enum: [stop, pause]
          default: stop
          description: |
            What to do when the turn runs out of one of its spending limits.
            `stop` ends it as `incomplete`. `pause` leaves it as `paused` so
            you can raise the limit and continue it.

            Covers the iteration, output-token, per-turn cost, and Session
            cost limits. Deadlines are not covered — a turn that runs out of
            time always ends and can never be resumed.
        context:
          type: array
          maxItems: 8
          x-nvoken-max-total-utf8-bytes: 16384
          items:
            $ref: "#/components/schemas/InvocationContextItem"
          description: |
            Ordered application-owned state snapshots to record before this
            turn's input. Send a name again to supersede its prior value. An
            unchanged latest value is deduplicated from the transcript, while
            this exact pre-deduplication payload remains part of the Invocation
            and of idempotency comparison.

            A Session may observe at most 16 distinct names over its lifetime.
            Names are stored and shown to the model with the reserved `app-`
            prefix, which callers must omit here. Context is not part of the
            Agent Definition and never advances its revision.
        input:
          $ref: "#/components/schemas/InvocationInput"
        webhook:
          $ref: "#/components/schemas/WebhookTarget"
        agent_definition_id:
          $ref: "#/components/schemas/AgentDefinitionID"
          description: |
            Stable resource ID to resolve for this turn. IDs from another App,
            or IDs that do not exist, return `agent_definition_not_found`.
            Idempotent replay compares this stable ID and returns the original
            admitted revision even when the resource has advanced.
        agent_definition:
          $ref: "#/components/schemas/AgentDefinitionWrite"
          description: |
            Full definition for this turn. nvoken records an immutable snapshot
            and returns its generated `agent_definition_id` and revision on the
            Invocation. Mutually exclusive with `agent_definition_id`.
        mcp_server_headers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServerHeaders"
          description: |
            Per-Invocation secret headers keyed to MCP server names in the
            selected Agent Definition. Encrypted for this turn and never stored
            in, hashed into, or returned with the Agent Definition.
        provider_keys:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ProviderKeySelection"
          description: |
            Which key pays for the model on this turn. Names a source; never
            contains a secret.

            Leave it out and nvoken works down its default order: your app's stored
            key for that provider, then a self-hosted installation's environment
            key (`config_byok`), then platform funding if the installation allows
            it.

            Whichever source is chosen is fixed when the turn starts. A turn never
            silently falls through to a different payer partway through, so the
            bill cannot move once work has begun.
    InvocationContextItem:
      type: object
      additionalProperties: false
      required: [name, tier, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*$"
          description: Stable caller-owned name without the reserved `app-` prefix.
        tier:
          type: string
          enum: [contextual, operator]
          description: |
            `contextual` is ordinary conversation context. `operator` is
            higher-authority application state; Dive maps the typed tier to
            each provider's native role.
        content:
          type: string
          minLength: 1
          x-nvoken-max-utf8-bytes: 8192
          description: Non-empty UTF-8 snapshot text, at most 8 KiB.
    SeedMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          $ref: "#/components/schemas/SeedMessageContent"
    SeedMessageContent:
      description: |
        Text-only canonical history. A string is shorthand for one text block;
        both forms normalize to the same stored content-block array.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/TextInputBlock"
    ForkSessionRequest:
      type: object
      additionalProperties: false
      required: [from_message]
      properties:
        from_message:
          oneOf:
            - $ref: "#/components/schemas/SessionMessageID"
            - type: integer
              format: int64
              minimum: 1
          description: Inclusive fork point, by stable message ID or sequence.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional tenant/Agent-scoped keyed identity for the child.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional opened-by label for the child Session.
        session_options:
          $ref: "#/components/schemas/ForkSessionOptions"
    ForkSessionOptions:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        retention:
          $ref: "#/components/schemas/RetentionPolicy"
        metadata:
          $ref: "#/components/schemas/Metadata"
      description: |
        Creation-only options for a forked child. The child never inherits the
        source Session's compaction policy, retention, or metadata.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        session_key: [agent_key]
        seed_messages: [agent_key]
      properties:
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Your own name for the agent, handled exactly as it is when starting a
            turn: nvoken finds the matching Agent or creates one. Leave it out and
            the Session starts with no Agent — `agent_id` stays null until the
            first turn binds it.
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional tenant partition. Precedence is credential constraint,
            this explicit value, then the default partition.
        user_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional host-owned end-user label recorded on the Session.
            Filtering only; not an isolation boundary.
        session_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional caller key resolved within (effective tenant partition,
            Agent, session_key). Requires agent_key. Makes creation an
            upsert: an existing keyed Session is returned unchanged.
        session_options:
          $ref: "#/components/schemas/SessionOptions"
        seed_messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SeedMessage"
          description: |
            Host-asserted starting history, accepted only while a new Session
            is created. Requires `agent_key`. A keyed request that resolves an
            existing Session returns it unchanged and never appends these
            messages. The UTF-8 text across the array may total at most 524288
            bytes.
    WebhookTarget:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        Optional endpoint nvoken posts a signed webhook to when this
        Invocation parks awaiting host tool results or reaches a terminal
        status. It is delivery configuration rather than model input, so it is
        excluded from the reusable Agent Definition. Two otherwise identical
        turns that differ only in endpoint therefore share one Agent Definition.

        Delivery is at least once and ordered within one Invocation, and the
        webhook ID is repeated in `Idempotency-Key` on every attempt. nvoken
        webhooks are thin: identifiers and status only, the API stays the read
        authority. A webhook never changes, delays, or fails the Invocation it
        describes.

        The endpoint is part of the request, so replaying an idempotency key
        with a changed endpoint or event set is a conflict rather than a
        silent adoption of either value. An App without a webhook-purpose
        signing key rejects this field instead of accepting it and never
        delivering it.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Absolute HTTPS endpoint with no userinfo and no fragment. Private,
            loopback, and link-local destinations are refused by the same
            guarded public egress the callback transport uses.
        events:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
          description: |
            Events to deliver. Omission selects every event, because the
            harmful default is the one that quietly drops
            `invocation.waiting` and leaves a parked tool loop with nobody
            listening. Order does not affect replay comparison.
    WebhookEvent:
      type: string
      enum: [invocation.waiting, invocation.paused, invocation.ended]
      x-enum-varnames: [WebhookEventWaiting, WebhookEventPaused, WebhookEventEnded]
      description: |
        `invocation.waiting` fires when a turn stops and needs you to run at
        least one tool. A turn waiting only on callback tools sends nothing,
        because nvoken delivers those to your endpoint itself and there is
        nothing for you to do.

        `invocation.paused` fires when a spending limit you opted into stopped
        the turn, and carries the `stop_reason` naming the limit.

        `invocation.ended` fires exactly once, when the turn reaches
        `completed`, `incomplete`, `failed`, or `cancelled`. Completed and
        incomplete payloads carry `stop_reason` alongside `failure_code`.
    ProviderKeySelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [provider, source, key]
          properties:
            provider:
              $ref: "#/components/schemas/ModelProvider"
            source:
              type: string
              enum: [caller_ephemeral]
              x-enum-varnames: [SourceCallerEphemeral]
            key:
              $ref: "#/components/schemas/ProviderStaticKey"
        - type: object
          additionalProperties: false
          required: [provider, source]
          properties:
            provider:
              $ref: "#/components/schemas/ModelProvider"
            source:
              type: string
              enum: [app_byok, tenant_byok, platform]
      description: |
        Exactly one selection matching the canonical model provider. Omitting
        `provider_keys` entirely resolves the default chain instead:
        the app's stored key when one exists, else the self-hosted
        installation's environment key (config_byok), else platform funding
        when the installation enables it.
    AllocateCreditsRequest:
      type: object
      additionalProperties: false
      required: [amount, idempotency_key]
      properties:
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        default_tenant:
          type: boolean
          default: false
        amount:
          $ref: "#/components/schemas/Money"
        reference:
          type: string
          minLength: 1
          maxLength: 255
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      description: |
        Select exactly one account with `tenant_key` or
        `default_tenant: true`. Amount must be positive USD with exactly six
        fractional digits. The optional reference is host-owned correlation
        text, not payment-provider state.
    CreditAccount:
      type: object
      additionalProperties: false
      required: [tenant_key, allocated, used, held, available, paused_invocations, created_at, updated_at]
      properties:
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Null identifies the App's default tenant.
        allocated:
          $ref: "#/components/schemas/Money"
        used:
          $ref: "#/components/schemas/Money"
        held:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
          description: max(0, allocated - used - held).
        paused_invocations:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: |
        One tenant's persistent, non-expiring spending capacity. These exact
        USD counters are enforcement facts, not an invoice or payment record.
        Deleting runtime transcripts never restores used credits.
    CreditAllocation:
      type: object
      additionalProperties: false
      required: [id, tenant_key, amount, reference, created_by, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CreditAllocationID"
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Null identifies the App's default tenant.
        amount:
          $ref: "#/components/schemas/Money"
        reference:
          oneOf:
            - type: string
            - type: "null"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      description: |
        One append-only addition to a tenant's credit account. Allocations are
        never rewritten or deleted by this API.
    AllocateCreditsResult:
      type: object
      additionalProperties: false
      required: [allocation, account]
      properties:
        allocation:
          $ref: "#/components/schemas/CreditAllocation"
        account:
          $ref: "#/components/schemas/CreditAccount"
    CreditAccountList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CreditAccount" }
        next_cursor:
          type: [string, "null"]
    CreditAllocationList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CreditAllocation" }
        next_cursor:
          type: [string, "null"]
    CreditBlock:
      type: object
      additionalProperties: false
      required: [tenant_key]
      properties:
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Account that could not fund the next provider attempt; null means the App's default tenant.
    ProviderStaticKey:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: Encrypted before persistence and never returned.
    CreateProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [provider, scope, key, idempotency_key]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required for tenant scope and forbidden for app scope.
        key:
          $ref: "#/components/schemas/ProviderStaticKey"
        expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    RotateProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [key, idempotency_key]
      properties:
        key:
          $ref: "#/components/schemas/ProviderStaticKey"
        expires_at:
          type: string
          format: date-time
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 0
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    ProviderKey:
      type: object
      additionalProperties: false
      required: [id, provider, scope, tenant_key, status, version, version_id, previous_version_id, version_status, expires_at, overlap_expires_at, created_by, created_at, updated_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum: [active, revoked]
          description: Active roots remain rotatable and revocable even when their current version has expired.
        version:
          type: integer
          minimum: 1
        version_id:
          $ref: "#/components/schemas/ProviderKeyVersionID"
        previous_version_id:
          oneOf:
            - $ref: "#/components/schemas/ProviderKeyVersionID"
            - type: "null"
        version_status:
          type: string
          enum: [active, overlap, expired, revoked]
          description: |
            An expired version cannot be used. Rotate the key before any new turn
            or model call can use it.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        overlap_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      description: Safe metadata only; secret material is never represented.
    ProviderKeyList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderKey"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    ProviderKeyUsage:
      type: object
      additionalProperties: false
      required: [id, provider, scope, invocations, last_used_at, usage]
      properties:
        id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        scope:
          $ref: "#/components/schemas/ProviderKeyScope"
        invocations:
          type: integer
          minimum: 0
          description: How many turns used this provider key.
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Latest durable model checkpoint under any bound Invocation, null before the first model call.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: Summed checkpoint usage, null before the first model call.
    UsageInterval:
      type: string
      enum: [day, week, month]
    ModelCallKind:
      type: string
      enum: [generation, compaction, direct]
    ModelCallFactStatus:
      type: string
      enum: [prepared, started, settled, not_started, uncertain]
    ProviderKeySource:
      type: string
      enum: [caller_ephemeral, app_byok, tenant_byok, platform, config_byok]
    AuthenticationMethod:
      type: string
      enum: [api_key, issuer_token, client_token, unknown]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{6}$'
          description: Exact decimal amount with six fractional digits.
        currency:
          type: string
          const: USD
    ActivityMetrics:
      type: object
      additionalProperties: false
      required: [invocations, completed_invocations, incomplete_invocations, failed_invocations, cancelled_invocations, open_invocations, active_users, unattributed_invocations, active_tenants, active_agents]
      properties:
        invocations: { type: integer, minimum: 0 }
        completed_invocations: { type: integer, minimum: 0 }
        incomplete_invocations: { type: integer, minimum: 0 }
        failed_invocations: { type: integer, minimum: 0 }
        cancelled_invocations: { type: integer, minimum: 0 }
        open_invocations: { type: integer, minimum: 0 }
        active_users: { type: integer, minimum: 0, description: Exact distinct non-null user identities over this row's window. }
        unattributed_invocations: { type: integer, minimum: 0 }
        active_tenants: { type: integer, minimum: 0 }
        active_agents: { type: integer, minimum: 0 }
    ModelMetrics:
      type: object
      additionalProperties: false
      required: [model_calls, reported_model_calls, failed_model_calls, runtime_steps, generation_calls, compaction_calls, direct_calls, input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens, reasoning_tokens]
      properties:
        model_calls: { type: integer, minimum: 0 }
        reported_model_calls: { type: integer, minimum: 0 }
        failed_model_calls: { type: integer, minimum: 0 }
        runtime_steps: { type: integer, minimum: 0, description: Model results durably committed to an Invocation transcript. }
        generation_calls: { type: integer, minimum: 0 }
        compaction_calls: { type: integer, minimum: 0 }
        direct_calls: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cache_creation_input_tokens: { type: integer, minimum: 0 }
        cache_read_input_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }
    ToolMetrics:
      type: object
      additionalProperties: false
      required: [tool_calls, completed_tool_calls, failed_tool_calls, cancelled_tool_calls]
      properties:
        tool_calls: { type: integer, minimum: 0 }
        completed_tool_calls: { type: integer, minimum: 0 }
        failed_tool_calls: { type: integer, minimum: 0 }
        cancelled_tool_calls: { type: integer, minimum: 0 }
    CostMetrics:
      type: object
      additionalProperties: false
      required: [model_cost, cost_coverage, priced_model_calls, unpriced_model_calls, uncertain_model_calls, unbounded_uncertain_model_calls, max_cost_at_risk]
      properties:
        model_cost: { $ref: "#/components/schemas/Money" }
        cost_coverage: { type: string, enum: [complete, partial, none, not_applicable] }
        priced_model_calls: { type: integer, minimum: 0 }
        unpriced_model_calls: { type: integer, minimum: 0 }
        uncertain_model_calls: { type: integer, minimum: 0 }
        unbounded_uncertain_model_calls: { type: integer, minimum: 0 }
        max_cost_at_risk: { $ref: "#/components/schemas/Money" }
    UsageMetrics:
      type: object
      additionalProperties: false
      required: [activity, model, tools, cost]
      properties:
        activity: { $ref: "#/components/schemas/ActivityMetrics" }
        model: { $ref: "#/components/schemas/ModelMetrics" }
        tools: { $ref: "#/components/schemas/ToolMetrics" }
        cost: { $ref: "#/components/schemas/CostMetrics" }
    UsageTimeseriesBucket:
      type: object
      additionalProperties: false
      required: [start_at, end_at, metrics]
      properties:
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        series_key: { type: string }
        metrics: { $ref: "#/components/schemas/UsageMetrics" }
    UsageTimeseries:
      type: object
      additionalProperties: false
      required: [start_at, end_at, interval, timezone, totals, buckets]
      properties:
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        interval: { $ref: "#/components/schemas/UsageInterval" }
        timezone: { type: string }
        group_by: { type: string, enum: [tenant_key, agent_id, model, tool_name, authentication_method] }
        totals: { $ref: "#/components/schemas/UsageMetrics" }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/UsageTimeseriesBucket" }
    UsageBreakdownItem:
      type: object
      additionalProperties: false
      required: [key, metrics]
      properties:
        key: { type: string }
        metrics: { $ref: "#/components/schemas/UsageMetrics" }
    UsageBreakdown:
      type: object
      additionalProperties: false
      required: [start_at, end_at, group_by, sort, totals, items, next_cursor]
      properties:
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        group_by: { type: string }
        sort: { type: string }
        totals: { $ref: "#/components/schemas/UsageMetrics" }
        items:
          type: array
          items: { $ref: "#/components/schemas/UsageBreakdownItem" }
        next_cursor: { type: [string, "null"] }
    ModelCallRecord:
      type: object
      additionalProperties: false
      required: [id, invocation_id, session_id, app_id, tenant_key, user_key, agent_id, credential_family_id, authentication_method, provider_key_source, provider_key_id, provider_key_version_id, call_kind, call_ordinal, lease_attempt, provider_attempt_ordinal, requested_provider, requested_model, served_provider, served_model, status, outcome, failure_class, input_tokens, output_tokens, cache_creation_input_tokens, cache_read_input_tokens, reasoning_tokens, model_cost, cost_coverage, max_cost_at_risk, pricing_version, created_at, started_at, first_output_at, settled_at]
      properties:
        id: { type: string, description: Opaque model-call fact ID with the mcall_ prefix. }
        invocation_id: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        app_id: { $ref: "#/components/schemas/AppID" }
        tenant_key: { type: [string, "null"] }
        user_key: { type: [string, "null"], description: Null after user erasure. }
        agent_id: { type: [string, "null"] }
        credential_family_id: { type: [string, "null"] }
        authentication_method:
          oneOf:
            - $ref: "#/components/schemas/AuthenticationMethod"
            - type: "null"
        provider_key_source: { $ref: "#/components/schemas/ProviderKeySource" }
        provider_key_id: { type: [string, "null"] }
        provider_key_version_id: { type: [string, "null"] }
        call_kind: { $ref: "#/components/schemas/ModelCallKind" }
        call_ordinal: { type: integer, minimum: 1 }
        lease_attempt: { type: integer, minimum: 1 }
        provider_attempt_ordinal: { type: integer, minimum: 1 }
        requested_provider: { type: string }
        requested_model: { type: string }
        served_provider: { type: [string, "null"] }
        served_model: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ModelCallFactStatus" }
        outcome: { type: [string, "null"], enum: [succeeded, failed, cancelled, null] }
        failure_class: { type: [string, "null"] }
        input_tokens: { type: [integer, "null"], minimum: 0 }
        output_tokens: { type: [integer, "null"], minimum: 0 }
        cache_creation_input_tokens: { type: [integer, "null"], minimum: 0 }
        cache_read_input_tokens: { type: [integer, "null"], minimum: 0 }
        reasoning_tokens: { type: [integer, "null"], minimum: 0 }
        model_cost:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        cost_coverage: { type: string, enum: [complete, none, not_applicable] }
        max_cost_at_risk:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        pricing_version: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        first_output_at: { type: [string, "null"], format: date-time }
        settled_at: { type: [string, "null"], format: date-time }
    UsageRecords:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModelCallRecord" }
        next_cursor: { type: [string, "null"] }
    InvocationTimelineStep:
      type: object
      additionalProperties: false
      required: [kind, id, detail_id, status, started_at]
      properties:
        kind: { type: string, enum: [lifecycle, model_call, tool_call, nudge] }
        id: { type: string }
        detail_id: { type: string }
        name: { type: string }
        mode: { type: string }
        call_kind: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        first_output_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        time_to_first_output_ms: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cache_creation_input_tokens: { type: integer, minimum: 0 }
        cache_read_input_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }
        model_cost: { $ref: "#/components/schemas/Money" }
    InvocationTimeline:
      type: object
      additionalProperties: false
      required: [invocation_id, session_id, app_id, tenant_key, user_key, agent_id, accepted_at, ended_at, status, stop_reason, failure_code, attempt_count, active_execution_ms, waiting_execution_ms, erased_at, steps]
      properties:
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        session_id: { $ref: "#/components/schemas/SessionID" }
        app_id: { $ref: "#/components/schemas/AppID" }
        tenant_key: { type: [string, "null"] }
        user_key: { type: [string, "null"] }
        agent_id: { $ref: "#/components/schemas/AgentID" }
        accepted_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        status: { type: [string, "null"] }
        stop_reason: { type: [string, "null"] }
        failure_code: { type: [string, "null"] }
        attempt_count: { type: integer, minimum: 0 }
        active_execution_ms: { type: integer, minimum: 0 }
        waiting_execution_ms: { type: integer, minimum: 0 }
        erased_at: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/InvocationTimelineStep" }
    ObservationStatus:
      type: string
      enum: [available, disabled]
      description: Whether this installation has a hosted observation store.
    TraceSummary:
      type: object
      additionalProperties: false
      required: [trace_id, root_span_id, name, status, started_at, span_count, error_count, is_partial]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceID" }
        root_span_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
        name: { type: string }
        status: { type: string, enum: [unset, ok, error] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        span_count: { type: integer, minimum: 1 }
        error_count: { type: integer, minimum: 0 }
        is_partial:
          type: boolean
          description: |
            True when the agent root has not arrived or the bounded trace read
            omitted spans. Partial traces are useful live diagnostics and must
            not be interpreted as the complete execution record.
        attempt:
          type: integer
          minimum: 1
          description: Durable Invocation lease attempt associated with this trace.
    TraceList:
      type: object
      additionalProperties: false
      required: [status, items, next_cursor]
      properties:
        status: { $ref: "#/components/schemas/ObservationStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/TraceSummary" }
        next_cursor: { type: [string, "null"] }
    TraceSpan:
      type: object
      additionalProperties: false
      required: [trace_id, span_id, name, kind, status, started_at]
      properties:
        trace_id: { $ref: "#/components/schemas/TraceID" }
        span_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
        parent_span_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
        name: { type: string }
        kind:
          type: string
          description: OpenTelemetry span kind; known values include internal, client, server, producer, consumer, and unspecified.
        operation:
          type: string
          description: GenAI operation name. Dive currently emits invoke_agent, chat, and execute_tool.
        status: { type: string, enum: [unset, ok, error] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        provider: { type: string }
        request_model: { type: string }
        response_model: { type: string }
        tool_name: { type: string }
        error_type: { type: string }
        input_tokens:
          type: integer
          minimum: 0
          description: Provider-reported input tokens; cache fields may overlap this total.
        output_tokens:
          type: integer
          minimum: 0
          description: Provider-reported output tokens; reasoning tokens are a subset when reported.
        cache_creation_input_tokens:
          type: integer
          minimum: 0
          description: Input tokens used to create a provider cache entry; do not add blindly to input_tokens.
        cache_read_input_tokens:
          type: integer
          minimum: 0
          description: Input tokens served from provider cache; do not add blindly to input_tokens.
        reasoning_tokens:
          type: integer
          minimum: 0
          description: Reasoning tokens included within output_tokens when the provider reports them.
        finish_reasons:
          type: array
          maxItems: 8
          items: { type: string }
        time_to_first_token_ms:
          type: integer
          minimum: 0
          description: Time from model-call start to the first streamed output token.
        model_cost: { $ref: "#/components/schemas/Money" }
    InvocationLog:
      type: object
      additionalProperties: false
      required: [id, timestamp, severity, severity_number, message]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        severity: { type: string }
        severity_number: { type: integer, minimum: 0, maximum: 24 }
        message: { type: string }
        service_name: { type: string }
        trace_id: { $ref: "#/components/schemas/TraceID" }
        span_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
        event: { type: string }
        component: { type: string }
        outcome: { type: string }
        error_class: { type: string }
        request_id: { type: string }
        provider: { type: string }
        model: { type: string }
        tool_name: { type: string }
        status: { type: string }
        attempt: { type: integer, minimum: 1 }
        iteration: { type: integer, minimum: 1 }
        lease_attempt: { type: integer, minimum: 1 }
    InvocationLogList:
      type: object
      additionalProperties: false
      required: [status, items, next_cursor]
      properties:
        status: { $ref: "#/components/schemas/ObservationStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/InvocationLog" }
        next_cursor: { type: [string, "null"] }
    Trace:
      type: object
      additionalProperties: false
      required:
        - trace_id
        - root_span_id
        - name
        - status
        - started_at
        - span_count
        - error_count
        - is_partial
        - invocation_id
        - session_id
        - spans
      properties:
        trace_id: { $ref: "#/components/schemas/TraceID" }
        root_span_id:
          type: string
          pattern: "^[0-9a-f]{16}$"
        name: { type: string }
        status: { type: string, enum: [unset, ok, error] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        span_count: { type: integer, minimum: 1 }
        error_count: { type: integer, minimum: 0 }
        is_partial:
          type: boolean
          description: True when this response contains only a bounded or rootless partial trace.
        attempt:
          type: integer
          minimum: 1
          description: Durable Invocation lease attempt associated with this trace.
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        session_id: { $ref: "#/components/schemas/SessionID" }
        spans:
          type: array
          items: { $ref: "#/components/schemas/TraceSpan" }
    InvocationInput:
      description: |
        A plain string is shorthand for one text block; an array is ordered
        multi-block input mixing text, images, and documents. Both normalize
        to the same stored message and are therefore equal for idempotency.
        At most 8 blocks may carry media, and their decoded payloads must
        total at most 16777216 bytes.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/InputBlock"
    InputBlock:
      oneOf:
        - $ref: "#/components/schemas/TextInputBlock"
        - $ref: "#/components/schemas/ImageInputBlock"
        - $ref: "#/components/schemas/DocumentInputBlock"
      description: |
        One caller-input block. A block carries text, an image, or a document;
        the members of one type are never valid on another.
    TextInputBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          x-enum-varnames: [InputTypeText]
        text:
          type: string
          minLength: 1
    ImageInputBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          enum: [image]
          x-enum-varnames: [InputTypeImage]
        source:
          $ref: "#/components/schemas/ImageInputSource"
      description: |
        An image, sent inline or by URL. A URL is downloaded once as the turn
        is created; nvoken stores those bytes and never fetches the URL again,
        so the image stays stable even if the link later changes or breaks.
        The image must be at most 5 MB and 8000 by 8000 pixels, and the model
        you selected must support images and this exact media type. nvoken
        determines the real type from the bytes themselves rather than
        trusting the declared type or the file extension.
    ImageInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum: [image/gif, image/jpeg, image/png, image/webp]
          x-enum-varnames: [ImageGIF, ImageJPEG, ImagePNG, ImageWEBP]
        data:
          type: string
          minLength: 1
          maxLength: 6990508
          description: |
            Standard padded base64 with no whitespace. Mutually exclusive with
            url.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            A public HTTPS URL, downloaded once as the turn is created. nvoken
            stops reading if the response runs past the size limit, and
            determines the real media type from the bytes it received.
            `media_type` is optional here; if you do send it, it must match
            what the bytes actually are.
    DocumentInputBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          enum: [document]
          x-enum-varnames: [InputTypeDocument]
        source:
          $ref: "#/components/schemas/DocumentInputSource"
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional filename supplied to providers that require one. Omission
            uses the adapter default and does not change acceptance.
      description: |
        A document, sent inline or by URL. A URL is downloaded once as the
        turn is created; nvoken stores those bytes and never fetches the URL
        again. Same rules as an image, with a 16 MB limit. Page count is
        capped by the provider rather than by nvoken, so a document with too
        many pages fails the turn with `input_media_rejected`.
    DocumentInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum: [application/pdf]
          x-enum-varnames: [DocumentPDF]
        data:
          type: string
          minLength: 1
          maxLength: 22369624
          description: Standard padded base64 with no whitespace.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            A public HTTPS URL, downloaded once as the turn is created. nvoken
            stops reading if the response runs past the size limit, and
            determines the real media type from the bytes it received.
            `media_type` is optional here; if you do send it, it must be
            `application/pdf`.
    AgentDefinitionID:
      type: string
      minLength: 1
      description: Stable App-owned Agent Definition identifier with the public `def_` prefix. Treat the body as opaque.
    AgentDefinitionWrite:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        instructions:
          type: string
          minLength: 1
          description: Optional model instructions. Omission adds no hidden default.
        model:
          $ref: "#/components/schemas/ModelInput"
        sampling:
          $ref: "#/components/schemas/Sampling"
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        limits:
          $ref: "#/components/schemas/Limits"
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ToolDeclaration"
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServer"
          description: MCP server declarations for later Invocations. Secrets are never part of an Agent Definition.
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProviderTool"
        client_interface:
          $ref: "#/components/schemas/ClientInterface"
      description: |
        Complete writable Agent Definition fields. The model string shorthand
        is accepted on write. Identity, revision, and timestamps are read-only.
    AgentDefinition:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        instructions:
          type: string
          minLength: 1
          description: Optional model instructions. Omission adds no hidden default.
        model:
          $ref: "#/components/schemas/Model"
        sampling:
          $ref: "#/components/schemas/Sampling"
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        limits:
          $ref: "#/components/schemas/Limits"
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ToolDeclaration"
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServer"
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProviderTool"
        client_interface:
          $ref: "#/components/schemas/ClientInterface"
      description: |
        Immutable Agent Definition fields admitted by one Invocation. Detailed
        Invocation reads nest these fields under `agent_definition`; the stable
        resource ID and admitted revision remain top-level.
        Identity, session selection, input, idempotency, `if_active`, `webhook`,
        metadata, and provider key selection are durable elsewhere and
        never appear here. Invocation admission for callback declarations
        requires App callback-signing configuration. Remote MCP authentication
        headers are encrypted outside this Agent Definition and never returned.
        Tools or structured output require at least two model iterations;
        omission resolves to three or the lower installation maximum.
    ClientInterface:
      type: object
      additionalProperties: false
      properties:
        context_names:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z][a-z0-9-]*$"
          description: |
            Exact recorded-context names a future client-token principal may
            append or supersede. Every item is contextual tier; clients never
            author operator-tier context.
        tool_names:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Exact subset of this definition's declared host-mode tools whose
            parked calls a future client-token principal may see and settle.
      description: |
        One immutable definition-specific authorization object. Omission means
        the definition is not client-token-capable; an explicit empty object
        opts in with no client-authored context or tools. Each set is sorted
        before a revision snapshot is retained, so order alone cannot advance
        a resource revision.

        This object grants authorship and settlement only, never selective read
        visibility. All public transcript content in a browser-reachable
        Session, including operator-tier recorded context, must be treated as
        client-visible. No lifetime, host_only, wildcard, generic tool-policy,
        tier-switch, or disclosure field exists here. The object remains
        dormant until PRD 065.
    AgentDefinitionResource:
      type: object
      additionalProperties: false
      required: [id, revision, model, created_at, updated_at, archived_at]
      properties:
        id:
          $ref: "#/components/schemas/AgentDefinitionID"
        revision:
          type: integer
          format: int64
          minimum: 1
        instructions:
          type: string
          minLength: 1
        model:
          $ref: "#/components/schemas/Model"
        sampling:
          $ref: "#/components/schemas/Sampling"
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        limits:
          $ref: "#/components/schemas/Limits"
        output_schema:
          $ref: "#/components/schemas/OutputSchema"
        tools:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ToolDeclaration"
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MCPServer"
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProviderTool"
        created_at:
          type: string
          format: date-time
        client_interface:
          $ref: "#/components/schemas/ClientInterface"
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the resource was archived, or null while it is live. Invocation
            admission that resolves an archived Agent Definition, by id or by
            pinned revision, is refused with `409 agent_definition_archived`.
            The resource and every revision stay readable.
    AgentDefinitionResourceList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentDefinitionResource"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    Sampling:
      type: object
      additionalProperties: false
      required: [temperature]
      properties:
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Sampling temperature, expressed the same way across providers. Omit
            `sampling` entirely to keep the provider's own default; an explicit `0`
            means 0 and is not treated as absent.

            If the model is not known to support temperature, the turn is refused
            rather than run with the setting quietly dropped.
    ReasoningEffort:
      type: string
      enum: [low, medium, high, xhigh, max]
      x-enum-varnames: [EffortLow, EffortMedium, EffortHigh, EffortXHigh, EffortMax]
    Reasoning:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        effort:
          $ref: "#/components/schemas/ReasoningEffort"
        budget_tokens:
          type: integer
          minimum: 1024
          description: |
            Provider reasoning target, not a separate Invocation hard budget.
            Requires an explicit, larger limits.max_output_tokens and exact
            support in the selected model descriptor.
    ToolChoice:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/ModelToolChoiceMode"
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
      description: |
        Portable Invocation tool selection. auto preserves normal selection;
        none disables tools for the Invocation; required and named apply only
        to the first durable model iteration, then return to auto. name is
        required only for named mode. The final bounded iteration always
        disables tools.
    SessionOptions:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        compaction:
          $ref: "#/components/schemas/CompactionPolicy"
        retention:
          $ref: "#/components/schemas/RetentionPolicy"
        metadata:
          $ref: "#/components/schemas/Metadata"
      description: |
        Settings stored on the Session. Every field is optional, but send at
        least one.

        On a new Session these are saved. When you reach an existing Session,
        by ID or by key, they are checked rather than applied: matching values
        are accepted, and a different value returns `session_options_conflict`
        with `details.conflicting_paths` naming exactly what disagreed.
        Compaction needs a turn to install it, because the policy is validated
        against that turn's model.
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        metadata:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 512
              - type: "null"
          maxProperties: 16
          propertyNames:
            pattern: "^[A-Za-z0-9_.:-]+$"
            maxLength: 64
          description: |
            Metadata merge patch. A string value sets the key, `null` deletes
            it, and an absent key is left alone. Bounds are enforced on the
            merged result.
    Metadata:
      type: object
      additionalProperties:
        type: string
        maxLength: 512
      maxProperties: 16
      propertyNames:
        pattern: "^[A-Za-z0-9_.:-]+$"
        maxLength: 64
      description: |
        Opaque host correlation data. nvoken stores it, returns it verbatim,
        and never interprets it — it exists so a support engineer holding an
        Invocation id can get back to the board, ticket, or surface the turn
        came from, which nvoken deliberately knows nothing about.

        At most 16 entries. Keys are 1–64 bytes of letters, digits, `_`, `.`,
        `:`, and `-`; values are at most 512 bytes of UTF-8.

        There is no `title` field on a Session by design. A title is one of
        these entries (`{"title": "Refund policy"}`), which keeps nvoken from
        forming opinions about a string only the host renders.
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: |
            Idle window, from one hour to thirty days.
      description: |
        How long a Session can sit unused before nvoken deletes it. When the
        window passes, the Session and everything under it are erased, exactly
        as `DELETE /v1/sessions/{session_id}` would.

        The clock measures idle time, not age: it resets every time a turn
        starts and every time one finishes. A long-running turn can never
        expire out from under you.

        **Automatic expiry never cancels running work.** A Session holding a
        queued, running, or waiting Invocation is skipped and reconsidered on
        the next sweep. An explicit `DELETE` may still stop a running turn,
        because a person asked for it; a clock may not.

        Omitting retention retains the Session until it is deleted explicitly,
        which stays the default.
    CompactionPolicy:
      type: object
      additionalProperties: false
      required: [trigger_tokens]
      properties:
        trigger_tokens:
          oneOf:
            - type: integer
              minimum: 4096
              maximum: 1000000
            - type: string
              enum: [auto]
              x-enum-varnames: [Auto]
          description: |
            Estimated retained-context size that triggers compaction. The
            Session stores "auto" as an exact value materialized when the
            policy is installed to 60% of that Invocation's primary model
            context window, clamped to the
            supported integer range.
        model:
          $ref: "#/components/schemas/Model"
      description: |
        Durable Session context-compaction policy. Omission of model uses the
        installing Invocation's primary model. An explicit model must be
        cataloged and use the same provider. Later Invocations automatically
        use this resolved policy and the latest Session summary.
    ProviderTool:
      type: object
      additionalProperties: false
      required: [type, web_search]
      properties:
        type:
          type: string
          enum: [web_search]
          x-enum-varnames: [ProviderToolWebSearch]
        web_search:
          $ref: "#/components/schemas/WebSearchTool"
      description: |
        Turns on a tool the model provider runs itself, inside the model call —
        web search, for example.

        This behaves differently from your own tools in two ways: the turn
        never stops to wait for it, and nvoken never executes it. The provider
        does, and charges it to the same provider key the model is running on.

        That is deliberate. A search tool operated by nvoken would mean nvoken
        holding a vendor relationship with a search provider and answering "who
        pays per query" for every installation. Letting the provider run it
        keeps one key and one bill.
    WebSearchTool:
      type: object
      additionalProperties: false
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            Searches this turn may run. Omitted means the provider default.
            This is the only bound nvoken can place on search spend, because
            the provider does not report a per-search fee it can meter.
        allowed_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Restrict results to these hosts. Bare hostnames only — a scheme,
            path, or port is rejected rather than reinterpreted. Mutually
            exclusive with `blocked_domains`, which is the provider's rule.
        blocked_domains:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
          description: |
            Exclude these hosts. Same format as `allowed_domains`, and mutually
            exclusive with it.
        user_location:
          $ref: "#/components/schemas/WebSearchLocation"
      description: |
        Anthropic web search options, passed through as the provider defines
        them.
    WebSearchLocation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        city:
          type: string
          maxLength: 128
        region:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 128
        timezone:
          type: string
          maxLength: 128
      description: |
        Approximate location used to bias results. Every member is optional;
        the host decides how precise to be about its end user.
    MCPServer:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            A name for this MCP server, unique within the turn. Its tools are
            exposed to the model as `<name>__<tool>`, so this is the prefix your
            model will see. Names starting with `nvoken`, in any casing, are
            reserved.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: Public HTTPS streamable-HTTP MCP endpoint without userinfo or a fragment.
        transport:
          type: string
          enum: [streamable_http]
          x-enum-varnames: [TransportStreamableHTTP]
        allowed_tools:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: Optional ordered allowlist. Every named tool must be discovered and projectable.
        timeouts:
          $ref: "#/components/schemas/MCPTimeouts"
    MCPServerHeaders:
      type: object
      additionalProperties: false
      required: [name, headers]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: "^[A-Za-z0-9_-]+$"
          description: Exact name of one MCP server in the selected Agent Definition.
        headers:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: |
            Secret request headers, limited to 8 KiB encoded. Routing,
            framing, proxy, cookie, hop-by-hop, and MCP session headers are
            rejected. Headers are encrypted per Invocation and never returned.
    MCPTimeouts:
      type: object
      additionalProperties: false
      properties:
        discovery_seconds:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
        call_seconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
    MCPListToolsRequest:
      type: object
      additionalProperties: false
      required: [server]
      properties:
        server:
          $ref: "#/components/schemas/MCPServer"
        headers:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: Optional secret headers used only for this discovery request.
    MCPToolAnnotations:
      description: >-
        What the remote server said about a tool's behavior, plus whether it
        said anything at all. The declaration facts are reported separately
        from the values because a server that starts declaring a hint it
        previously omitted has changed the contract a reviewer approved, even
        when the effective value did not move.


        `read_only_hint` and `idempotent_hint` are non-null only when the
        server declared them true: the MCP schema types both as bare booleans
        with `omitempty`, so a declared false is indistinguishable from an
        absent one. `destructive_hint` and `open_world_hint` keep the full
        distinction. Treat a null `read_only_hint` as "potentially mutating",
        never as "read-only unknown but probably safe" — nvoken does.
      type: object
      additionalProperties: false
      required: [present, read_only_hint, idempotent_hint, destructive_hint, open_world_hint]
      properties:
        present:
          description: Whether the server sent an annotations object at all.
          type: boolean
        read_only_hint:
          type: [boolean, "null"]
        idempotent_hint:
          type: [boolean, "null"]
        destructive_hint:
          type: [boolean, "null"]
        open_world_hint:
          type: [boolean, "null"]
    MCPProjectedTool:
      type: object
      additionalProperties: false
      required: [server_name, projected_name, remote_name, description, input_schema, annotations]
      properties:
        server_name:
          type: string
        projected_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        remote_name:
          type: string
        title:
          description: >-
            The server's human-readable name for the tool, when it declares
            one. nvoken does not present it to the model; it is reported
            because it is part of the contract a host reviews.
          type: string
          maxLength: 4096
        description:
          type: string
          maxLength: 4096
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          description: >-
            The server's declared result shape, when it declares one. nvoken
            does not validate results against it.
          type: object
          additionalProperties: true
        annotations:
          $ref: "#/components/schemas/MCPToolAnnotations"
    MCPToolExclusion:
      type: object
      additionalProperties: false
      required: [server_name, remote_name, reason]
      properties:
        server_name:
          type: string
        remote_name:
          type: string
        reason:
          type: string
          enum: [not_allowlisted, invalid_name, name_collision, invalid_schema, schema_too_large, schema_too_deep]
    MCPListToolsResponse:
      type: object
      additionalProperties: false
      required: [tools, exclusions]
      properties:
        tools:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/MCPProjectedTool"
        exclusions:
          type: array
          items:
            $ref: "#/components/schemas/MCPToolExclusion"
    ToolDeclaration:
      oneOf:
        - $ref: "#/components/schemas/BuiltinToolDeclaration"
        - $ref: "#/components/schemas/HostToolDeclaration"
        - $ref: "#/components/schemas/CallbackToolDeclaration"
      discriminator:
        propertyName: mode
        mapping:
          builtin: "#/components/schemas/BuiltinToolDeclaration"
          host: "#/components/schemas/HostToolDeclaration"
          callback: "#/components/schemas/CallbackToolDeclaration"
    BuiltinToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name:
          type: string
          enum: [nvoken_fetch]
          x-enum-varnames: [NameNvokenFetch]
          description: Fixed runtime-owned public-web fetch capability.
        mode:
          type: string
          enum: [builtin]
          x-enum-varnames: [ModeBuiltin]
    HostToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, description, mode, input_schema]
      description: |
        A host tool is function calling: declared with JSON Schema and executed
        by the host application.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            The tool's name, unique within this agent definition. Names starting
            with `nvoken_` are reserved.

            Letters, digits, `_`, and `-` only. That is the strictest rule any
            supported provider imposes, so a name accepted here reaches every
            provider unchanged and your agent behaves the same wherever it runs.
            nvoken deliberately does not rewrite names to fit — a rewriting layer
            would own the collisions it creates, and would clash with the `__`
            separator used for MCP tool names.

            If your own permissions use dotted names, map them one-to-one
            (`naming.domain.check` becomes `naming_domain_check`) and tell the
            model about the mapping once in your instructions.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [host]
          x-enum-varnames: [ModeHost]
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
    CallbackToolDeclaration:
      type: object
      additionalProperties: false
      required: [name, description, mode, input_schema, callback]
      description: |
        A callback tool is a host tool nvoken delivers to the host's endpoint
        instead of waiting for the host to poll.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            The tool's name, unique within this agent definition. Names starting
            with `nvoken_` are reserved.

            Letters, digits, `_`, and `-` only. That is the strictest rule any
            supported provider imposes, so a name accepted here reaches every
            provider unchanged and your agent behaves the same wherever it runs.
            nvoken deliberately does not rewrite names to fit — a rewriting layer
            would own the collisions it creates, and would clash with the `__`
            separator used for MCP tool names.

            If your own permissions use dotted names, map them one-to-one
            (`naming.domain.check` becomes `naming_domain_check`) and tell the
            model about the mapping once in your instructions.
        description:
          type: string
          minLength: 1
          maxLength: 4096
        mode:
          type: string
          enum: [callback]
          x-enum-varnames: [ModeCallback]
        input_schema:
          type: object
          additionalProperties: true
          description: |
            Object-root JSON Schema using the same bounded, self-contained
            subset as structured output, including `uniqueItems`. Compact
            canonical JSON is limited to 32 KiB. A rejection carries
            `details.{code,path,keyword}` naming the offending schema position.
        callback:
          $ref: "#/components/schemas/CallbackTarget"
    CallbackTarget:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://"
          description: |
            Public HTTPS endpoint. Userinfo and fragments are rejected. Every
            dial revalidates resolved addresses and refuses redirects.
    OutputSchema:
      type: object
      additionalProperties: true
      description: |
        Self-contained JSON Schema for an object result. Compact canonical JSON
        is limited to 32 KiB and 16 schema positions. Supported keywords are
        type, title, description, properties, required, additionalProperties,
        items, enum, pattern, minLength, maxLength, minItems, maxItems,
        uniqueItems, minimum, and maximum. Every schema position has one string
        type; pattern values are limited to 1,024 UTF-8 bytes; references and
        other keywords are rejected. Numeric bounds are read as values, not
        spellings: 10, 10.0, and 1e1 are the same bound. When present, nvoken
        exposes a reserved durable submit tool and publishes only a
        server-validated terminal object. This does not enable host-defined
        tools.
    Limits:
      type: object
      additionalProperties: false
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          type: integer
          minimum: 1
          description: |
            Optional cumulative external-waiting SLA. When omitted, host and
            callback ToolCalls may remain pending indefinitely; waiting does
            not consume the Invocation's total or active execution budgets.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            A cost ceiling for this turn, in USD, estimated from list prices.
            It does not reserve funds and is not a bill.

            The model must have a known price. If it does not, the turn fails
            with `cost_estimate_unavailable` — and where nvoken can
            tell in advance, it refuses before calling the provider at all, so
            you are not charged for a turn it cannot police.

            Hitting the ceiling is not itself a failure. If the turn can stop
            cleanly it ends `incomplete` with
            `stop_reason: max_estimated_cost` and keeps everything it
            produced.
        max_iterations:
          type: integer
          minimum: 1
      description: |
        Optional requested limits. Total time bounds the entire turn, active
        time bounds model and tool execution, and waiting time bounds the
        cumulative time parked for host or callback tool results. Installation
        defaults supply all three time limits and the iteration limit.
        Output-token and estimated-cost limits are unlimited when omitted.
        Installation maxima may be lower than the schema's numeric range.
    ResumeInvocationRequest:
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits:
          $ref: "#/components/schemas/Limits"
      description: |
        Replacement for the one turn-level consumption ceiling named by the
        paused Invocation's stop_reason. Exactly that field must be present
        and must be raised above both the previous ceiling and usage so far.
    Model:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider:
          $ref: "#/components/schemas/ModelProvider"
        id:
          type: string
          minLength: 1
          maxLength: 255
    ModelInput:
      oneOf:
        - $ref: "#/components/schemas/Model"
        - type: string
          pattern: "^[^/]+/.+$"
          maxLength: 511
      description: |
        Which model to use. The object form — separate `provider` and `id` — is
        the real shape. You may also send a single `provider/id` string for
        convenience; nvoken splits it at the first slash and always returns the
        object form.
    InvocationStatus:
      type: string
      enum: [queued, running, waiting, paused, completed, incomplete, failed, cancelled]
      description: |
        `completed`, `incomplete`, `failed`, and `cancelled` are final. Once a
        turn reaches one of them it never changes again.

        `completed` means the turn ended the way it was asked to: the model
        finished on its own, or you interrupted it.

        `incomplete` means a limit you set stopped the turn cleanly, between
        steps rather than mid-request. `stop_reason` names the limit that ran
        out. The reply so far is valid and carries into the next turn just
        like a completed turn's does, so this is a stopping point rather than
        an error.

        `failed` means the turn could not stop cleanly — a deadline landing in
        the middle of a model request, for example — or that a turn you asked
        for structured output from never produced a valid object. Read `error`
        for the reason; the reply, if any, is not carried forward.

        `waiting` — `requires_action` in some other APIs — means the turn has
        stopped for tool calls you need to run. Nothing is executing. Send the
        results and the turn returns to `queued` and picks up where it left
        off. A turn can also return to `queued` on its own if nvoken had to
        restart it after an interruption; `attempt` tells the two apart, and
        the `revision` on each stream update tells you their order.

        `paused` means a spending limit stopped the turn but left it
        resumable. Nothing is executing, and its deadlines are on hold, so a
        turn cannot expire while you decide. Raise the turn's limit or add
        credits to the blocked tenant account and it continues. It still
        accepts interrupt, cancel, and nudge.
    InvocationStopReason:
      type: string
      enum: [end_turn, interrupted, max_iterations, deadline,
             max_output_tokens, max_estimated_cost, insufficient_credits]
      description: |
        Why a turn stopped. Set on turns that did not fail, and which values
        can appear depends on the status.

        A `completed` turn carries `end_turn` (the model finished on its own)
        or `interrupted` (you asked it to stop, and it stopped at the next
        clean point). An `incomplete` turn carries whichever limit ran out:
        `max_iterations`, `deadline`, `max_output_tokens`, or
        `max_estimated_cost`. A `paused` turn carries `max_estimated_cost` or
        `insufficient_credits`, never `deadline`, because a paused turn's
        deadlines are on hold.

        An interrupt is deliberately `completed` rather than `incomplete`: you
        asked the turn to end there, so ending there is the result you wanted,
        not a shortfall.

        Expect new values here over time.
    Invocation:
      type: object
      additionalProperties: false
      required: [id, agent_id, session_id, user_key, agent_definition_id, agent_definition_revision, agent_definition, context, status, stop_reason, credit_block,
                 attempt, error, usage,
                 provenance, structured_output, structured_output_provenance,
                 metadata, limits, active_execution_ms, deadline_at,
                 created_at, updated_at, ended_at]
      properties:
        id:
          $ref: "#/components/schemas/InvocationID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Your own label for the end user this turn belongs to. Useful for
            filtering lists. It is not a security boundary — no request is
            ever refused because of it, so do not rely on it to keep one
            user's data away from another.
        agent_definition_id:
          $ref: "#/components/schemas/AgentDefinitionID"
        agent_definition_revision:
          type: integer
          format: int64
          minimum: 1
          description: Immutable Agent Definition revision admitted for this turn.
        agent_definition:
          oneOf:
            - $ref: "#/components/schemas/AgentDefinition"
            - type: "null"
          description: |
            The agent definition this turn actually ran with, stored when the turn
            started and returned exactly as it was. Request headers for remote MCP
            servers are never stored and never appear here.

            Present on `GET /v1/invocations/{id}` and on the result. Null in list
            items, where `agent_definition_id` and `agent_definition_revision`
            identify it instead.
        context:
          oneOf:
            - type: array
              maxItems: 8
              items:
                $ref: "#/components/schemas/InvocationContextItem"
            - type: "null"
          description: |
            The ordered context payload accepted with this turn, before
            transcript deduplication. Null when omitted and in Invocation list
            items. Present on admission, point reads, results, and stream
            Invocation projections. Context is immutable and order-sensitive
            for idempotency.
        deduplicated:
          type: boolean
          description: |
            Only present on the `POST /v1/invocations` response. False when this
            call created a new turn, true when your idempotency key matched one
            that already existed and you got that one back.
        status:
          $ref: "#/components/schemas/InvocationStatus"
        stop_reason:
          oneOf:
            - $ref: "#/components/schemas/InvocationStopReason"
            - type: "null"
          description: |
            Why the turn stopped or paused. Present on `completed`,
            `incomplete`, and `paused`; null on every other status — a failure
            keeps `error` as the authority. Treat an unrecognized value as an
            ordinary end.
        credit_block:
          oneOf:
            - $ref: "#/components/schemas/CreditBlock"
            - type: "null"
          description: Tenant credit account for an insufficient-credits stop, otherwise null.
        attempt:
          type: integer
          minimum: 0
          description: |
            Execution attempts this Invocation has been claimed for. It
            increases on every claim, so an attempt increase across a
            `running → queued → running` transition is the retry signal that
            status alone cannot give, and it is the durable anchor for
            discarding provisional output from an earlier attempt. Zero
            before the first claim.
        error:
          oneOf:
            - $ref: "#/components/schemas/InvocationFailure"
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: One normalized terminal aggregate, not a billing ledger.
        provenance:
          oneOf:
            - $ref: "#/components/schemas/ModelProvenance"
            - type: "null"
        structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
          description: |
            The object the model produced, already checked against the schema
            you asked for. Null until the turn finishes successfully, and
            always null if you did not ask for structured output.
        structured_output_provenance:
          oneOf:
            - $ref: "#/components/schemas/StructuredOutputProvenance"
            - type: "null"
        metadata:
          oneOf:
            - $ref: "#/components/schemas/Metadata"
            - type: "null"
          description: |
            Your own data, stored when the turn was created and returned exactly as
            you sent it.
        limits:
          $ref: "#/components/schemas/ResolvedLimits"
        active_execution_ms:
          type: integer
          minimum: 0
        deadline_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            The deadline currently enforced by the runtime. Null while the
            Invocation is waiting without an explicit waiting timeout; the
            explicit waiting deadline while bounded; otherwise the total-time
            deadline for queued, running, and terminal Invocations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
          description: Present for a waiting Invocation with unresolved host or callback calls.
    InvocationList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invocation"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    InvocationResult:
      type: object
      additionalProperties: false
      required: [invocation, messages, output_text]
      properties:
        invocation:
          $ref: "#/components/schemas/Invocation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
          description: |
            Every canonical SessionMessage owned by this Invocation, all
            roles, ascending sequence, composed at read time from the
            canonical transcript. Nothing is stored twice.
        output_text:
          oneOf:
            - type: string
            - type: "null"
          description: |
            The assistant's text from this turn, joined together in order with
            nothing between the pieces. This is the convenience field for "what did
            the agent say?"

            Non-null only when the turn completed and produced at least one piece
            of text. Failed and cancelled turns leave it null even if some text was
            produced, so read the messages directly if you need those.
    ClientInvocation:
      type: object
      additionalProperties: false
      required: [id, session_id, agent_definition_id, agent_definition_revision, status, stop_reason, attempt, error, structured_output, active_execution_ms, deadline_at, created_at, updated_at, ended_at]
      properties:
        id: { $ref: "#/components/schemas/InvocationID" }
        session_id: { $ref: "#/components/schemas/SessionID" }
        agent_definition_id: { $ref: "#/components/schemas/AgentDefinitionID" }
        agent_definition_revision: { type: integer, minimum: 1 }
        deduplicated: { type: boolean, description: Present only on Invocation admission. }
        status: { $ref: "#/components/schemas/InvocationStatus" }
        stop_reason:
          oneOf:
            - $ref: "#/components/schemas/InvocationStopReason"
            - type: "null"
        attempt: { type: integer, minimum: 0 }
        error:
          oneOf:
            - $ref: "#/components/schemas/ClientInvocationFailure"
            - type: "null"
        structured_output:
          oneOf:
            - { type: object, additionalProperties: true }
            - type: "null"
        active_execution_ms: { type: integer, minimum: 0 }
        deadline_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        pending_tool_calls:
          type: array
          items: { $ref: "#/components/schemas/PendingHostToolCall" }
          description: Only eligible named host-mode tools declared by the admitted definition.
      description: Closed browser projection. It never includes Agent or user identity, definition content, provider configuration, usage, budget, metadata, provenance, or resolved limits.
    ClientInvocationFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ClientInvocationList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClientInvocation" }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }
    ClientInvocationResult:
      type: object
      additionalProperties: false
      required: [invocation, messages, output_text]
      properties:
        invocation: { $ref: "#/components/schemas/ClientInvocation" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ClientSessionMessage" }
        output_text: { type: [string, "null"] }
    InvocationResponse:
      description: Trusted machine projection or the smaller projection selected by client-token authentication.
      oneOf:
        - $ref: "#/components/schemas/Invocation"
        - $ref: "#/components/schemas/ClientInvocation"
    InvocationListResponse:
      oneOf:
        - $ref: "#/components/schemas/InvocationList"
        - $ref: "#/components/schemas/ClientInvocationList"
    InvocationResultResponse:
      oneOf:
        - $ref: "#/components/schemas/InvocationResult"
        - $ref: "#/components/schemas/ClientInvocationResult"
    ModelUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
          description: |
            Uncached input tokens. The three input buckets are disjoint across
            every provider, so total prompt size is input_tokens +
            cache_creation_input_tokens + cache_read_input_tokens. Cached tokens
            are never also counted here.
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
          description: |
            Input tokens written to the provider's prompt cache. Absent on
            providers that report cache hits but not cache writes.
        cache_read_input_tokens:
          type: integer
          minimum: 0
          description: Input tokens served from the provider's prompt cache.
        reasoning_tokens:
          type: integer
          minimum: 0
          description: |
            Output tokens spent on reasoning. A subset of output_tokens, not an
            additive bucket.
        model_calls:
          type: integer
          minimum: 0
          description: |
            How many model requests these totals cover. Older records may not have
            it.
        estimated_cost:
          $ref: "#/components/schemas/ModelCost"
    ModelCost:
      type: object
      additionalProperties: false
      required: [input, output, cache_read, cache_write, total]
      properties:
        input:
          type: number
          minimum: 0
        output:
          type: number
          minimum: 0
        cache_read:
          type: number
          minimum: 0
        cache_write:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
        currency:
          type: string
        model:
          type: string
    ModelProvenance:
      type: object
      additionalProperties: false
      required: [provider, requested_model, served_model, provider_key_source]
      properties:
        provider:
          type: string
        requested_model:
          type: string
        served_model:
          type: string
        provider_key_source:
          type: string
          enum: [caller_ephemeral, app_byok, tenant_byok, platform, config_byok]
        provider_key_id:
          $ref: "#/components/schemas/ProviderKeyID"
        provider_key_version_id:
          $ref: "#/components/schemas/ProviderKeyVersionID"
      description: |
        Reusable BYOK sources include safe provider key and version IDs. Caller,
        platform, and config sources omit them. No secret material is
        included.
    StructuredOutputProvenance:
      type: object
      additionalProperties: false
      required: [source, schema_sha256]
      properties:
        source:
          type: string
          enum: [tool_call]
          x-enum-varnames: [SourceToolCall]
        tool_call_id:
          $ref: "#/components/schemas/ToolCallID"
        schema_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of the JSON Schema this object was checked against. Compare
            it with your own schema's hash to confirm the model answered the
            version you sent.
      description: |
        Shows where `structured_output` came from and what it was checked
        against, so you can verify the object rather than trust it. It records
        the tool call the model produced the object in and the exact schema
        that object was validated against. It never changes after the turn
        ends.
    ToolCallID:
      type: string
      minLength: 1
      description: |
        Identifies one durable ToolCall. Treat it as opaque: read it from a
        transcript `tool_use` block or from the pending host tool calls, and
        pass it back verbatim as `tool_call_id` when submitting results. The
        same value is the `Idempotency-Key` on a callback delivery.
    DeliveryID:
      type: string
      minLength: 1
      description: |
        Identifies one delivery nvoken sent you, callback or webhook alike —
        both are the same durable record and carry the same `dlvr_` prefix.
        Treat it as opaque; it appears in the signed payload and identifies the
        attempt when you report a delivery problem.
    ToolCallMode:
      type: string
      enum: [builtin, host, callback, mcp]
    ToolCallStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]
    ToolCallResultOrigin:
      type: string
      enum: [builtin, callback, host, mcp, system]
      description: |
        The component that committed the result. `callback` is an inline
        callback response; `host` includes settlement through `tool-results`.
    CallbackDeliveryOutcome:
      type: string
      enum: [pending, acknowledged, succeeded, failed, abandoned]
      description: |
        `pending` means nvoken has not reached a final transport outcome.
        `acknowledged` means the endpoint returned 202 with an empty body and
        the ToolCall still awaits settlement. The other values are terminal
        transport outcomes.
    ToolCallDelivery:
      type: object
      additionalProperties: false
      required: [outcome, attempts, last_http_status]
      properties:
        outcome:
          $ref: "#/components/schemas/CallbackDeliveryOutcome"
        attempts:
          type: integer
          format: int64
          minimum: 0
          description: Number of leased HTTP delivery attempts.
        last_http_status:
          oneOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: "null"
          description: Last HTTP status returned by the endpoint, or null before any response.
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, mode, name, status, iteration, created_at, ended_at, attempts, result_origin]
      properties:
        id:
          $ref: "#/components/schemas/ToolCallID"
        mode:
          $ref: "#/components/schemas/ToolCallMode"
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: "#/components/schemas/ToolCallStatus"
        iteration:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        attempts:
          type: integer
          minimum: 0
          description: Number of runtime execution attempts for this ToolCall.
        result_origin:
          oneOf:
            - $ref: "#/components/schemas/ToolCallResultOrigin"
            - type: "null"
          description: Null until a ToolCall has a committed result.
        delivery:
          $ref: "#/components/schemas/ToolCallDelivery"
          description: Present only when mode is callback.
    ToolCallList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    ToolCallbackContext:
      type: object
      additionalProperties: false
      required: [schema_version, delivery_id, tool_call_id, invocation_id,
                 session_id, agent_key]
      properties:
        schema_version:
          type: integer
          enum: [1]
        delivery_id:
          $ref: "#/components/schemas/DeliveryID"
        tool_call_id:
          $ref: "#/components/schemas/ToolCallID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        agent_key:
          type: string
          minLength: 1
          maxLength: 255
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Absent for the app's default tenant.
    ToolCallbackRequest:
      type: object
      additionalProperties: false
      required: [nvoken, input]
      properties:
        nvoken:
          $ref: "#/components/schemas/ToolCallbackContext"
        input: {}
    ToolCallbackResponse:
      type: object
      additionalProperties: false
      required: [content]
      description: |
        Strict callback reply. The encoded content is limited to 256 KiB and
        32 nesting levels. `is_error` defaults to false when omitted.
      properties:
        content: {}
        is_error:
          type: boolean
          default: false
    PendingHostToolCall:
      type: object
      additionalProperties: false
      required: [id, name, input, deadline_at]
      properties:
        id:
          $ref: "#/components/schemas/ToolCallID"
        name:
          type: string
        input: {}
        deadline_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            The Invocation's explicit waiting deadline, or null when external
            waiting is unbounded.
    SubmitHostToolResultsRequest:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [tool_call_id, content]
            properties:
              tool_call_id:
                $ref: "#/components/schemas/ToolCallID"
              content: {}
              is_error:
                type: boolean
    HostToolResultAcceptance:
      type: object
      additionalProperties: false
      required: [tool_call_id, status, deduplicated]
      properties:
        tool_call_id:
          $ref: "#/components/schemas/ToolCallID"
        status:
          type: string
          enum: [completed, failed]
        deduplicated:
          type: boolean
    SubmitHostToolResultsResponse:
      type: object
      additionalProperties: false
      required: [invocation_id, session_id, status, results, pending_tool_calls]
      properties:
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        status:
          $ref: "#/components/schemas/InvocationStatus"
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/HostToolResultAcceptance"
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
          description: Remaining open host- and callback-mode ToolCalls.
    InvocationFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - deadline_exceeded
            - budget_exceeded
            - cost_estimate_unavailable
            - provider_key_unavailable
            - context_window_exceeded
            - input_media_rejected
            - provider_error
            - mcp_discovery_failed
            - structured_output_unsatisfied
            - internal
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      description: |
        A failed turn still reports `usage` and `provenance` if the model
        answered at least once before it stopped, so you can see what you were
        charged for. A cancelled turn reports whatever it had used up to the
        moment you cancelled. A turn that failed before any model reply
        reports neither.

        `details` is a small object whose keys depend on `code`. Each code
        below lists the only keys it sets:

        - `deadline_exceeded` sets `details.scope` to the deadline that ran
          out: `total`, `active_execution`, `execution_segment`, or `waiting`.
        - `budget_exceeded` sets `details.kind` to the limit the turn went
          over: `output_tokens` or `estimated_cost`. A limit only shows up as a failure
          when the turn could not stop cleanly; when it could, the turn ends
          `incomplete` with a matching `stop_reason` instead.
        - `cost_estimate_unavailable` does not
          mean you overspent — it means nvoken has no price for the model and
          so cannot enforce mandatory credits or the cost limit you set.
        - `structured_output_unsatisfied` sets `details.reason` to `missing`,
          `invalid`, or `oversized`.
        - `context_window_exceeded` sets the integer keys `input_tokens`,
          `context_window_tokens`, and `requested_output_tokens`, each only
          when nvoken knows it.
        - `input_media_rejected` sets `modality`, `media_type`, and `reason`
          as the provider reported them, each only when known.

        A `provider_error` sets `details.provider_failure_class`, which is
        nvoken's summary of what went wrong at the provider and is the field
        to branch your retry logic on:

        - `upstream_rejected` — the provider refused this request. Do not
          retry it unchanged; fix the request first.
        - `upstream_unavailable` or `throttled` — the provider could not serve
          it right now. Retry with backoff.
        - `configuration`, `canceled`, `timeout_or_transport`,
          `invalid_response`, or `unknown` — everything else.

        Provider error text is never passed through here, so nothing in this
        object leaks another vendor's wording or your key material.
    ResolvedLimits:
      type: object
      additionalProperties: false
      required: [total_timeout_seconds, active_timeout_seconds, waiting_timeout_seconds, max_iterations]
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: |
            The explicit cumulative external-waiting SLA, or null when waits
            are durable and unbounded.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            Resolved USD list-price guardrail. It is present only when the host
            requested a cost limit; unknown price metadata fails closed.
        max_iterations:
          type: integer
          minimum: 1
    SessionContext:
      type: object
      additionalProperties: false
      required: [estimated_tokens, context_window_tokens, model]
      properties:
        estimated_tokens:
          type: integer
          format: int64
          minimum: 0
          description: |
            Roughly how many tokens the model will see on the next turn: the
            most recent summary, plus the messages that came after it. This is
            the same number nvoken checks when deciding whether to summarize
            again.
        context_window_tokens:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: |
            Cataloged context window for `model`, or null when the selected
            model is not in this nvoken installation's catalog.
        model:
          $ref: "#/components/schemas/Model"
          description: |
            Model whose context window applies: the Session compaction model
            when configured, otherwise the most recent Invocation's primary
            model.
    Session:
      type: object
      additionalProperties: false
      required: [id, agent_id, tenant_key, session_key, user_key, forked_from, compaction, retention, expires_at, metadata, active_invocation_id, active_invocation_status, credit_block, context, usage, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionID"
        agent_id:
          oneOf:
            - $ref: "#/components/schemas/AgentID"
            - type: "null"
          description: |
            Null only while a Session created ahead of time has not run a turn yet.
            The first turn binds the Agent, and after that it never changes.
        tenant_key:
          oneOf:
            - type: string
            - type: "null"
          description: Immutable effective tenant partition reference.
        session_key:
          oneOf:
            - type: string
            - type: "null"
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Host-owned end-user label recorded when this Session was opened.
            Filtering only; not an isolation boundary.
        forked_from:
          oneOf:
            - $ref: "#/components/schemas/SessionForkLineage"
            - type: "null"
          description: Durable source prefix lineage, or null for an original Session.
        compaction:
          oneOf:
            - $ref: "#/components/schemas/CompactionPolicy"
            - type: "null"
          description: |
            The automatic compaction policy this Session actually applies, or
            null when it compacts nothing. It is echoed resolved: a request
            that asked for `trigger_tokens: auto` reads back the integer that
            resolved to, and a request that named no model reads back the
            model the policy bound. Nothing here is ever the unresolved
            request.
        retention:
          oneOf:
            - $ref: "#/components/schemas/RetentionPolicy"
            - type: "null"
          description: |
            The idle retention window this Session was created with, or null
            when it is retained until deleted explicitly. A window outside the
            supported range is refused at creation rather than clamped, so
            what is read back is always exactly what applies.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: |
            When nvoken may automatically delete this Session, or null if it
            has no retention window. The date moves forward every time a turn
            starts and every time one finishes, so a Session in active use
            never reaches it.
        metadata:
          oneOf:
            - $ref: "#/components/schemas/Metadata"
            - type: "null"
          description: |
            Host correlation data, returned verbatim. Set at creation through
            `session_options.metadata` and changed with
            `PATCH /v1/sessions/{session_id}`.
        active_invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
          description: The queued, running, waiting, or paused Invocation, if one exists.
        active_invocation_status:
          oneOf:
            - type: string
              enum: [queued, running, waiting, paused]
            - type: "null"
          description: Status of active_invocation_id; null exactly when that ID is null.
        credit_block:
          oneOf:
            - $ref: "#/components/schemas/CreditBlock"
            - type: "null"
          description: Tenant credit account blocking the active paused Invocation, otherwise null.
        context:
          oneOf:
            - $ref: "#/components/schemas/SessionContext"
            - type: "null"
          description: |
            Read-time retained-context estimate and the model window it is
            measured against. Null until the Session has either a compaction
            model or an Invocation primary model. The object remains present
            for an uncataloged model, with `context_window_tokens: null`.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: |
            Read-time sum of this Session's non-null Invocation usage and
            committed private compaction usage. Null until either exists. This
            normalized estimate is not a billing ledger.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pending_tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/PendingHostToolCall"
          description: Pending host and callback calls for the active waiting Invocation.
    SessionForkLineage:
      type: object
      additionalProperties: false
      required: [session, message]
      properties:
        session:
          $ref: "#/components/schemas/SessionID"
        message:
          $ref: "#/components/schemas/SessionMessageID"
      description: |
        The source Session and inclusive source message of a fork. These IDs
        remain as lineage after the source Session is erased.
    SessionList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    ClientSession:
      type: object
      additionalProperties: false
      required: [id, active_invocation_id, active_invocation_status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/SessionID" }
        active_invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        active_invocation_status:
          oneOf:
            - { type: string, enum: [queued, running, waiting, paused] }
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pending_tool_calls:
          type: array
          items: { $ref: "#/components/schemas/PendingHostToolCall" }
      description: Closed browser projection. Session keys, Agent/user/tenant identifiers, lineage, policies, cost settings, metadata, usage, budget, and derived host context are omitted.
    ClientSessionList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClientSession" }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }
    SessionResponse:
      oneOf:
        - $ref: "#/components/schemas/Session"
        - $ref: "#/components/schemas/ClientSession"
    SessionListResponse:
      oneOf:
        - $ref: "#/components/schemas/SessionList"
        - $ref: "#/components/schemas/ClientSessionList"
    SessionMessageRole:
      type: string
      enum: [system, user, assistant, tool]
    SessionContentBlock:
      oneOf:
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/ImageReferenceBlock"
        - $ref: "#/components/schemas/DocumentReferenceBlock"
        - $ref: "#/components/schemas/ToolUseBlock"
        - $ref: "#/components/schemas/ServerToolUseBlock"
        - $ref: "#/components/schemas/ToolResultBlock"
        - $ref: "#/components/schemas/ReminderBlock"
        - $ref: "#/components/schemas/RedactedBlock"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextBlock"
          image: "#/components/schemas/ImageReferenceBlock"
          document: "#/components/schemas/DocumentReferenceBlock"
          tool_use: "#/components/schemas/ToolUseBlock"
          server_tool_use: "#/components/schemas/ServerToolUseBlock"
          tool_result: "#/components/schemas/ToolResultBlock"
          reminder: "#/components/schemas/ReminderBlock"
          redacted: "#/components/schemas/RedactedBlock"
      description: |
        One block of a stored message, in nvoken's own shape rather than any
        provider's. Images and documents come back described rather than
        inlined — type, media type, optional title, size in `bytes`, and a
        `sha256:` checksum — so reading a transcript never ships the original
        bytes back to you.

        New block types will appear as features ship. Render the ones you know
        and skip the rest.
    TextBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
          x-enum-varnames: [TypeText]
        text:
          type: string
          minLength: 1
        citations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Citation"
          description: Source locations attached to generated text.
    ReminderBlock:
      type: object
      additionalProperties: false
      required: [type, name, tier, content]
      properties:
        type:
          type: string
          enum: [reminder]
          x-enum-varnames: [TypeReminder]
        name:
          type: string
          minLength: 5
          maxLength: 68
          pattern: "^app-[a-z][a-z0-9-]*$"
          description: Caller name in nvoken's reserved application namespace.
        tier:
          type: string
          enum: [contextual, operator]
        content:
          type: string
          minLength: 1
          x-nvoken-max-utf8-bytes: 8192
      description: |
        One application-owned state snapshot recorded at Invocation admission.
        Contextual reminders use the user role; operator reminders use the
        system role. The typed tier remains authoritative for provider mapping.
    Citation:
      oneOf:
        - $ref: "#/components/schemas/CharLocationCitation"
        - $ref: "#/components/schemas/WebSearchResultLocationCitation"
        - $ref: "#/components/schemas/URLCitation"
      discriminator:
        propertyName: type
        mapping:
          char_location: "#/components/schemas/CharLocationCitation"
          web_search_result_location: "#/components/schemas/WebSearchResultLocationCitation"
          url_citation: "#/components/schemas/URLCitation"
    CharLocationCitation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [char_location]
          x-enum-varnames: [TypeCharLocation]
        cited_text:
          type: string
        document_index:
          type: integer
          minimum: 0
        document_title:
          type: string
        start_char_index:
          type: integer
          minimum: 0
        end_char_index:
          type: integer
          minimum: 0
      description: A location inside one indexed input document.
    WebSearchResultLocationCitation:
      type: object
      additionalProperties: false
      required: [type, url, title]
      properties:
        type:
          type: string
          enum: [web_search_result_location]
          x-enum-varnames: [TypeWebSearchResultLocation]
        url:
          type: string
          format: uri
        title:
          type: string
        encrypted_index:
          type: string
        cited_text:
          type: string
      description: A provider search result cited by the generated text.
    URLCitation:
      type: object
      additionalProperties: false
      required: [type, url, title, start_index, end_index]
      properties:
        type:
          type: string
          enum: [url_citation]
          x-enum-varnames: [TypeURLCitation]
        url:
          type: string
          format: uri
        title:
          type: string
        start_index:
          type: integer
          minimum: 0
        end_index:
          type: integer
          minimum: 0
      description: A URL citation positioned within the generated text.
    ImageReferenceBlock:
      type: object
      additionalProperties: false
      required: [type, media_type, bytes, digest]
      properties:
        type:
          type: string
          enum: [image]
          x-enum-varnames: [TypeImage]
        media_type:
          type: string
          enum: [image/gif, image/jpeg, image/png, image/webp]
        bytes:
          type: integer
          minimum: 0
          maximum: 5242880
          description: Decoded media byte count; never the media payload.
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the decoded media bytes.
        url:
          type: string
          format: uri
          description: Original URL when the image arrived by URL.
      description: |
        A stored input image, described rather than sent back. You get its
        media type, size, and checksum, but not the bytes.
    DocumentReferenceBlock:
      type: object
      additionalProperties: false
      required: [type, media_type, bytes, digest]
      properties:
        type:
          type: string
          enum: [document]
          x-enum-varnames: [TypeDocument]
        media_type:
          type: string
          enum: [application/pdf]
        title:
          type: string
          description: Present only when the caller supplied a title.
        bytes:
          type: integer
          minimum: 0
          maximum: 16777216
          description: Decoded document byte count; never the document payload.
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Digest of the decoded document bytes.
        url:
          type: string
          format: uri
          description: Original URL when the document arrived by URL.
      description: |
        A stored input document, described rather than sent back. You get its
        media type, size, and checksum, but not the bytes.
    ToolUseBlock:
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      properties:
        type:
          type: string
          enum: [tool_use]
          x-enum-varnames: [TypeToolUse]
        id:
          $ref: "#/components/schemas/ToolCallID"
        name:
          type: string
          minLength: 1
        input: {}
      description: A host, builtin, MCP, or callback tool call.
    ServerToolUseBlock:
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      properties:
        type:
          type: string
          enum: [server_tool_use]
          x-enum-varnames: [TypeServerToolUse]
        id:
          type: string
          minLength: 1
          description: |
            The provider's own ID for a tool it ran itself, such as web
            search. This is not a ToolCall ID: you never send a result for
            it, and it never appears in your pending tool calls. It is here
            so you can show the user what the model looked up.
        name:
          type: string
          minLength: 1
        input: {}
      description: A provider-run tool call retained in the public transcript.
    ToolResultBlock:
      type: object
      additionalProperties: false
      required: [type, tool_use_id, content]
      properties:
        type:
          type: string
          enum: [tool_result]
          x-enum-varnames: [TypeToolResult]
        tool_use_id:
          $ref: "#/components/schemas/ToolCallID"
          description: |
            The `id` of the `tool_use` block this result answers. The name comes
            from the provider message format nvoken stores and replays; the value
            is a ToolCall ID.
        content:
          description: |
            The host's own JSON, retained verbatim. Its canonical encoding is
            limited to 262144 bytes and 32 nesting levels; the complete result
            submission body is limited to 1048576 bytes.
          x-nvoken-max-json-bytes: 262144
          x-nvoken-max-json-depth: 32
        is_error:
          type: boolean
      description: The durable result of one tool call.
    RedactedBlock:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [redacted]
          x-enum-varnames: [TypeRedacted]
      description: Placeholder for an assistant message whose content is private.
    SessionMessage:
      type: object
      additionalProperties: false
      required: [id, session_id, agent_id, invocation_id, user_key, sequence, role, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionMessageID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
          description: |
            The Invocation that wrote this row, or null for seeded and copied
            history. `origin` and `copied_from_message_id` explain that null.
        user_key:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Per-turn host end-user attribution. Copied rows preserve it;
            seeded history may omit it.
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          $ref: "#/components/schemas/SessionMessageRole"
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SessionContentBlock"
        origin:
          type: string
          enum: [seeded]
          description: |
            Present only when the message content was asserted by the host at
            Session creation. Messages nvoken wrote carry no origin marker;
            fork copies preserve the source marker.
        copied_from_message_id:
          $ref: "#/components/schemas/SessionMessageID"
          description: Present only on a fork copy; names its source message.
        phase:
          allOf:
            - $ref: "#/components/schemas/MessagePhase"
          description: |
            Whether this assistant message is the turn's actual answer or something
            along the way. Absent on user and tool messages, which have no phase.

            It is worked out when you read, from how the turn ended, and it is
            frozen onto forked copies so a fork keeps the phases it had. Your own
            input never carries a phase.
        created_at:
          type: string
          format: date-time
    ClientSessionMessage:
      type: object
      additionalProperties: false
      required: [id, session_id, invocation_id, sequence, role, content, created_at]
      properties:
        id: { $ref: "#/components/schemas/SessionMessageID" }
        session_id: { $ref: "#/components/schemas/SessionID" }
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        sequence: { type: integer, format: int64, minimum: 1 }
        role: { $ref: "#/components/schemas/SessionMessageRole" }
        content:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SessionContentBlock" }
        created_at: { type: string, format: date-time }
      description: Public transcript content without Agent/user identity, runtime phase, copy origin, or host provenance.
    ClientSessionMessageList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClientSessionMessage" }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }
    SessionMessageListResponse:
      oneOf:
        - $ref: "#/components/schemas/SessionMessageList"
        - $ref: "#/components/schemas/ClientSessionMessageList"
    MessagePhase:
      type: string
      enum: [commentary, final_answer]
      description: |
        Tells you which assistant message is the actual answer, so you can
        render a turn without guessing.

        `final_answer` is the message the model ended the turn with — the
        reply you would show a user. `commentary` is everything else: the
        model thinking out loud between tool calls, and every message of a
        turn that was interrupted or stopped early, none of which was ever an
        answer. A turn with no `final_answer` was left unfinished, and you can
        show it as such.
    CreateNudgeRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          allOf:
            - $ref: "#/components/schemas/InvocationInput"
          description: |
            Text guidance for the running turn: a string, or an array of text
            blocks. Media blocks are refused here.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Per-Invocation retry key. The same key with the same content
            returns the original acknowledgement with `deduplicated: true`; the
            same key with different content is refused, so a key is never
            reused with different words.
    NudgeAcknowledgement:
      type: object
      additionalProperties: false
      required: [nudge_id, status, deduplicated, after_sequence]
      properties:
        nudge_id:
          $ref: "#/components/schemas/NudgeID"
        status:
          $ref: "#/components/schemas/NudgeStatus"
        deduplicated:
          type: boolean
        after_sequence:
          type: integer
          format: int64
          description: |
            Transcript position to watch from for the promoted message. It is
            the Session cursor as of this call for a Nudge that has not been
            drained, and the position immediately before the promoted message
            for a Nudge that already has, so reading after it finds the message
            either way.
    NudgeStatus:
      type: string
      enum: [pending, drained, expired, cancelled]
      description: |
        `pending` is the only state a turn will still pick up. `drained` means
        the turn took it and it is now in the transcript. `expired` means the
        turn ended without ever taking it. `cancelled` means you withdrew it
        before the turn got to it.
    Nudge:
      type: object
      additionalProperties: false
      required: [id, invocation_id, status, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/NudgeID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        status:
          $ref: "#/components/schemas/NudgeStatus"
        content:
          $ref: "#/components/schemas/InvocationInput"
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        drained_at:
          type: string
          format: date-time
          description: When the Nudge was promoted into the transcript. Present only when drained.
        drained_message_sequence:
          type: integer
          format: int64
          description: |
            Transcript sequence the content was promoted into. Present only on
            a drained Nudge, and the receipt that the model saw it.
        ended_at:
          type: string
          format: date-time
          description: When the Nudge left pending for any terminal status.
    NudgeList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Nudge"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionMessageList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    SessionCompactionStatus:
      type: string
      enum: [applied, fell_through]
      description: |
        `applied` means the new summary took effect and is what the model now
        sees in place of the older messages. `fell_through` means the summary
        attempt failed or came back unusable, so the turn carried on with the
        previous summary. Either way the turn keeps running — a failed summary
        is not a failed turn.
    SessionCompaction:
      type: object
      additionalProperties: false
      required: [id, invocation_id, covers_through, status, failure_class,
                 usage, summary, created_at]
      properties:
        id:
          $ref: "#/components/schemas/SessionCompactionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        covers_through:
          type: integer
          format: int64
          minimum: 1
          description: Last canonical Session message sequence included in this pass.
        status:
          $ref: "#/components/schemas/SessionCompactionStatus"
        failure_class:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
          description: |
            nvoken's stable failure classification for a fell-through pass;
            null when status is applied.
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
          description: |
            What the summarizing model call cost, when it was recorded reliably.
            This counts toward the Session's usage but never toward the usage of
            the turn that triggered it.
        summary:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
          description: |
            The summary text itself, for an attempt that took effect; null for one
            that did not. It is shown here so you can see what the model is working
            from. It is not a message in the conversation and never appears in the
            transcript.
        created_at:
          type: string
          format: date-time
    SessionCompactionList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionCompaction"
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    InvocationChange:
      type: object
      additionalProperties: false
      required: [invocation_id, revision, status, through_message_sequence, error, usage, provenance, structured_output, structured_output_provenance, occurred_at]
      properties:
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/InvocationStatus"
        through_message_sequence:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/InvocationFailure"
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/ModelUsage"
            - type: "null"
        provenance:
          oneOf:
            - $ref: "#/components/schemas/ModelProvenance"
            - type: "null"
        structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        structured_output_provenance:
          oneOf:
            - $ref: "#/components/schemas/StructuredOutputProvenance"
            - type: "null"
        occurred_at:
          type: string
          format: date-time
    TranscriptSnapshot:
      type: object
      additionalProperties: false
      required: [messages, invocation_changes, has_more, resume_cursor, next_page_token]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        invocation_changes:
          type: array
          items:
            $ref: "#/components/schemas/InvocationChange"
        has_more:
          type: boolean
        resume_cursor:
          type: string
          minLength: 1
          description: Your resume position. Store it and send it back as `cursor` to continue where you left off.
        next_page_token:
          oneOf:
            - type: string
            - type: "null"
    ClientInvocationChange:
      type: object
      additionalProperties: false
      required: [invocation_id, revision, status, through_message_sequence, error, structured_output, occurred_at]
      properties:
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        revision: { type: integer, format: int64, minimum: 1 }
        status: { $ref: "#/components/schemas/InvocationStatus" }
        through_message_sequence: { type: [integer, "null"], format: int64, minimum: 1 }
        error:
          oneOf:
            - $ref: "#/components/schemas/ClientInvocationFailure"
            - type: "null"
        structured_output:
          oneOf:
            - { type: object, additionalProperties: true }
            - type: "null"
        occurred_at: { type: string, format: date-time }
    ClientTranscriptSnapshot:
      type: object
      additionalProperties: false
      required: [messages, invocation_changes, has_more, resume_cursor, next_page_token]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ClientSessionMessage" }
        invocation_changes:
          type: array
          items: { $ref: "#/components/schemas/ClientInvocationChange" }
        has_more: { type: boolean }
        resume_cursor: { type: string, minLength: 1 }
        next_page_token: { type: [string, "null"] }
    TranscriptSnapshotResponse:
      oneOf:
        - $ref: "#/components/schemas/TranscriptSnapshot"
        - $ref: "#/components/schemas/ClientTranscriptSnapshot"
    TranscriptUpdate:
      type: object
      additionalProperties: false
      required: [type, session_id, messages, invocation_changes, resume_cursor]
      properties:
        type:
          type: string
          enum: [transcript.update]
          x-enum-varnames: [EventTranscriptUpdate]
        session_id:
          $ref: "#/components/schemas/SessionID"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        invocation_changes:
          type: array
          items:
            $ref: "#/components/schemas/InvocationChange"
        resume_cursor:
          type: string
          minLength: 1
          description: Your resume position. Store it and send it back as `cursor` to continue where you left off.
    ClientTranscriptUpdate:
      type: object
      additionalProperties: false
      required: [type, session_id, messages, invocation_changes, resume_cursor]
      properties:
        type: { type: string, const: transcript.update }
        session_id: { $ref: "#/components/schemas/SessionID" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ClientSessionMessage" }
        invocation_changes:
          type: array
          items: { $ref: "#/components/schemas/ClientInvocationChange" }
        resume_cursor: { type: string, minLength: 1 }
    OutputTextDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, attempt, iteration, content_index, text, emitted_at]
      properties:
        type:
          type: string
          enum: [output_text.delta]
          x-enum-varnames: [EventOutputTextDelta]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: |
            Execution attempt that emitted this preview. Discard provisional
            output from earlier attempts when this value increases.
        iteration:
          type: integer
          minimum: 1
          description: Model iteration that owns the assistant message.
        content_index:
          type: integer
          minimum: 0
        text:
          type: string
          minLength: 1
        emitted_at:
          type: string
          format: date-time
    ThinkingDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, attempt, iteration, content_index, thinking, emitted_at]
      properties:
        type:
          type: string
          enum: [thinking.delta]
          x-enum-varnames: [EventThinkingDelta]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: |
            Execution attempt that emitted this preview. Discard provisional
            output from earlier attempts when this value increases.
        iteration:
          type: integer
          minimum: 1
          description: Model iteration that owns the assistant message.
        content_index:
          type: integer
          minimum: 0
        thinking:
          type: string
          minLength: 1
        emitted_at:
          type: string
          format: date-time
    StreamResyncEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, reason]
      properties:
        type:
          type: string
          enum: [stream.resync]
          x-enum-varnames: [EventStreamResync]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        reason:
          type: string
          enum: [live_delivery_gap]
          x-enum-varnames: [ReasonLiveDeliveryGap]
    StreamEndEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, reason, resume_cursor]
      properties:
        type:
          type: string
          enum: [stream.end]
          x-enum-varnames: [EventStreamEnd]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
        reason:
          type: string
          enum: [terminal, rotate]
          description: |
            `rotate` means the server is cycling the connection — reconnect with
            your last `resume_cursor`. `terminal` means there is nothing more
            coming: the turn finished, or for a Session stream, nothing is running
            any more.
        resume_cursor:
          type: string
          minLength: 1
    TranscriptStreamEvent:
      description: |
        The JSON value carried by one Session-stream SSE `data:` field.
        Durable `transcript.update` frames carry the resume cursor as both
        payload data and SSE `id`; preview and control frames never carry IDs.
      oneOf:
        - $ref: "#/components/schemas/TranscriptUpdate"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    ClientTranscriptStreamEvent:
      description: Browser stream event. Thinking previews and host-only transcript fields are never emitted.
      oneOf:
        - $ref: "#/components/schemas/ClientTranscriptUpdate"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    TranscriptStreamResponse:
      oneOf:
        - $ref: "#/components/schemas/TranscriptStreamEvent"
        - $ref: "#/components/schemas/ClientTranscriptStreamEvent"
    InvocationAcceptedEvent:
      type: object
      additionalProperties: false
      required: [type, agent_id, session_id, invocation_id, status, deduplicated, deadline_at, limits]
      properties:
        type:
          type: string
          enum: [invocation.accepted]
          x-enum-varnames: [EventInvocationAccepted]
        agent_id:
          $ref: "#/components/schemas/AgentID"
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        status:
          $ref: "#/components/schemas/InvocationStatus"
        deduplicated:
          type: boolean
        deadline_at:
          type: string
          format: date-time
        limits:
          allOf:
            - $ref: "#/components/schemas/ResolvedLimits"
          description: |
            The limits this turn is actually running under, after your
            installation's defaults and minimums were applied. Repeated here so you
            can see what you got without a second request — worth checking when you
            left `max_iterations` out, since the default may be lower than you
            expect.
    ClientInvocationAcceptedEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, status, deduplicated, deadline_at]
      properties:
        type: { type: string, const: invocation.accepted }
        session_id: { $ref: "#/components/schemas/SessionID" }
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        status: { $ref: "#/components/schemas/InvocationStatus" }
        deduplicated: { type: boolean }
        deadline_at: { type: string, format: date-time }
    InvocationUpdateEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, invocation, new_messages]
      properties:
        type:
          type: string
          enum: [invocation.update]
          x-enum-varnames: [EventInvocationUpdate]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        invocation:
          $ref: "#/components/schemas/Invocation"
        new_messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
    ClientInvocationUpdateEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, invocation, new_messages]
      properties:
        type: { type: string, const: invocation.update }
        session_id: { $ref: "#/components/schemas/SessionID" }
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        invocation: { $ref: "#/components/schemas/ClientInvocation" }
        new_messages:
          type: array
          items: { $ref: "#/components/schemas/ClientSessionMessage" }
    InvocationResultEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, result]
      properties:
        type:
          type: string
          enum: [invocation.result]
          x-enum-varnames: [EventInvocationResult]
        session_id:
          $ref: "#/components/schemas/SessionID"
        invocation_id:
          $ref: "#/components/schemas/InvocationID"
        result:
          $ref: "#/components/schemas/InvocationResult"
    ClientInvocationResultEvent:
      type: object
      additionalProperties: false
      required: [type, session_id, invocation_id, result]
      properties:
        type: { type: string, const: invocation.result }
        session_id: { $ref: "#/components/schemas/SessionID" }
        invocation_id: { $ref: "#/components/schemas/InvocationID" }
        result: { $ref: "#/components/schemas/ClientInvocationResult" }
    InvocationStreamEvent:
      description: |
        Typed event from one Invocation stream. A minimal consumer prints
        `output_text.delta` and finishes on `invocation.result`.
      oneOf:
        - $ref: "#/components/schemas/InvocationAcceptedEvent"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/InvocationUpdateEvent"
        - $ref: "#/components/schemas/InvocationResultEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    ClientInvocationStreamEvent:
      description: Browser Invocation stream event. Thinking previews and host-only fields are never emitted.
      oneOf:
        - $ref: "#/components/schemas/ClientInvocationAcceptedEvent"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/ClientInvocationUpdateEvent"
        - $ref: "#/components/schemas/ClientInvocationResultEvent"
        - $ref: "#/components/schemas/StreamResyncEvent"
        - $ref: "#/components/schemas/StreamEndEvent"
    InvocationStreamResponse:
      oneOf:
        - $ref: "#/components/schemas/InvocationStreamEvent"
        - $ref: "#/components/schemas/ClientInvocationStreamEvent"
    AdmissionOutcome:
      type: string
      enum: [admitted, refused]
      description: |
        `admitted` created an Invocation; `refused` did not. A refusal is the
        only record that the request happened at all.
    AdmissionAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - attempted_at
        - outcome
        - error_code
        - http_status
        - tenant_key
        - user_key
        - agent_key
        - provider
        - model
        - credential_family_id
        - authentication_method
        - request_id
        - invocation_id
        - deduplicated
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque identifier with the public `adm_` prefix.
        attempted_at:
          type: string
          format: date-time
        outcome:
          $ref: "#/components/schemas/AdmissionOutcome"
        error_code:
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
          description: The refusal code, or null when the turn was admitted.
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: The status the caller received.
        tenant_key:
          type: [string, "null"]
          description: |
            The tenant key as sent, or null for the App's default tenant. It is
            raw text, not a resolved reference: a refused attempt commonly
            names a tenant that was never interned.
        user_key:
          type: [string, "null"]
        agent_key:
          type: [string, "null"]
        provider:
          type: [string, "null"]
        model:
          type: [string, "null"]
        credential_family_id:
          type: [string, "null"]
        authentication_method:
          type: [string, "null"]
          enum: [api_key, issuer_token, client_token, null]
        request_id:
          type: [string, "null"]
        invocation_id:
          oneOf:
            - $ref: "#/components/schemas/InvocationID"
            - type: "null"
          description: |
            The admitted Invocation, or null for a refusal. It carries no
            foreign key: the record outlives Session erasure, so a deleted
            transcript never erases the evidence that the request happened.
        deduplicated:
          type: boolean
          description: Whether the request replayed an existing Invocation.
        details:
          type: object
          additionalProperties: true
          description: |
            The refusal's own detail object, the same one the caller received.
            For `insufficient_credits` it carries the tenant key with exact
            available and required amounts.
    AdmissionAttemptList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdmissionAttempt" }
        next_cursor:
          type: [string, "null"]
    AdmissionSummary:
      type: object
      additionalProperties: false
      required: [start_at, end_at, admitted, refused, reasons, tenants]
      properties:
        start_at:
          type: string
          format: date-time
          description: Inclusive lower bound the counts cover.
        end_at:
          type: [string, "null"]
          format: date-time
          description: Exclusive upper bound, or null when the window runs to now.
        admitted:
          type: integer
          format: int64
        refused:
          type: integer
          format: int64
        reasons:
          type: array
          description: Every refusal in the window, grouped by code. Never truncated.
          items: { $ref: "#/components/schemas/AdmissionReasonCount" }
        tenants:
          type: array
          description: |
            The ten keys refused most, worst first. Raw keys, not tenants: a
            key here may have no tenant behind it, which is the case worth
            acting on.
          items: { $ref: "#/components/schemas/AdmissionTenantCount" }
    AdmissionReasonCount:
      type: object
      additionalProperties: false
      required: [error_code, count]
      properties:
        error_code: { type: string }
        count: { type: integer, format: int64 }
    AdmissionTenantCount:
      type: object
      additionalProperties: false
      required: [tenant_key, refusals, last_refused_at]
      properties:
        tenant_key: { type: string }
        refusals: { type: integer, format: int64 }
        last_refused_at: { type: string, format: date-time }
    TenantCredits:
      type: object
      additionalProperties: false
      required: [funded, allocated, used, held, available]
      properties:
        funded:
          type: boolean
          description: |
            Whether a credit account exists at all. False means nothing was
            ever allocated, which reads as zero everywhere else here.
        allocated: { $ref: "#/components/schemas/Money" }
        used: { $ref: "#/components/schemas/Money" }
        held: { $ref: "#/components/schemas/Money" }
        available: { $ref: "#/components/schemas/Money" }
    Tenant:
      type: object
      additionalProperties: false
      required: [id, tenant_key, credits, last_invocation_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/TenantID" }
        tenant_key:
          type: [string, "null"]
          description: The interned key, or null for the App's default tenant.
        credits: { $ref: "#/components/schemas/TenantCredits" }
        last_invocation_at:
          type: [string, "null"]
          format: date-time
          description: |
            When this tenant last had a turn admitted, or null if it never
            has. Read from retained Invocation facts, so Session deletion does
            not change it.
        created_at:
          type: string
          format: date-time
          description: When the key was first interned, by any path.
    TenantList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_cursor:
          type: [string, "null"]
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - agent_definition_not_found
        - agent_definition_revision_conflict
        - precondition_required
        - media_fetch_failed
        - model_retired
        - unauthenticated
        - forbidden
        - not_found
        - idempotency_conflict
        - session_options_conflict
        - provider_key_conflict
        - session_invocation_active
        - invocation_not_waiting
        - invocation_not_paused
        - app_archived
        - org_archived
        - agent_definition_archived
        - org_has_active_apps
        - tenant_in_use
        - budget_exceeded
        - insufficient_credits
        - cost_estimate_unavailable
        - tool_result_conflict
        - tool_result_expired
        - mcp_discovery_failed
        - rate_limited
        - internal
        - unavailable
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    CredentialProfile:
      type: string
      enum: [runtime, viewer, operator]
      description: |
        Fixed authorization profile. Runtime is meaningful for App-bound
        execution and cannot be selected for an Org credential.
    Operation:
      type: string
      enum: [create_invocation, create_agent_definition, get_agent_definition, list_agent_definitions, update_agent_definition, create_session, get_agent, list_agents, get_invocation, submit_tool_results, cancel_invocation, interrupt_invocation, manage_invocation_nudges, resume_invocation, list_invocations, get_session, update_session, delete_session, list_sessions, list_session_messages, get_session_transcript, get_identity, list_credentials, create_credential, get_credential, rotate_credential, revoke_credential, list_provider_keys, create_provider_key, get_provider_key, rotate_provider_key, revoke_provider_key, read_usage, read_credits, allocate_credits, delete_tenant, register_app, list_apps, get_app, update_app, register_org, list_orgs, get_org, update_org]
    CredentialStatus:
      type: string
      enum: [active, revoked]
    Credential:
      type: object
      required: [id, name, prefix, status, profile, operations, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/CredentialID"
        name:
          type: string
        prefix:
          type: string
        status:
          $ref: "#/components/schemas/CredentialStatus"
        profile:
          $ref: "#/components/schemas/CredentialProfile"
        app_id:
          oneOf:
            - $ref: "#/components/schemas/AppID"
            - type: "null"
        org_id:
          oneOf:
            - $ref: "#/components/schemas/OrgID"
            - type: "null"
        creator_credential_id:
          oneOf:
            - $ref: "#/components/schemas/CredentialID"
            - type: "null"
        creator_subject:
          type: [string, "null"]
          description: Opaque issuer subject when the credential was created by an issuer token.
        tenant_key:
          type: [string, "null"]
        session_id:
          oneOf:
            - $ref: "#/components/schemas/SessionID"
            - type: "null"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        expires_at:
          type: [string, "null"]
          format: date-time
        rotated_from_id:
          oneOf:
            - $ref: "#/components/schemas/CredentialID"
            - type: "null"
        rotation_overlap_ends_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialList:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    CreateCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, profile]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        profile:
          $ref: "#/components/schemas/CredentialProfile"
        app_id:
          $ref: "#/components/schemas/AppID"
          description: |
            Target App for an Org or installation Operator provisioning an App
            credential. Org callers may name only Apps contained by their Org.
            App callers may omit this field or repeat their own App ID.
        org_id:
          $ref: "#/components/schemas/OrgID"
          description: |
            Target Org for an installation Operator provisioning an Org
            credential. Installation issuer tokens require `admin: true`.
            Mutually exclusive with `app_id`. Org and App callers cannot mint
            Org credentials.
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        session_id:
          $ref: "#/components/schemas/SessionID"
        operations:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Operation"
        expires_at:
          type: string
          format: date-time
    CredentialIssuance:
      type: object
      required: [credential, secret, delivery_expires_at, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        secret:
          type: string
          writeOnly: true
        delivery_expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    CurrentIdentity:
      type: object
      required: [authentication]
      properties:
        authentication:
          type: object
          required: [credential_id, app_id, org_id, effective_profile, operations, method, assurance]
          properties:
            credential_id:
              $ref: "#/components/schemas/CredentialID"
            app_id:
              oneOf:
                - $ref: "#/components/schemas/AppID"
                - type: "null"
            org_id:
              oneOf:
                - $ref: "#/components/schemas/OrgID"
                - type: "null"
            effective_profile:
              $ref: "#/components/schemas/CredentialProfile"
            tenant_key:
              type: [string, "null"]
            session_id:
              oneOf:
                - $ref: "#/components/schemas/SessionID"
                - type: "null"
            operations:
              type: array
              items:
                $ref: "#/components/schemas/Operation"
            method:
              type: string
              enum: [api_key, issuer_token]
            assurance:
              type: string
              const: bearer
    ClientCurrentIdentity:
      type: object
      additionalProperties: false
      required: [authentication]
      properties:
        authentication:
          type: object
          additionalProperties: false
          required: [app_id, tenant_key, agent_key, agent_definition_id, agent_definition_revision, session_id, operations, method, assurance]
          properties:
            app_id: { $ref: "#/components/schemas/AppID" }
            tenant_key: { type: string }
            agent_key: { type: string }
            agent_definition_id: { $ref: "#/components/schemas/AgentDefinitionID" }
            agent_definition_revision: { type: integer, minimum: 1 }
            session_id:
              oneOf:
                - $ref: "#/components/schemas/SessionID"
                - type: "null"
            operations:
              type: array
              items: { $ref: "#/components/schemas/Operation" }
            method: { type: string, const: client_token }
            assurance: { type: string, const: bearer }
    CurrentIdentityResponse:
      oneOf:
        - $ref: "#/components/schemas/CurrentIdentity"
        - $ref: "#/components/schemas/ClientCurrentIdentity"
  responses:
    InvalidRequest:
      description: The request is invalid or contains a deferred field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: tools[0].mode must be host.
            request_id: req_01K0NV9K7Z9WR3Y3Q3RMV2G7H0
            details:
              path: /tools/0/mode
    Unauthenticated:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unauthenticated
            message: A valid API credential is required.
            request_id: req_01K0NVA1K5T8Y1MBVX7TZBM21H
    Forbidden:
      description: The authenticated credential is not permitted to make this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: forbidden
            message: The requested tenant_key conflicts with the credential constraint.
            request_id: req_01K0NVAE24H917QNE9P1QMX95Y
    NotFound:
      description: The resource is missing or cannot be disclosed in this scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: not_found
            message: The requested resource was not found.
            request_id: req_01K0NVASB4CF29K41VZA271H23
    Conflict:
      description: The resource state conflicts with the requested lifecycle transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invocation_not_paused
            message: The Invocation is not paused on a turn-level budget.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    AppArchived:
      description: |
        The App is archived, so admission and grant-minting are closed. Reads,
        settlement of running work, erasure, configuration, and revocation are
        unaffected; restore reopens the App.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: app_archived
            message: The App is archived. Existing work can finish and be read, but no new work or grants are admitted.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97T
            details:
              app_id: app_019b0a12-8d51-7f34-aed2-0e07c1bdb320
    OrgArchived:
      description: The Org is archived and admits no new App or Org-bound credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: org_archived
            message: The Org is archived and admits no new Apps or credentials.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97U
            details:
              org_id: org_019b0a12-8d51-7f34-aed2-0e07c1bdb321
    RateLimited:
      description: A durable App, tenant, or opaque-user admission limit refused fresh work, or deployment ingress rate limited the request. No Invocation is created.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before the caller should retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: rate_limited
            message: Too many requests.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    Internal:
      description: An unexpected server error occurred before acknowledgement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal
            message: The request could not be completed.
            request_id: req_01K0NVB8MJPBPQY0WXFJGCXEH3
    Unavailable:
      description: nvoken cannot serve this request right now. Retry with backoff.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unavailable
            message: The service is temporarily unavailable.
            request_id: req_01K0NVBGWQ1V6JJBVH0Q4WZRS1
    MCPDiscoveryFailed:
      description: nvoken could not safely reach the remote MCP server or read its tool list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: mcp_discovery_failed
            message: The remote MCP server could not be discovered.
            request_id: req_01K0NVCPKYGE1D64K9DXMZ7J64
