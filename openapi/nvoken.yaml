  /v1/apps:
    get:
      tags:
        - Apps
      operationId: listApps
      summary: List registered apps
      description: |
        Returns the Apps this caller can see. An App key sees only that App,
        an Org console presentation sees the Apps contained by its Org, and an
        installation-admin key sees every registered App.
        An exact `external_ref` filter narrows that visible set during the
        staged console migration. Archived Apps are excluded unless `status`
        asks for them.
      parameters:
        - name: external_ref
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Return only apps whose `external_ref` equals this value.
        - $ref: '#/components/parameters/ArchiveStatus'
      responses:
        '200':
          description: The apps visible to the authenticated credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags:
        - Apps
      operationId: registerApp
      summary: Register an app
      description: |
        Registers one host application, returning the generated `app_id` and
        independent callback and webhook HMAC keys. Tenants are interned by
        the first request that names one, so a new App has none. The
        plaintext signing keys are returned only in this response; store
        them in the receiver's secret manager. nvoken stores only
        authenticated ciphertext and selects a key from the durable App
        scope of each delivery. Registration is unavailable when the
        service's encryption keyring is not configured.

        Registration requires an Org console presentation or installation-admin
        key; an App key cannot mint siblings. Org callers always create
        Apps in their own Org and may omit `org_id`. Installation machine
        credentials may choose any registered Org or temporarily leave
        ownership unset during the staged console migration. An installation
        issuer token requires `admin: true` to assign an Org. Names identify
        Apps and are unique, so re-registering an existing name is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAppRequest'
      responses:
        '201':
          description: |
            The registered app and its one-time receiver signing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRegistration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OrgArchived'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/apps/{app_id}:
    get:
      tags:
        - Apps
      operationId: getApp
      summary: Get one app
      description: >
        Returns one registered App. App keys and Org console presentations
        receive

        `404` for Apps outside their durable containment boundary.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      responses:
        '200':
          description: The requested app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags:
        - Apps
      operationId: updateApp
      summary: Update an app
      description: >
        Updates an App's display name, callback timeout, browser configuration,

        anonymous access mode, or credit policy. An installation administrator
        may also transfer the

        App to another registered Org by changing `org_id`.

        Org- and App-scoped callers receive `404` outside their containment

        boundary, and cannot move an App. The unique `name` and transitional

        `external_ref` cannot be changed.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        '200':
          description: The updated app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrgArchived'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags:
        - Apps
      operationId: archiveApp
      summary: Archive an app
      description: >
        Marks the App out of service. Nothing is destroyed and no other

        resource's lifecycle changes: the App's credentials keep

        authenticating, its client keys stay registered, and its Agents and

        AgentRevisions are untouched.


        While archived, exactly these operations return `409 app_archived`:

        Conversation create, Turn create, Turn resume, Agent create

        and revision publication, client-key create, App-bound credential

        issuance, provider-key create, and credit allocation. Everything else

        behaves as on a live App — reads and lists, cancel, interrupt, nudges,

        tool-result submission, Conversation update and erasure, App `PATCH`,
        and

        credential, client-key, and provider-key rotation and revocation — so a

        draining host can let running turns settle and then clean up. Usage

        reporting keeps counting the App's spend.


        Archiving requires the same authority as updating the App: an Org or

        installation credential. A credential bound to the App cannot archive

        or restore it. Repeating the call is a successful no-op.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      responses:
        '204':
          description: The App is archived.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/apps/{app_id}/restore:
    post:
      tags:
        - Apps
      operationId: restoreApp
      summary: Restore an archived app
      description: |
        Clears the App's archive tombstone and reopens admission. Nothing else
        is restored, and the App's Org may still be archived. Restoring a live
        App is a successful no-op.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      responses:
        '204':
          description: The App is live.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/apps/{app_id}/anonymous-tokens:
    post:
      tags:
        - Apps
      operationId: issueAnonymousToken
      summary: Mint anonymous browser access for one configured App
      description: >
        Public, credential-free exchange for Apps that explicitly enable

        anonymous access. The request must carry exactly one canonical Origin

        that appears in the App's browser allowlist. Browser JavaScript does

        not set this header; the user agent supplies the page's actual Origin.

        Omit `visitor_token` on a first visit; persist every successful returned

        visitor token as an opaque replacement and present it on renewal to

        preserve the same visitor partition, tenant-scoped Agent, fixed

        thirty-day expiry, allowance, and canonical Conversation. Never discard
        a

        stored visitor token only because a network, `429`, or `5xx` response

        occurred.


        Reuse one `Idempotency-Key` while retrying the same logical exchange.

        Exact retries recover the same visitor result without another rate

        slot; changed input conflicts. The access token lasts at most 15

        minutes and never beyond visitor expiry. Responses are exact-origin

        CORS-enabled and use `Cache-Control: no-store`. Neither opaque token

        proves a human identity or supports individual revocation.
      security: []
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: One canonical browser origin configured on the App.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousTokenRequest'
      responses:
        '201':
          description: >-
            Fresh access and renewable visitor tokens plus the remembered
            Conversation when one exists.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousTokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The App is archived or this idempotency key was used with different
            input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/apps/{app_id}/client-keys:
    get:
      tags:
        - Apps
      operationId: listAppClientKeys
      summary: List an App's client-token verification keys
      description: >
        Lists the App's Ed25519 client-token verification-key records in
        creation

        order. Responses contain only the generated key ID, display name,

        SHA-256 fingerprint, and creation time; public-key bytes are never

        returned. This route requires the same host App-write authority

        as updating the visible App. Cross-App targets return `404`.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      responses:
        '200':
          description: The registered client keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientKeyList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags:
        - Apps
      operationId: createAppClientKey
      summary: Register an Ed25519 client-token verification key
      description: |
        Registers one standard-base64-encoded, exactly 32-byte Ed25519 public
        key. nvoken stores no seed or private key and never returns the public
        bytes. At most five keys may exist for one App so hosts can overlap a
        bounded rotation. Duplicate public bytes within one App are rejected;
        another App may independently register the same bytes.

        A conforming App-issued JWT signed by an active key is accepted by the
        browser-direct runtime boundary.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AppID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientKeyRequest'
      responses:
        '201':
          description: The registered client-key record without key material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AppArchived'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/apps/{app_id}/client-keys/{key_id}:
    delete:
      tags:
        - Apps
      operationId: revokeAppClientKey
      summary: Revoke an App client-token verification key
      description: |
        Deletes only the named App-owned verification record. A repeated,
        unknown, or cross-App key ID returns the same `404`. Agent revisions
        and App configuration are never changed by revocation.
      parameters:
        - name: app_id
          in: path
          required: true
