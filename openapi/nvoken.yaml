            $ref: '#/components/schemas/ProviderKeyScope'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - revoked
        - name: tenant_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: cursor
          in: query
          description: >-
            Opaque continuation cursor bound to the effective scope, filters,
            and limit.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
