        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Agent Definitions]
      operationId: createAgentDefinition
      summary: Create an Agent Definition resource
      description: |
        Creates a stable App-owned resource at revision 1. Equal content in a
        separate create gets a separate ID. Retry the same canonical request
        with the same `Idempotency-Key` to receive the original revision-1
        resource; changing the request under that key conflicts.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDefinitionWrite"
            examples:
              supportDefinition:
                value:
                  instructions: You are a concise billing support agent.
                  model:
                    provider: anthropic
                    id: claude-sonnet-5
      responses:
        "201":
          description: The new or idempotently replayed revision-1 resource.
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag containing the current decimal revision in quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinitionResource"
