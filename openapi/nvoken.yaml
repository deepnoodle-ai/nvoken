        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPListToolsRequest"
      responses:
        "200":
          description: |
            The tools this server offers, named as the model will see them, plus
            any that were excluded and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPListToolsResponse"
        "400":
