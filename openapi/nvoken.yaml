    TurnMemorySelection:
      oneOf:
        - $ref: '#/components/schemas/NoTurnMemory'
        - $ref: '#/components/schemas/UserTurnMemory'
        - $ref: '#/components/schemas/TenantTurnMemory'
      discriminator:
        propertyName: scope
        mapping:
          none: '#/components/schemas/NoTurnMemory'
          user: '#/components/schemas/UserTurnMemory'
          tenant: '#/components/schemas/TenantTurnMemory'
    NoTurnMemory:
      type: object
      additionalProperties: false
