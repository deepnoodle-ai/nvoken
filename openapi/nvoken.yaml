        - $ref: '#/components/parameters/UsageProviderKeyIDFilter'
        - $ref: '#/components/parameters/UsageCredentialFamilyIDFilter'
        - $ref: '#/components/parameters/UsageAuthenticationMethodFilter'
        - $ref: '#/components/parameters/UsageCallKindFilter'
        - $ref: '#/components/parameters/UsageToolNameFilter'
        - $ref: '#/components/parameters/UsageToolModeFilter'
