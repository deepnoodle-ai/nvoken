    CreditAllocationID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    AllocateCreditsRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_key
        - amount
        - idempotency_key
      properties:
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: '#/components/schemas/Money'
        reference:
          type: string
          minLength: 1
          maxLength: 255
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      description: |
        `tenant_key` names the account. Amount must be positive USD with
        exactly six fractional digits. The optional reference is host-owned
        correlation text, not payment-provider state.
    CreditAccount:
      type: object
      additionalProperties: false
      required:
        - tenant_key
        - allocated
        - used
        - held
        - available
        - budget_hold_turns
        - created_at
        - updated_at
      properties:
        tenant_key:
          type: string
        allocated:
          $ref: '#/components/schemas/Money'
        used:
          $ref: '#/components/schemas/Money'
        held:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
          description: max(0, allocated - used - held).
        budget_hold_turns:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: |
        One tenant's persistent, non-expiring spending capacity. These exact
        USD counters are enforcement facts, not an invoice or payment record.
        Deleting runtime transcripts never restores used credits.
    CreditAllocation:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_key
        - amount
        - reference
        - created_by
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/CreditAllocationID'
        tenant_key:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        reference:
          oneOf:
            - type: string
            - type: 'null'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      description: |
        One append-only addition to a tenant's credit account. Allocations are
        never rewritten or deleted by this API.
    AllocateCreditsResult:
      type: object
      additionalProperties: false
      required:
        - allocation
        - account
      properties:
        allocation:
          $ref: '#/components/schemas/CreditAllocation'
        account:
          $ref: '#/components/schemas/CreditAccount'
    CreditAccountList:
      type: object
