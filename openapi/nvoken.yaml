      operationId: listProviderKeys
      summary: List reusable provider key metadata
      description: >-
        Full and read-only App keys may read metadata in their App; secret
        material is never readable.
      parameters:
        - name: provider
          in: query
          schema:
            $ref: '#/components/schemas/ModelProvider'
        - name: scope
          in: query
