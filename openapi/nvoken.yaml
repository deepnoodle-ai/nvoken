  /v1/conversations/{conversation_id}/fork:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      tags:
        - Conversations
      operationId: forkConversation
      summary: Fork a Conversation through one message
      description: |
        Copies the public transcript prefix through `from_message_id` into a
        new Conversation in the explicitly requested owner namespace. Source
        lineage never supplies or implies the target owner. The source and
        target remain inside the same tenant, while the target may deliberately
        select tenant or user ownership.

        This is a trusted-host operation. Browser client and anonymous tokens
        cannot fork Conversations. `Idempotency-Key` is scoped to the source
        tenant: an exact retry returns the original fork, while reuse with a
        different material request returns `idempotency_conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkConversationRequest'
      responses:
        '201':
          description: >-
            The new Conversation, or the original result of an exact idempotent
            retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
