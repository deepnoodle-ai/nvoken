  /v1/invocations/{invocation_id}/stream:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    get:
      tags: [Invocations]
      operationId: streamInvocation
      summary: Follow one turn over Server-Sent Events
      description: |
        Follows one turn as it runs, and can be resumed after a dropped
        connection. Pass `cursor` to pick up after a position you already
        received; the stream replays everything saved since then, then
        continues live until the turn finishes.

        Saved updates carry an SSE `id` — that is your resume position, and
        the only value you need to store. Live text previews and control
        frames carry no `id` because they are not saved state. If you receive
        `stream.resync`, discard the preview text you have accumulated and
        wait for the saved messages; previews can be lost, saved updates
        cannot.

        The `cursor` query parameter wins over the `Last-Event-ID` header.
        `stream.end` with reason `rotate` means the server is cycling the
        connection — reconnect using your last saved `id`. Set `deltas=false`
        to skip previews; nothing about replay, resumption, or how the stream
        ends changes.

        Disconnecting never cancels the turn. It keeps running, and you can
        reconnect or read it later.

        Client-token streams omit `thinking.delta` previews even when
        `deltas=true`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: deltas
          in: query
          description: Include id-less output and thinking preview frames. Client tokens receive output previews only. Defaults to true.
          schema:
            type: boolean
            default: true
        - name: Last-Event-ID
          in: header
          description: Opaque cursor from the last durable frame; ignored when `cursor` is supplied.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Invocation-scoped event stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/InvocationStreamResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations/{invocation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    post:
      tags: [Invocations]
      operationId: cancelInvocation
      summary: Stop a turn and discard its work
      description: |
        Stops a turn and discards what it produced. The turn ends `cancelled`
        and its work does not carry into the next turn — use interrupt instead
        if you want to keep it.

        Safe to repeat. Cancelling a turn that already finished returns it
        unchanged rather than failing. A successful response means the
        cancellation is recorded and will stick. Work already sent to the
        model provider stops as soon as it can, so you may still be billed for
        what had run by then.

        Send an empty request body.
      responses:
        "200":
          description: The turn's final state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations/{invocation_id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    post:
      tags: [Invocations]
      operationId: interruptInvocation
      summary: Stop a turn but keep what it produced
      description: |
        Asks a running turn to stop at its next clean stopping point. It ends
        `completed` with `stop_reason: interrupted`, and everything it
        produced — the model's replies and any tool results — stays in the
        conversation for the next turn. That is the whole difference from
        cancelling, which throws the turn's work away.

        The request is recorded and safe to repeat. What happens next depends
        on what the turn was doing:

        - Between steps (`queued`, `waiting`, or `running` with nothing
          actively executing) it stops before this call returns. Any tool
          calls you still owed results for are closed out, so submitting one
          afterwards returns `409`.
        - Mid-step, nvoken records the request and returns the turn still
          `running`. It stops at the next checkpoint, at worst one model call
          later. Watch the stream or re-read the turn to see it end.

        Interrupting a turn that has already finished changes nothing and
        returns it as-is. A turn that was asked for structured output but
        never produced a valid object ends `failed` with
        `structured_output_unsatisfied` rather than `completed`. Either way
        usage is reported in full and billed, because the work was kept.

        Send an empty request body.
      responses:
        "200":
          description: The turn's state after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations/{invocation_id}/resume:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    post:
      tags: [Invocations]
      operationId: resumeInvocation
      summary: Raise a paused turn's limit and continue it
      description: |
        Continues a turn that paused because one of its own spending limits
        ran out. Send `limits` containing only the limit that ran out, raised
        above both its old value and what the turn has already used, and still
        within what your installation allows.

        If the turn paused on the Session maximum estimated cost rather than
        its own limit, raise or remove that Session cap instead — this endpoint
        will not resume it. Deadlines never pause a turn, so they never bring
        you here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeInvocationRequest"
      responses:
        "202":
          description: The turn, queued to continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The Invocation is not paused on a raisable ceiling, or the App is
            archived (`app_archived`): a paused Invocation on an archived App
            can be cancelled, not continued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/invocations/{invocation_id}/nudges:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    post:
      tags: [Invocations]
      operationId: createNudge
      summary: Send extra direction to a running turn
      description: |
        Sends extra direction to a turn that is already running — "focus on
        the marine segment" — without stopping it and without losing the work
        you are steering. Use this when a long turn is heading the wrong way
        and you want to correct it in place.

        Compare with `if_active: supersede` on a new Invocation, which
        replaces the running turn and discards what it had produced. Steering
        a long turn that way throws away exactly the work you were trying to
        redirect.

        **A nudge is not an interrupt, and it is not immediate.** The turn
        picks it up at its next clean stopping point: when it starts its next
        step, when it pauses for you to run a tool, or when a turn that
        thought it was finished re-enters its loop to answer you. A model call
        or tool run already in flight is never aborted to deliver it. A turn
        you have interrupted is never given more work — the interrupt wins and
        the direction you staged expires unused.

        Nudges and Invocations never turn into each other. Posting to
        `/v1/invocations` against a busy Session behaves exactly as its
        `if_active` setting says; it never quietly becomes a nudge, and a
        nudge never quietly becomes a new turn.

        If the turn ends without ever picking it up, your Nudge is marked
        `expired` at that moment and has no effect on any later turn. Check
        `GET .../nudges` to see whether it was used or missed. Whether
        to re-send missed direction as the next turn's input is your call.

        `content` must be text — a string, or an array of text blocks. Images
        and documents are fine on a turn's own input but are refused here,
        because a turn resuming in place carries text only, and silently
        dropping your attachment would be worse than telling you now.

        Requires the same permission as cancelling the turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNudgeRequest"
            example:
              content: Focus on the marine segment for the rest of this pass.
              idempotency_key: nudge-1
      responses:
        "202":
          description: Your direction is queued. The turn will pick it up at its next stopping point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NudgeAcknowledgement"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `invocation_not_active` when the Invocation is already terminal;
            `idempotency_conflict` when `idempotency_key` was already used with
            different content; `nudge_queue_full` when the Invocation already
            holds the maximum nudges, with the bound in
            `details.limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Invocations]
      operationId: listNudges
      summary: List Nudges for an Invocation
      description: |
        Lists the direction you have sent to this turn with `/nudges`, in the
        order the turn will pick it up. Entries stay listed after they are used
        or missed, so you can answer "what did the user say, and did the model
        ever see it?"

        Check `status` on each entry: `drained` means the turn used it,
        `expired` means the turn ended first, `cancelled` means you withdrew
        it.
      parameters:
        - name: status
          in: query
          description: Restrict to one status.
          schema:
            $ref: "#/components/schemas/NudgeStatus"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Maximum items in this page. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of Nudges in consumption order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NudgeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations/{invocation_id}/nudges/{nudge_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
      - $ref: "#/components/parameters/NudgeID"
    post:
      tags: [Invocations]
      operationId: cancelNudge
      summary: Withdraw a Nudge the turn has not taken
      description: |
        Withdraws direction you sent with `/nudges`, as long as the turn has not
        picked it up yet. Cancelling something already cancelled returns it
        unchanged, so retrying is safe.

        Cancelling races the turn, and whichever happens first wins outright:
        you either withdraw it cleanly or the turn uses it. It is never
        half-applied. If the turn got there first, you get a conflict and the
        entry stays `drained`.
      responses:
        "200":
          description: The nudge after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nudge"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `nudge_already_closed` when the nudge was already drained or
            expired. `details.nudge` carries its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invocations/{invocation_id}/tool-results:
    parameters:
      - $ref: "#/components/parameters/InvocationID"
    post:
      tags: [Invocations]
      operationId: submitHostToolResults
      summary: Submit durable results for pending host and callback ToolCalls
      description: |
        Atomically accepts one bounded batch for a waiting Invocation. The
        first committed result for each ToolCall wins. An equal replay is
        acknowledged as deduplicated; a changed replay conflicts. Partial
        batches leave the Invocation waiting. Closing the final pending call
        queues the same Invocation and its successor dispatch before
        returning `202`.

        This command accepts only host- or callback-mode calls owned by the path
        Invocation and authenticated tenant scope. It is not a generic
        Session append endpoint. The body is limited to 1 MiB; each result
        content value is valid JSON limited to 256 KiB and 32 nesting levels.

        `content` accepts any JSON value and the stored transcript retains it
        verbatim. Before a result reaches the model, a string or an array of
        content blocks passes through unchanged; any other value is
        serialized to its compact JSON text and sent as a string, so the
        model sees the same bytes a host that pre-stringifies would send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitHostToolResultsRequest"
            example:
              results:
                - tool_call_id: call_019b0a12-9e61-7144-bed2-0e07c1bdb333
                  content:
                    order_id: order-123
                    state: ready
                - tool_call_id: call_019b0a12-af71-7254-8ed2-0e07c1bdb344
                  content:
                    delivered: false
                  is_error: true
      responses:
        "202":
          description: The complete batch committed, possibly as equal replays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitHostToolResultsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Invocation cannot accept the supplied result batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notWaiting:
                  value:
                    code: invocation_not_waiting
                    message: The Invocation is not waiting for this tool result.
                    request_id: req_01K0NV8AJQ9FB89N5MZ5HDZDR3
                conflict:
                  value:
                    code: tool_result_conflict
                    message: A different result was already accepted for this ToolCall.
                    request_id: req_01K0NV8AJQ9FB89N5MZ5HDZDR3
                expired:
                  value:
                    code: tool_result_expired
                    message: The tool result deadline has expired.
                    request_id: req_01K0NV8AJQ9FB89N5MZ5HDZDR3
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admissions:
    get:
      tags: [Admissions]
      operationId: listAdmissions
      summary: List attempts to start a turn, admitted and refused
      description: |
        Every request to create an Invocation leaves one record here, whether
        or not an Invocation was created. Newest first.

        This is the surface for a turn that never became an Invocation. A
        refusal aborts the admission transaction, which also discards the
        tenant it interned along the way, so before this log a refused request
        left nothing behind anywhere: no Invocation, no tenant, no spend. The
        record is written after that transaction resolves, so the rollback no
        longer takes the evidence with it.

        `tenant_key` is the key the caller sent, not a resolved reference. For
        a refusal it is usually a key nvoken has never interned -- which is
        exactly the point when a host derives tenant keys and one of them is
        subtly wrong.

        Records are diagnostics, not accounting evidence: they age out after
        30 days, while the retained usage facts they sit beside never do.
      parameters:
        - name: outcome
          in: query
          description: Limit to admitted or refused attempts.
          schema:
            $ref: "#/components/schemas/AdmissionOutcome"
        - name: error_code
          in: query
          description: Limit to one refusal code, for example `insufficient_credits`.
          schema: { type: string, maxLength: 64 }
        - $ref: "#/components/parameters/TenantKeyFilter"
        - $ref: "#/components/parameters/UserKeyFilter"
        - name: start_at
          in: query
          description: Inclusive RFC 3339 lower bound on `attempted_at`.
          schema: { type: string, format: date-time }
        - name: end_at
          in: query
          description: Exclusive RFC 3339 upper bound on `attempted_at`.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page of admission attempts, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionAttemptList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admissions/summary:
    get:
      tags: [Admissions]
      operationId: summarizeAdmissions
      summary: Count a window of admission attempts by outcome, reason, and key
      description: |
        The counts behind the log. `GET /v1/admissions` answers "what happened
        to this request"; this answers the question that comes first and that a
        page of records cannot: "is anything being refused at all".

        A host whose turns are failing has no reason to open a request log it
        does not know it needs, so this is the number worth putting somewhere
        an operator already looks.

        `reasons` covers every refusal in the window -- the error codes are a
        small fixed vocabulary. `tenants` is truncated to the ten keys refused
        most, and lists raw keys rather than tenants, because the key with no
        tenant behind it is the one worth seeing.
      parameters:
        - name: start_at
          in: query
          description: |
            Inclusive RFC 3339 lower bound. Defaults to 24 hours ago; the
            window is always bounded, since an unbounded count would change
            meaning silently as records age out.
          schema: { type: string, format: date-time }
        - name: end_at
          in: query
          description: Exclusive RFC 3339 upper bound. Defaults to now.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Counts over the requested window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List the App's interned tenants
      description: |
        One row per tenant key nvoken has interned for this App, with its
        credit position and the last time it ran a turn.

        A tenant row is an interning of a key, not tenant state: nvoken stores
        no configuration, profile, or entitlement for it. What this list
        reports is therefore what is attached to the key, not what is
        configured on it.

        A key that has only ever been refused does not appear here, because it
        was never interned. Those keys are in `GET /v1/admissions`, and the
        difference between the two lists is the set of tenants a host is
        addressing but has never successfully run.
      parameters:
        - $ref: "#/components/parameters/TenantKeyFilter"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: One page of tenants, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/tenants/{tenant_id}:
    delete:
      tags: [Tenants]
      operationId: deleteTenant
      summary: Delete a tenant that never ran anything
      description: |
        Removes a tenant along with the credit account and allocations that
        belong to it alone. It exists to undo a mistake -- a key funded with a
        typo in it, a tenant created by a misconfigured client -- and is
        deliberately narrow.

        A tenant with any Session, Invocation, retained model-call fact,
        provider key, or dispatch is refused with `409 tenant_in_use` and the
        counts that made it load-bearing. This is not a policy choice: every
        runtime table references `tenants` with ON DELETE RESTRICT, and the
        retained usage facts must outlive the transcripts they describe, so
        deleting a tenant that has run work would mean destroying accounting
        evidence. To remove transcripts, delete the Sessions; the facts and
        their spend stay.

        The default tenant is never deletable. Deleting a funded tenant
        destroys its allocation history, and allocations cannot be recreated
        with their original identity, so the released amount is written to the
        operator log at deletion.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TenantID" }
      responses:
        "204": { description: The tenant and its credit state were removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The tenant has runtime history, or is the default tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/credits:
    get:
      tags: [Credits]
      operationId: listCreditAccounts
      summary: List tenant credit accounts
      description: Returns non-expiring credit accounts inside the authenticated App and tenant constraint.
      parameters:
        - { $ref: "#/components/parameters/TenantKeyFilter" }
        - name: default_tenant
          in: query
          schema: { type: boolean }
          description: Select the App's default tenant account. Mutually exclusive with tenant_key.
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Credit accounts ordered newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditAccountList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/credits/allocations:
    get:
      tags: [Credits]
      operationId: listCreditAllocations
      summary: List credit allocations
      description: Returns append-only credit allocations inside the authenticated App and tenant constraint.
      parameters:
        - { $ref: "#/components/parameters/TenantKeyFilter" }
        - name: default_tenant
          in: query
          schema: { type: boolean }
          description: Select the App's default tenant allocations. Mutually exclusive with tenant_key.
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Credit allocations ordered newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditAllocationList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Credits]
      operationId: allocateCredits
      summary: Add credits to one tenant account
      description: |
        Atomically appends a positive allocation and adds it to the selected
        tenant's non-expiring credit account. An identical idempotent retry
        returns the original allocation and current account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocateCreditsRequest"
      responses:
        "201":
          description: Credits allocated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocateCreditsResult"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            The idempotency key was already used with different allocation
            inputs, or the App is archived (`app_archived`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/provider-keys:
    get:
      tags: [Provider keys]
      operationId: listProviderKeys
      summary: List reusable provider key metadata
      description: Viewer, Runtime, and Operator profiles may read metadata within their exact scope; secret material is never readable.
      parameters:
        - name: provider
          in: query
          schema:
            $ref: "#/components/schemas/ModelProvider"
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/ProviderKeyScope"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, revoked]
        - name: tenant_key
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: cursor
          in: query
          description: Opaque continuation cursor bound to the effective scope, filters, and limit.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Bounded provider key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Provider keys]
      operationId: createProviderKey
      summary: Create one reusable provider key
      description: |
        Creates encrypted app or tenant BYOK. App scope requires an
        unconstrained Operator credential inside the app; the credential is
        shared by every tenant of that app and by no other app. A
        tenant-constrained Runtime credential may manage only its exact tenant
        partition. The response contains metadata only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderKeyRequest"
      responses:
        "201":
          description: Provider key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            The idempotency key changed nonsecret request metadata, an active
            provider key already exists, or the App is archived
            (`app_archived`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/provider-keys/{provider_key_id}:
    parameters:
      - $ref: "#/components/parameters/ProviderKeyID"
    get:
      tags: [Provider keys]
      operationId: getProviderKey
      summary: Read provider key metadata
      description: Viewer, Runtime, and Operator profiles may read secret-free metadata within their exact scope.
      responses:
        "200":
          description: Provider key metadata without secret material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Provider keys]
      operationId: revokeProviderKey
      summary: Revoke a provider key and destroy live encrypted versions
      responses:
        "200":
          description: Revoked provider key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/provider-keys/{provider_key_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ProviderKeyID"
    post:
      tags: [Provider keys]
      operationId: rotateProviderKey
      summary: Rotate a provider key
      description: Replaces the active version, optionally preserving a bounded overlap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateProviderKeyRequest"
      responses:
        "200":
          description: Current provider key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The rotation idempotency key names another provider key or changed expiry or overlap metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/provider-keys/{provider_key_id}/usage:
    parameters:
      - $ref: "#/components/parameters/ProviderKeyID"
    get:
      tags: [Provider keys]
      operationId: getProviderKeyUsage
      summary: Read the token usage rollup for one provider key
      description: |
        Totals usage for one provider key across every turn that used it: how
        many turns, when a model call last used it, and the combined token and
        cost totals.

        Calculated from retained model-call facts each time you ask, so
        deleting Sessions does not lower historical numbers.
      responses:
        "200":
          description: Aggregated usage attributed to the provider key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyUsage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/usage/timeseries:
    get:
      tags: [Usage]
      operationId: getUsageTimeseries
      summary: Read usage totals and sparse time buckets
      description: |
        Returns activity, model, tool, and model-cost metrics from retained,
        content-free facts. The half-open window totals use exact distinct
        counts and are not sums of bucket distincts. Grouping is bounded to ten
        selected series plus `other`. Session deletion does not rewrite history.
        An App credential is forced to its App, an Org credential to Apps
        currently owned by its Org, and only an installation-scoped admin
        issuer token can span every App.
      parameters:
        - { $ref: "#/components/parameters/UsageStartAt" }
        - { $ref: "#/components/parameters/UsageEndAt" }
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UsageInterval" }
        - name: timezone
          in: query
          schema: { type: string, default: UTC }
          description: IANA timezone used for bucket boundaries.
        - { $ref: "#/components/parameters/UsageAppIDFilter" }
        - { $ref: "#/components/parameters/TenantKeyFilter" }
        - { $ref: "#/components/parameters/UserKeyFilter" }
        - { $ref: "#/components/parameters/UsageAgentIDFilter" }
        - { $ref: "#/components/parameters/UsageProviderFilter" }
        - { $ref: "#/components/parameters/UsageModelFilter" }
        - { $ref: "#/components/parameters/UsageProviderKeySourceFilter" }
        - { $ref: "#/components/parameters/UsageProviderKeyIDFilter" }
        - { $ref: "#/components/parameters/UsageCredentialFamilyIDFilter" }
        - { $ref: "#/components/parameters/UsageAuthenticationMethodFilter" }
        - { $ref: "#/components/parameters/UsageCallKindFilter" }
        - { $ref: "#/components/parameters/UsageToolNameFilter" }
        - { $ref: "#/components/parameters/UsageToolModeFilter" }
        - name: group_by
          in: query
          schema: { type: string, enum: [tenant_key, agent_id, model, tool_name, authentication_method] }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 10 }
        - name: keys
          in: query
          schema: { type: string }
          description: Comma-separated explicit series keys, maximum ten; mutually exclusive with top.
      responses:
        "200":
          description: Normalized window, exact totals, and sparse buckets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageTimeseries" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/usage/breakdown:
    get:
      tags: [Usage]
      operationId: getUsageBreakdown
      summary: Rank usage by one dimension
      parameters:
        - { $ref: "#/components/parameters/UsageStartAt" }
        - { $ref: "#/components/parameters/UsageEndAt" }
        - { $ref: "#/components/parameters/UsageAppIDFilter" }
        - { $ref: "#/components/parameters/TenantKeyFilter" }
        - { $ref: "#/components/parameters/UserKeyFilter" }
        - { $ref: "#/components/parameters/UsageAgentIDFilter" }
        - { $ref: "#/components/parameters/UsageProviderFilter" }
        - { $ref: "#/components/parameters/UsageModelFilter" }
        - { $ref: "#/components/parameters/UsageProviderKeySourceFilter" }
        - { $ref: "#/components/parameters/UsageProviderKeyIDFilter" }
        - { $ref: "#/components/parameters/UsageCredentialFamilyIDFilter" }
        - { $ref: "#/components/parameters/UsageAuthenticationMethodFilter" }
        - { $ref: "#/components/parameters/UsageCallKindFilter" }
        - { $ref: "#/components/parameters/UsageToolNameFilter" }
        - { $ref: "#/components/parameters/UsageToolModeFilter" }
