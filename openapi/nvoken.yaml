    TurnInput:
      description: |
        A plain string is shorthand for one text block; an array is ordered
        multi-block input mixing text, images, and documents. Both normalize
        to the same stored message and are therefore equal for idempotency.
        At most 8 blocks may carry media, and their decoded payloads must
        total at most 16777216 bytes.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InputBlock'
    InputBlock:
      oneOf:
        - $ref: '#/components/schemas/TextInputBlock'
        - $ref: '#/components/schemas/ImageInputBlock'
        - $ref: '#/components/schemas/DocumentInputBlock'
      description: |
        One caller-input block. A block carries text, an image, or a document;
        the members of one type are never valid on another.
    ImageInputBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - source
      properties:
        type:
          type: string
          enum:
            - image
          x-enum-varnames:
            - InputTypeImage
        source:
          $ref: '#/components/schemas/ImageInputSource'
      description: |
        An image, sent inline or by URL. A URL is downloaded once as the turn
        is created; nvoken stores those bytes and never fetches the URL again,
        so the image stays stable even if the link later changes or breaks.
        The image must be at most 5 MB and 8000 by 8000 pixels, and the model
        you selected must support images and this exact media type. nvoken
        determines the real type from the bytes themselves rather than
        trusting the declared type or the file extension.
    ImageInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum:
            - image/gif
            - image/jpeg
            - image/png
            - image/webp
          x-enum-varnames:
            - ImageGIF
            - ImageJPEG
            - ImagePNG
            - ImageWEBP
        data:
          type: string
          minLength: 1
          maxLength: 6990508
          description: |
            Standard padded base64 with no whitespace. Mutually exclusive with
            url.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |
            A public HTTPS URL, downloaded once as the turn is created. nvoken
            stops reading if the response runs past the size limit, and
            determines the real media type from the bytes it received.
            `media_type` is optional here; if you do send it, it must match
            what the bytes actually are.
    DocumentInputBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - source
      properties:
        type:
          type: string
          enum:
            - document
          x-enum-varnames:
            - InputTypeDocument
        source:
          $ref: '#/components/schemas/DocumentInputSource'
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional filename supplied to providers that require one. Omission
            uses the adapter default and does not change acceptance.
      description: |
        A document, sent inline or by URL. A URL is downloaded once as the
        turn is created; nvoken stores those bytes and never fetches the URL
        again. Same rules as an image, with a 16 MB limit. Page count is
        capped by the provider rather than by nvoken, so a document with too
        many pages fails the turn with `input_media_rejected`.
    DocumentInputSource:
      type: object
      additionalProperties: false
      description: |
        Exactly one source form is required. Inline sources carry media_type
        and data. URL sources carry url and may declare media_type.
      properties:
        media_type:
          type: string
          enum:
            - application/pdf
          x-enum-varnames:
            - DocumentPDF
        data:
          type: string
          minLength: 1
          maxLength: 22369624
          description: Standard padded base64 with no whitespace.
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https://
          description: |
            A public HTTPS URL, downloaded once as the turn is created. nvoken
            stops reading if the response runs past the size limit, and
            determines the real media type from the bytes it received.
            `media_type` is optional here; if you do send it, it must be
            `application/pdf`.
    EffectiveBehavior:
      description: Turn-owned normalized behavior after any permitted limit narrowing.
      $ref: '#/components/schemas/BehaviorInput'
    TurnBehaviorSource:
      oneOf:
        - $ref: '#/components/schemas/StoredTurnBehaviorSource'
        - $ref: '#/components/schemas/InlineTurnBehaviorSource'
      discriminator:
        propertyName: kind
        mapping:
          agent_revision: '#/components/schemas/StoredTurnBehaviorSource'
          inline: '#/components/schemas/InlineTurnBehaviorSource'
    StoredTurnBehaviorSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - agent_id
        - agent_revision_id
        - revision
      properties:
        kind:
          type: string
          const: agent_revision
        agent_id:
          $ref: '#/components/schemas/AgentID'
        agent_revision_id:
          $ref: '#/components/schemas/AgentRevisionID'
        revision:
          $ref: '#/components/schemas/AgentRevisionNumber'
    InlineTurnBehaviorSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - digest
      properties:
        kind:
          type: string
          const: inline
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    MCPServerHeaders:
      type: object
      additionalProperties: false
      required:
        - name
        - headers
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          pattern: ^[A-Za-z0-9_-]+$
          description: Exact name of one MCP server in the selected AgentRevision.
        headers:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: |
            Secret request headers, limited to 8 KiB encoded. Routing,
            framing, proxy, cookie, hop-by-hop, and MCP conversation headers are
            rejected. Headers are encrypted per Turn and never returned.
    ResumeTurnRequest:
      type: object
      additionalProperties: false
      required:
        - limits
      properties:
        limits:
          $ref: '#/components/schemas/Limits'
      description: |
        Replacement for the one turn-level consumption ceiling named by the
        held Turn's `stop_reason`. Exactly that field must be present
        and must be raised above both the previous ceiling and usage so far.
    TurnTrigger:
      type: object
      additionalProperties: false
      required:
        - type
        - parent_turn_id
        - tool_call_id
      properties:
        type:
          type: string
          enum:
            - tool_call
        parent_turn_id:
          $ref: '#/components/schemas/TurnID'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallID'
      description: >
        Immutable causal evidence for a child Turn. The ToolCall must

        belong to the named parent. The IDs remain readable after the source

        Conversation is erased; they do not imply cancellation, budget, or
        result

        propagation.
    TurnChildCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - open
        - failed
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        open:
          type: integer
          format: int64
          minimum: 0
          description: Direct children in any nonterminal status.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: Direct children whose status is `failed`.
      description: Direct-child counts; descendants are not folded in recursively.
    Turn:
      type: object
      additionalProperties: false
      description: |
        One durable Turn. Trusted reads include behavior details and all
        coordinates. A browser projection may omit machine-only fields while
        retaining this same response schema. An exact admission replay after
        content erasure returns a content-free projection with `deduplicated`
        and `erased_at`; content-bearing optional fields remain absent or null.
      required:
        - id
        - tenant_key
        - conversation_id
        - memory_space_id
        - status
        - stop_reason
        - attempt
        - error
        - structured_output
        - active_execution_ms
        - deadline_at
        - content_expires_at
        - created_at
        - updated_at
        - ended_at
        - tool_calls
      properties:
        id:
          $ref: '#/components/schemas/TurnID'
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        user_key:
          type:
            - string
            - 'null'
          description: Optional actor attributed to this Turn.
        behavior_source:
          $ref: '#/components/schemas/TurnBehaviorSource'
        effective_behavior:
          oneOf:
            - $ref: '#/components/schemas/BehaviorInput'
            - type: 'null'
          description: >-
            Present on point reads and results; null or omitted from list
            projections.
        effective_behavior_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
          description: Null for a standalone Turn.
        memory_space_id:
          oneOf:
            - $ref: '#/components/schemas/MemorySpaceID'
            - type: 'null'
        memory:
          oneOf:
            - $ref: '#/components/schemas/TurnMemorySelection'
            - type: 'null'
          description: The resolved memory selection; null means no MemorySpace.
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        triggered_by:
          oneOf:
            - $ref: '#/components/schemas/TurnTrigger'
            - type: 'null'
        child_turn_counts:
          $ref: '#/components/schemas/TurnChildCounts'
        context:
          type:
            - array
            - 'null'
          maxItems: 8
          items:
            $ref: '#/components/schemas/TurnContextItem'
        deduplicated:
          type: boolean
          description: Present only on admission responses.
        status:
          $ref: '#/components/schemas/TurnStatus'
        stop_reason:
          oneOf:
            - $ref: '#/components/schemas/TurnStopReason'
            - type: 'null'
        credit_block:
          oneOf:
            - $ref: '#/components/schemas/CreditBlock'
            - type: 'null'
        attempt:
          type: integer
          minimum: 0
        error:
          oneOf:
            - $ref: '#/components/schemas/TurnFailure'
            - type: 'null'
        usage:
          oneOf:
            - $ref: '#/components/schemas/ModelUsage'
            - type: 'null'
        provenance:
          oneOf:
            - $ref: '#/components/schemas/ModelProvenance'
            - type: 'null'
        structured_output:
          type:
            - object
            - 'null'
          additionalProperties: true
        structured_output_provenance:
          oneOf:
            - $ref: '#/components/schemas/StructuredOutputProvenance'
            - type: 'null'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/Metadata'
            - type: 'null'
        limits:
          $ref: '#/components/schemas/ResolvedLimits'
        active_execution_ms:
          type: integer
          minimum: 0
        deadline_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
        erased_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            Present on an exact admission replay whose Turn content has been
            erased.
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallSummary'
    TurnList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Turn'
        has_more:
          type: boolean
        next_cursor:
          description: |
            Your position after this page. Null once a default listing is
            exhausted. Under `ended=true` it is always a string, including on
            an empty page, because a caught-up consumer still has a place to
            keep.
          oneOf:
            - type: string
            - type: 'null'
        complete_through:
          description: |
            The instant the feed is complete to; nothing that ended at or
            before it will appear later. Returned only under `ended=true`,
            where it is the number to alarm on when settlement stalls.
          type: string
          format: date-time
    TurnResult:
      type: object
      additionalProperties: false
      required:
        - turn
        - messages
        - output_text
      properties:
        turn:
          $ref: '#/components/schemas/Turn'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
          description: |
            Every canonical ConversationMessage owned by this Turn, all
            roles, ascending sequence, composed at read time from the
            canonical transcript. Nothing is stored twice.
        output_text:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Text blocks from this Turn's `final_answer` message, joined in
            block order with nothing between the pieces. Commentary is never
            folded into this field. This is the convenience field for "what
            did the agent answer?"

            Non-null only when the Turn completed with a final-answer message
            that contains text. Interrupted, incomplete, failed, and cancelled
            Turns leave it null even if they produced commentary, so read the
            messages directly when you need partial work.
    ToolCallResultOrigin:
      type: string
      enum:
        - builtin
        - callback
        - host
        - mcp
        - system
      description: |
        The component that committed the result. `callback` is an inline
        callback response; `host` includes settlement through `tool-results`.
    CallbackDeliveryOutcome:
      type: string
      enum:
        - pending
        - acknowledged
        - succeeded
        - failed
        - abandoned
      description: |
        `pending` means nvoken has not reached a final transport outcome.
        `acknowledged` means the endpoint returned 202 with an empty body and
        the ToolCall still awaits settlement. The other values are terminal
        transport outcomes.
    ToolCallDelivery:
      type: object
      additionalProperties: false
      required:
        - outcome
        - attempts
        - last_http_status
      properties:
        outcome:
          $ref: '#/components/schemas/CallbackDeliveryOutcome'
        attempts:
          type: integer
          format: int64
          minimum: 0
          description: Number of leased HTTP delivery attempts.
        last_http_status:
          oneOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: 'null'
          description: >-
            Last HTTP status returned by the endpoint, or null before any
            response.
    ToolCall:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - conversation_id
        - content_expires_at
        - id
        - mode
        - name
        - status
        - iteration
        - created_at
        - ended_at
        - attempts
        - result_origin
      properties:
        turn_id:
          $ref: '#/components/schemas/TurnID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        id:
          $ref: '#/components/schemas/ToolCallID'
        mode:
          $ref: '#/components/schemas/ToolCallMode'
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        iteration:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        attempts:
          type: integer
          minimum: 0
          description: Number of runtime execution attempts for this ToolCall.
        result_origin:
          oneOf:
            - $ref: '#/components/schemas/ToolCallResultOrigin'
            - type: 'null'
          description: Null until a ToolCall has a committed result.
        delivery:
          $ref: '#/components/schemas/ToolCallDelivery'
          description: Present only when mode is callback.
    ToolCallList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
    SubmitHostToolResultsRequest:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
              - tool_call_id
              - content
            properties:
              tool_call_id:
                $ref: '#/components/schemas/ToolCallID'
              content: {}
              is_error:
                type: boolean
    HostToolResultAcceptance:
      type: object
      additionalProperties: false
      required:
        - tool_call_id
        - status
        - deduplicated
      properties:
        tool_call_id:
          $ref: '#/components/schemas/ToolCallID'
        status:
          type: string
          enum:
            - completed
            - failed
        deduplicated:
          type: boolean
    SubmitHostToolResultsResponse:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - conversation_id
        - content_expires_at
        - status
        - results
        - tool_calls
      properties:
        turn_id:
          $ref: '#/components/schemas/TurnID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        status:
          $ref: '#/components/schemas/TurnStatus'
        results:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/HostToolResultAcceptance'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallSummary'
          description: |
            Every tool call this turn has made, with its current status. The
            ones still yours to run carry `arguments` and `deadline_at`.
    ResolvedLimits:
      type: object
      additionalProperties: false
      required:
        - total_timeout_seconds
        - active_timeout_seconds
        - waiting_timeout_seconds
      properties:
        total_timeout_seconds:
          type: integer
          minimum: 1
        active_timeout_seconds:
          type: integer
          minimum: 1
        waiting_timeout_seconds:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: |
            The explicit cumulative external-waiting SLA, or null when waits
            are durable and unbounded.
        max_output_tokens:
          type: integer
          minimum: 1
        max_estimated_cost_usd:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.000001
          description: |
            Resolved USD list-price guardrail. It is present only when the host
            requested a cost limit; unknown price metadata fails closed.
        max_iterations:
          type: integer
          minimum: 1
          description: |
            The turn's own model-call cap. Absent when neither the behavior nor
            the request set one; the installation ceiling still bounds the
            loop, but it is not reported here because the host never asked for
            it.
    CreateNudgeRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          allOf:
            - $ref: '#/components/schemas/TurnInput'
          description: |
            Text guidance for the running turn: a string, or an array of text
            blocks. Media blocks are refused here.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Per-Turn retry key. The same key with the same content
            returns the original acknowledgement with `deduplicated: true`; the
            same key with different content is refused, so a key is never
            reused with different words.
    NudgeAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - nudge_id
        - status
        - deduplicated
        - after_sequence
      properties:
        nudge_id:
          $ref: '#/components/schemas/NudgeID'
        status:
          $ref: '#/components/schemas/NudgeStatus'
        deduplicated:
          type: boolean
        after_sequence:
          type: integer
          format: int64
          description: >
            Transcript position to watch from for the promoted message. It is

            the Conversation cursor as of this call for a Nudge that has not
            been

            drained, and the position immediately before the promoted message

            for a Nudge that already has, so reading after it finds the message

            either way.
    NudgeStatus:
      type: string
      enum:
        - pending
        - drained
        - expired
        - cancelled
      description: |
        `pending` is the only state a turn will still pick up. `drained` means
        the turn took it and it is now in the transcript. `expired` means the
        turn ended without ever taking it. `cancelled` means you withdrew it
        before the turn got to it.
    Nudge:
      type: object
      additionalProperties: false
      required:
        - id
        - turn_id
        - status
        - content
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/NudgeID'
        turn_id:
          $ref: '#/components/schemas/TurnID'
        status:
          $ref: '#/components/schemas/NudgeStatus'
        content:
          $ref: '#/components/schemas/TurnInput'
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        drained_at:
          type: string
          format: date-time
          description: >-
            When the Nudge was promoted into the transcript. Present only when
            drained.
        drained_message_sequence:
          type: integer
          format: int64
          description: |
            Transcript sequence the content was promoted into. Present only on
            a drained Nudge, and the receipt that the model saw it.
        ended_at:
          type: string
          format: date-time
          description: When the Nudge left pending for any terminal status.
    NudgeList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Nudge'
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
    AgentRevisionNumber:
      type: integer
      format: int64
      minimum: 1
    DefaultMemoryNone:
      type: object
      additionalProperties: false
      required:
        - default_scope
      properties:
        default_scope:
          type: string
          const: none
    DefaultMemoryUser:
      type: object
      additionalProperties: false
      required:
        - default_scope
      properties:
        default_scope:
          type: string
          const: user
        namespace:
          type: string
          minLength: 1
          maxLength: 255
    DefaultMemoryTenant:
      type: object
      additionalProperties: false
      required:
        - default_scope
      properties:
        default_scope:
          type: string
          const: tenant
        namespace:
          type: string
          minLength: 1
          maxLength: 255
    DefaultMemoryPolicy:
      oneOf:
        - $ref: '#/components/schemas/DefaultMemoryNone'
        - $ref: '#/components/schemas/DefaultMemoryUser'
        - $ref: '#/components/schemas/DefaultMemoryTenant'
      discriminator:
        propertyName: default_scope
        mapping:
          none: '#/components/schemas/DefaultMemoryNone'
          user: '#/components/schemas/DefaultMemoryUser'
          tenant: '#/components/schemas/DefaultMemoryTenant'
    BehaviorInput:
      type: object
      additionalProperties: false
      required:
        - instructions
        - model
      properties:
        instructions:
          type: string
          minLength: 1
        model:
          $ref: '#/components/schemas/ModelInput'
        sampling:
          $ref: '#/components/schemas/Sampling'
        reasoning:
          $ref: '#/components/schemas/Reasoning'
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        limits:
          $ref: '#/components/schemas/Limits'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        tools:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ToolDeclaration'
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MCPServer'
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ProviderTool'
        memory:
          $ref: '#/components/schemas/DefaultMemoryPolicy'
        client_interface:
          $ref: '#/components/schemas/ClientInterface'
    AgentOwnerKind:
      type: string
      enum:
        - app
        - tenant
        - user
    AgentKey:
      type: string
      minLength: 1
      maxLength: 255
      description: Caller-owned key, unique only inside one explicit Agent owner namespace.
    TenantConversationOwner:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          const: tenant
    UserConversationOwner:
      type: object
      additionalProperties: false
      required:
        - kind
        - user_key
      properties:
        kind:
          type: string
          const: user
        user_key:
          type: string
          minLength: 1
          maxLength: 255
    ConversationOwner:
      oneOf:
        - $ref: '#/components/schemas/TenantConversationOwner'
        - $ref: '#/components/schemas/UserConversationOwner'
      discriminator:
        propertyName: kind
        mapping:
          tenant: '#/components/schemas/TenantConversationOwner'
          user: '#/components/schemas/UserConversationOwner'
    ConversationKey:
      type: string
      minLength: 1
      maxLength: 255
    ConversationMetadata:
      type: object
      additionalProperties: true
      description: Application-owned JSON metadata stored without interpretation.
    ModelPricing:
      type: object
      additionalProperties: false
      required:
        - status
        - pricing_version
      description: |
        The list prices nvoken uses to estimate what a turn will cost. These
        are nvoken's own recorded prices, not a live quote from the provider.

        A `priced` entry carries the currency, unit, input and output rates,
        and when it was last updated. `unpriced` and `unknown` carry only the
        status and a version string. Treat that version as opaque — compare
        two versions for equality to detect a change, but do not try to order
        or parse them.
      properties:
        status:
          type: string
          enum:
            - priced
            - unpriced
            - unknown
        currency:
          type: string
          enum:
            - USD
        unit:
          type: string
          enum:
            - per_million_tokens
        input:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
        output:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
        cache_read:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
        cache_write:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
        updated_at:
          type: string
          format: date
        pricing_version:
          type: string
          minLength: 1
          description: |
            Opaque nvoken-owned identifier for the local pricing snapshot.
            Values never encode an upstream dependency name or version.
    ModelDescriptor:
      type: object
      additionalProperties: false
      required:
        - provider
        - id
        - cataloged
        - pricing
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        id:
          type: string
          minLength: 1
          maxLength: 255
        cataloged:
          type: boolean
          description: Whether nvoken advertises and maintains metadata for this selection.
        display_name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        context_window_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input_modalities:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*$
          description: |
            The kinds of input this model accepts. For images and documents, the
            exact media types are listed under `controls.input.media`.
        recommended:
          type: boolean
          description: nvoken's suggested general-purpose starting point for this provider.
        deprecated:
          type: boolean
        deprecated_at:
          type: string
          format: date
          description: Date nvoken marked this model deprecated.
        retires_at:
          type: string
          format: date
          description: The date nvoken stops accepting new turns on this model.
        replacement:
          $ref: '#/components/schemas/Model'
        controls:
          $ref: '#/components/schemas/ModelControlCapabilities'
        pricing:
          $ref: '#/components/schemas/ModelPricing'
      description: |
        What nvoken knows about one model.

        For a model in nvoken's catalog you get the full picture, including the
        capability details under `controls` — the same ones nvoken checks when
        deciding whether to accept a turn. For a model not in the catalog you
        get only `provider`, `id`, `cataloged`, and `pricing`. Missing
        information there means unknown, not "unsupported" or "zero" — so treat
        an absent capability as "nvoken cannot tell", not as false.

        A deprecated model keeps working until its `retires_at` date.
    ModelControlCapabilities:
      type: object
      additionalProperties: false
      required:
        - sampling
        - reasoning
        - tools
        - input
      properties:
        sampling:
          $ref: '#/components/schemas/ModelSamplingCapabilities'
        reasoning:
          $ref: '#/components/schemas/ModelReasoningCapabilities'
        tools:
          $ref: '#/components/schemas/ModelToolCapabilities'
        input:
          $ref: '#/components/schemas/ModelInputCapabilities'
    ModelSamplingCapabilities:
      type: object
      additionalProperties: false
      required:
        - temperature
      properties:
        temperature:
          type: boolean
          description: >-
            Whether nvoken can guarantee an explicit temperature reaches this
            exact model path.
    ModelReasoningCapabilities:
      type: object
      additionalProperties: false
      required:
        - effort
        - budget_tokens
        - effort_budget_compatible
      properties:
        effort:
          $ref: '#/components/schemas/ModelReasoningEffortCapabilities'
        budget_tokens:
          $ref: '#/components/schemas/ModelReasoningBudgetCapabilities'
        effort_budget_compatible:
          type: boolean
    ModelReasoningEffortCapabilities:
      type: object
      additionalProperties: false
      required:
        - supported
        - values
        - with_temperature
      properties:
        supported:
          type: boolean
        values:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningEffort'
        with_temperature:
          type: boolean
    ModelReasoningBudgetCapabilities:
      type: object
      additionalProperties: false
      required:
        - supported
        - with_temperature
      properties:
        supported:
          type: boolean
        with_temperature:
          type: boolean
        minimum:
          type: integer
          minimum: 1024
        maximum:
          type: integer
          minimum: 1024
    ModelToolCapabilities:
      type: object
      additionalProperties: false
      required:
        - choice
        - web_search
      properties:
        choice:
          $ref: '#/components/schemas/ModelToolChoiceCapabilities'
        web_search:
          type: boolean
          description: >
            Whether this model can run the provider's own web search. If it
            reports

            false, asking for `provider_tools` is refused rather than silently

            ignored — and a model missing from nvoken's catalog reports nothing,
            so

            it is refused too.
    ModelToolChoiceCapabilities:
      type: object
      additionalProperties: false
      required:
        - modes
        - with_reasoning
      properties:
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelToolChoiceMode'
        with_reasoning:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelToolChoiceMode'
          description: Modes that remain exact when explicit reasoning is active.
    ModelInputCapabilities:
      type: object
      additionalProperties: false
      required:
        - media
      properties:
        media:
          $ref: '#/components/schemas/ModelMediaCapabilities'
    ModelMediaCapabilities:
      type: object
      additionalProperties: false
      required:
        - image
        - document
      properties:
        image:
          $ref: '#/components/schemas/ModelMediaKindCapabilities'
        document:
          $ref: '#/components/schemas/ModelMediaKindCapabilities'
    ModelMediaKindCapabilities:
      type: object
      additionalProperties: false
      required:
        - supported
        - media_types
      properties:
        supported:
          type: boolean
        media_types:
          type: array
          uniqueItems: true
          items:
            type: string
          description: >
            The exact media types this model accepts. An empty list means it
            does

            not accept this kind of input at all.
    ModelList:
      type: object
      additionalProperties: false
      required:
        - items
        - catalog_version
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelDescriptor'
        catalog_version:
          type: string
          minLength: 1
          description: >-
            Opaque version of the complete unfiltered catalog and pricing
            snapshot.
    MCPListToolsRequest:
      type: object
      additionalProperties: false
      required:
        - server
      properties:
        server:
          $ref: '#/components/schemas/MCPServer'
        headers:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
          description: Optional secret headers used only for this discovery request.
    MCPToolAnnotations:
      description: >-
        What the remote server said about a tool's behavior, plus whether it
        said anything at all. The declaration facts are reported separately from
        the values because a server that starts declaring a hint it previously
        omitted has changed the contract a reviewer approved, even when the
        effective value did not move.


        `read_only_hint` and `idempotent_hint` are non-null only when the server
        declared them true: the MCP schema types both as bare booleans with
        `omitempty`, so a declared false is indistinguishable from an absent
        one. `destructive_hint` and `open_world_hint` keep the full distinction.
        Treat a null `read_only_hint` as "potentially mutating", never as
        "read-only unknown but probably safe" — nvoken does.
      type: object
      additionalProperties: false
      required:
        - present
        - read_only_hint
        - idempotent_hint
        - destructive_hint
        - open_world_hint
      properties:
        present:
          description: Whether the server sent an annotations object at all.
          type: boolean
        read_only_hint:
          type:
            - boolean
            - 'null'
        idempotent_hint:
          type:
            - boolean
            - 'null'
        destructive_hint:
          type:
            - boolean
            - 'null'
        open_world_hint:
          type:
            - boolean
            - 'null'
    MCPProjectedTool:
      type: object
      additionalProperties: false
      required:
        - server_name
        - projected_name
        - remote_name
        - description
        - input_schema
        - annotations
      properties:
        server_name:
          type: string
        projected_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        remote_name:
          type: string
        title:
          description: >-
            The server's human-readable name for the tool, when it declares one.
            nvoken does not present it to the model; it is reported because it
            is part of the contract a host reviews.
          type: string
          maxLength: 4096
        description:
          type: string
          maxLength: 4096
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          description: >-
            The server's declared result shape, when it declares one. nvoken
            does not validate results against it.
          type: object
          additionalProperties: true
        annotations:
          $ref: '#/components/schemas/MCPToolAnnotations'
    MCPToolExclusion:
      type: object
      additionalProperties: false
      required:
        - server_name
        - remote_name
        - reason
      properties:
        server_name:
          type: string
        remote_name:
          type: string
        reason:
          type: string
          enum:
            - not_allowlisted
            - invalid_name
            - name_collision
            - invalid_schema
            - schema_too_large
            - schema_too_deep
    MCPListToolsResponse:
      type: object
      additionalProperties: false
      required:
        - tools
        - exclusions
      properties:
        tools:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/MCPProjectedTool'
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/MCPToolExclusion'
    AgentOwner:
      oneOf:
        - $ref: '#/components/schemas/AppAgentOwner'
        - $ref: '#/components/schemas/TenantAgentOwner'
        - $ref: '#/components/schemas/UserAgentOwner'
      discriminator:
        propertyName: kind
        mapping:
          app: '#/components/schemas/AppAgentOwner'
          tenant: '#/components/schemas/TenantAgentOwner'
          user: '#/components/schemas/UserAgentOwner'
    AppAgentOwner:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          const: app
    TenantAgentOwner:
      type: object
      additionalProperties: false
      required:
        - kind
        - tenant_key
      properties:
        kind:
          type: string
          const: tenant
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
    UserAgentOwner:
      type: object
      additionalProperties: false
      required:
        - kind
        - tenant_key
        - user_key
      properties:
        kind:
          type: string
          const: user
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        user_key:
          type: string
          minLength: 1
          maxLength: 255
    Behavior:
      description: Normalized immutable behavior returned on an AgentRevision.
      $ref: '#/components/schemas/BehaviorInput'
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required:
        - agent_key
        - owner
        - instructions
        - model
      properties:
        agent_key:
          $ref: '#/components/schemas/AgentKey'
        name:
          type: string
          minLength: 1
          maxLength: 255
        owner:
          $ref: '#/components/schemas/AgentOwner'
        instructions:
          type: string
          minLength: 1
        model:
          $ref: '#/components/schemas/ModelInput'
        sampling:
          $ref: '#/components/schemas/Sampling'
        reasoning:
          $ref: '#/components/schemas/Reasoning'
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        limits:
          $ref: '#/components/schemas/Limits'
        output_schema:
          $ref: '#/components/schemas/OutputSchema'
        tools:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ToolDeclaration'
        mcp_servers:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MCPServer'
        provider_tools:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ProviderTool'
        memory:
          $ref: '#/components/schemas/DefaultMemoryPolicy'
        client_interface:
          $ref: '#/components/schemas/ClientInterface'
    Agent:
      type: object
      additionalProperties: false
      required:
        - id
        - agent_key
        - name
        - owner
        - current_revision
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          $ref: '#/components/schemas/AgentID'
        agent_key:
          $ref: '#/components/schemas/AgentKey'
        name:
          type: string
          minLength: 1
          maxLength: 255
        owner:
          $ref: '#/components/schemas/AgentOwner'
        current_revision:
          $ref: '#/components/schemas/AgentRevisionNumber'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
    AgentRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - agent_id
        - revision
        - behavior
        - behavior_sha256
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/AgentRevisionID'
        agent_id:
          $ref: '#/components/schemas/AgentID'
        revision:
          $ref: '#/components/schemas/AgentRevisionNumber'
        behavior:
          $ref: '#/components/schemas/Behavior'
        behavior_sha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        created_at:
          type: string
          format: date-time
    AgentList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    AgentRevisionList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentRevision'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    ConversationOwnerKind:
      type: string
      enum:
        - tenant
        - user
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_key
        - owner
      properties:
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        conversation_key:
          $ref: '#/components/schemas/ConversationKey'
        owner:
          $ref: '#/components/schemas/ConversationOwner'
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
        compaction:
          $ref: '#/components/schemas/CompactionPolicy'
        metadata:
          $ref: '#/components/schemas/ConversationMetadata'
    UpdateConversationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        metadata:
          $ref: '#/components/schemas/ConversationMetadata'
          description: Complete JSON metadata object to store on the Conversation.
        refresh_retention:
          type: boolean
          const: true
          description: |
            Recomputes `expires_at` from the Conversation's stored retention
            policy without changing that policy. Refused when no retention
            policy exists.
    ForkConversationRequest:
      type: object
      additionalProperties: false
      required:
        - from_message_id
        - owner
      properties:
        from_message_id:
          $ref: '#/components/schemas/ConversationMessageID'
          description: >-
            Public source message included as the final message in the copied
            prefix.
        conversation_key:
          $ref: '#/components/schemas/ConversationKey'
        owner:
          $ref: '#/components/schemas/ConversationOwner'
          description: >-
            Explicit owner of the new Conversation; never inferred from the
            source.
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
        compaction:
          $ref: '#/components/schemas/CompactionPolicy'
        metadata:
          $ref: '#/components/schemas/ConversationMetadata'
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_key
        - owner
        - conversation_key
        - forked_from
        - active_turn_id
        - active_turn_status
        - retention
        - compaction
        - metadata
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ConversationID'
        tenant_key:
          type: string
        owner:
          $ref: '#/components/schemas/ConversationOwner'
        conversation_key:
          oneOf:
            - $ref: '#/components/schemas/ConversationKey'
            - type: 'null'
        forked_from:
          oneOf:
            - $ref: '#/components/schemas/ConversationForkLineage'
            - type: 'null'
        active_turn_id:
          oneOf:
            - $ref: '#/components/schemas/TurnID'
            - type: 'null'
        active_turn_status:
          oneOf:
            - $ref: '#/components/schemas/TurnStatus'
            - type: 'null'
        retention:
          oneOf:
            - $ref: '#/components/schemas/RetentionPolicy'
            - type: 'null'
        compaction:
          oneOf:
            - $ref: '#/components/schemas/CompactionPolicy'
            - type: 'null'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/ConversationMetadata'
            - type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationForkLineage:
      type: object
      additionalProperties: false
      required:
        - conversation_id
        - message_id
      properties:
        conversation_id:
          $ref: '#/components/schemas/ConversationID'
        message_id:
          $ref: '#/components/schemas/ConversationMessageID'
      description: |
        Durable source prefix lineage. It records provenance and does not
        imply the fork's owner.
    ConversationList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    ConversationMessageList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    ConversationCompactionStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
    ConversationCompactionID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    ConversationCompaction:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - status
        - through_sequence
        - summary
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ConversationCompactionID'
        conversation_id:
          $ref: '#/components/schemas/ConversationID'
        status:
          $ref: '#/components/schemas/ConversationCompactionStatus'
        through_sequence:
          type: integer
          format: int64
          minimum: 0
        summary:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationCompactionList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationCompaction'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    TranscriptSnapshot:
      type: object
      additionalProperties: false
      required:
        - conversation
        - messages
        - compactions
        - captured_at
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        compactions:
          type: array
          items:
            $ref: '#/components/schemas/ConversationCompaction'
        captured_at:
          type: string
          format: date-time
    ProviderKeyScope:
      type: string
      enum:
        - app
        - tenant
      description: |
        `app` is one provider key shared by every tenant of one app;
        `tenant` is one provider key for a single named
        tenant_key inside the app.
    CreateProviderKeyRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - scope
        - key
        - idempotency_key
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        scope:
          $ref: '#/components/schemas/ProviderKeyScope'
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required for tenant scope and forbidden for app scope.
        key:
          $ref: '#/components/schemas/ProviderStaticKey'
        expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    RotateProviderKeyRequest:
      type: object
      additionalProperties: false
      required:
        - key
        - idempotency_key
      properties:
        key:
          $ref: '#/components/schemas/ProviderStaticKey'
        expires_at:
          type: string
          format: date-time
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 0
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    ProviderKey:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - scope
        - tenant_key
        - status
        - version
        - version_id
        - previous_version_id
        - version_status
        - expires_at
        - overlap_expires_at
        - created_by
        - created_at
        - updated_at
        - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/ProviderKeyID'
        provider:
          $ref: '#/components/schemas/ModelProvider'
        scope:
          $ref: '#/components/schemas/ProviderKeyScope'
        tenant_key:
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: string
          enum:
            - active
            - revoked
          description: >-
            Active roots remain rotatable and revocable even when their current
            version has expired.
        version:
          type: integer
          minimum: 1
        version_id:
          $ref: '#/components/schemas/ProviderKeyVersionID'
        previous_version_id:
          oneOf:
            - $ref: '#/components/schemas/ProviderKeyVersionID'
            - type: 'null'
        version_status:
          type: string
          enum:
            - active
            - overlap
            - expired
            - revoked
          description: >
            An expired version cannot be used. Rotate the key before any new
            turn

            or model call can use it.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        overlap_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      description: Safe metadata only; secret material is never represented.
    ProviderKeyList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKey'
        has_more:
          type: boolean
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
    ProviderKeyUsage:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - scope
        - turns
        - last_used_at
        - usage
      properties:
        id:
          $ref: '#/components/schemas/ProviderKeyID'
        provider:
          $ref: '#/components/schemas/ModelProvider'
        scope:
          $ref: '#/components/schemas/ProviderKeyScope'
        turns:
          type: integer
          minimum: 0
          description: How many turns used this provider key.
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: >-
            Latest durable model checkpoint under any bound Turn, null before
            the first model call.
        usage:
          oneOf:
            - $ref: '#/components/schemas/ModelUsage'
            - type: 'null'
          description: Summed checkpoint usage, null before the first model call.
    App:
      type: object
      additionalProperties: false
      required:
        - id
        - org_id
        - name
        - external_ref
        - display_name
        - callback_timeout_seconds
        - default_rate_limits
        - machine_concurrency_limits
        - browser_access
        - anonymous_access
        - credit_policy
        - created_at
        - archived_at
      properties:
        id:
          $ref: '#/components/schemas/AppID'
          description: The generated nvoken app identifier.
        org_id:
          oneOf:
            - $ref: '#/components/schemas/OrgID'
            - type: 'null'
          description: |
            Durable owning Org. Nullable only during the staged console
            migration and tightened after every existing App is claimed.
        name:
          type: string
          description: The unique host-chosen name for this app.
        external_ref:
          type:
            - string
            - 'null'
          maxLength: 255
          description: |
            Transitional console-owner reference retained only to stamp
            existing Apps into Orgs during rollout. It is not an authorization
            boundary and is removed by the gated cleanup migration.
        display_name:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Human-facing label; `name` stays the unique handle.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          description: |
            Resolved deadline for each callback HTTP request whose tool does
            not name one of its own. Defaults to 10. Webhook delivery is
            unaffected.

            This ceiling is 60 while a single tool may declare up to 300 in
            `callback.timeout_seconds`. The asymmetry is the point: this value
            governs every callback the App makes, so raising it to cover one
            slow tool would make a hung delivery of a fast one invisible for
            just as long. Slow is named per tool.
        default_rate_limits:
          oneOf:
            - $ref: '#/components/schemas/AppDefaultRateLimits'
            - type: 'null'
          description: |
            App-wide admission ceilings shared by machine, client-token, and
            anonymous-token callers. Null means unlimited machine admission;
            browser access requires finite values.
        machine_concurrency_limits:
          oneOf:
            - $ref: '#/components/schemas/MachineConcurrencyLimits'
            - type: 'null'
          description: |
            Optional per-tenant and per-user concurrency ceilings for machine
            credentials. Null leaves machine traffic subject only to the
            App-wide default_rate_limits.
        browser_access:
          oneOf:
            - $ref: '#/components/schemas/BrowserAccess'
            - type: 'null'
          description: |
            Complete browser-direct configuration. Null means browser access
            is disabled and client JWTs receive no browser CORS permission.
        anonymous_access:
          oneOf:
            - $ref: '#/components/schemas/AnonymousAccess'
            - type: 'null'
          description: |
            Managed public-browser mode. Null means nvoken will not mint
            anonymous tokens for this App.
        credit_policy:
          $ref: '#/components/schemas/CreditPolicy'
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the App was archived, or null while it is live. An archived
            App refuses admission and grant-minting with `409 app_archived`
            while every read, settlement, erasure, configuration, and
            revocation path stays open. Its credentials keep authenticating.
    AppList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
    AppSigningKeyPurpose:
      type: string
      enum:
        - callback
        - webhook
      description: The only delivery class this HMAC key may sign.
    AppSigningKey:
      type: object
      additionalProperties: false
      required:
        - purpose
        - key_id
        - version
        - active
        - created_at
      properties:
        purpose:
          $ref: '#/components/schemas/AppSigningKeyPurpose'
        key_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Value sent in `X-Nvoken-Signing-Key-Id`. It names the App and
            purpose and does not change across versions, so a receiver keys its
            verifier table on the pair: this selects the entry, `version`
            selects the secret within it.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Value sent in `X-Nvoken-Signing-Key-Version`.
        active:
          type: boolean
          description: |
            Whether this is the version nvoken signs with. Exactly one version
            per purpose is active. During an overlapped rotation the other one
            is minted but not yet signing, and your receiver should already
            accept both.
        created_at:
          type: string
          format: date-time
      description: |
        One stored signing key version without its material. Key rows are
        immutable; which version signs is separate state, so a rotation never
        updates key material.
    AppSigningKeyList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppSigningKey'
    MintAppSigningKeyRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/AppSigningKeyPurpose'
        activate:
          type: boolean
          default: false
          description: |
            Sign with the new version immediately, collapsing the rotation to
            one call. Correct only when no working verifier is left to
            protect — recovering a lost secret. Leaving it false is what makes
            an ordinary rotation cause zero failed verifications.
    AppSigningKeySecret:
      type: object
      additionalProperties: false
      required:
        - purpose
        - key_id
        - version
        - active
        - secret
      properties:
        purpose:
          $ref: '#/components/schemas/AppSigningKeyPurpose'
        key_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Value sent in `X-Nvoken-Signing-Key-Id`.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Value sent in `X-Nvoken-Signing-Key-Version`.
        active:
          type: boolean
          description: |
            Whether this version is already signing. False after an overlapped
            mint: configure your receiver with this secret, then activate.
        secret:
          type: string
          minLength: 32
          description: |
            Receiver HMAC secret. This plaintext is returned only by the
            request that created the version — App registration or a mint — and
            is irretrievable afterwards. Store it before you discard the
            response.
    AppRegistration:
      type: object
      additionalProperties: false
      required:
        - app
        - signing_keys
      properties:
        app:
          $ref: '#/components/schemas/App'
        signing_keys:
          type: array
          minItems: 2
          maxItems: 2
          description: One callback key and one webhook key.
          items:
            $ref: '#/components/schemas/AppSigningKeySecret'
    RegisterAppRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The unique name identifying this app. Registering a name that
            already exists is rejected.
        org_id:
          $ref: '#/components/schemas/OrgID'
          description: |
            Owning Org. Org-scoped callers may omit this to use their own Org
            and cannot name another. Installation callers may name any
            registered Org or omit it during the staged migration.
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional opaque owner reference.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional human-facing label.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          default: 10
          description: |
            Callback HTTP reply deadline for tools that declare none of their
            own. A single tool may declare up to 300 in
            `callback.timeout_seconds`; this App-wide value stays capped at 60
            so one slow tool cannot loosen loss detection for all of them.
        default_rate_limits:
          oneOf:
            - $ref: '#/components/schemas/AppDefaultRateLimits'
            - type: 'null'
          description: |
            Optional shared App admission ceilings. Browser access requires a
            non-null value.
        machine_concurrency_limits:
          oneOf:
            - $ref: '#/components/schemas/MachineConcurrencyLimits'
            - type: 'null'
          description: |
            Optional machine-credential fairness ceilings. Null and omission
            both create the App without per-tenant or per-user machine limits.
        browser_access:
          oneOf:
            - $ref: '#/components/schemas/BrowserAccess'
            - type: 'null'
          description: |
            Optional complete browser configuration. Null and omission both
            create the App with browser access disabled.
        credit_policy:
          $ref: '#/components/schemas/CreditPolicy'
          description: Defaults to `off`. See the schema for what each value enforces.
      description: |
        There is deliberately no `anonymous_access` here. Enabling it requires
        browser access, finite App limits, and `credit_policy: required` to
        already be stored, so it is set with `PATCH /v1/apps/{app_id}` once
        the App exists rather than validated against a request that is still
        describing itself.
    UpdateAppRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: New human-facing label for the app.
        org_id:
          $ref: '#/components/schemas/OrgID'
          description: |
            New owning Org. Supplying this field transfers ownership and is
            restricted to installation administrators.
        callback_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          description: |
            New callback HTTP reply deadline for tools that declare none of
            their own. Still capped at 60; per-tool deadlines up to 300 are
            declared on the tool.
        default_rate_limits:
          oneOf:
            - $ref: '#/components/schemas/AppDefaultRateLimits'
            - type: 'null'
          description: |
            Replace the whole member, or send null to restore unlimited
            machine admission. Clearing is rejected while browser access
            remains enabled. Omission preserves the stored value.
        machine_concurrency_limits:
          oneOf:
            - $ref: '#/components/schemas/MachineConcurrencyLimits'
            - type: 'null'
          description: |
            Replace both machine concurrency ceilings, or send null to disable
            them. Omission preserves the stored value.
        browser_access:
          oneOf:
            - $ref: '#/components/schemas/BrowserAccess'
            - type: 'null'
          description: |
            Replace the complete member, or send null to disable browser
            access without deleting client keys. Omission preserves the
            stored value.
        anonymous_access:
          oneOf:
            - $ref: '#/components/schemas/AnonymousAccess'
            - type: 'null'
          description: |
            Replace the complete anonymous-browser mode, or send null to stop
            minting and reject new anonymous-token requests. Enabling requires
            browser access, finite App limits, and `credit_policy: required`.
            Omission preserves the stored value.
        credit_policy:
          $ref: '#/components/schemas/CreditPolicy'
          description: |
            Change credit enforcement for turns admitted from now on.
            Turns already running keep the policy they were admitted
            under. Omission preserves the stored value.
    CreditPolicy:
      type: string
      enum:
        - 'off'
        - required
      default: 'off'
      description: |
        Whether nvoken refuses a turn whose tenant has no available credits.

        `off`, the default, admits turns without consulting the tenant's
        credit account. It is the right setting when the provider account
        paying for the call is yours -- an App provider key, or the
        deployment's own -- because nvoken is not the party at risk and your
        own billing system already meters the end user.

        `required` refuses admission, and each later provider call, unless the
        tenant has enough available credits. Choose it when you want nvoken to
        hold the line per tenant.

        Neither value governs platform-funded work. When a call is paid for by
        nvoken's own provider key, credits are always required.
    AppDefaultRateLimits:
      type: object
      additionalProperties: false
      required:
        - max_concurrent_turns
        - max_admissions_per_minute
      properties:
        max_concurrent_turns:
          type: integer
          format: int64
          minimum: 1
        max_admissions_per_minute:
          type: integer
          format: int64
          minimum: 1
      description: |
        The one App-wide admission contract shared by machine and browser
        callers. Both positive values are required and enforced at admission.
    MachineConcurrencyLimits:
      type: object
      additionalProperties: false
      required:
        - max_concurrent_turns_per_tenant
        - max_concurrent_turns_per_user
      properties:
        max_concurrent_turns_per_tenant:
          type: integer
          format: int64
          minimum: 1
          description: Maximum nonterminal Turns in the resolved tenant.
        max_concurrent_turns_per_user:
          type: integer
          format: int64
          minimum: 1
          description: |
            Maximum nonterminal Turns for one user_key in the resolved
            tenant. Machine admissions without user_key are governed only by
            the tenant and App-wide ceilings.
      description: |
        Optional machine-credential fairness limits enforced transactionally
        at Turn admission. The counts include nonterminal Turns
        admitted through any credential class in the same tenant or user.
    BrowserAccess:
      type: object
      additionalProperties: false
      required:
        - allowed_origins
        - turn_webhook
        - limits
      properties:
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
          description: |
            Canonical exact origins, returned sorted. Wildcards, userinfo,
            paths, queries, and fragments are invalid. HTTPS is required,
            except that exact localhost and loopback origins may use HTTP for
            development. Browser requests must match exactly before CORS is
            emitted.
        turn_webhook:
          $ref: '#/components/schemas/BrowserTurnWebhook'
        limits:
          $ref: '#/components/schemas/BrowserRateLimits'
      description: |
        Complete browser-direct configuration. Enabling it requires
        App default_rate_limits and an active webhook-purpose signing key.
    BrowserTurnWebhook:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Guarded absolute HTTPS Turn webhook endpoint.
        events:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEvent'
          description: |
            Must include turn.waiting and turn.ended. Omission
            selects every current Turn webhook event.
    BrowserRateLimits:
      type: object
      additionalProperties: false
      required:
        - max_concurrent_turns_per_tenant
        - max_concurrent_turns_per_user
        - max_admissions_per_user_per_minute
      properties:
        max_concurrent_turns_per_tenant:
          type: integer
          format: int64
          minimum: 1
        max_concurrent_turns_per_user:
          type: integer
          format: int64
          minimum: 1
        max_admissions_per_user_per_minute:
          type: integer
          format: int64
          minimum: 1
      description: Browser-specific ceilings enforced at Turn admission.
    AnonymousAccess:
      type: object
      additionalProperties: false
      required:
        - tenant_key
        - agent_id
        - visitor_allowance
        - limits
        - conversation_retention
        - webhook_delivery
      properties:
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact tenant in which all anonymous Turns run.
        agent_id:
          $ref: '#/components/schemas/AgentID'
        visitor_allowance:
          $ref: '#/components/schemas/Money'
        limits:
          $ref: '#/components/schemas/AnonymousRateLimits'
        conversation_retention:
          $ref: '#/components/schemas/RetentionPolicy'
        webhook_delivery:
          type: string
          enum:
            - browser_access
            - disabled
          description: |
            `browser_access` copies the App browser webhook onto anonymous
            Turns. `disabled` creates no webhook delivery and requires
            every host-mode tool to be named in `client_interface`.
      description: |
        Complete managed-anonymous mode. The Agent must be live, visible in the
        configured tenant, App- or tenant-owned, client-capable, and declare
        memory `none`. Each short-lived access token pins the exact
        AgentRevision selected when that token is minted. The positive USD
        allowance is a fixed thirty-day visitor-continuity cost ceiling.
        Clearing browser storage can create a new subject, so anonymous limits,
        tenant Credits, and App admission limits remain aggregate hard caps.
    AnonymousRateLimits:
      type: object
      additionalProperties: false
      required:
        - max_admissions_per_minute
        - max_token_exchanges_per_minute
      properties:
        max_admissions_per_minute:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Admission ceiling shared across all anonymous visitor subjects in
            this tenant.
        max_token_exchanges_per_minute:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Replica-wide exchange ceiling for this App and canonical Origin
            bucket.
    AnonymousTokenRequest:
      type: object
      additionalProperties: false
      properties:
        visitor_token:
          type: string
          minLength: 1
          description: Previously returned visitor token; omit on a first visit.
    AnonymousTokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_in_seconds
        - visitor_token
        - visitor_token_expires_at
        - conversation_id
      properties:
        access_token:
          type: string
          minLength: 1
          description: Short-lived bearer for browser-direct runtime requests.
        access_token_expires_in_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          description: Whole seconds until access-token expiry at issuance.
        visitor_token:
          type: string
          minLength: 1
          description: Opaque replacement continuity bearer accepted only by this route.
        visitor_token_expires_at:
          type: string
          format: date-time
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
          description: |
            Canonical conversation for this visitor, or null before its first
            turn. Anonymous Turns that omit Conversation selectors resume this
            Conversation automatically.
    ClientKeyID:
      type: string
      description: >-
        Opaque App client verification-key identifier with the public `ckey_`
        prefix.
    CreateClientKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - public_key
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Bounded operator-facing display name.
        public_key:
          type: string
          format: byte
          minLength: 44
          maxLength: 44
          description: Standard padded base64 for exactly 32 Ed25519 public-key bytes.
    ClientKey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - fingerprint
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/ClientKeyID'
        name:
          type: string
          minLength: 1
          maxLength: 255
        fingerprint:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Base64url-without-padding SHA-256 of the raw 32 public-key bytes.
        created_at:
          type: string
          format: date-time
      description: Public-key metadata only; no key bytes are returned.
    ClientKeyList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ClientKey'
    Org:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - external_ref
        - created_at
        - archived_at
      properties:
        id:
          $ref: '#/components/schemas/OrgID'
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-facing label for the customer Org.
        external_ref:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
          description: Optional unique identity-provider Org identifier.
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the Org was archived, or null while it is live. An archived
            Org admits no new App and no new Org-bound credential; its reads
            and org-scoped reporting are unchanged.
      description: |
        Thin customer ownership boundary. Membership, roles, invitations,
        policy, and runtime state deliberately live elsewhere.
    OrgList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Org'
    RegisterOrgRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional unique identity-provider Org identifier. Reusing it
            returns the existing Org unchanged.
    UpdateOrgRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
    ModelCallFactID:
      type: string
      description: >-
        RFC 9562 UUIDv7 in canonical lowercase text. Identifiers carry no type
        prefix; treat the value as opaque.
    UsageInterval:
      type: string
      enum:
        - day
        - week
        - month
    ModelCallKind:
      type: string
      enum:
        - generation
        - compaction
        - direct
    ModelCallFactStatus:
      type: string
      enum:
        - prepared
        - started
        - settled
        - not_started
        - uncertain
    ProviderKeySource:
      type: string
      enum:
        - caller_ephemeral
        - app_byok
        - tenant_byok
        - platform
        - config_byok
      description: |
        Which account pays for a model call. Installations choose which
        sources they enable: a BYOK-disabled installation (nvoken Cloud
        today) refuses `caller_ephemeral`, `app_byok`, and `tenant_byok`
        selections and provider key storage, and every call runs on its
        system provider keys.
    AuthenticationMethod:
      type: string
      enum:
        - api_key
        - issuer_token
        - client_token
        - anonymous_token
        - unknown
    ActivityMetrics:
      type: object
      additionalProperties: false
      required:
        - turns
        - completed_turns
        - incomplete_turns
        - failed_turns
        - cancelled_turns
        - open_turns
        - active_users
        - unattributed_turns
        - active_tenants
        - active_agents
      properties:
        turns:
          type: integer
          minimum: 0
        completed_turns:
          type: integer
          minimum: 0
        incomplete_turns:
          type: integer
          minimum: 0
        failed_turns:
          type: integer
          minimum: 0
        cancelled_turns:
          type: integer
          minimum: 0
        open_turns:
          type: integer
          minimum: 0
        active_users:
          type: integer
          minimum: 0
          description: Exact distinct non-null user identities over this row's window.
        unattributed_turns:
          type: integer
          minimum: 0
        active_tenants:
          type: integer
          minimum: 0
        active_agents:
          type: integer
          minimum: 0
    ModelMetrics:
      type: object
      additionalProperties: false
      required:
        - model_calls
        - reported_model_calls
        - failed_model_calls
        - runtime_steps
        - generation_calls
        - compaction_calls
        - direct_calls
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
        - reasoning_tokens
      properties:
        model_calls:
          type: integer
          minimum: 0
        reported_model_calls:
          type: integer
          minimum: 0
        failed_model_calls:
          type: integer
          minimum: 0
        runtime_steps:
          type: integer
          minimum: 0
          description: Model results durably committed to a Turn transcript.
        generation_calls:
          type: integer
          minimum: 0
        compaction_calls:
          type: integer
          minimum: 0
        direct_calls:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
    ToolMetrics:
      type: object
      additionalProperties: false
      required:
        - tool_calls
        - completed_tool_calls
        - failed_tool_calls
        - cancelled_tool_calls
      properties:
        tool_calls:
          type: integer
          minimum: 0
        completed_tool_calls:
          type: integer
          minimum: 0
        failed_tool_calls:
          type: integer
          minimum: 0
        cancelled_tool_calls:
          type: integer
          minimum: 0
    CostMetrics:
      type: object
      additionalProperties: false
