openapi: 3.1.0
info:
  title: nvoken API
  version: 0.1.0
  summary: Run agent turns in the background, follow them live, and keep the conversation
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    nvoken runs agent turns for you. You describe a turn — an Agent Definition
    and some input — and nvoken queues it, runs it in the
    background, keeps running it across restarts and failures, and lets you
    either watch it live or come back for the result later.

    Your application stays in charge of what your agents are and when they
    run. nvoken owns the conversation: it stores the messages, tracks the
    state of every turn, and handles talking to the model providers.

    ## Getting started

    `POST /v1/invocations` starts a turn and returns a `202` right away.
    From there:

    - Follow it live with `GET /v1/invocations/{invocation_id}/stream`, or
      read `GET /v1/invocations/{invocation_id}/result` whenever you want the
      finished answer. Disconnecting never cancels anything.
    - If your agent uses tools you run yourself, the turn stops with status
      `waiting` and lists what it needs. Run them, post the results to
      `/tool-results`, and the turn continues where it left off.
    - Sessions carry conversation history from one turn to the next. They
      last until you delete them, or until a retention window you set runs
      out.

    Also here: tools nvoken calls back to over HTTPS, remote MCP servers,
    structured output validated against your JSON Schema, reusable Agent
    Definitions, image and document input, your own model provider keys, and
    spending limits.

    ## Authorization

    Machine credentials use `nvk_…` bearer API keys. A configured trusted
    console may also present a short-lived Ed25519 issuer token; this is an
    authentication presentation only and does not create a user identity model
    in nvoken.

    Apps may register dormant browser-access configuration and Ed25519 client
    public keys. This version does not accept App-issued client JWTs, apply the
    registered admission limits, or emit CORS headers; PRD 065 activates that
    complete boundary. The host remains the identity provider and alone holds
    token-minting keys.

    - App-scoped Runtime credentials may call every Runtime operation and GET /v1/identity.
    - App-scoped Viewer credentials may call Runtime reads and GET /v1/identity.
    - App-scoped Operator credentials may call every Runtime operation, GET /v1/identity, and all credential lifecycle operations.
    - Org-scoped Viewer and Operator credentials are management and reporting
      identities only. They resolve no tenant and cannot perform Runtime
      operations; Operators can register and manage Apps and their App
      credentials, while Viewers have read-only access.

    Tenant, Session, operation, and expiry constraints only narrow these grants.

    ## Familiar names

    Where a name already means something in other agent APIs, nvoken uses it
    the same way rather than inventing its own. `metadata` follows OpenAI's
    limits of 16 keys, 64-character names, and 512-byte values. `output_text`
    is the assistant's text joined into one string. `reasoning.effort` takes
    `low`, `medium`, `high`, `xhigh`, and `max`. `stop_reason: end_turn`,
    status `running`, and the `commentary` and `final_answer` message phases
    are the same idea you have seen elsewhere. If you have integrated another
    agent API, these should need no translation.

    ## You can always read back what applied

    Anything nvoken decides on your behalf is readable on the resource that
    used it. You never have to work out what happened by combining the request
    you sent with your own assumptions about nvoken's defaults — just read the
    resource.

    A turn reports the `limits` it is really running under, after defaults and
    minimums; the `agent_definition` it ran with, exactly as stored; and
    `provenance`, which records what actually served the request. A Session
    reports its compaction (summarization) policy with `auto` already resolved to a real
    number and a real model, and its retention window as accepted. New
    settings will work the same way: a default you cannot read back is a
    setting only the server knows about.

servers:
  - url: /
    description: Current nvoken installation
security:
  - bearerAuth: []
tags:
  - name: Agents
    description: App-scoped identity anchors; behavior remains per Invocation.
  - name: Invocations
    description: One agent turn — what OpenAI calls a Response and Cursor calls a Run. Starting one queues background work and returns immediately.
  - name: Models
    description: Curated model discovery and exact model-selection inspection.
  - name: MCP
    description: Stateless remote MCP server discovery.
  - name: Agent Definitions
    description: Stable App-owned agent configurations with immutable revision history.
  - name: Sessions
    description: Durable conversation identity and state. A Session is what OpenAI and Mistral call a Conversation.
  - name: Provider keys
    description: |
      Encrypted app and tenant model-provider BYOK lifecycle. Claude vaults
      authenticate an agent's tools; nvoken provider keys decide who pays for
      the model.
  - name: Apps
    description: Host applications using nvoken as their agentic backend.
  - name: Orgs
    description: Thin customer ownership boundaries containing one or more Apps.
  - name: Usage
    description: Token and cost totals, calculated from the stored record of what actually ran.
  - name: Credits
    description: Persistent tenant spending capacity and its append-only allocation history.
  - name: Tenants
    description: |
      The App's interned tenant keys with their credit position. nvoken holds
      no tenant configuration; a tenant row is a key made referenceable.
  - name: Admissions
    description: |
      What happened to every request to start a turn, including the refused
      ones that never became an Invocation.
  - name: Identity
    description: |
      Durable machine credential lifecycle and caller introspection. These
      credentials authenticate every other operation in this contract.
paths:
  /v1/orgs:
    get:
      tags: [Orgs]
      operationId: listOrgs
      summary: List registered orgs
      description: |
        Returns the Orgs visible to the caller. Installation machine
        credentials and admin issuer tokens see every Org; an Org-scoped
        credential sees only its own Org. App-scoped credentials and
        non-admin installation issuer tokens cannot list Orgs.

        Archived Orgs are excluded unless `status` asks for them.
      parameters:
        - $ref: "#/components/parameters/ArchiveStatus"
      responses:
        "200":
          description: The Orgs visible to the authenticated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [Orgs]
      operationId: registerOrg
      summary: Register an org
      description: |
        Registers a thin customer ownership boundary. This requires an
        installation Operator credential or an admin issuer token. When
        `external_ref` names an existing Org, the existing resource is
        returned unchanged so register-on-first-login is race-safe and
        idempotent.

        Orgs are never hard-deleted; `DELETE /v1/orgs/{org_id}` archives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOrgRequest"
      responses:
        "200":
          description: The existing Org matched by `external_ref`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "201":
          description: The newly registered Org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/orgs/{org_id}:
    get:
      tags: [Orgs]
      operationId: getOrg
      summary: Get one org
      description: |
        Returns one registered Org. An Org-scoped caller receives `404` for
        any other Org, so identifiers cannot be probed across the ownership
        boundary. Installation issuer tokens require `admin: true`.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OrgID"
      responses:
        "200":
          description: The requested Org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [Orgs]
      operationId: updateOrg
      summary: Update an org
      description: |
        Updates the Org's human-facing display name. Installation issuer
        tokens require `admin: true`.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: The updated Org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [Orgs]
      operationId: archiveOrg
      summary: Archive an org
      description: |
        Marks the Org out of service. Every App it owns must be archived first;
        this is an explicit precondition rather than a cascade, so no
        irreversible side effect hides inside a reversible operation.

        Nothing is destroyed. An archived Org refuses App registration into it
        and Org-bound credential issuance with `409 org_archived`, while Org
        reads and org-scoped reporting stay open. Archiving requires the same
        authority as updating the Org, and repeating it is a successful no-op.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OrgID"
      responses:
        "204":
          description: The Org is archived.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The Org still owns at least one live App.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: org_has_active_apps
                message: Archive every App the Org owns before archiving the Org.
                request_id: req_01K0NVB0QFQP0YNSVD3CB7E97V
                details:
                  org_id: org_019b0a12-8d51-7f34-aed2-0e07c1bdb321
                  active_apps: 2
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/orgs/{org_id}/restore:
    post:
      tags: [Orgs]
      operationId: restoreOrg
      summary: Restore an archived org
      description: |
        Clears the Org's archive tombstone. There is no ordering precondition
        and nothing else is restored: Apps archived before the Org stay
        archived. Restoring a live Org is a successful no-op.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OrgID"
      responses:
        "204":
          description: The Org is live.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: List registered apps
      description: |
        Returns the Apps this credential can see. An App-scoped credential
        sees only that App, an Org-scoped credential sees the Apps contained
        by its Org, and an installation credential sees every registered App.
        An exact `external_ref` filter narrows that visible set during the
        staged console migration. Archived Apps are excluded unless `status`
        asks for them.
      parameters:
        - name: external_ref
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Return only apps whose `external_ref` equals this value.
        - $ref: "#/components/parameters/ArchiveStatus"
      responses:
        "200":
          description: The apps visible to the authenticated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [Apps]
      operationId: registerApp
      summary: Register an app
      description: |
        Registers one host application and creates its default tenant,
        returning the generated `app_id` and independent callback and webhook
        HMAC keys. The plaintext signing keys are returned only in this
        response; store them in the receiver's secret manager. nvoken stores
        only authenticated ciphertext and selects a key from the durable App
        scope of each delivery. Registration is unavailable when the service's
        encryption keyring is not configured.

        Registration requires an Org or installation Operator credential; an
        App-scoped credential cannot mint siblings. Org callers always create
        Apps in their own Org and may omit `org_id`. Installation machine
        credentials may choose any registered Org or temporarily leave
        ownership unset during the staged console migration. An installation
        issuer token requires `admin: true` to assign an Org. Names identify
        Apps and are unique, so re-registering an existing name is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAppRequest"
      responses:
        "201":
          description: |
            The registered app and its one-time receiver signing credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistration"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/OrgArchived" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/apps/{app_id}:
    get:
      tags: [Apps]
      operationId: getApp
      summary: Get one app
      description: |
        Returns one registered App. App- and Org-scoped credentials receive
        `404` for Apps outside their durable containment boundary.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      responses:
        "200":
          description: The requested app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [Apps]
      operationId: updateApp
      summary: Update an app
      description: |
        Updates an App's display name, callback timeout, or dormant browser
        configuration. An installation administrator may also transfer the
        App to another registered Org by changing `org_id`.
        Org- and App-scoped callers receive `404` outside their containment
        boundary, and cannot move an App. The unique `name` and transitional
        `external_ref` cannot be changed.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppRequest"
      responses:
        "200":
          description: The updated app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OrgArchived" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [Apps]
      operationId: archiveApp
      summary: Archive an app
      description: |
        Marks the App out of service. Nothing is destroyed and no other
        resource's lifecycle changes: the App's credentials keep
        authenticating, its client keys stay registered, and its Agent
        Definitions are untouched.

        While archived, exactly these operations return `409 app_archived`:
        Session create and fork, Invocation create, Invocation resume, Agent
        Definition create and replace, client-key create, App-bound credential
        issuance, provider-key create, and credit allocation. Everything else
        behaves as on a live App — reads and lists, cancel, interrupt, nudges,
        tool-result submission, Session update and erasure, App `PATCH`, and
        credential, client-key, and provider-key rotation and revocation — so a
        draining host can let running turns settle and then clean up. Usage
        reporting keeps counting the App's spend.

        Archiving requires the same authority as updating the App: an Org or
        installation credential. A credential bound to the App cannot archive
        or restore it. Repeating the call is a successful no-op.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      responses:
        "204":
          description: The App is archived.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/apps/{app_id}/restore:
    post:
      tags: [Apps]
      operationId: restoreApp
      summary: Restore an archived app
      description: |
        Clears the App's archive tombstone and reopens admission. Nothing else
        is restored, and the App's Org may still be archived. Restoring a live
        App is a successful no-op.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      responses:
        "204":
          description: The App is live.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/apps/{app_id}/client-keys:
    get:
      tags: [Apps]
      operationId: listAppClientKeys
      summary: List an App's client-token verification keys
      description: |
        Lists the App's dormant Ed25519 verification-key records in creation
        order. Responses contain only the generated key ID, display name,
        SHA-256 fingerprint, and creation time; public-key bytes are never
        returned. This route requires the same non-client Operator authority
        as updating the visible App. Cross-App targets return `404`.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      responses:
        "200":
          description: The registered client keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [Apps]
      operationId: createAppClientKey
      summary: Register an Ed25519 client-token verification key
      description: |
        Registers one standard-base64-encoded, exactly 32-byte Ed25519 public
        key. nvoken stores no seed or private key and never returns the public
        bytes. At most five keys may exist for one App so hosts can overlap a
        bounded rotation. Duplicate public bytes within one App are rejected;
        another App may independently register the same bytes.

        Registration remains dormant in this version: a JWT signed by the key
        still receives the existing unauthenticated response and creates no
        runtime or credential rows.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientKeyRequest"
      responses:
        "201":
          description: The registered client-key record without key material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKey"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AppArchived" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/apps/{app_id}/client-keys/{key_id}:
    delete:
      tags: [Apps]
      operationId: revokeAppClientKey
      summary: Revoke an App client-token verification key
      description: |
        Deletes only the named App-owned verification record. A repeated,
        unknown, or cross-App key ID returns the same `404`. Agent Definitions
        and App configuration are never changed by revocation.
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AppID"
        - name: key_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ClientKeyID"
      responses:
        "204":
          description: The verification record was deleted.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List Agent identity anchors
      description: |
        Returns newest-first identity anchors scoped to the caller's app. An
        Agent belongs to one app and stores only its nvoken ID, the host-owned
        `agent_key`, and creation time; instructions, models, tools, and
        provider keys still travel on each Invocation. An exact `agent_key`
        filter returns zero or one item within that app.

        Unconstrained credentials see their app's anchors. Tenant-constrained
        credentials see only anchors referenced by a Session in their
        effective partition.
        Session-constrained credentials see only that Session's anchor. The
        opaque cursor is bound to the authenticated caller, credential
        constraint, and exact key filter.
      parameters:
        - $ref: "#/components/parameters/AgentKeyFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One bounded page of Agent identity anchors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Read one Agent identity anchor
      description: |
        Reads identity without creating work. Out-of-scope and undisclosable
        constrained resources use `not_found`.
      responses:
        "200":
          description: One Agent identity anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/mcp/list-tools:
    post:
      tags: [MCP]
      operationId: listMCPTools
      summary: Discover and project one remote MCP server's tools
      description: |
        Connects to a remote MCP server and lists the tools it offers, without
        starting a turn. Use it to check a server works and see what the model
        would get before you wire it into an agent.

        nvoken opens one short-lived session, reads through every page of the
        server's tool list, applies the same filtering rules a real turn would,
        and disconnects. Headers you supply are used for this call only and are
        never stored.
