openapi: 3.1.0
info:
  title: nvoken API
  version: 0.1.0
  summary: >-
    Run agent turns in the background, follow them live, and keep the
    conversation
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: >
    nvoken runs durable Agent Turns in the background. Each Turn selects one

    immutable AgentRevision or inline behavior, optional retained Conversation,

    and optional MemorySpace. Those coordinates remain independent: a

    Conversation supplies continuity only, and an optional user is the Turn
    actor.


    ## Getting started


    `POST /v1/turns` durably admits work and returns `202`. Follow it with

    `GET /v1/turns/{turn_id}/stream`, or read `/result` later. A standalone

    Turn omits `conversation`; a conversational Turn explicitly selects new,

    existing, or continue-or-create continuity. Disconnecting never cancels
    work.


    Reusable behavior lives in owner-namespaced Agents. Creating an Agent
    creates

    revision 1 atomically; publishing appends an immutable AgentRevision and

    advances current without updating one resource per tenant or user. Exact
    HTTP

    key lookup always states App, tenant, or user ownership and never applies

    owner precedence.


    ## Authorization


    Machine credentials use `nvk_…` bearer API keys. Installation credentials

    manage Apps but resolve no tenant runtime data; App credentials operate only

    inside their App. `X-Nvoken-Tenant-Key` and `X-Nvoken-User-Key` are optional

    per-request assertions: they narrow reads and attribute writes, but never

    redefine Agent or Conversation ownership. A user assertion requires its

    tenant assertion. Callers may only narrow the credential's existing scope.


    Browser callers use narrow short-lived grants. A verified browser grant pins

    one exact AgentRevision, so browser Turn admission omits behavior. Browser

    projections may omit machine-only detail while retaining the same resource

    schema. Anonymous work is memoryless.


    ## Keys and IDs


    Caller-owned keys are names in explicit owner namespaces. Service-owned IDs

    are opaque and use `agent_`, `arev_`, `mspc_`, `conv_`, and `turn_`
    prefixes.

    Paths take IDs; key resolution uses exact request or query coordinates.


    ## Streams


    A Turn stream closes after that Turn becomes terminal. A Conversation stream

    follows current and future Turns and may stay open while idle. Both use the

    same frame vocabulary. A Conversation-bound Turn cursor may resume on its

    Conversation stream; a standalone Turn cursor cannot.
servers:
  - url: /
    description: Current nvoken installation
security:
  - bearerAuth: []
tags:
  - name: Turns
    description: >-
      One agent turn — what OpenAI calls a Response and Cursor calls a Run.
      Starting one queues background work and returns immediately.
  - name: Models
    description: Curated model discovery and exact model-selection inspection.
  - name: MCP
    description: Stateless remote MCP server discovery.
  - name: Agents
    description: |
      App-, tenant-, and user-owned reusable behavior. Creating an Agent creates
      revision 1 atomically; publishing appends an immutable AgentRevision.
  - name: Conversations
    description: |
      Retained continuity independent of Agent behavior, memory, and Turn actor.
      A Conversation is tenant- or user-owned and may contain Turns using
      different behavior and MemorySpaces.
  - name: Provider keys
    description: |
      Encrypted app and tenant model-provider BYOK lifecycle. Claude vaults
      authenticate an agent's tools; nvoken provider keys decide who pays for
      the model.
  - name: Apps
    description: Host applications using nvoken as their agentic backend.
  - name: Orgs
    description: Thin customer ownership boundaries containing one or more Apps.
  - name: Usage
    description: >-
      Token and cost totals, calculated from the stored record of what actually
      ran.
  - name: Credits
    description: >-
      Persistent tenant spending capacity and its append-only allocation
      history.
  - name: Tenants
    description: |
      The App's interned tenant keys with their credit position. nvoken holds
      no tenant configuration; a tenant row is a key made referenceable.
  - name: MemorySpaces
    description: >
      Tenant-bound durable memory independent of Agent behavior and Conversation

      continuity. A user scope partitions by user; a tenant scope is
      intentionally

      shared across users.
  - name: Admissions
    description: |
      What happened to every request to start a turn, including the refused
      ones that never became a Turn.
  - name: Identity
    description: |
      Durable machine credential lifecycle and caller introspection. These
      credentials authenticate every other operation in this contract.
  - name: Console integration
    description: Server-to-server operations used by the nvoken console.
paths:
  /v1/turns:
    get:
      tags:
        - Turns
      operationId: listTurns
      summary: List authoritative Turns, or walk the ones that ended
      description: >
        Returns newest-first durable Turn state. Exact filters combine

        with AND. An App credential without a tenant constraint may list all

        tenant partitions in that App, or one of them with `tenant_key`. A

        tenant-constrained credential is always scoped to its partition. The

        opaque cursor is bound to the normalized filter set and credential

        tenant scope. Agent filtering uses the persisted Agent ID; an

        `agent_key` is owner-namespaced lookup input, not a Turn relationship.


        ## `ended=true` makes this a reconciliation feed


        Set it and the same operation reverses into a feed: every Turn

        that reached a terminal status, **oldest first by the moment it ended**,

        each appearing exactly once. Walk it and append by `id`.


        This is the backstop for settlement. `turn.ended` webhooks are

        delivered at least once, which narrows the window but does not close

        it: a delivery that never lands leaves a turn nobody settles, and that

        failure is silent — no error, just a ledger row that was never written.

        Reading the feed to the end is how you find out.


        The default listing cannot do that job. Newest-first over current state

        means a turn that ends while you page moves under you, and filtering by

        terminal status gives you a set with no position in it. Ending order is

        the only order you can resume.


        Start with `ended_since`, or with no position at all to begin at the

        oldest retained turn. Then send back `next_cursor`, which in this mode

        is present on every response including an empty page, so a consumer

        that catches up keeps its position without special-casing. Keep going

        while `has_more` is true; when it is false you are caught up and can

        wait before asking again.


        `complete_through` is returned in this mode and is the instant the feed

        is complete to. Turns that ended after it are held back until their

        settling transactions are certainly visible, because a turn that

        appeared behind your cursor would be one you never see again. It trails

        the present by a bounded interval, so a consumer is always slightly

        behind and never wrong; it is also the number to alarm on, since a

        `complete_through` that stops advancing means settlement has stalled

        rather than that nothing ended.


        A cursor carries its mode, so one from the default listing cannot

        resume the feed and the reverse is also refused. Erased Conversations
        take

        their Turns with them, so a turn deleted before you read it never

        appears; reconcile before you erase.
      parameters:
        - $ref: '#/components/parameters/TenantKeyFilter'
        - $ref: '#/components/parameters/UserKeyFilter'
        - name: conversation_id
          in: query
          schema:
            $ref: '#/components/schemas/ConversationID'
        - name: agent_id
          in: query
          description: Exact persisted Agent relationship.
          schema:
            $ref: '#/components/schemas/AgentID'
        - name: status
          in: query
          description: |
            Repeat to select a union of statuses. Order and duplicates are
            normalized before cursor binding.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/TurnStatus'
        - name: parent_turn_id
          in: query
          description: |
            Select direct children of one Turn. Send the literal `null`
            to select top-level Turns; omit the parameter to retain the
            authoritative unfiltered collection. This filter is part of the
            opaque cursor's collection identity.
          schema:
            type: string
            example: turn_01JABCDEF0123456789ABCDEFG
        - name: ended
          in: query
          description: |
            Walk the turns that ended, oldest first, instead of listing current
            state newest first. See the description above.
          schema:
            type: boolean
            default: false
        - name: ended_since
          in: query
          description: |
            Inclusive RFC 3339 lower bound on `ended_at`, for starting a feed
            that has no cursor yet. Requires `ended=true`, and is mutually
            exclusive with `cursor`, which already carries a position.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One bounded page of Turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
        - Turns
      operationId: createTurn
      summary: Start one Turn in the background
      description: >
        Resolves one stored AgentRevision or inline behavior, optional memory,

        and optional Conversation in the same admission transaction. A `202`

        means the Turn is durable and may be followed, recovered, or resumed by
        ID.


        Omit `conversation` for a standalone Turn. Behavior, memory,
        Conversation,

        and actor are independent: a Conversation supplies continuity only, and

        `user_key` attributes this Turn without selecting Agent or memory
        ownership.


        Trusted-host idempotency keys are scoped to the resolved tenant. An
        equal

        retry returns the original Turn; a changed request conflicts. If that

        Turn's content has since been erased, the equal admission retry still

        returns `202` with `deduplicated: true`, `erased_at`, and the retained

        content-free Turn receipt. It does not re-resolve the requested Agent,

        MemorySpace, or Conversation. An ordinary `GET /v1/turns/{turn_id}`

        continues to return `410 turn_erased`. Machine callers supply
        `behavior`;

        browser callers rely on the exact AgentRevision pinned by their verified

        grant.
      parameters:
        - name: X-Anthropic-Api-Key
          in: header
          required: false
          description: |
            Caller-supplied Anthropic API key, equivalent to a
            caller_ephemeral `provider_keys` selection. The header
            must name the model provider and cannot be combined with
            the body field. Siblings: X-Openai-Api-Key, X-Gemini-Api-Key,
            X-Xai-Api-Key.
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Openai-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Gemini-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
        - name: X-Xai-Api-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '202':
          description: >
            The turn is queued and will run, or your idempotency key matched a
            turn

            that already existed and you got that one back. A repeat stays `202`

            even when the turn it returns has already finished.


            This is the acknowledgment for the turn. Follow it with

            `GET /v1/turns/{turn_id}/stream`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The referenced Conversation, Turn, or AgentRevision is not visible
            to this app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            The idempotency key, supplied Conversation options, or active
            Conversation

            state conflicts, or the App or selected Agent is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The selected model is retired or URL media could not be accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: getTurn
      summary: Read authoritative Turn identity and state
      description: |
        The turn's current state, including anything that went wrong after it
        started.

        A credential that can authenticate but lacks permission for this read
        gets `forbidden`. A turn belonging to another tenant is reported as
        `not_found` rather than `forbidden`, so you cannot use this endpoint to
        discover whether an ID exists outside your scope.
      responses:
        '200':
          description: The turn's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
        - Turns
      operationId: deleteTurn
      summary: Erase a terminal standalone Turn
      description: |
        Erases the private content carried by a terminal standalone turn while
        retaining its minimal usage, lineage, and idempotency facts. A
        conversation-bound Turn is erased through its Conversation instead.
      responses:
        '204':
          description: The standalone Turn content was erased.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/stream:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: streamTurn
      summary: Follow one Turn over Server-Sent Events
      description: |
        Carries only this turn's durable transcript updates and optional live
        previews, then closes after its terminal change is delivered. The
        cursor is scoped to the Turn and never reveals an internal
        carrier Conversation for a standalone turn.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: deltas
          in: query
          description: Include id-less preview frames. Defaults to true.
          schema:
            type: boolean
            default: true
        - name: Last-Event-ID
          in: header
          description: >-
            Opaque cursor from the last durable update; ignored when the cursor
            query parameter is supplied.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A resumable stream that closes after terminal settlement.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConversationStreamEvent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/result:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: getTurnResult
      summary: Read a Turn together with its messages
      description: |
        Returns the turn and the messages it produced, at any status. This is
        the convenient read for "what did the agent answer?" — `output_text`
        gives you the final-answer text already joined into a single string,
        without intermediate commentary, so you do not have to walk the
        message blocks yourself.

        The turn and its messages are read from one consistent database
        snapshot, so you will never see a finished turn whose last message is
        missing.

        Authentication, tenant scoping, and the not-found behavior are the
        same as reading the Turn on its own.
      responses:
        '200':
          description: The turn and its messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: getTurnTimeline
      summary: Read the durable execution waterfall for one Turn
      description: |
        Assembles lifecycle waits, model calls, tool calls, nudges, and
        compactions from one database snapshot. It contains timings and usage,
        never prompts, responses, tool arguments, results, or error text. After
        Conversation erasure it degrades to the retained facts-only skeleton.
      responses:
        '200':
          description: Ordered durable execution steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnTimeline'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/traces:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: listTurnTraces
      summary: Page through hosted agent traces for one Turn
      description: |
        Returns newest-first, content-free summaries exported from Dive through
        OpenTelemetry. A child-only trace is returned as `is_partial: true`
        while its agent root is still open or if the process exits before that
        root is exported. Traces remain diagnostic and best-effort; the durable
        Turn timeline is the execution authority. `status` is `disabled`
        when this installation has no configured observation store.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One bounded page of trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/logs:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: listTurnLogs
      summary: Page through hosted structured logs for one Turn
      description: |
        Returns the content-free structured lifecycle logs associated by the
        Turn ID. Arbitrary attributes and raw error values are omitted.
        `status` is `disabled` when this installation has no configured
        observation store.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: trace_id
          in: query
          description: Return only logs correlated to this W3C trace ID.
          schema:
            $ref: '#/components/schemas/TraceID'
      responses:
        '200':
          description: One bounded page of associated logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnLogList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/traces/{trace_id}:
    parameters:
      - $ref: '#/components/parameters/TraceID'
    get:
      tags:
        - Turns
      operationId: getTrace
      summary: Read one hosted agent trace
      description: |
        Returns a content-free projection of up to 200 OpenTelemetry spans.
        Use the pageable Turn log endpoint with `trace_id` for associated
        logs. `is_partial` says when the
        agent root has not arrived or the bounded read omitted spans. nvoken
        grounds the trace's Turn attribution in its durable Turn
        record before returning it; knowing a W3C trace ID grants no authority.
      responses:
        '200':
          description: The authorized, bounded trace tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/tool-calls:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    get:
      tags:
        - Turns
      operationId: listToolCalls
      summary: Page through durable ToolCall execution records
      description: |
        Returns ToolCalls in execution discovery order. Every execution mode is
        included. The records contain lifecycle and timing facts only. Tool
        inputs and results remain in the canonical Conversation transcript.

        Callback records include a delivery object. Its terminal outcome,
        attempt count, and last HTTP status remain available after the bounded
        delivery transport row is pruned. These records use the same
        authentication, tenant scope, Conversation constraint, and nondisclosing
        not_found behavior as the Turn read. Deleting the Conversation deletes
        these records with the rest of its subtree.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One bounded page of ToolCall records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallList'
              example:
                items:
                  - id: 019b0a12-8d51-7f34-aed2-0e07c1bdb325
                    turn_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb322
                    conversation_id: 019b0a12-7c41-7e24-8ed2-0e07c1bdb311
                    content_expires_at: null
                    mode: callback
                    name: create_ticket
                    status: completed
                    iteration: 3
                    created_at: '2026-08-08T17:02:11Z'
                    ended_at: '2026-08-08T17:02:19Z'
                    attempts: 0
                    result_origin: callback
                    delivery:
                      outcome: succeeded
                      attempts: 2
                      last_http_status: 200
                has_more: false
                next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    post:
      tags:
        - Turns
      operationId: cancelTurn
      summary: Stop a Turn and discard its work
      description: |
        Stops a turn and discards what it produced. The turn ends `cancelled`
        and its work does not carry into the next turn — use interrupt instead
        if you want to keep it.

        Safe to repeat. Cancelling a turn that already finished returns it
        unchanged rather than failing. A successful response means the
        cancellation is recorded and will stick. Work already sent to the
        model provider stops as soon as it can, so you may still be billed for
        what had run by then.

        Send an empty request body.
      responses:
        '200':
          description: The turn's final state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    post:
      tags:
        - Turns
      operationId: interruptTurn
      summary: Stop a Turn but keep what it produced
      description: |
        Asks a running turn to stop at its next clean stopping point. It ends
        `completed` with `stop_reason: interrupted`, and everything it
        produced — the model's replies and any tool results — stays in the
        conversation for the next turn. That is the whole difference from
        cancelling, which throws the turn's work away.

        The request is recorded and safe to repeat. What happens next depends
        on what the turn was doing:

        - Between steps (`queued`, `waiting`, or `running` with nothing
          actively executing) it stops before this call returns. Any tool
          calls you still owed results for are closed out, so submitting one
          afterwards returns `409`.
        - Mid-step, nvoken records the request and returns the turn still
          `running`. It stops at the next checkpoint, at worst one model call
          later. Watch the stream or re-read the turn to see it end.

        Interrupting a turn that has already finished changes nothing and
        returns it as-is. A turn that was asked for structured output but
        never produced a valid object ends `failed` with
        `structured_output_unsatisfied` rather than `completed`. Either way
        usage is reported in full and billed, because the work was kept.

        Send an empty request body.
      responses:
        '200':
          description: The turn's state after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/resume:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    post:
      tags:
        - Turns
      operationId: resumeTurn
      summary: Raise a held Turn's limit and continue it
      description: |
        Continues a turn on `budget_hold` because one of its own consumption
        limits ran out. Send `limits` containing only the limit that ran out,
        raised above both its old value and what the turn has already used,
        and still within what your installation allows.

        If the turn is held because the tenant ran out of credits rather than
        on a limit of its own, allocate credits to that account instead — this
        endpoint refuses it, and funding the account continues the turn on its
        own. Deadlines never put a turn on budget hold, so they never bring you
        here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeTurnRequest'
      responses:
        '202':
          description: The turn, queued to continue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The Turn is not on a raisable budget hold, or the App is
            archived (`app_archived`): a held Turn on an archived App can
            be cancelled, not continued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/TurnErased'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/nudges:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    post:
      tags:
        - Turns
      operationId: createNudge
      summary: Send extra direction to a running Turn
      description: >
        Sends extra direction to a turn that is already running — "focus on

        the marine segment" — without stopping it and without losing the work

        you are steering. Use this when a long turn is heading the wrong way

        and you want to correct it in place.


        Compare with `conversation.if_active: supersede` on a new Turn, which

        replaces the running turn and discards what it had produced. Steering

        a long turn that way throws away exactly the work you were trying to

        redirect.


        **A nudge is not an interrupt, and it is not immediate.** The turn

        picks it up at its next model-call boundary: before the next model call

        in a running builtin or MCP tool loop, when a host-tool result resumes

        the next execution segment, or when a turn that thought it was finished

        re-enters its loop to answer you. A parked host tool is not woken; its

        result still has to resume the turn. A model call or tool run already in

        flight is never aborted to deliver a Nudge. A turn you have interrupted

        is never given more work — the interrupt wins and the direction you

        staged expires unused.


        Nudges and Turns never turn into each other. Posting to

        `/v1/turns` against a busy Conversation behaves exactly as its

        `conversation.if_active` setting says; it never quietly becomes a nudge,
        and a

        nudge never quietly becomes a new turn.


        If the turn ends without ever picking it up, your Nudge is marked

        `expired` at that moment and has no effect on any later turn. Check

        `GET .../nudges` to see whether it was used or missed. Whether

        to re-send missed direction as the next turn's input is your call.


        `content` must be text — a string, or an array of text blocks. Images

        and documents are fine on a turn's own input but are refused here,

        because a turn resuming in place carries text only, and silently

        dropping your attachment would be worse than telling you now.


        Requires the same permission as cancelling the turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNudgeRequest'
            example:
              content: Focus on the marine segment for the rest of this pass.
              idempotency_key: nudge-1
      responses:
        '202':
          description: >-
            Your direction is queued. The turn will pick it up at its next
            stopping point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeAcknowledgement'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `turn_not_active` when the Turn is already terminal;
            `idempotency_conflict` when `idempotency_key` was already used with
            different content; `nudge_queue_full` when the Turn already
            holds the maximum nudges, with the bound in
            `details.limit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
        - Turns
      operationId: listNudges
      summary: List Nudges for a Turn
      description: |
        Lists the direction you have sent to this turn with `/nudges`, in the
        order the turn will pick it up. Entries stay listed after they are used
        or missed, so you can answer "what did the user say, and did the model
        ever see it?"

        Check `status` on each entry: `drained` means the turn used it,
        `expired` means the turn ended first, `cancelled` means you withdrew
        it.
      parameters:
        - name: status
          in: query
          description: Restrict to one status.
          schema:
            $ref: '#/components/schemas/NudgeStatus'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Maximum items in this page. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of Nudges in consumption order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/nudges/{nudge_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TurnID'
      - $ref: '#/components/parameters/NudgeID'
    post:
      tags:
        - Turns
      operationId: cancelNudge
      summary: Withdraw a Nudge the Turn has not taken
      description: |
        Withdraws direction you sent with `/nudges`, as long as the turn has not
        picked it up yet. Cancelling something already cancelled returns it
        unchanged, so retrying is safe.

        Cancelling races the turn, and whichever happens first wins outright:
        you either withdraw it cleanly or the turn uses it. It is never
        half-applied. If the turn got there first, you get a conflict and the
        entry stays `drained`.
      responses:
        '200':
          description: The nudge after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nudge'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `nudge_already_closed` when the nudge was already drained or
            expired. `details.nudge` carries its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/turns/{turn_id}/tool-results:
    parameters:
      - $ref: '#/components/parameters/TurnID'
    post:
      tags:
        - Turns
      operationId: submitHostToolResults
      summary: Submit durable results for pending host and callback ToolCalls
      description: |
        Atomically accepts one bounded batch for a waiting Turn. The
        first committed result for each ToolCall wins. An equal replay is
        acknowledged as deduplicated; a changed replay conflicts. Partial
        batches leave the Turn waiting. Closing the final pending call
        queues the same Turn and its successor dispatch before
        returning `202`.

        This command accepts only host- or callback-mode calls owned by the path
        Turn and authenticated tenant scope. It is not a generic
        Conversation append endpoint. The body is limited to 1 MiB; each result
        content value is valid JSON limited to 256 KiB and 32 nesting levels.

        `content` accepts any JSON value and the stored transcript retains it
        verbatim. Before a result reaches the model, a string or an array of
        content blocks passes through unchanged; any other value is
        serialized to its compact JSON text and sent as a string, so the
        model sees the same bytes a host that pre-stringifies would send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitHostToolResultsRequest'
            example:
              results:
                - tool_call_id: 019b0a12-9e61-7144-bed2-0e07c1bdb333
                  content:
                    order_id: order-123
                    state: ready
                - tool_call_id: 019b0a12-af71-7254-8ed2-0e07c1bdb344
                  content:
                    delivered: false
                  is_error: true
      responses:
        '202':
          description: The complete batch committed, possibly as equal replays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitHostToolResultsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The Turn cannot accept the supplied result batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/TurnErased'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List nvoken's curated model catalog
      description: >
        Returns the complete bounded set of text-generation models nvoken

        intentionally advertises. Catalog membership means nvoken maintains

        metadata for the exact provider/model selection. It does not prove that

        the caller's provider account, region, or selected provider key can
        access

        the model. Ordering is deterministic but has no semantic meaning.


        Authentication is required, but no scoped operation is: this is

        installation-wide capability metadata and contains no App or tenant

        data. Browser grants cannot reach the model catalog.
      parameters:
        - name: provider
          in: query
