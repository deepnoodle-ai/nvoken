            - $ref: '#/components/schemas/CredentialID'
            - type: 'null'
        rotation_overlap_ends_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialList:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    CreateCredentialRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CredentialType'
        app_id:
          $ref: '#/components/schemas/AppID'
          description: |
            Required for App and App-read-only credentials. Console Org callers
            may name only Apps contained by their Org. Installation admins may
            name any App. Full App keys cannot create a new key family.
        expires_at:
          type: string
          format: date-time
    CredentialIssuance:
      type: object
      required:
        - credential
        - secret
        - delivery_expires_at
        - replayed
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
        secret:
          type: string
          writeOnly: true
        delivery_expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    CurrentIdentity:
      description: |
        Who nvoken thinks you are. `method` says how you authenticated. A
        machine API key carries `credential_id` and `type`; a short-lived
        console presentation may carry `org_id`; a browser grant carries its
        fixed App, Agent, AgentRevision, tenant, subject, memory grant, and
        Conversation grant.
      type: object
      required:
        - authentication
      properties:
        authentication:
          type: object
          required:
            - app_id
            - method
          properties:
            credential_id:
              $ref: '#/components/schemas/CredentialID'
              description: Machine credentials only.
            app_id:
              oneOf:
                - $ref: '#/components/schemas/AppID'
                - type: 'null'
              description: >
                Null for installation credentials and Org console presentations.
                A

                browser grant is always App-scoped, so this is never null for

                one.
            org_id:
              oneOf:
                - $ref: '#/components/schemas/OrgID'
                - type: 'null'
              description: Short-lived console presentations only.
            type:
              $ref: '#/components/schemas/CredentialType'
              description: Machine API keys only.
            agent_id:
              $ref: '#/components/schemas/AgentID'
              description: Browser grants only. The Agent this grant is pinned to.
            agent_revision_id:
              $ref: '#/components/schemas/AgentRevisionID'
              description: >-
                Browser grants only. Exact immutable behavior pinned by the
                grant.
            tenant_key:
              type:
                - string
                - 'null'
              description: |
                Null only when a machine credential resolves no tenant. A
                browser grant is always tenant-pinned, so this is never null
                for one.
            user_key:
              type:
                - string
                - 'null'
              description: Browser subject and Turn actor; null for machine credentials.
            memory_access:
              $ref: '#/components/schemas/BrowserMemoryAccess'
              description: Browser grants only. Omission grants no memory authority.
            conversation_access:
              $ref: '#/components/schemas/BrowserConversationAccess'
              description: Browser grants only. Omission grants no Conversation authority.
            method:
              type: string
              enum:
                - api_key
                - issuer_token
                - client_token
                - anonymous_token
              x-enum-varnames:
                - ApiKey
                - IssuerToken
                - ClientToken
                - AnonymousToken
              description: |
                How this caller authenticated. New values may be added; handle
                a value you do not recognize as an unknown caller rather than
                refusing the response.
    BrowserMemoryAccess:
      oneOf:
        - $ref: '#/components/schemas/BrowserNoMemoryAccess'
        - $ref: '#/components/schemas/BrowserUserMemoryAccess'
      discriminator:
        propertyName: scope
        mapping:
          none: '#/components/schemas/BrowserNoMemoryAccess'
          user: '#/components/schemas/BrowserUserMemoryAccess'
    BrowserNoMemoryAccess:
      type: object
      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          type: string
          const: none
    BrowserUserMemoryAccess:
      type: object
      additionalProperties: false
      required:
        - scope
        - namespace
      properties:
        scope:
          type: string
          const: user
        namespace:
          type: string
          minLength: 1
          maxLength: 255
    BrowserConversationAccess:
      oneOf:
        - $ref: '#/components/schemas/BrowserStandaloneOnlyAccess'
        - $ref: '#/components/schemas/BrowserExactConversationAccess'
        - $ref: '#/components/schemas/BrowserUserConversationsAccess'
      discriminator:
        propertyName: scope
        mapping:
          standalone_only: '#/components/schemas/BrowserStandaloneOnlyAccess'
          exact: '#/components/schemas/BrowserExactConversationAccess'
          user_conversations: '#/components/schemas/BrowserUserConversationsAccess'
    BrowserStandaloneOnlyAccess:
      type: object
      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          type: string
          const: standalone_only
    BrowserExactConversationAccess:
      type: object
      additionalProperties: false
      required:
        - scope
        - conversation_id
      properties:
        scope:
          type: string
          const: exact
        conversation_id:
          $ref: '#/components/schemas/ConversationID'
    BrowserUserConversationsAccess:
      type: object
      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          type: string
          const: user_conversations
    ConsoleDeviceAuthorizationStatus:
      type: string
      enum:
        - pending
        - approved
        - denied
    CreateConsoleDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[ -~]+$
    ConsoleDeviceAuthorizationGrant:
      type: object
      additionalProperties: false
      required:
        - device_code
        - user_code
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          minLength: 43
          maxLength: 43
        user_code:
          type: string
          pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
        expires_in:
          type: integer
          enum:
            - 600
        interval:
          type: integer
          enum:
            - 5
    ConsoleDeviceAuthorizationApproval:
      type: object
      additionalProperties: false
      required:
        - status
        - label
      properties:
        status:
          $ref: '#/components/schemas/ConsoleDeviceAuthorizationStatus'
        label:
          type: string
          minLength: 1
          maxLength: 64
        app_name:
          type: string
          minLength: 1
        credential_type:
          type: string
          enum:
            - app
            - app_read_only
    ApproveConsoleDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - credential_type
      properties:
        credential_type:
          type: string
          enum:
            - app
            - app_read_only
    ConsoleDeviceAuthorizationExchangeState:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
    ConsoleDeviceAuthorizationClaim:
      type: object
      additionalProperties: false
      required:
        - status
        - device_code
        - issuer_token
        - app_id
        - app_name
        - credential_type
        - label
      properties:
        status:
          type: string
          enum:
            - approved
        device_code:
          type: string
          minLength: 43
          maxLength: 43
        issuer_token:
          type: string
          description: >-
            Five-minute App issuer bearer, returned only to the authenticated
            console Worker.
        app_id:
          $ref: '#/components/schemas/AppID'
        app_name:
          type: string
          minLength: 1
        credential_type:
          type: string
          enum:
            - app
            - app_read_only
        label:
          type: string
          minLength: 1
          maxLength: 64
    DeliveryID:
      type: string
      description: |
        Identifies one delivery nvoken sent you, callback or webhook alike —
        both are the same durable record and carry the same `dlvr_` prefix.
        Treat it as opaque; it appears in the signed payload and identifies the
        attempt when you report a delivery problem.
    DeliveryBehaviorSource:
      oneOf:
        - $ref: '#/components/schemas/DeliveryAgentRevisionSource'
        - $ref: '#/components/schemas/DeliveryInlineSource'
      discriminator:
        propertyName: kind
        mapping:
          agent_revision: '#/components/schemas/DeliveryAgentRevisionSource'
          inline: '#/components/schemas/DeliveryInlineSource'
    DeliveryAgentRevisionSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - agent_id
        - agent_revision_id
        - revision
      properties:
        kind:
          type: string
          const: agent_revision
        agent_id:
          $ref: '#/components/schemas/AgentID'
        agent_revision_id:
          $ref: '#/components/schemas/AgentRevisionID'
        revision:
          $ref: '#/components/schemas/AgentRevisionNumber'
    DeliveryInlineSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - digest
      properties:
        kind:
          type: string
          const: inline
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    ToolCallbackContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - delivery_id
        - tool_call_id
        - tool_name
        - turn_id
        - conversation_id
        - memory_space_id
        - content_expires_at
        - behavior_source
        - tenant_key
        - user_key
      properties:
        schema_version:
          type: integer
          enum:
            - 2
        delivery_id:
          $ref: '#/components/schemas/DeliveryID'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallID'
        tool_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: |
            The tool this delivery is asking you to run, taken from the durable
            ToolCall. It is inside the signed body, so a receiver serving many
            tools dispatches on it with no authoritative read — and any
            per-tool path suffix you configure stays an unsigned logging
            convenience rather than the thing you branch on.
        turn_id:
          $ref: '#/components/schemas/TurnID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        memory_space_id:
          oneOf:
            - $ref: '#/components/schemas/MemorySpaceID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        behavior_source:
          $ref: '#/components/schemas/DeliveryBehaviorSource'
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        user_key:
          type:
            - string
            - 'null'
          description: Optional Turn actor.
    ToolCallbackRequest:
      type: object
      additionalProperties: false
      required:
        - nvoken
        - input
      properties:
        nvoken:
          $ref: '#/components/schemas/ToolCallbackContext'
        input: {}
    TurnWebhookContext:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - delivery_id
        - event
        - sequence
        - turn_id
        - conversation_id
        - memory_space_id
        - content_expires_at
        - behavior_source
        - tenant_key
        - user_key
      properties:
        schema_version:
          type: integer
          enum:
            - 2
        delivery_id:
          $ref: '#/components/schemas/DeliveryID'
        event:
          $ref: '#/components/schemas/WebhookEvent'
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: |
            Counts transitions within one Turn, from 1. Deliveries can
            arrive out of order, so a receiver folding state keeps the highest
            sequence it has seen for that Turn and discards anything
            lower rather than applying whichever arrived last.
        turn_id:
          $ref: '#/components/schemas/TurnID'
        conversation_id:
          oneOf:
            - $ref: '#/components/schemas/ConversationID'
            - type: 'null'
        memory_space_id:
          oneOf:
            - $ref: '#/components/schemas/MemorySpaceID'
            - type: 'null'
        content_expires_at:
          $ref: '#/components/schemas/ContentExpiresAt'
        behavior_source:
          $ref: '#/components/schemas/DeliveryBehaviorSource'
        tenant_key:
          type: string
          minLength: 1
          maxLength: 255
        user_key:
          type:
            - string
            - 'null'
          description: Optional Turn actor.
    TurnWebhookSubject:
      type: object
      additionalProperties: false
      required:
        - status
      description: |
        A pointer to the turn, not a projection of it. It deliberately carries
        no transcript content, tool arguments, structured output, usage,
        provenance, or failure message: a signed body that grew those would be
        a second, staler copy of the record, and a receiver that read them
        would be reconciling against the wrong source. Read
        `GET /v1/turns/{turn_id}` or its `/result` for anything
        beyond what is here.
      properties:
        status:
          $ref: '#/components/schemas/TurnStatus'
        stop_reason:
          $ref: '#/components/schemas/TurnStopReason'
        failure_code:
          type: string
          minLength: 1
          description: Present when the turn ended in a failure.
        waiting_tool_call_ids:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallID'
          description: |
            The host tools this turn is parked on. Present on
            `turn.waiting` only.
        credit_block:
          $ref: '#/components/schemas/CreditBlock'
          description: |
            Present when a spending limit stopped the turn, naming the account
            that could not fund the next attempt.
    TurnWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - nvoken
        - turn
      properties:
        nvoken:
          $ref: '#/components/schemas/TurnWebhookContext'
        turn:
          $ref: '#/components/schemas/TurnWebhookSubject'
    ToolCallbackResponse:
      type: object
      additionalProperties: false
      required:
        - content
      description: |
        Strict callback reply. The encoded content is limited to 256 KiB and
        32 nesting levels. `is_error` defaults to false when omitted.
      properties:
        content: {}
        is_error:
          type: boolean
          default: false
  responses:
    InvalidRequest:
      description: The request is invalid or contains a deferred field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: tools[0].mode must be host.
            request_id: req_01K0NV9K7Z9WR3Y3Q3RMV2G7H0
            details:
              path: /tools/0/mode
    Unauthenticated:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unauthenticated
            message: A valid API credential is required.
            request_id: req_01K0NVA1K5T8Y1MBVX7TZBM21H
    Forbidden:
      description: The authenticated credential is not permitted to make this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: forbidden
            message: The requested tenant_key conflicts with the credential constraint.
            request_id: req_01K0NVAE24H917QNE9P1QMX95Y
    NotFound:
      description: The resource is missing or cannot be disclosed in this scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: The requested resource was not found.
            request_id: req_01K0NVASB4CF29K41VZA271H23
    Conflict:
      description: The resource state conflicts with the requested lifecycle transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: turn_not_budget_hold
            message: The Turn is not on a turn-level budget hold.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    AppArchived:
      description: |
        The App is archived, so admission and grant-minting are closed. Reads,
        settlement of running work, erasure, configuration, and revocation are
        unaffected; restore reopens the App.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: app_archived
            message: >-
              The App is archived. Existing work can finish and be read, but no
              new work or grants are admitted.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97T
            details:
              app_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb320
    RateLimited:
      description: >-
        A durable App, tenant, or opaque-user admission limit refused fresh
        work, or deployment ingress rate limited the request. No Turn is
        created.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: Seconds before the caller should retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: rate_limited
            message: Too many requests.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97S
    Internal:
      description: An unexpected server error occurred before acknowledgement.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: internal
            message: The request could not be completed.
            request_id: req_01K0NVB8MJPBPQY0WXFJGCXEH3
    Unavailable:
      description: nvoken cannot serve this request right now. Retry with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unavailable
            message: The service is temporarily unavailable.
            request_id: req_01K0NVBGWQ1V6JJBVH0Q4WZRS1
    TurnErased:
      description: The standalone Turn's private content has been erased.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: turn_erased
            message: The Turn content has been erased.
            request_id: req_01K0NVASB4CF29K41VZA271H24
            details:
              turn_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb322
              erased_at: '2026-08-25T13:00:00Z'
    MCPDiscoveryFailed:
      description: >-
        nvoken could not safely reach the remote MCP server or read its tool
        list.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mcp_discovery_failed
            message: The remote MCP server could not be discovered.
            request_id: req_01K0NVCPKYGE1D64K9DXMZ7J64
    OrgArchived:
      description: The Org is archived and admits no new App or Org-bound credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: org_archived
            message: The Org is archived and admits no new Apps or credentials.
            request_id: req_01K0NVB0QFQP0YNSVD3CB7E97U
            details:
              org_id: 019b0a12-8d51-7f34-aed2-0e07c1bdb321
    MethodNotAllowed:
      description: |
        The request method is not allowed on this path. The `Allow` header
        names the one that is.
      headers:
        Allow:
          description: The allowed method.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: The request method is not allowed.
            request_id: req_01K0NVASB4CF29K41VZA271H23
  headers:
    ETag:
      description: Strong validator for this exact JSON representation.
      schema:
        type: string
