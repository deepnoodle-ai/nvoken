name: release-npm

on:
  push:
    tags:
      - npm-v*

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment. Without it the
    # OIDC subject is the tag ref, the registry rejects the exchange, and npm
    # falls back to anonymous auth and reports a misleading 404.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@deepnoodle/nvoken
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Node 24 bundles an npm newer than the 11.5.1 trusted-publishing
      # minimum, so the CLI needs no separate upgrade step.
      # setup-node v7 no longer exports the dummy NODE_AUTH_TOKEN that made npm
      # choose token authentication instead of GitHub OIDC trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify trusted-publishing runtime
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node - "${npm_version}" <<'NODE'
          const [major, minor] = process.argv[2].split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error('npm 11.5.1 or newer is required for trusted publishing')
          }
          NODE
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN must be unset so npm uses OIDC trusted publishing" >&2
            exit 1
          fi
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            echo "NPM_CONFIG_USERCONFIG must be unset so npm has no token-auth configuration" >&2
            exit 1
          fi
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Verify release tag matches package version
        working-directory: sdk/typescript
        run: |
          version="$(node --print "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "npm-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm run build
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm publish --dry-run --ignore-scripts
        working-directory: sdk/typescript
      # Verbose logging records only the registry's OIDC exchange result, not
      # either GitHub token, which makes trusted-publisher mismatches actionable.
      - run: npm publish --loglevel=verbose
        working-directory: sdk/typescript
      - name: Verify the public registry artifact
        working-directory: sdk/typescript
        run: |
          # publish succeeds before the registry's read replica catches up, so a
          # single `npm view` right after publish can 404 on a version that is
          # live. Retry with backoff instead of failing the release on that lag.
          version="$(node --print "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "@deepnoodle/nvoken@${version}" version 2>/dev/null || true)"
            if [ "${published}" = "${version}" ]; then
              echo "registry serves @deepnoodle/nvoken@${version}"
              exit 0
            fi
            echo "attempt ${attempt}: registry not serving ${version} yet; retrying in 10s"
            sleep 10
          done
          echo "registry never served @deepnoodle/nvoken@${version} after retries" >&2
          exit 1
