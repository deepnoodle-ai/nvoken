name: release-npm

on:
  push:
    tags:
      - npm-v*

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment. Without it the
    # OIDC subject is the tag ref, the registry rejects the exchange, and npm
    # falls back to anonymous auth and reports a misleading 404.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@deepnoodle/nvoken
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # pnpm 11 supports npm trusted publishing through GitHub OIDC. This action
      # reads the exact pnpm version from the root packageManager field and
      # installs the release workflow's Node runtime without npm.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Verify trusted-publishing runtime
        run: |
          node --version
          expected_pnpm="$(node --print "require('./package.json').packageManager.split('@')[1]")"
          actual_pnpm="$(pnpm --version)"
          echo "pnpm ${actual_pnpm}"
          test "${actual_pnpm}" = "${expected_pnpm}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN must be unset so pnpm uses OIDC trusted publishing" >&2
            exit 1
          fi
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            echo "NPM_CONFIG_USERCONFIG must be unset so pnpm has no token-auth configuration" >&2
            exit 1
          fi
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - name: Verify release tag matches package version
        working-directory: sdk/typescript
        run: |
          version="$(node --print "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "npm-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepnoodle/nvoken build
      - run: pnpm --filter @deepnoodle/nvoken test
      # This workflow triggers on a tag push, so the checkout is a detached
      # HEAD and pnpm's git checks abort with ERR_PNPM_GIT_UNKNOWN_BRANCH
      # before publishing anything. npm has no equivalent check to relax.
      - run: pnpm publish --dry-run --ignore-scripts --no-git-checks
        working-directory: sdk/typescript
      - run: pnpm publish --no-git-checks
        working-directory: sdk/typescript
      - name: Verify the public registry artifact
        working-directory: sdk/typescript
        run: |
          # publish succeeds before the registry's read replica catches up, so a
          # single `pnpm view` right after publish can 404 on a version that is
          # live. Retry with backoff instead of failing the release on that lag.
          version="$(node --print "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published="$(pnpm view "@deepnoodle/nvoken@${version}" version 2>/dev/null || true)"
            if [ "${published}" = "${version}" ]; then
              echo "registry serves @deepnoodle/nvoken@${version}"
              exit 0
            fi
            echo "attempt ${attempt}: registry not serving ${version} yet; retrying in 10s"
            sleep 10
          done
          echo "registry never served @deepnoodle/nvoken@${version} after retries" >&2
          exit 1
